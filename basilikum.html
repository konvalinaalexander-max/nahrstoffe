/* Kurzname eines Wasserparameters – der Zusatz «(Wasser)» steht in jeder
   Überschrift schon im Zusammenhang. */
const gwName=k=>String(NAME[k]||k).replace(' (Wasser)','').replace(' (Giesswasser)','');

/* ══════════ 9 · Kulturmanagement ══════════
   Die Balken unter den Diagrammen: was in den Tank kam und was sonst an der
   Kultur geändert wurde – von wann bis wann. Drei Arten von Zeilen:
   · je Mittel ein Balken: aus den Gaben (Handy, Excel, Datenpaket) und aus
     Zeiträumen von Hand;
   · eigene Massnahmen mit Namen, von Hand über «＋ Massnahme eintragen»;
   · Ereignisse ohne Mittel (Tank neu angesetzt, Umpumpen …) als Marken,
     eine Zeile je Art.
   Ohne Etikett «Versuch» – einfach, was war. Das Logbuch früherer Fassungen
   ist darin aufgegangen: jeder Eintrag steht in seiner Zeile. */

/* Aus den Gaben: von der ersten bis zur letzten, eine Lücke über vier
   Wochen trennt. Läuft eine Beigabe noch? Nur, wenn die letzte Gabe keine
   vier Wochen her ist UND die Tanks seither nicht neu angesetzt wurden –
   mit dem Wasser ist auch das Mittel weg. */
const BEIGABE_LUECKE=28;
function beigabeLaeuft(bis){
  if(tage(bis,heute())>BEIGABE_LUECKE)return false;
  return !db.ereignisse.some(e=>e.typ==='Tank neu angesetzt'&&e.datum&&e.datum>bis&&e.datum<=heute());
}
/* Zeiträume von Hand – für ein Mittel ({mittel}) oder eine eigene Massnahme
   ({name}). Sie gelten für alle, die das Dashboard öffnen. */
const beigabeHand=f=>(Array.isArray(db.beigabeZeiten)?db.beigabeZeiten:[]).filter(h=>h&&(h.mittel||h.name)&&h.von&&(!f||f(h)));
const MITTEL_FARBE={biovin:'#2C7A4B',epsotop:'#8A7118',kali:'#A2432E',zink:'#3F7F7A',phosphorsaeure:'#7A4E8C',
  zitronensaeure:'#BE6F16',schwefelsaeure25:'#B0446F',halades:'#3A6DA6',em:'#6D5C3D'};
const mittelKurz=id=>String(evMittelName(id)||id).replace(/\s*\(.*?\)\s*/g,' ').replace(' Bio-Kraftdünger 9N','').replace(/\s+/g,' ').trim();
/* Die Balken eines Mittels. Ein Zeitraum von Hand nimmt die Gaben in sich
   auf, die in ihn fallen; Gaben ausserhalb bilden ihre eigenen Balken –
   so verschwindet keine Gabe, nur weil jemand einen Zeitraum gesetzt hat. */
function beigabeSpannenMittel(id){
  const gaben=db.ereignisse.filter(x=>x.datum&&x.mittel===id&&!isNaN(+new Date(x.datum))).sort(chrono);
  const hand=beigabeHand(h=>h.mittel===id);
  const inHand=g=>hand.some(h=>g.datum>=h.von&&g.datum<=(h.bis||heute()));
  const trennt=(a,b)=>hand.some(h=>h.von>a&&h.von<b);
  const out=[];let akt=null;
  for(const g of gaben.filter(x=>!inHand(x))){
    if(!akt||tage(akt.bis,g.datum)>BEIGABE_LUECKE||trennt(akt.bis,g.datum)){akt={id,von:g.datum,bis:g.datum,n:0,gaben:[]};out.push(akt)}
    akt.bis=g.datum;akt.n++;akt.gaben.push(g);
  }
  for(const sp of out)sp.laeuft=beigabeLaeuft(sp.bis);
  for(const h of hand){
    const bis=h.bis||heute(),g=gaben.filter(x=>x.datum>=h.von&&x.datum<=bis);
    out.push({id,von:h.von,bis,laeuft:!h.bis,n:g.length,gaben:g,hand:h});
  }
  return out.sort((a,b)=>a.von.localeCompare(b.von));
}
/* Summe der Mengen, je Einheit – Gramm und Kilogramm (oder Milliliter und
   Liter) zusammengezählt, sobald beide vorkommen. Gaben ohne Menge werden
   genannt, nicht geschätzt. */
function beigabeSumme(gaben){
  const m={};let ohne=0;
  for(const g of gaben){if(g.menge==null){ohne++;continue}const e=g.einheit||'';m[e]=(m[e]||0)+g.menge*(g.jeReservoir?2:1)}
  if(m.g!=null&&m.kg!=null){m.kg+=m.g/1000;delete m.g}
  if(m.ml!=null&&m.l!=null){m.l+=m.ml/1000;delete m.ml}
  const t=Object.keys(m).map(e=>nz(m[e])+' '+e).join(' + ');
  return (t||'–')+(ohne?` (dazu ${ohne} Gabe${ohne>1?'n':''} ohne notierte Menge)`:'');
}
const EVFARBE=(()=>{const m={};Object.keys(EVTYPEN).forEach((t,i)=>m[t]=FARBSTOFF[(i+9)%FARBSTOFF.length]);return m})();
const evFarbe=t=>EVFARBE[t]||'#8C9A88';
/* Menge eines Eintrags als Text, mit dem «je Reservoir»-Vorbehalt. */
function evMenge(e){
  if(e.menge==null)return '';
  const t=nz(e.menge)+' '+(e.einheit||'');
  return e.jeReservoir?`${t} je Reservoir (zusammen ${nz(e.menge*2)} ${e.einheit||''})`:t;
}
/* Was an einem Eintrag steht, ohne die Notiz. */
function evAngaben(e){
  const d=evTypDef(e.typ),t=[];
  if(e.mittel)t.push(mittelKurz(e.mittel));
  if(e.menge!=null)t.push(evMenge(e));
  for(const [k,label] of (d.f||[]))if(e.felder&&e.felder[k]&&k!=='text')t.push(`${label}: ${e.felder[k]}`);
  return t.join(' · ');
}
const evNotiz=e=>e.notiz||(e.felder&&e.felder.text)||'';
/* Auswahl der Mittel (Tabellenimport): Stammdaten zuerst, dann Verwendetes. */
function evMittelListe(){
  const aus=Object.keys(db.produkte||{}).map(k=>[k,db.produkte[k].name]);
  const frei=[...new Set(db.ereignisse.map(e=>e.mittel).filter(m=>m&&!db.produkte[m]))];
  return aus.concat(frei.map(m=>[m,m]));
}
/* Eigene Massnahmen: die Farbe folgt dem Namen, damit dieselbe Massnahme
   immer gleich aussieht. */
const KM_FARBEN=['#4B5D2A','#1F5F86','#96601C','#7A4E8C','#3F7F7A','#B0446F','#556B2F','#A2432E'];
function eigeneFarbe(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))>>>0;return KM_FARBEN[h%KM_FARBEN.length]}
/* Links neben den Marken ist Platz für rund 15 Zeichen. */
const TYPKURZ={'Tank neu angesetzt':'Neuansatz','Gerätekalibrierung':'Kalibrierung','Wasserzugabe':'Wasserzugabe',
  'Neues Substrat / Grunddüngung':'Substrat','Pflanzenschutz / Nützlinge':'Pflanzenschutz','Dosierung geändert':'Dosierung'};
const typKurz=t=>TYPKURZ[t]||(String(t).length>16?String(t).slice(0,15)+'…':String(t));
const HERKUNFT={erfassen:'Maske',excel:'Excel',paket:'Paket',hand:'von Hand'};

/* Alle Zeilen, in fester Reihenfolge: Mittel nach den Stammdaten, dann eigene
   Massnahmen, dann Ereignisse. Dieselbe Liste für die Balken und für
   «Balken ein- und ausblenden». */
function kmListe(){
  const mittel=[...new Set(db.ereignisse.filter(x=>x.mittel&&x.datum).map(x=>x.mittel).concat(beigabeHand(h=>h.mittel).map(h=>h.mittel)))];
  const reihe=Object.keys(db.produkte||{});
  mittel.sort((a,b)=>{const ia=reihe.indexOf(a),ib=reihe.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  const eigene=[...new Set(beigabeHand(h=>!h.mittel).map(h=>h.name))].sort((a,b)=>a.localeCompare(b));
  const typen=[...new Set(db.ereignisse.filter(e=>e.datum&&!e.mittel&&e.typ).map(e=>e.typ))]
    .sort((a,b)=>Object.keys(EVTYPEN).indexOf(a)-Object.keys(EVTYPEN).indexOf(b)||a.localeCompare(b));
  return mittel.map((id,i)=>({key:'m|'+id,art:'mittel',id,name:mittelKurz(id),farbe:MITTEL_FARBE[id]||FARBEN[i%FARBEN.length]}))
    .concat(eigene.map(n=>({key:'n|'+n,art:'eigen',id:n,name:n,farbe:eigeneFarbe(n)})))
    .concat(typen.map(t=>({key:'t|'+t,art:'typ',id:t,name:t,farbe:evFarbe(t)})));
}
/* Ausgeblendete Zeilen: persönlich, wie die übrige Ansicht. Gemerkt wird,
   was AUS ist – Neues erscheint also von selbst. */
let kmAus=new Set();
const spanneText=(name,sp)=>sp.laeuft?`${name} seit ${fmtK(sp.von)}`:sp.von===sp.bis?`${name} ${fmtK(sp.von)}`:`${name} ${fmtK(sp.von)}–${fmtK(sp.bis)}`;
function kmBalken(){
  const out=[];
  for(const z of kmListe()){
    if(kmAus.has(z.key))continue;
    if(z.art==='mittel'){
      for(const sp of beigabeSpannenMittel(z.id))out.push({zeile:z.key,laeuft:!!sp.laeuft,x0:+new Date(sp.von),x1:+new Date(sp.laeuft?heute():sp.bis),
        farbe:z.farbe,text:spanneText(z.name,sp),kennung:'m|'+z.id+'|'+sp.von,
        tipp:tippBau(z.name,z.farbe,[['von',fmt(sp.von)],['bis',sp.laeuft?'läuft – bis heute':fmt(sp.bis)],['Gaben',String(sp.n)],
          sp.n?['Menge gesamt',beigabeSumme(sp.gaben)]:null,sp.hand?['Zeitraum','von Hand gesetzt'+(sp.hand.notiz?': '+sp.hand.notiz:'')]:null],
          'Anklicken: Gaben ansehen, Beginn und Ende setzen.')});
    }else if(z.art==='eigen'){
      for(const h of beigabeHand(x=>!x.mittel&&x.name===z.id).sort((a,b)=>a.von.localeCompare(b.von))){
        const sp={von:h.von,bis:h.bis||heute(),laeuft:!h.bis};
        out.push({zeile:z.key,laeuft:sp.laeuft,x0:+new Date(sp.von),x1:+new Date(sp.bis),farbe:z.farbe,text:spanneText(z.name,sp),
          kennung:'n|'+h.id,tipp:tippBau(z.name,z.farbe,[['von',fmt(sp.von)],['bis',sp.laeuft?'läuft – bis heute':fmt(sp.bis)]],
            (h.notiz?h.notiz+' · ':'')+'Anklicken zum Ändern.')});
      }
    }else{
      const jeTag=new Map();
      for(const e of db.ereignisse.filter(x=>x.datum&&!x.mittel&&x.typ===z.id&&!isNaN(+new Date(x.datum)))){
        if(!jeTag.has(e.datum))jeTag.set(e.datum,[]);
        jeTag.get(e.datum).push(e);
      }
      for(const [d,l] of jeTag){
        l.sort(chrono);
        const x=zeitpunkt(l[0]);
        out.push({marke:true,zeile:z.key,zeileText:typKurz(z.id),x0:x,x1:x,farbe:z.farbe,n:l.length,kennung:'t|'+z.id+'|'+d,
          tipp:tippBau(z.name+' · '+fmt(d),z.farbe,l.slice(0,8).map(e=>[e.zeit||'ohne Uhrzeit',
            [evAngaben(e),evNotiz(e),e.stelle&&e.stelle!=='beide'?e.stelle:null,e.wer].filter(Boolean).join(' · ')||'–'])
            .concat(l.length>8?[`… und ${l.length-8} weitere`]:[]),'Anklicken zeigt die Einträge.')});
      }
    }
  }
  return out;
}

const gabenTabelle=l=>`<div class="scroll"><table><thead><tr><th>Datum</th><th>Art</th><th>Angaben</th><th>Stelle</th><th>Name</th><th>Notiz</th><th>Herkunft</th><th></th></tr></thead><tbody>
  ${chronoAb(l).map(g=>`<tr><td class="mono">${fmt(g.datum)}${zeitTag(g)}</td><td class="small">${esc(g.typ)}</td><td class="small">${esc(evAngaben(g)||'–')}</td>

      <div style="margin-top:8px"><label class="lab">Notiz <span class="muted">(freiwillig)</span></label><input id="spNotiz" value="${esc(h&&h.notiz||'')}" style="width:100%" placeholder="z.B. seit August jede Woche"></div>
      <p class="tiny muted" style="margin:8px 0 0">${h

    <p class="small muted">${sp.n?`${sp.n} Gabe${sp.n>1?'n':''} in diesem Zeitraum`:'Keine Gabe eingetragen in diesem Zeitraum'}.</p>

AKTION.spLaeuft=(d,ev)=>{

/* Beginn, Ende und «läuft» aus dem offenen Dialog lesen und prüfen. */
function zeitraumLesen(){
  const von=el('spVon').value,laeuft=el('spLaeuft').checked,bis=laeuft?null:el('spBis').value;
  if(!von){toast('Bitte einen Beginn eintragen.');return null}
  if(!laeuft&&!bis){toast('Bitte ein Ende eintragen – oder «weiterhin» ankreuzen.');return null}
  if(bis&&bis<von){toast('Das Ende liegt vor dem Beginn.');return null}
  return {von,bis,notiz:(el('spNotiz').value||'').trim()||null};
}
AKTION.spanneSpeichern=d=>{
  const t=String(d.id).split('|');if(t[0]!=='m')return;
  const mittel=t[1],alt=beigabeSpannenMittel(mittel).find(x=>x.von===t[2]);
  const z=zeitraumLesen();if(!z)return;
  /* Was sich mit dem neuen Zeitraum überschneidet, geht in ihm auf – für
     dasselbe Mittel gibt es nie zwei Zeiträume übereinander. */
  const ende=z.bis||'9999-12-31',id=alt&&alt.hand?alt.hand.id:uid();
  db.beigabeZeiten=beigabeHand().filter(h=>h.id!==id&&!(h.mittel===mittel&&h.von<=ende&&(h.bis||'9999-12-31')>=z.von));
  db.beigabeZeiten.push({id,mittel,von:z.von,bis:z.bis,notiz:z.notiz,gesetzt:heute()});
  aend();if(el('dlg').open)el('dlg').close();diagFrisch();
  toast(`${mittelKurz(mittel)}: ${fmt(z.von)} bis ${z.bis?fmt(z.bis):'heute (läuft)'} – gilt für alle.`);
};
AKTION.spanneAuto=d=>{

};

/* Ein Mittel: liegt der Zeitraum schon in einem Balken, bleibt alles, wie
   es ist. Sonst wird ein Zeitraum von Hand gesetzt – zusammen mit den
   Balken desselben Mittels, die er berührt, damit es einer bleibt. */
function mittelZeitraumDazu(mittel,von,bis,notiz){
  const OFFEN='9999-12-31',heu=heute(),spannen=beigabeSpannenMittel(mittel);
  const gedeckt=spannen.some(sp=>sp.von<=von&&(sp.laeuft?(bis?bis<=heu:true):(bis?sp.bis>=bis:false)));
  if(gedeckt)return false;
  let v=von,b=bis||OFFEN;
  for(const sp of spannen){
    const spEnde=sp.hand&&sp.laeuft?OFFEN:sp.bis;
    if(sp.von<=b&&spEnde>=v){if(sp.von<v)v=sp.von;if(spEnde>b)b=spEnde}
  }
  db.beigabeZeiten=beigabeHand().filter(h=>!(h.mittel===mittel&&h.von<=b&&(h.bis||OFFEN)>=v));
  db.beigabeZeiten.push({id:uid(),mittel,von:v,bis:b===OFFEN?null:b,notiz,gesetzt:heute()});
  return true;
}
AKTION.massnahmeSpeichern=()=>{

  if(!von)return toast('Bitte einen Beginn eintragen.');
  if(was.indexOf('t|')===0){
    const typ=was.slice(2);
    db.ereignisse.push({id:uid(),datum:von,zeit:null,typ,titel:null,mittel:null,menge:null,einheit:null,jeReservoir:false,
      stelle:'beide',felder:{},geltung:'alle',saetze:[],notiz,wer:null,quelle:'hand'});
    aend();el('dlg').close();diagFrisch();
    return toast(`${typ} am ${fmt(von)} eingetragen.`);
  }
  const bis=dauer==='tag'?von:dauer==='bis'?el('mnBis').value:null;
  if(dauer==='bis'&&!bis)return toast('Bitte ein Ende eintragen.');
  if(bis&&bis<von)return toast('Das Ende liegt vor dem Beginn.');
  if(was.indexOf('m|')===0){
    const mittel=was.slice(2);
    if(!mittelZeitraumDazu(mittel,von,bis,notiz)){el('dlg').close();return toast(`${mittelKurz(mittel)} steht für diesen Zeitraum schon im Balken.`)}
    kmAus.delete('m|'+mittel);
    aend();el('dlg').close();diagFrisch();
    return toast(`${mittelKurz(mittel)}: ab ${fmt(von)}${bis?' bis '+fmt(bis):', läuft'} – gilt für alle.`);
  }
  const name=was==='neu'?(el('mnName').value||'').trim().replace(/\s+/g,' ').slice(0,60):was.slice(2);
  if(!name)return toast('Bitte einen Namen eintragen.');
  db.beigabeZeiten=beigabeHand();
  db.beigabeZeiten.push({id:uid(),name,von,bis,notiz,gesetzt:heute()});
  kmAus.delete('n|'+name);
  aend();el('dlg').close();diagFrisch();
  toast(`«${name}» eingetragen.`);
};

/* ══════════ 10 · pH und EC am Tank ══════════
   Die Messungen am Tank – aus der Excel-Tabelle, vom Handy, aus dem
   Datenpaket –, nicht die Laborwerte. Je Grösse eine Spur, gemeinsam ist
   die Zeit; darunter dieselben Balken wie im Reiter Blattsaft &
   Giesswasser, darunter die Liste. */
let tkStelle='alle',tkZeit='alles',tkLinien='keine';
/* Aus dem, was bei einer Messung als Stelle steht – vom Handy der Name der
   Stelle, aus Excel «vorne»/«hinten», von früher gar nichts –, die Stelle,
   wie sie im Bestand heisst. */
function messStelle(m){
  const st=(m&&m.stelle)?String(m.stelle):'';
  if(!st)return 'ohne Stelle';
  if(st==='wurzelraum')return 'Wurzelraum';
  const g=stellenDb().gruppen.find(x=>x.name===st);
  if(g)return g.name;
  const t=st.toLowerCase();
  const v=stellenDb().gruppen.find(x=>/vorne/.test(x.name.toLowerCase())),h=stellenDb().gruppen.find(x=>/hinten/.test(x.name.toLowerCase()));
  if(/vorn|\brv\b/.test(t)&&v)return v.name;
  if(/hint|\brh\b/.test(t)&&h)return h.name;
  return st;
}
const STELLE_FARBE=['#2C7A4B','#3A6DA6','#BE6F16','#7A4E8C','#A2432E','#3F7F7A'];
/* Die Stellen in fester Reihenfolge: die Reservoirs zuerst, wie sie unter
   Einstellungen stehen, dann alles andere. */
function tankStellen(){
  const namen=stellenDb().gruppen.map(g=>g.name);
  return [...new Set(db.messungen.filter(m=>m.datum).map(messStelle))]
    .sort((a,b)=>{const ia=namen.indexOf(a),ib=namen.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
}
function vTank(){

  function kopf(){

        <td class="mono tiny">${esc(m.wer||'')}</td><td class="small muted">${esc(m.notiz||'')}</td>

/* ══════════ 10b · Tabellenimport (pH und EC) ══════════
   Der Betrieb fuehrt seine Tankmessungen in einer Excel-Datei. Die Zahlen
   gehoeren in messungen[]; der wertvollere Teil ist die Bemerkungsspalte –
   sie enthält den grössten Teil der Betriebsgeschichte und wird zu
   Vorschlägen für Gaben und Ereignisse.

   Der Parser sucht die Tabellen NICHT an festen Spalten, sondern ueber die
   Kopfzeile. Ein verschobener Kopfblock oder eine eingefuegte Spalte macht
   ihn damit nicht blind. Zwei nebeneinanderstehende Tabellen erkennt er
   daran, dass in derselben Kopfzeile mehrmals «Datum» steht.            */

const TAB_KOPF=[
  ['datum',      /^datum|^tag$/i],
  ['zeit',       /^(uhr)?zeit$|^uhrzeit|^uhr$/i],
  ['ecVorne',    /ec.*vorn|vorn.*ec/i],
  ['ecHinten',   /ec.*hint|hint.*ec/i],
  ['phVorne',    /ph.*vorn|vorn.*ph/i],
  ['phHinten',   /ph.*hint|hint.*ph/i],
  ['bemerkung',  /bemerk|notiz|kommentar/i],
  ['satz',       /^satz|^charge|^kultur/i],
  ['wurzel1',    /(ec.*1.*wurzel)|(wurzel.*1)|^ec\s*1$/i],
  ['wurzel2',    /(ec.*2.*wurzel)|(wurzel.*2)|^ec\s*2$/i],
  ['wurzel3',    /(ec.*3.*wurzel)|(wurzel.*3)|^ec\s*3$/i],
  ['schnitt',    /durchschnitt|mittelwert|^mittel$|^ø/i],
  ['ec',         /^ec$|^ec\b(?!.*(vorn|hint|\d))/i],
  ['ph',         /^ph$|^ph\b(?!.*(vorn|hint))/i],
  ['saeure',     /säurezugabe|säure.*ml|zugabe.*ml|^ml$/i],
  ['temp',       /temperatur|^temp/i],
  ['o2',         /^o2$|^o₂|sauerstoff/i]];
const zelle=v=>v==null?'':String(v).trim();
function kopfArt(t){
  const x=zelle(t);
  if(!x)return null;
  for(const [name,re] of TAB_KOPF)if(re.test(x))return name;
  return null;
}
/* Datum: Excel-Seriennummer, ISO, oder deutsche Kurzform ohne Jahr.
   Fehlt das Jahr, wird es vom zuletzt vollstaendigen Datum uebernommen;
   springt der Monat zurueck, wird das Jahr erhoeht. */
function tabDatum(v,letzt){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&isFinite(v)){
    if(v<20||v>80000)return null;
    const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);
    return isNaN(+d)?null:d.toISOString().slice(0,10);
  }
  if(v instanceof Date&&!isNaN(+v))return new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())).toISOString().slice(0,10);
  /* «17.09.2026 09:05»: die Uhrzeit liest tabZeit, hier zählt das Datum. */
  const t=zelle(v).replace(/\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:uhr|h)?$/i,'');
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  /* «17,06», «2,7», «12,8»: in der Datumsspalte ein Datum mit Komma statt
     Punkt – so steht es in den echten Tabellen. */
  m=t.match(/^(\d{1,2})\s*[.\/,]\s*(\d{1,2})\s*[.\/]?\s*(\d{2,4})?\s*\.?$/);
  if(!m)return null;
  const tag=+m[1],mon=+m[2];
  if(tag<1||tag>31||mon<1||mon>12)return null;
  let jahr=m[3]?+m[3]:null;
  if(jahr!=null&&jahr<100)jahr+=2000;
  if(jahr==null){
    if(!letzt)return null;
    jahr=+letzt.slice(0,4);
    if(mon<+letzt.slice(5,7))jahr++;          /* Jahreswechsel in der Spalte */
  }
  if(jahr<1990||jahr>2100)return null;
  /* Gibt es diesen Tag ueberhaupt? «31.02.» darf nicht stillschweigend zum
     3. Maerz werden – lieber gar kein Datum als ein erfundenes. */
  const probe=new Date(Date.UTC(jahr,mon-1,tag));
  if(probe.getUTCMonth()!==mon-1||probe.getUTCDate()!==tag)return null;
  return `${jahr}-${String(mon).padStart(2,'0')}-${String(tag).padStart(2,'0')}`;
}
/* Uhrzeit aus einer Zelle: Text «09:05» / «9.05 Uhr», Excel-Bruchteil
   eines Tages (0,375 = 09:00) oder ein Datum mit Uhrzeit. Eine Uhrzeit
   00:00 aus einem reinen Datum ist keine Uhrzeit. */
function tabZeit(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&isFinite(v)){
    const f=v-Math.floor(v);if(f<=0)return null;
    const min=Math.round(f*1440)%1440;
    return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
  }
  if(v instanceof Date&&!isNaN(+v)){
    if(!v.getHours()&&!v.getMinutes())return null;
    return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
  }
  const t=zelle(v);
  const m=t.match(/(?:^|[\sT])(\d{1,2}[:.]\d{2})(?::\d{2})?\s*(?:uhr|h)?$/i);
  return m?zeitNorm(m[1]):zeitNorm(t);
}
const tabZahl=v=>{
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  return toNum(String(v).replace(/['’](?=\d)/g,''));
};

/* ── Bemerkungen zu Vorschlägen ────────────────────
   Erkannt wird Menge + Einheit + Mittel. Was nicht sicher zuzuordnen ist,
   wird als Notiz mit dem Rohtext vorgeschlagen – nichts geht verloren. */
const MITTEL_MUSTER=[
  {re:/bio-?v[a-zä]*[-\s]?wasser/i,typ:'Wasserzugabe',mittel:null,duenger:true,
   warnung:'«BioV-Wasser» ist Wasser, das mit Dünger angesetzt wurde. Wieviel Dünger darin war, steht in dieser Bemerkung nicht – trag das als eigene Düngergabe ein, wenn du es weisst.'},
  {re:/\bbiovin\b|\bbiov\b/i,typ:'Düngergabe',mittel:'biovin'},
  {re:/\bepsotop\b/i,typ:'Düngergabe',mittel:'epsotop'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])EP?T(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Düngergabe',mittel:'epsotop',streng:1},
  /* Die Kürzel, wie sie hinten geschrieben werden: EPT, KS, Zn, HA, PS, ZS,
     H2SO4 – auch mit Null statt O. «Haldes» ist der Tippfehler für Halades. */
  /* Wörter ohne Rücksicht auf Gross und Klein; die Kürzel dagegen genau so,
     wie sie geschrieben werden – sonst wäre jedes «ha» in einem Satz Halades. */
  {re:/kalisulfat|kaliumsulfat/i,typ:'Zusatzdünger / Spurenelemente',mittel:'kali'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])KS(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Zusatzdünger / Spurenelemente',mittel:'kali',streng:1},
  {re:/\bzink/i,typ:'Zusatzdünger / Spurenelemente',mittel:'zink'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])Zn(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Zusatzdünger / Spurenelemente',mittel:'zink',streng:1},
  {re:/p-?\s?säure|phosphorsäure|p-?saeure/i,typ:'Säurezugabe',mittel:'phosphorsaeure'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])PS(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Säurezugabe',mittel:'phosphorsaeure',streng:1},
  {re:/h2s[o0]4|schwefelsäure|schwefelsaeure/i,typ:'Säurezugabe',mittel:'schwefelsaeure25'},
  {re:/zitronensäure|zitronensaeure|\bcitro/i,typ:'Säurezugabe',mittel:'zitronensaeure'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])ZS(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Säurezugabe',mittel:'zitronensaeure',streng:1},
  {re:/hal[a-z]{0,3}des/i,typ:'Desinfektion',mittel:'halades'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])HA(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Desinfektion',mittel:'halades',streng:1},
  /* «MKBoden» heisst im Betrieb EM (Effektive Mikroorganismen). */
  {re:/mk\s*boden|effektive\s*mikroorganismen/i,typ:'Biologisches Präparat',mittel:'em'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])EM(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Biologisches Präparat',mittel:'em',streng:1},
  {re:/säurezugabe|\bsäure\b|\bsaeure\b/i,typ:'Säurezugabe',mittel:null,allgemein:1},
  {re:/dünger|duenger/i,typ:'Düngergabe',mittel:null,allgemein:1},
  {re:/wasser|zudosiert|zudosieren|nachgefüllt|nachgefuellt|aufgefüllt/i,typ:'Wasserzugabe',mittel:null,allgemein:1}];
const REIN_MUSTER=[
  /* «kalbriert» steht so in den echten Bemerkungen – der Tippfehler muss
     mitgelesen werden, sonst geht der Eintrag verloren. */
  {re:/kal.{0,2}br/i,typ:'Gerätekalibrierung',titel:'Gerät neu kalibriert'},
  /* «Wasser abgepumpt, Tanks neu gefüllt» ist ein Neuansatz, kein Umpumpen –
     das Wort «neu gefüllt» / «geleert» entscheidet, darum steht es vor dem Pumpen. */
  {re:/neu\s*(angesetzt|gefüllt|gefuellt|befüllt|befuellt|aufgesetzt)|(tanks?|reservoirs?)\s*(geleert|entleert)/i,typ:'Tank neu angesetzt',titel:'Tank neu angesetzt'},
  {re:/gepumpt|umgepumpt|umpumpen/i,typ:'Umpumpen',titel:'umgepumpt'},
  {re:/(dünger|duenger|reservoir|tank).{0,14}leer|leer.{0,14}(dünger|duenger)/i,typ:'Notiz',titel:'leer'}];
const MENGE_RE=/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|lt?r?|liter|%)(?![a-zä])/gi;
const EINH_NORM={l:'l',lt:'l',ltr:'l',liter:'l',ml:'ml',kg:'kg',g:'g','%':'%'};

/* Aus einer Bemerkung Vorschläge für Gaben und Ereignisse lesen.
   Grundsaetze, die aus dem ersten Durchlauf an echten Bemerkungen stammen:
   · «Wasser OHNE Dünger» ist keine Düngergabe. Verneinungen werden geprüft.
   · Es gewinnt das Mittel, das im Text ZUERST steht, nicht das erste in der
     Liste. Sonst schlägt «Dünger» jedes «Wasser».
   · Ein Mittel ohne Menge ist meist Erzählung («vor Säurezugabe»), keine
     Zugabe – daraus wird eine Notiz.
   · Stehen mehrere Mengen derselben Einheit im selben Satz, ist die
     Zuordnung unsicher. Dann wird sie benannt statt geraten.               */
function bemerkungLesen(text,datum){
  const roh=zelle(text);
  if(!roh)return [];
  let t=roh.replace(/[’']/g,"'").replace(/(\d)'(\d{3})/g,'$1$2');
  /* RV und RH heissen hinten die Reservoirs – überall dasselbe Wort. */
  t=t.replace(/(?:^|[^A-Za-zÄÖÜäöü])RV(?=$|[^A-Za-zÄÖÜäöü])/g,m=>m.replace('RV','vorne')).replace(/(?:^|[^A-Za-zÄÖÜäöü])RH(?=$|[^A-Za-zÄÖÜäöü])/g,m=>m.replace('RH','hinten'));
  /* «vorne (ca. 5000l)» ist das Volumen des Reservoirs, keine Zugabe. Es
     wird gemerkt und aus dem Text genommen. */
  const volumen={};
  t=t.replace(/\b(vorne|hinten)\s*:?\s*\(\s*ca\.?\s*(\d[\d.]*)\s*l\s*\)/gi,(m,st,v)=>{volumen[st.toLowerCase()]=toNum(v.replace(/\./g,''));return st});
  const stelleVon=x=>/vordere|vorne|vorderes/i.test(x)?'vorne':(/hintere|hinten|hinteres/i.test(x)?'hinten':null);
  const stelleGlobal=stelleVon(t)||'beide';
  /* «je 1kg Zitronensäure RV + RH» heisst je Reservoir; «15'000l (je
     Reservoir ca. 7500l)» dagegen nennt eine Gesamtmenge und erklärt nur,
     wie sie sich verteilt – dann wird nichts verdoppelt. */
  const jeGesamt=/je\s+(reservoir|tank)\s*(ca\.?\s*)?\d/i.test(t);
  const jeText=(/\bje\s+\d/i.test(t)&&/vorne/.test(t)&&/hinten/.test(t))||(/je\s+(reservoir|tank)/i.test(t)&&!jeGesamt);
  /* Trennen: an «+», «;», «und», Pfeilen, «danach», «zusätzlich» – und an
     einem Stellenwort, wenn ein Teil beide Stellen mit Mengen nennt
     («vorne 2100ml, hinten 2100ml»). Ein Stellenwort am Ende eines Teils
     («1l H2SO4 hinten») gehört zum nächsten Teil, nicht zu diesem. */
  let teile=t.split(/\s*\+\s*|\s*;\s*|\s+und\s+|-->|→|\n|,?\s*danach\s*,?|,?\s*zusätzlich\s*/i).map(x=>x.trim()).filter(Boolean);
  teile=teile.flatMap(x=>(x.match(/\b(vorne|hinten)\b/g)||[]).length>=2?x.split(/(?=\b(?:vorne|hinten)\b)/).map(y=>y.trim()).filter(Boolean):[x]);
  for(let i=0;i<teile.length-1;i++){
    const m=teile[i].match(/^(.*\S)\s+(vorne|hinten)\s*:?$/i);
    if(m){teile[i]=m[1];teile[i+1]=m[2]+' '+teile[i+1]}
  }
  const out=[];
  let aktStelle=stelleGlobal,traegerMittel=null;
  for(let ti=0;ti<teile.length;ti++){
    const teil=teile[ti];
    /* nur ein Stellenwort: setzt die Stelle für das Folgende */
    if(/^(vorne|hinten)\s*:?$/i.test(teil)){aktStelle=stelleVon(teil);continue}
    const eigene=stelleVon(teil);
    if(eigene)aktStelle=eigene;
    const stelle=eigene||aktStelle;
    const je=jeText||/je\s+reservoir|pro\s+reservoir|je\s+tank/i.test(teil)&&!jeGesamt;
    const mengen=[];MENGE_RE.lastIndex=0;
    let mm;while((mm=MENGE_RE.exec(teil)))mengen.push({z:toNum(mm[1]),e:EINH_NORM[mm[2].toLowerCase()]||mm[2].toLowerCase(),pos:mm.index});
    const prozent=mengen.find(x=>x.e==='%');
    let echte=mengen.filter(x=>x.e!=='%');
    /* Wasser: Liter ab 500 sind Wasser, nicht Dünger – niemand dosiert
       15 000 Liter Biovin. Solche Mengen werden als Wasserzugabe geführt,
       mit Dünger, wenn im selben Teil einer steht. */
    const wasser=echte.filter(x=>x.e==='l'&&x.z>=500);
    if(wasser.length&&!/bio-?v[a-zä]*[-\s]?wasser/i.test(teil)){
      const mitD=/dünger|duenger|biovin|biov\b|epsotop|\bET\b|EPT/i.test(teil)&&!/\bohne\b/i.test(teil);
      out.push({typ:'Wasserzugabe',mittel:null,menge:wasser[0].z,einheit:'l',jeReservoir:false,stelle,datum,roh,
        felder:{mitDuenger:mitD?'ja':'nein'},warnung:null,dabei:true});
      echte=echte.filter(x=>!wasser.includes(x));
      /* Bleibt ausser dem Wasser nichts mit Menge, ist der Teil erledigt –
         «Wasser ohne Dünger zudosiert» braucht keine zweite Notiz. */
      if(!echte.length&&!mitD)continue;
    }

    /* Ereignisse ohne Menge zuerst: «kalibriert», «umgepumpt», «leer». */
    const rein=REIN_MUSTER.find(mu=>mu.re.test(teil));
    if(rein&&!echte.length){
      out.push({typ:rein.typ,mittel:null,menge:null,einheit:null,jeReservoir:false,stelle,datum,roh,
        titel:rein.titel,felder:rein.typ==='Notiz'?{text:teil.slice(0,180)}:{},warnung:null,dabei:true});
      continue;
    }

    /* Welches Mittel ist gemeint? Ein benanntes Produkt («Epsotop») schlaegt
       ein allgemeines Wort («Düngerzugabe»), auch wenn es spaeter im Satz
       steht. Unter Gleichrangigen gewinnt das zuerst genannte. Verneinungen
       zaehlen nicht: «Wasser ohne Dünger» ist keine Düngergabe. */
    let treffer=null,bestPos=Infinity,bestRang=9;
    for(const mu of MITTEL_MUSTER){
      const m=teil.match(mu.re);
      if(!m)continue;
      const pos=m.index;
      if(/\bohne\s*$/i.test(teil.slice(Math.max(0,pos-8),pos)))continue;
      const rang=mu.allgemein?1:0;
      if(rang<bestRang||(rang===bestRang&&pos<bestPos)){bestRang=rang;bestPos=pos;treffer=mu}
    }
    /* «nach PS (vorne 2100ml, hinten 2100ml)»: das Mittel steht im ersten
       Teil, die Mengen in den folgenden – das Mittel wird mitgetragen. */
    if(treffer&&!treffer.allgemein&&!echte.length)traegerMittel={mu:treffer,pos:0,notizAn:out.length};
    else if(!treffer&&echte.length&&traegerMittel&&eigene){
      treffer=traegerMittel.mu;bestPos=0;
      /* die Notiz «PS erwähnt, ohne Menge» ist damit überholt */
      if(traegerMittel.notizAn!=null){out.splice(traegerMittel.notizAn,1);traegerMittel.notizAn=null}
    }
    else if(treffer)traegerMittel=null;
    /* Ein unbekanntes Mittel mit Menge: Notiz mit klarer Bitte, statt zu raten. */
    if(treffer&&treffer.unbekannt){
      out.push({typ:'Notiz',mittel:null,menge:null,einheit:null,jeReservoir:false,stelle,datum,roh,
        felder:{text:teil.slice(0,180)},warnung:null,dabei:true,
        hinweis:`«${treffer.unbekannt}» ist kein hinterlegtes Produkt${echte.length?' ('+echte.map(x=>nz(x.z)+' '+x.e).join(', ')+')':''} – bitte Art und Mittel hier wählen, sonst bleibt es eine Notiz.`});
      continue;
    }

    if(treffer&&echte.length){
      const soll=evEinheit(treffer.typ,treffer.mittel);
      /* die Menge, die dem Mittel im Text am naechsten steht */
      const passend=echte.filter(x=>x.e===soll);
      const kandidaten=passend.length?passend:echte;
      /* Steht eine Menge kurz HINTER dem Mittel, ist sie fast immer gemeint
         – «Dünger Biovin zudosiert (15l)». Sonst die naechstliegende. */
      const dahinter=kandidaten.filter(x=>x.pos>bestPos&&x.pos-bestPos<=40)
        .sort((a,b)=>a.pos-b.pos)[0];
      let gut=dahinter||kandidaten[0];
      if(!dahinter)for(const x of kandidaten)if(Math.abs(x.pos-bestPos)<Math.abs(gut.pos-bestPos))gut=x;
      let menge=gut.z,einheit=gut.e;
      if(einheit==='g'&&soll==='kg'){menge=menge/1000;einheit='kg'}
      const mehrdeutig=kandidaten.length>1;
      out.push({typ:treffer.typ,mittel:treffer.mittel,menge,einheit:einheit||soll||null,
        jeReservoir:je,stelle,datum,roh,
        felder:prozent?{dosis:String(prozent.z)}:(treffer.duenger?{mitDuenger:'ja'}:{}),
        warnung:treffer.warnung||(mehrdeutig
          ? `In dieser Bemerkung stehen mehrere Mengen (${kandidaten.map(x=>nz(x.z)+' '+x.e).join(', ')}). Die App hat die nächstliegende gewählt – bitte prüfen, welche gemeint ist, und die übrigen als eigene Einträge erfassen.`
          : null),
        dabei:true});
      continue;
    }
    /* Ein Mittel ohne Menge: meist Erzaehlung, keine Zugabe. */
    if(treffer||rein){
      out.push({typ:'Notiz',mittel:null,menge:null,einheit:null,jeReservoir:false,stelle,datum,roh,
        felder:{text:teil.slice(0,180)},warnung:null,dabei:true,
        hinweis:treffer?`«${treffer.typ}» ist erwähnt, aber ohne Menge – das ist meist eine Beschreibung, keine Zugabe. Als Notiz vorgeschlagen; die Art lässt sich hier ändern.`:null});
      continue;
    }
    /* Eine Menge ohne erkennbares Mittel */
    if(echte.length){
      out.push({typ:'Notiz',mittel:null,menge:null,einheit:null,jeReservoir:false,stelle,datum,roh,
        felder:{text:teil.slice(0,180)},warnung:null,dabei:true,
        hinweis:`Eine Menge (${echte.map(x=>nz(x.z)+' '+x.e).join(', ')}) ohne erkennbares Mittel – bitte Art und Mittel selbst wählen.`});
    }
  }
  if(!out.length)out.push({typ:'Notiz',mittel:null,menge:null,einheit:null,jeReservoir:false,
    stelle:stelleGlobal,datum,roh,felder:{text:roh.slice(0,180)},warnung:null,dabei:true,
    hinweis:'Nicht zugeordnet – wird als Notiz mit dem Rohtext übernommen, damit nichts verloren geht.'});
  return out;
}

/* ── Blattauswertung ── */
function tabBlatt(zeilen){
  const mess=[],wurzel=[],vorschlaege=[],hinweise=[];
  let letztDatum=null;
  for(let r=0;r<zeilen.length;r++){
    const zeile=zeilen[r]||[];
    /* Kopfzeile? mindestens ein «Datum» und ein weiterer erkannter Kopf */
    const arten=zeile.map(kopfArt);
    const datumSpalten=arten.map((a,i)=>a==='datum'?i:-1).filter(i=>i>=0);
    if(!datumSpalten.length||arten.filter(Boolean).length<2)continue;
    /* Bloecke: von einer Datumsspalte bis zur naechsten */
    const bloecke=datumSpalten.map((start,k)=>{
      const ende=k+1<datumSpalten.length?datumSpalten[k+1]:zeile.length;
      const map={};
      for(let c=start;c<ende;c++)if(arten[c]&&map[arten[c]]===undefined)map[arten[c]]=c;
      return map;
    });
    letztDatum=null;
    for(let z=r+1;z<zeilen.length;z++){
      const w=zeilen[z]||[];
      if(w.map(kopfArt).filter(Boolean).length>=2&&w.map(kopfArt).includes('datum')){r=z-1;break}
      if(!w.some(x=>zelle(x)!==''))continue;
      for(const b of bloecke){
        const d=tabDatum(w[b.datum],letztDatum);
        if(d)letztDatum=d;
        const dat=d||letztDatum;
        if(!dat)continue;
        const bem=b.bemerkung!==undefined?zelle(w[b.bemerkung]):'';
        /* Uhrzeit: aus einer eigenen Spalte, sonst aus der Datumszelle. */
        const zeit=(b.zeit!==undefined?tabZeit(w[b.zeit]):null)||(typeof w[b.datum]==='number'||w[b.datum] instanceof Date||/\d:\d\d/.test(zelle(w[b.datum]))?tabZeit(w[b.datum]):null);
        /* Ohne Datum in der Zeile gilt das der Zeile davor – aber gesagt,
           nicht stillschweigend. Ein Datum, das dasteht und nicht lesbar
           ist, ebenso. */
        const datumZelle=zelle(w[b.datum]);
        const inhalt=[b.ecVorne,b.ecHinten,b.phVorne,b.phHinten,b.ec,b.ph,b.o2,b.bemerkung,b.wurzel1].some(c=>c!==undefined&&zelle(w[c])!=='');
        if(inhalt&&!datumZelle)hinweise.push(`Zeile ${z+1}: kein Datum – das der Zeile davor (${fmtK(dat)}) übernommen, bitte prüfen.`);
        else if(inhalt&&datumZelle&&!d)hinweise.push(`Zeile ${z+1}: Datum «${datumZelle}» nicht lesbar – das der Zeile davor (${fmtK(dat)}) übernommen, bitte prüfen.`);
        /* Reservoirblock */
        if(b.ecVorne!==undefined||b.phVorne!==undefined||b.ec!==undefined||b.ph!==undefined){
          const paare=[['vorne',b.ecVorne,b.phVorne],['hinten',b.ecHinten,b.phHinten]];
          if(b.ecVorne===undefined&&b.ecHinten===undefined)paare.length=0;
          if(!paare.length&&(b.ec!==undefined||b.ph!==undefined))paare.push(['beide',b.ec,b.ph]);
          let gesetzt=false;
          /* Sauerstoff: das Gerät hängt im Reservoir vorne – die Spalte
             gehört zur vorderen Messung. */
          const o2=b.o2!==undefined?tabZahl(w[b.o2]):null;
          for(const [stelle,ce,cp] of paare){
            const ec=ce!==undefined?tabZahl(w[ce]):null;
            const ph=cp!==undefined?tabZahl(w[cp]):null;
            const o2hier=(stelle==='vorne'||stelle==='beide')?o2:null;
            if(ec==null&&ph==null&&o2hier==null)continue;
            gesetzt=true;
            const warn=[];
            if(ph!=null&&(ph<3||ph>10))warn.push(`pH ${nz(ph,2)} liegt ausserhalb 3–10 – Tippfehler?`);
            if(ec!=null&&(ec<0||ec>10))warn.push(`EC ${nz(ec,2)} ist für einen Rücklauf unwahrscheinlich – Tippfehler?`);
            mess.push({id:uid(),datum:dat,zeit,stelle,ec,ph,ecFrisch:null,o2:o2hier,o2sat:null,wer:null,
              temp:b.temp!==undefined?tabZahl(w[b.temp]):null,
              notiz:bem||null,quelle:'excel',dabei:true,zeile:z+1,warnung:warn.length?warn.join(' '):null});
          }
          if(!gesetzt&&bem)hinweise.push(`Zeile ${z+1}: nur eine Bemerkung, kein Messwert – daraus entsteht nur ein Vorschlag für eine Gabe oder ein Ereignis.`);
        }
        /* Wurzelblock */
        if(b.wurzel1!==undefined||b.satz!==undefined){
          const werte=[b.wurzel1,b.wurzel2,b.wurzel3].filter(c=>c!==undefined).map(c=>tabZahl(w[c])).filter(x=>x!=null);
          const satz=b.satz!==undefined?zelle(w[b.satz]):'';
          if(werte.length)wurzel.push({id:uid(),datum:dat,satz:satz||null,werte,
            schnitt:b.schnitt!==undefined?tabZahl(w[b.schnitt]):null,dabei:true,zeile:z+1});
        }
        if(bem)vorschlaege.push(...bemerkungLesen(bem,dat).map(v=>Object.assign(v,{zeile:z+1,zeit})));
      }
    }
    if(r>=zeilen.length-1)break;
  }
  return {mess,wurzel,vorschlaege,hinweise};
}
/* Doppelte Vorschlaege aus derselben Zeile zusammenfassen */
function tabZusammen(teile){
  const mess=[],wurzel=[],vorschlaege=[],hinweise=[];
  const gesehen=new Set();
  for(const t of teile){
    for(const m of t.mess){
      const k=m.datum+'|'+(m.zeit||'')+'|'+m.stelle+'|'+m.ec+'|'+m.ph+'|'+(m.notiz||'')+'|'+m.zeile;
      if(gesehen.has(k))continue;gesehen.add(k);mess.push(m);
    }
    for(const x of t.wurzel){
      const k='w'+x.datum+'|'+x.satz+'|'+x.werte.join(',');
      if(gesehen.has(k))continue;gesehen.add(k);wurzel.push(x);
    }
    for(const v of t.vorschlaege){
      const k='v'+v.datum+'|'+v.typ+'|'+v.mittel+'|'+v.menge+'|'+v.roh;
      if(gesehen.has(k))continue;gesehen.add(k);vorschlaege.push(v);
    }
    hinweise.push(...t.hinweise);
  }
  return {mess,wurzel,vorschlaege,hinweise:[...new Set(hinweise)]};
}

/* ── Einlesen ── */
let TABPRUEF=null;
const csvZeilen=text=>{
  const kopf=(text.split('\n')[0]||'');
  const trenner=kopf.split('\t').length>1?'\t':(kopf.split(';').length>kopf.split(',').length?';':',');
  const out=[];let feld='',zeile=[],inAnf=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inAnf){ if(c==='"'){ if(text[i+1]==='"'){feld+='"';i++} else inAnf=false } else feld+=c; continue }
    if(c==='"'){inAnf=true;continue}
    if(c===trenner){zeile.push(feld);feld='';continue}
    if(c==='\n'){zeile.push(feld);out.push(zeile);zeile=[];feld='';continue}
    if(c==='\r')continue;
    feld+=c;
  }
  zeile.push(feld);if(zeile.some(x=>x!==''))out.push(zeile);
  return out;
};
async function tabelleEinlesen(file){
  const csv=/\.csv$/i.test(file.name);
  let blaetter=[];
  try{
    if(csv){
      blaetter=[{name:file.name,zeilen:csvZeilen(await file.text())}];
    }else{
      if(typeof XLSX==='undefined')
        return dialog('Die Excel-Bibliothek fehlt',
          `<p class="small">Zum Lesen von Excel-Dateien braucht die App die Bibliothek SheetJS aus dem Netz. Sie konnte nicht geladen werden – vermutlich besteht gerade keine Internetverbindung.</p>
           <p class="small">Alles Übrige funktioniert weiter. Zwei Auswege: die Seite mit Verbindung neu laden, oder das Blatt in Excel als <strong>CSV</strong> speichern – CSV liest die App ohne jede Bibliothek.</p>`,
          '<button data-tun="dlgZu">Schliessen</button>');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
      blaetter=wb.SheetNames.map(n=>({name:n,
        zeilen:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:true})}));
    }
  }catch(err){
    return dialog('Die Datei liess sich nicht lesen',
      `<p class="small">${esc(err&&err.message||String(err))}</p>
       <p class="small">Prüfe, ob es wirklich eine Excel- oder CSV-Datei ist. Als Ausweg lässt sich das Blatt in Excel als CSV speichern.</p>`,
      '<button data-tun="dlgZu">Schliessen</button>');
  }
  const teile=blaetter.map(b=>{const r=tabBlatt(b.zeilen);r.blatt=b.name;return r});
  const alles=tabZusammen(teile);
  alles.blaetter=blaetter.map((b,i)=>({name:b.name,zeilen:b.zeilen.length,
    mess:teile[i].mess.length,wurzel:teile[i].wurzel.length,vor:teile[i].vorschlaege.length}));
  alles.datei=file.name;
  if(!alles.mess.length&&!alles.vorschlaege.length&&!alles.wurzel.length)
    return dialog('Nichts erkannt',
      `<p class="small">In «${esc(file.name)}» wurde keine Tabelle mit einer Kopfzeile gefunden, die «Datum» und dazu EC oder pH enthält.</p>
       <div class="scroll"><table><thead><tr><th>Blatt</th><th>Zeilen</th></tr></thead><tbody>
       ${blaetter.map(b=>`<tr><td>${esc(b.name)}</td><td class="mono">${b.zeilen.length}</td></tr>`).join('')}</tbody></table></div>
       <p class="small">Der Import sucht die Spalten über ihre Überschrift, nicht über feste Positionen. Es genügt, dass in einer Zeile «Datum» steht und daneben etwas mit «EC» oder «pH».</p>`,
      '<button data-tun="dlgZu">Schliessen</button>');
  TABPRUEF=alles;
  tabDialog();
}

  const warnMess=t.mess.filter(m=>m.warnung).length;

      <td class="tiny muted">${m.zeile}</td>

      <td><input class="mono${m.warnung&&/pH/.test(m.warnung)?' val-off':''}" size="5" data-aend="tabFeld" data-k="mess" data-i="${i}" data-f="ph" value="${m.ph==null?'':m.ph}"${m.warnung?` title="${esc(m.warnung)}"`:''}></td>
      <td><input class="mono" size="4" data-aend="tabFeld" data-k="mess" data-i="${i}" data-f="o2" value="${m.o2==null?'':m.o2}"></td>
      <td class="tiny ${m.warnung?'val-off':'muted'}">${m.warnung?esc(m.warnung)+' · ':''}${esc((m.notiz||'').slice(0,60))}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted small">Keine Messwerte erkannt.</p>';

  if(t.wurzel.length)h+=`<div class="hd" style="margin:16px 0 8px"><div><h2 style="font-size:16px">EC im Wurzelraum (${nw} von ${t.wurzel.length})</h2>
    <p class="sub">Mehrere Einzelmessungen je Satz. Sie werden als eigene Messungen mit dem Satznamen in der Notiz abgelegt.</p></div></div>
    <div class="scroll"><table><thead><tr><th></th><th>Zeile</th><th>Datum</th><th>Satz</th><th>Werte</th><th>Durchschnitt</th></tr></thead><tbody>
    ${t.wurzel.map((x,i)=>`<tr><td><input type="checkbox" data-aend="tabAn" data-k="wurzel" data-i="${i}"${x.dabei?' checked':''}></td>
      <td class="tiny muted">${x.zeile}</td><td class="mono">${fmt(x.datum)}</td><td>${esc(x.satz||'–')}</td>
      <td class="mono tiny">${x.werte.map(v=>nz(v,2)).join(' · ')}</td>

    </tbody></table></div>`;

  h+=`<div class="hd" style="margin:16px 0 8px"><div><h2 style="font-size:16px">Vorgeschlagene Gaben und Ereignisse (${nv} von ${t.vorschlaege.length})</h2>

  h+=t.vorschlaege.length?t.vorschlaege.map((v,i)=>`<div class="vorschlag">

      <div><label class="lab">Datum</label><input type="date" data-aend="tabFeld" data-k="vorschlaege" data-i="${i}" data-f="datum" value="${esc(v.datum||'')}"></div>

        <option value="">–</option>${evMittelListe().map(([k,n])=>`<option value="${esc(k)}"${v.mittel===k?' selected':''}>${esc(n)}</option>`).join('')}</select></div>
      <div><label class="lab">Menge ${esc(v.einheit||'')}</label><input class="mono" size="7" data-aend="tabFeld" data-k="vorschlaege" data-i="${i}" data-f="menge" value="${v.menge==null?'':v.menge}"></div>
      <div><label class="lab">Stelle</label><select data-aend="tabFeld" data-k="vorschlaege" data-i="${i}" data-f="stelle">
        ${STELLEN.map(x=>`<option${v.stelle===x?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div><label class="lab">&nbsp;</label><label class="small" style="display:block;padding-top:7px">
        <input type="checkbox" data-aend="tabFeld" data-k="vorschlaege" data-i="${i}" data-f="jeReservoir"${v.jeReservoir?' checked':''}> je Reservoir</label></div>
    </div>
    ${v.jeReservoir&&v.menge!=null?`<div class="tiny muted" style="margin-top:5px">Das wären ${nz(v.menge)} ${esc(v.einheit||'')} je Reservoir, zusammen ${nz(v.menge*2)} ${esc(v.einheit||'')}. Die App entscheidet das nicht für dich.</div>`:''}
    ${v.warnung?`<div class="note warn" style="margin-top:6px">${esc(v.warnung)}</div>`:''}
    ${v.hinweis?`<div class="tiny muted" style="margin-top:5px">${esc(v.hinweis)}</div>`:''}
    <div class="tiny muted" style="margin-top:5px">Zeile ${v.zeile} · Rohtext: «${esc(v.roh)}»</div>
  </div>`).join(''):'<p class="muted small">Keine Bemerkungen gefunden.</p>';

  dialog(`Tabelle kontrollieren und bestätigen`,h,
    `<button class="primary" data-tun="tabUeber">Übernehmen</button><button data-tun="dlgZu">Abbrechen</button>
     <div style="flex:1"></div><span class="tiny muted">${nm} Messungen · ${nw} Wurzel-EC · ${nv} Gaben und Ereignisse</span>`);
}
AKTION.tabAn=(d,ev)=>{const x=TABPRUEF[d.k][+d.i];if(x)x.dabei=ev.target.checked};
AKTION.tabFeld=(d,ev)=>{
  const x=TABPRUEF[d.k][+d.i];if(!x)return;
  if(d.f==='jeReservoir'){x.jeReservoir=ev.target.checked;return tabDialog()}
  if(d.f==='menge'||d.f==='ec'||d.f==='ph'||d.f==='o2'){x[d.f]=ev.target.value===''?null:toNum(ev.target.value);return}
  if(d.f==='zeit'){x.zeit=zeitNorm(ev.target.value);return}
  x[d.f]=ev.target.value;
  if(d.f==='typ'||d.f==='mittel'){x.einheit=evEinheit(x.typ,x.mittel)||null;tabDialog()}
};
AKTION.tabUeber=()=>{
  const t=TABPRUEF;if(!t)return;
  let nm=0,nw=0,nv=0;
  for(const m of t.mess.filter(x=>x.dabei)){
    if(!m.datum)continue;
    /* O₂ und Uhrzeit gehen mit – bis zum 30.09. fiel der Sauerstoff hier
       stillschweigend weg, obwohl der Dialog ihn zeigte. */
    db.messungen.push({id:uid(),datum:m.datum,zeit:zeitNorm(m.zeit),stelle:m.stelle,ph:m.ph,ec:m.ec,ecFrisch:null,
      temp:m.temp==null?null:m.temp,o2:m.o2==null?null:m.o2,o2sat:null,wer:null,notiz:m.notiz||null,quelle:'excel'});nm++;
  }
  for(const x of t.wurzel.filter(y=>y.dabei)){
    const s=x.schnitt!=null?x.schnitt:mittel(x.werte);
    if(s==null)continue;
    db.messungen.push({id:uid(),datum:x.datum,stelle:'wurzelraum',ph:null,ec:s,ecFrisch:null,temp:null,
      notiz:`EC im Wurzelraum${x.satz?' · Satz '+x.satz:''} · Einzelwerte ${x.werte.map(v=>nz(v,2)).join(' / ')}`,
      quelle:'excel'});nw++;
  }
  for(const v of t.vorschlaege.filter(x=>x.dabei)){
    if(!v.datum)continue;
    db.ereignisse.push({id:uid(),datum:v.datum,zeit:zeitNorm(v.zeit),typ:v.typ,titel:v.titel||null,mittel:v.mittel||null,
      menge:v.menge,einheit:v.menge!=null?(v.einheit||evEinheit(v.typ,v.mittel)):null,
      jeReservoir:!!(v.menge!=null&&v.jeReservoir),stelle:v.stelle||'beide',
      notiz:v.roh,felder:Object.assign({},v.felder||{}),geltung:'alle',saetze:[],quelle:'excel'});nv++;
  }
  TABPRUEF=null;
  aend();el('dlg').close();setTab('tank');
  toast(`${nm} Messungen, ${nw} Wurzel-EC und ${nv} Gaben und Ereignisse übernommen.${ONLINE.an?'':' Zum Behalten oben rechts sichern.'}`);
};

/* ══════════ 11 · Einträge der Maske ══════════
   Alles, was hinten am Tank über die Handy-Seite eingetragen wurde – als
   Liste, neueste zuerst. Die Messungen stehen ausserdem im Reiter pH & EC,
   die Gaben in den Balken. */
let meFilter='alle';
function vMaske(){
  const alle=db.messungen.filter(m=>m.quelle==='erfassen'&&m.datum).map(x=>({art:'messung',x}))
    .concat(db.ereignisse.filter(e=>e.quelle==='erfassen'&&e.datum).map(x=>({art:'beigabe',x})))
    .sort((a,b)=>chrono(b.x,a.x)||String(b.x.erfasst||'').localeCompare(String(a.x.erfasst||'')));
  if(!alle.length)return leerHinweis('Noch nichts aus der Maske',
    ONLINE.an?`Was hinten am Tank über die Handy-Seite eingetragen wird, steht hier als Liste. Die Maske: <span class="mono">${esc(maskeAdresse())}</span>`
             :'Die Eingabemaske fürs Handy gibt es, sobald das Dashboard online läuft. Was dort eingetragen wird, steht dann hier.',
    ONLINE.an?'<button class="primary" data-tun="qr">QR-Code zur Maske</button>':'');
  const n=a=>alle.filter(z=>z.art===a).length;
  const sicht=meFilter==='alle'?alle:alle.filter(z=>z.art===meFilter);
  const angaben=z=>{
    const x=z.x;
    if(z.art==='beigabe')return evAngaben(x)||'–';
    return [x.ph!=null?'pH '+nz(x.ph,2):null,x.ec!=null?'EC '+nz(x.ec,2)+' mS/cm':null,x.ecFrisch!=null?'EC frisch '+nz(x.ecFrisch,2):null,
      x.o2!=null?'O₂ '+nz(x.o2,1)+' mg/l':null,x.temp!=null?nz(x.temp,1)+' °C':null].filter(Boolean).join(' · ')||'–';
  };
  return `<div class="card"><div class="hd"><div><h2>Einträge der Maske</h2>
    <p class="sub">Alles, was über die Handy-Seite am Tank eingetragen wurde, neueste zuerst.</p></div>
    <span class="seg">${[['alle','alle',alle.length],['messung','Messungen',n('messung')],['beigabe','Beigaben',n('beigabe')]]
      .map(([v,l,z])=>`<button class="${meFilter===v?'on':''}" data-tun="meFilter" data-v="${v}">${l} <span style="opacity:.65">${z}</span></button>`).join('')}</span></div>
    <div class="liste"><table><thead><tr><th>Datum</th><th>Uhrzeit</th><th>Name</th><th>Was</th><th>Stelle</th><th>Angaben</th><th>Notiz</th><th></th></tr></thead><tbody>
    ${sicht.map(z=>{const x=z.x;
      return `<tr${x.erfasst?` title="eingetragen ${esc(new Date(x.erfasst).toLocaleString('de-CH'))}"`:''}>
      <td class="mono">${fmt(x.datum)}</td><td class="mono">${esc(x.zeit||'')}</td><td class="mono tiny">${esc(x.wer||'–')}</td>
      <td>${z.art==='messung'?'Messung':esc(x.typ||'Beigabe')}</td>
      <td class="tiny">${esc(z.art==='messung'?messStelle(x):(x.stelle||''))}</td>
      <td class="small">${esc(angaben(z))}</td><td class="small muted">${esc(z.art==='messung'?(x.notiz||''):evNotiz(x))}</td>
      <td><button class="ghost" data-tun="${z.art==='messung'?'messungWeg':'evWeg'}" data-id="${esc(x.id)}">entfernen</button></td></tr>`}).join('')}
    </tbody></table></div></div>`;
}

        <div class="row"><button class="primary" data-tun="sichern">Jetzt sichern</button><button data-tun="dateiOeffnen">Datei öffnen</button>
        <button data-tun="sichernDaten">Nur die Daten (JSON)</button><button data-tun="zuruecksetzen">Alles zurücksetzen</button></div>

const dbBytes=()=>{try{return JSON.stringify(db).length}catch(e){return 0}};
const mb=b=>nz(b/1048576,1)+' MB';
AKTION.zuruecksetzen=()=>{
  if(!confirm('Wirklich alle Daten in diesem Fenster verwerfen? Gesicherte Dateien bleiben erhalten.'))return;
  db=leer();dirty=false;render();
};

/* ══════════ 12b · Vorbereitete Daten ══════════
   Die Reservoir-Tabelle von April bis September und der Bericht über die
   Säure vom 31. August bis 10. September – einmal von Hand gelesen,
   bereinigt und so eingetragen, wie es der Betrieb am 30. September
   entschieden hat. Der Import aus Excel kann vieles, aber nicht nachfragen;
   hier ist nachgefragt worden. Ein Klick auf «Aktivieren» übernimmt alles
   als ganz normale Einträge – mit fester Kennung, damit zweimal Aktivieren
   nichts doppelt einträgt, und mit dem Beleg (Tabellenzeile, Berichtsteil)
   an jedem Eintrag. Nichts davon heisst «Versuch»: es sind die Daten.   */
const PAKET_RES26=(()=>{
  const P='reservoir-2026',M=[],E=[],zm={},ze={};
  const T=(z,roh)=>'Tabelle «pH/EC Reservoir», Zeile '+z+(roh?': «'+roh+'»':'');

function paketStand(p){

  const alle=p.messungen.concat(p.ereignisse,p.zeiten||[]),da=alle.filter(x=>ids.has(x.id)).length;
  const merk=(db.pakete||{})[p.id]||null;

/* Was eine neuere Paketfassung dazubringt und im Bestand noch fehlt. Wer das
   Paket schon aktiviert hatte, bekommt gezielt nur das – was er selbst
   gelöscht hat, kommt nicht ungefragt zurück. */
function paketNeues(p){
  const merk=(db.pakete||{})[p.id]||{},hatte=merk.version||1;
  if(!merk.aktiviert||hatte>=(p.version||1))return [];
  const ids=new Set(db.messungen.map(x=>x.id).concat(db.ereignisse.map(x=>x.id),beigabeHand().map(x=>x.id)));
  return p.messungen.concat(p.ereignisse,p.zeiten||[]).filter(x=>(x.pv||1)>hatte&&!ids.has(x.id));

/* ══════════ 13 · Sichern und Laden ══════════
   Die Anwendung schreibt sich selbst neu. Beim Sichern entsteht keine
   getrennte Datenablage, sondern eine vollständige HTML-Datei: dasselbe
   Werkzeug, mit dem Bestand darin. Wer sie bekommt, öffnet sie doppelt und
   arbeitet weiter - ohne zweite Datei, ohne Hochladeschritt.

   Warum als Selbstabbild und nicht durch Nachlesen der eigenen Datei: aus
   einer lokal geöffneten Seite heraus darf keine Datei gelesen werden
   (fetch auf file:// ist in Firefox seit Jahren gesperrt), und ein Server
   ist ausdrücklich nicht gewünscht. Das Abbild wird beim Start genommen,
   bevor irgendetwas gezeichnet ist - so enthält es nur das Gerüst und nicht
   den halb aufgebauten Bildschirm des Augenblicks. */
let SEITE_ROH=null;
function seiteMerken(){
  const b=el('datenblock');
  /* Der Block wird geleert, bevor das Abbild entsteht: sonst schleppte jede
     Sicherung den vorigen Bestand ein zweites Mal mit. */
  if(b)b.textContent='null';
  try{SEITE_ROH='<!doctype html>\n'+document.documentElement.outerHTML}catch(e){SEITE_ROH=null}
}
function datenAusSeite(){
  const b=el('datenblock');
  if(!b)return null;
  const t=(b.textContent||'').trim();
  if(!t||t==='null')return null;
  try{return JSON.parse(t)}catch(e){return {__kaputt:String(e&&e.message||e)}}
}
/* Der eingesetzte Text darf die Seite nicht sprengen: ein «<» in einem
   Satznamen könnte sonst das Skript-Ende vortäuschen. \u003c ist im JSON
   dasselbe Zeichen und beim Einlesen wieder ein «<». */
function seiteMitDaten(){
  if(!SEITE_ROH)return null;
  const j=JSON.stringify(db).replace(/</g,'\\u003c');
  let getroffen=false;
  const raus=SEITE_ROH.replace(/(<script[^>]*id="datenblock"[^>]*>)[\s\S]*?(<\/script>)/,
    (m,a,b)=>{getroffen=true;return a+j+b});
  return getroffen?raus:null;
}
AKTION.sichern=()=>{if(ONLINE.an){if(dirty)sichernOnline();else toast('Wird von selbst gesichert – hier gibt es nichts zu drücken.')}else sichern()};
AKTION.kopie=()=>sichern();
AKTION.sichernDaten=()=>sichernJson();
AKTION.dateiOeffnen=()=>el('fileJson').click();
function stempel(){return new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}
function herunterladen(text,name,typ){
  const blob=new Blob([text],{type:typ});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return blob.size;
}
function sichern(){
  const html=seiteMitDaten();
  if(!html){
    toast('Die Seite konnte sich selbst nicht schreiben – ich sichere stattdessen die Daten als JSON.');
    return sichernJson();
  }
  db.version++;db.gespeichert=new Date().toISOString();
  const gr=herunterladen(html,`basilikum_${stempel()}.html`,'text/html');
  dirty=false;render();
  toast(`Gesichert: eine HTML-Datei mit allem darin (rund ${mb(gr)}). Diese eine Datei genügt.`);
}
function sichernJson(){
  db.version++;db.gespeichert=new Date().toISOString();
  herunterladen(JSON.stringify(db,null,1),`basilikum-daten_${stempel()}.json`,'application/json');
  dirty=false;render();
  toast('Nur die Daten gesichert. Zum Weitergeben ist die HTML-Datei der bequemere Weg.');
}
/* Beim Öffnen wird beides angenommen: eine reine Datendatei und eine
   gesicherte HTML-Datei. Aus der HTML wird nur der Datenblock gelesen, nicht
   das Skript - fremder Programmcode wird nie ausgeführt. */
function datenAusText(text,name){
  if(/^\s*[{[]/.test(text)){
    try{return JSON.parse(text)}catch(e){return {__fehler:'Diese Datei ist kein gültiges JSON.'}}
  }
  const m=text.match(/<script[^>]*id="datenblock"[^>]*>([\s\S]*?)<\/script>/);
  if(!m)return {__fehler:'In dieser HTML-Datei steckt kein Datenblock. Stammt sie aus einer älteren Fassung, die nur JSON gesichert hat?'};
  const t=m[1].trim();
  if(!t||t==='null')return {__fehler:'Diese HTML-Datei ist das leere Werkzeug – es sind keine Daten darin gesichert.'};
  try{return JSON.parse(t)}catch(e){return {__fehler:'Der Datenblock in dieser Datei ist beschädigt: '+(e&&e.message||e)}}
}
async function laden(file){
  const roh=datenAusText(await file.text(),file.name);
  if(roh&&roh.__fehler)return toast(roh.__fehler);
  if(!roh||!Array.isArray(roh.analysen))return toast('Diese Datei sieht nicht nach einer Sicherung dieses Werkzeugs aus.');
  if(dirty&&!confirm('Es gibt ungesicherte Änderungen. Trotzdem laden?'))return;
  let erg;
  try{erg=migriere(roh)}
  catch(e){return toast('Die Datei liess sich nicht übernehmen: '+e.message)}
  db=erg.db;dirty=erg.von<4;
  if(ONLINE.an){aend();toast('Eingelesen – wird gleich auf den Server geschrieben.')}
  render();
  if(erg.notizen.length)
    dialog('Ältere Sicherung übernommen',
      `<p>Die Datei war im Format ${erg.von}, dieses Werkzeug arbeitet mit Format ${leer().schema}. Alles wurde übernommen. Angepasst:</p>
       <ul style="margin:0 0 12px;padding-left:20px">${erg.notizen.map(n=>`<li style="margin-bottom:6px">${esc(n)}</li>`).join('')}</ul>
       <p class="small muted">Die alte Datei bleibt unverändert liegen.</p>`,
      `<button class="primary" data-tun="dlgZu">Verstanden</button>`);
  else if(!ONLINE.an)toast(`Geladen: ${db.analysen.length} Analysen, ${db.messungen.length} Messungen.`);
}

/* ══════════ 14 · Persönliche Ansicht ══════════
   Was alle angeht, liegt im Bestand (Daten, Zuordnungen, Zeiträume). Was
   nur mich angeht – welcher Reiter offen war, welche Werte ich sehe, welche
   Balken ausgeblendet sind –, bleibt auf diesem Gerät. Der Bestand liegt
   nie im Browserspeicher. */
const ANSICHT_SCHLUESSEL='basilikum.ansicht';
function ansichtMerken(){
  try{localStorage.setItem(ANSICHT_SCHLUESSEL,JSON.stringify({tab,kbBlatt,kbWasser,kbEtage,kbLinien,kbSkala,
    tkStelle,tkLinien,anFilter,meFilter,kmAus:[...kmAus]}))}catch(e){}
}
function ansichtLaden(){
  let a=null;try{a=JSON.parse(localStorage.getItem(ANSICHT_SCHLUESSEL)||'null')}catch(e){a=null}
  if(!a||typeof a!=='object')return;
  const liste=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):null;
  const wort=(v,erlaubt)=>erlaubt.includes(v)?v:undefined;
  if(TABS.some(([k])=>k===a.tab))tab=a.tab;
  if(liste(a.kbBlatt))kbBlatt=liste(a.kbBlatt);
  if(liste(a.kbWasser))kbWasser=liste(a.kbWasser);
  kbEtage=wort(a.kbEtage,['beide','jung','alt','misch'])||kbEtage;
  kbLinien=wort(a.kbLinien,['keine','reihe'])||kbLinien;
  kbSkala=wort(a.kbSkala,['wert','lage'])||kbSkala;
  if(typeof a.tkStelle==='string')tkStelle=a.tkStelle;
  tkLinien=wort(a.tkLinien,['keine','reihe'])||tkLinien;
  anFilter=wort(a.anFilter,['alle','blattsaft','giesswasser','substrat'])||anFilter;
  meFilter=wort(a.meFilter,['alle','messung','beigabe'])||meFilter;
  if(liste(a.kmAus))kmAus=new Set(liste(a.kmAus));
}

/* ══════════ 15 · QR-Code zur Maske ══════════
   Hinten kommt man per QR-Code auf die Maske – ausgedruckt am Tank. Die
   Bibliothek (qrcode-generator, MIT) kommt wie pdf.js von cdnjs, aber erst,
   wenn jemand den Code öffnet; die Prüfsumme sorgt dafür, dass genau diese
   Datei läuft und keine andere. Gezeichnet wird selbst, als SVG: scharf in
   jeder Grösse, auch auf dem Drucker. */
const QR_SKRIPT='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const QR_PRUEF='sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==';
const maskeAdresse=()=>location.origin+'/maske';
function qrLaden(){
  return new Promise((ok,nein)=>{
    if(typeof window.qrcode==='function')return ok();
    const s=document.createElement('script');
    s.src=QR_SKRIPT;s.integrity=QR_PRUEF;s.crossOrigin='anonymous';s.referrerPolicy='no-referrer';
    s.onload=()=>typeof window.qrcode==='function'?ok():nein(new Error('QR-Bibliothek unvollständig'));
    s.onerror=()=>nein(new Error('QR-Bibliothek nicht erreichbar'));
    document.head.appendChild(s);
  });
}
function qrSvg(text,modul){
  const q=window.qrcode(0,'M');q.addData(text);q.make();
  const n=q.getModuleCount(),rand=4,g=(n+2*rand)*modul;
  let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${(c+rand)*modul} ${(r+rand)*modul}h${modul}v${modul}h-${modul}z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${g}" height="${g}" viewBox="0 0 ${g} ${g}" shape-rendering="crispEdges" role="img" aria-label="QR-Code: ${esc(text)}"><rect width="${g}" height="${g}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
AKTION.qr=async()=>{
  const url=maskeAdresse();
  try{await qrLaden()}catch(e){
    return dialog('QR-Code zur Maske',`<p class="small">Die QR-Bibliothek liess sich nicht laden (${esc(e.message)}). Die Adresse zum Abtippen:</p>
      <p class="mono" style="font-size:20px">${esc(url)}</p>`,'<button data-tun="dlgZu">Schliessen</button>');
  }
  dialog('QR-Code zur Maske',
    `<div style="text-align:center"><div id="qrBild" style="display:inline-block;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff">${qrSvg(url,8)}</div>
      <p class="mono" style="font-size:17px;margin:10px 0 2px">${esc(url)}</p>
      <p class="small muted" style="max-width:52ch;margin:6px auto 0">Ausdrucken und an den Tank hängen. Wer ihn mit dem Handy scannt, kommt direkt in die Eingabemaske – dort nur den Namen eintippen, kein Passwort.
      Die Maske hat keinen Link hierher ins Dashboard.</p></div>`,
    `<button class="primary" data-tun="qrDruck">Drucken</button><button data-tun="qrBildSpeichern">Als Bild speichern</button><button data-tun="dlgZu">Schliessen</button>`);
};
/* Drucken: nur das Blatt mit dem Code, gross, mit Titel und Adresse. */
AKTION.qrDruck=()=>{
  const url=maskeAdresse();
  let b=el('qrDruck');if(b)b.remove();
  b=document.createElement('div');b.id='qrDruck';
  b.innerHTML=`<h1>Basilikum · Messen und Beigaben</h1><div class="qr">${qrSvg(url,10)}</div><p>${esc(url)}</p><p class="klein">Scannen, Namen eintippen, eintragen.</p>`;
  document.body.appendChild(b);document.body.classList.add('druckQr');
  const weg=()=>{document.body.classList.remove('druckQr');const x=el('qrDruck');if(x)x.remove();window.removeEventListener('afterprint',weg)};
  window.addEventListener('afterprint',weg);
  setTimeout(()=>{window.print();setTimeout(weg,1500)},50);
};
AKTION.qrBildSpeichern=()=>{
  const blob=new Blob([qrSvg(maskeAdresse(),10)],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='basilikum-maske-qr.svg';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
};

/* ══════════ 16 · Online ══════════
   Läuft die Seite von einem Server (http oder https statt file), holt sie
   den Bestand von dort und schreibt Änderungen nach kurzer Ruhe zurück.
   Vom Ordner geöffnet ändert sich nichts – dann gilt weiter der Datei-Modus.

   Gleichzeitigkeit: jeder Schreibvorgang trägt die Version, die er geladen
   hat. Stimmt sie nicht mehr – jemand anders war schneller –, holt die App
   den fremden Stand, vereinigt die Listen nach Kennung und schreibt noch
   einmal. Messungen und Beigaben vom Handy kommen dabei immer mit, weil sie
   nur angehängt, nie ersetzt werden. */
const ONLINE={an:false,version:0,geaendert:null,von:null,zustand:'aus',fehler:null,laeuft:false,nochmal:false,zeitgeber:null,abfrage:null};
const LISTEN=['analysen','ereignisse','messungen','beigabeZeiten'];
function onlineStand(){
  if(!ONLINE.an)return dirty?'ungesicherte Änderungen':(db.gespeichert?'gesichert '+new Date(db.gespeichert).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'');
  const wann=ONLINE.geaendert?new Date(ONLINE.geaendert).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  if(ONLINE.zustand==='sichert')return 'wird gesichert …';
  if(ONLINE.zustand==='wartet')return 'Änderung – wird gleich gesichert';
  if(ONLINE.zustand==='fehler')return 'nicht erreichbar – Änderungen warten'+(ONLINE.fehler?' ('+ONLINE.fehler+')':'');
  return 'online · gesichert '+wann+(ONLINE.von&&ONLINE.von!=='admin'?' · zuletzt von «'+ONLINE.von+'»':'');
}
function kopfStand(){
  const st=el('stand');if(st)st.textContent=onlineStand();
  /* Online ist es eine Webseite: kein Sichern-Knopf, kein Datei-Knopf. Was
     eingetragen ist, ist eingetragen. Sicherung einspielen und Kopie holen
     stehen unter «Einstellungen», wo sie hingehören. */
  const link=el('erfassenLink'),sich=el('knopfSichern'),oeff=el('knopfOeffnen'),qr=el('knopfQr');
  if(link)link.hidden=!ONLINE.an;
  if(qr)qr.hidden=!ONLINE.an;
  if(sich)sich.hidden=ONLINE.an;
  if(oeff)oeff.hidden=ONLINE.an;
}
async function onlineStart(){
  if(!/^https?:$/.test(location.protocol))return false;
  let r;
  try{r=await fetch('/api/bestand',{credentials:'same-origin',cache:'no-store'})}catch(e){return false}
  if(!r.ok)return false;
  let j;try{j=await r.json()}catch(e){return false}
  if(!j||typeof j.version!=='number')return false;
  ONLINE.an=true;ONLINE.version=j.version;ONLINE.geaendert=j.geaendert;ONLINE.von=j.von;ONLINE.zustand='gesichert';
  let notizen=[];
  if(j.db&&Array.isArray(j.db.analysen)){
    try{const erg=migriere(j.db);db=erg.db;notizen=erg.von<leer().schema?erg.notizen:[]}
    catch(e){ONLINE.an=false;return false}
  }else db=leer();
  dirty=false;
  ONLINE.abfrage=setInterval(onlineAbfragen,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)onlineAbfragen()});
  return {notizen};
}
function onlinePlanen(){
  clearTimeout(ONLINE.zeitgeber);
  if(ONLINE.laeuft){ONLINE.nochmal=true;return}
  ONLINE.zustand='wartet';kopfStand();
  ONLINE.zeitgeber=setTimeout(sichernOnline,1500);
}
/* Zwei Stände vereinigen: die Listen nach Kennung, alles Übrige aus dem
   eigenen Stand. Was der andere hat und ich nicht, kommt dazu – auch dann,
   wenn ich es gerade gelöscht hatte. Das ist selten und wird gesagt. */
function vereinigen(mein,fremd){
  const out=mein;let dazu=0;
  if(!fremd||typeof fremd!=='object')return {db:out,dazu};
  for(const k of LISTEN){
    const m=Array.isArray(out[k])?out[k]:(out[k]=[]),f=Array.isArray(fremd[k])?fremd[k]:[];
    const ids=new Set(m.map(x=>x&&x.id));
    for(const x of f)if(x&&x.id&&!ids.has(x.id)){m.push(x);ids.add(x.id);dazu++}
  }
  return {db:out,dazu};
}
async function sichernOnline(){
  if(!ONLINE.an||ONLINE.laeuft)return;
  clearTimeout(ONLINE.zeitgeber);
  ONLINE.laeuft=true;ONLINE.nochmal=false;ONLINE.zustand='sichert';kopfStand();
  try{
    const put=()=>fetch('/api/bestand',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({basisVersion:ONLINE.version,db})});
    let r=await put();
    if(r.status===409){
      const j=await r.json();
      const v=vereinigen(db,j.db);
      db=v.db;ONLINE.version=j.version;
      r=await put();
      if(v.dazu)toast(`Gleichzeitig gespeichert${j.von?' von «'+j.von+'»':''}: ${v.dazu} Eintrag${v.dazu>1?'e':''} aus dem anderen Stand übernommen – was du gerade gelöscht hattest, könnte darunter sein.`);
      if(r.ok)render();
    }
    if(!r.ok){let t='';try{t=(await r.json()).fehler||''}catch(e){}throw new Error(t||('Antwort '+r.status))}
    const j=await r.json();
    ONLINE.version=j.version;ONLINE.geaendert=j.geaendert;ONLINE.von='admin';
    db.gespeichert=j.geaendert;
    dirty=false;ONLINE.zustand='gesichert';ONLINE.fehler=null;
  }catch(e){
    ONLINE.zustand='fehler';ONLINE.fehler=e.message;
    setTimeout(()=>{if(dirty&&!ONLINE.laeuft)sichernOnline()},30000);
  }
  ONLINE.laeuft=false;kopfStand();
  if(ONLINE.nochmal)onlinePlanen();
}
/* Alle 30 Sekunden nachsehen, ob jemand anders etwas eingetragen hat. Nur
   wenn hier nichts offen ist und niemand gerade in einem Feld tippt, wird
   stillschweigend aufgefrischt – sonst holt der nächste Speichervorgang
   den fremden Stand ohnehin herein. */
async function onlineAbfragen(){
  if(!ONLINE.an||dirty||ONLINE.laeuft)return;
  let j;
  try{const r=await fetch('/api/version',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;j=await r.json()}catch(e){return}
  if(j.version===ONLINE.version)return;
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&el('view').contains(a))return;
  if(el('dlg').open)return;
  try{
    const r=await fetch('/api/bestand',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;
    const b=await r.json();
    if(!b.db||!Array.isArray(b.db.analysen))return;
    db=migriere(b.db).db;ONLINE.version=b.version;ONLINE.geaendert=b.geaendert;ONLINE.von=b.von;dirty=false;
    render();
    toast(`Aufgefrischt – ${b.von&&b.von!=='admin'?'von «'+b.von+'» ':''}neu eingetragen.`);
  }catch(e){}
}

/* ══════════ 17 · Verdrahtung ══════════ */
el('fileJson').onchange=e=>{const f=e.target.files[0];if(f)laden(f);e.target.value=''};
el('filePdf').onchange=e=>{const l=[...e.target.files].map(f=>({pfad:f.name,file:f}));if(l.length)einlesen(l);e.target.value=''};
el('fileTab').onchange=e=>{const f=e.target.files[0];if(f)tabelleEinlesen(f);e.target.value=''};
/* PDFs und Tabellen lassen sich auf jedem Reiter ablegen. Ohne
   preventDefault auf dragover öffnet der Browser die Datei stattdessen. */
const ziehtDatei=e=>!!(e.dataTransfer&&[...(e.dataTransfer.types||[])].indexOf('Files')>=0);
document.addEventListener('dragover',e=>{if(!ziehtDatei(e))return;e.preventDefault();const d=el('drop');if(d)d.classList.add('over')});
document.addEventListener('dragleave',()=>{const d=el('drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{
  e.preventDefault();
  const d=el('drop');if(d)d.classList.remove('over');
  const alle=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
  const pdfs=alle.filter(f=>/\.pdf$/i.test(f.name));
  const tabellen=alle.filter(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name));
  if(pdfs.length){if(tab!=='analysen'){tab='analysen';render()}einlesen(pdfs.map(f=>({pfad:f.name,file:f})))}
  if(tabellen.length)tabelleEinlesen(tabellen[0]);
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
/* Die Diagramme rechnen mit der Breite ihres Kastens; nach einer Änderung
   der Fenstergrösse werden sie neu gezeichnet – die Seite bleibt stehen. */
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(el('dlg').open)return;
  if(DIAG)diagFrisch()},250)});
document.addEventListener('keydown',e=>{
  if(e.key==='s'&&(e.ctrlKey||e.metaKey)){e.preventDefault();AKTION.sichern()}
});
/* Ohne Netz bleibt alles bedienbar: ansehen, sichern, laden. Nur das
   Einlesen von PDFs braucht pdf.js vom CDN – fällt es aus, sagt die App das. */
let pdfBereit=false;
async function pdfVorbereiten(){
  if(typeof pdfjsLib==='undefined')return false;
  try{
    const w=await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    if(!w.ok)throw new Error('Status '+w.status);
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await w.text()],{type:'application/javascript'}));
  }catch(e){
    try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
    catch(e2){return false}
  }
  return true;
}
(async()=>{
  /* Reihenfolge zählt doppelt. Das Abbild der Seite entsteht als
     Allererstes – vor jedem Zeichnen –, damit nur das ausgelieferte Gerüst
     darin steht. Und der Datenblock wird davor ausgelesen und danach
     geleert, sonst trüge jede Sicherung den vorigen Bestand ein zweites Mal
     mit sich. */
  let eingebettet=null;
  try{eingebettet=datenAusSeite()}catch(e){eingebettet=null}
  seiteMerken();
  try{ansichtLaden()}catch(e){}
  try{pdfBereit=await pdfVorbereiten()}catch(e){pdfBereit=false}
  let start=null;
  /* Vom Server geladen? Dann ist der Server die Wahrheit, nicht der Datenblock. */
  let online=null;
  try{online=await onlineStart()}catch(e){online=null}
  if(online){
    eingebettet=null;
    if((online.notizen||[]).length)start={text:'Bestand vom Server geladen und auf den neuen Stand gebracht.',notizen:online.notizen};
    else if(ONLINE.version===0)start={text:'Verbunden. Der Bestand auf dem Server ist noch leer – unter Einstellungen lässt sich eine bestehende Sicherung einspielen.'};
  }
  if(eingebettet&&eingebettet.__kaputt)
    start={warn:true,text:'In dieser Datei stecken Daten, die sich nicht lesen lassen ('+eingebettet.__kaputt+'). Das Werkzeug startet leer – die Datei selbst ist unverändert.'};
  else if(eingebettet&&Array.isArray(eingebettet.analysen)){
    try{
      const erg=migriere(eingebettet);
      db=erg.db;dirty=false;
      start={text:`Aus dieser Datei geladen: ${db.analysen.length} Analysen, ${db.messungen.length} Messungen.`,notizen:erg.von<leer().schema?erg.notizen:[]};
    }catch(e){start={warn:true,text:'Die eingebetteten Daten liessen sich nicht übernehmen: '+(e&&e.message||e)}}
  }
  try{render()}
  catch(e){
    document.getElementById('view').innerHTML='<div class="card"><h2>Die App liess sich nicht starten</h2>'+
      '<p class="muted">Bitte die Seite neu laden. Bleibt es dabei, hilft die Meldung unten weiter.</p>'+
      '<pre class="tiny mono" style="white-space:pre-wrap">'+esc(e&&e.stack||e)+'</pre></div>';
  }
  if(start){
    if(start.warn||(start.notizen||[]).length)
      dialog(start.warn?'Daten in dieser Datei':'Ältere Daten übernommen',
        `<p>${esc(start.text)}</p>`+
        ((start.notizen||[]).length?`<p>Dabei angepasst:</p><ul style="margin:0 0 12px;padding-left:20px">${
          start.notizen.map(n=>`<li style="margin-bottom:6px">${esc(n)}</li>`).join('')}</ul>`:''),
        `<button class="primary" data-tun="dlgZu">Verstanden</button>`);
    else toast(start.text);
  }
})();
</script>
