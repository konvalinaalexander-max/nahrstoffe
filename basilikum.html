    </tbody></table></div>`;
  const aus=liste.filter(x=>x.zustand.aus);
  if(aus.length)t+=`<div class="note neutral" style="margin-top:14px"><strong>Nicht verwendet:</strong> ${esc(aus.map(x=>x.roh+' ('+x.n+')').join(', '))}.
    Diese Proben bleiben vollständig im Bestand, in den Tabellen und in der Sicherungsdatei – sie bilden nur keine Reihe im Verlauf.</div>`;
  if(offen.length)t+=`<div class="note">${offen.length} Bezeichnung${offen.length>1?'en sind':' ist'} noch nicht zugeordnet.
    Solange bleibt jede eine eigene Reihe – es geht nichts verloren, aber der Verlauf zerfällt in mehr Reihen als es Stellen gibt.</div>`;
  dialog('Entnahmestellen zuordnen',t,`<button class="primary" data-tun="dlgZu">Fertig</button>`);
}
AKTION.stellen=()=>stellenDialog();
AKTION.stelleZu=d=>{
  const zu=stellenDb().zu;
  if(d.id==='offen')delete zu[d.roh];               /* Zuordnung aufheben */
  else if(d.id==='')zu[d.roh]=null;                 /* ausdrücklich zu keiner Stelle */
  else if(zu[d.roh]===d.id)delete zu[d.roh];        /* derselbe Knopf noch einmal: wieder offen */
  else zu[d.roh]=d.id;
  aend();stellenDialog();render();
};
AKTION.stelleVorschlagAlle=()=>{
  const zu=stellenDb().zu;let n=0;
  for(const x of stellenListe())if(x.zustand.offen&&x.vorschlag){zu[x.roh]=x.vorschlag.id;n++}
  if(!n)return toast('Es gibt nichts, wofür sich ein Vorschlag ableiten liesse.');
  aend();stellenDialog();render();
  toast(`${n} Bezeichnung${n>1?'en zugeordnet':' zugeordnet'} – bitte kurz durchsehen, besonders die behandelten Proben.`);
};
AKTION.stelleNeu=()=>{
  const e=el('stNeu'),name=(e&&e.value||'').trim();
  if(!name)return toast('Bitte einen Namen eintragen.');
  const gr=stellenDb().gruppen;
  if(gr.some(g=>g.name===name))return toast('Diese Stelle gibt es schon.');
  gr.push({id:'s'+Date.now().toString(36),name});
  aend();stellenDialog();render();
};
AKTION.stelleName=(d,ev)=>{
  const g=stelleDef(d.id);if(!g)return;
  const n=(ev.target.value||'').trim();
  if(!n)return toast('Eine Stelle braucht einen Namen.');
  g.name=n;aend();render();
};
AKTION.stelleWeg=d=>{
  const zu=stellenDb().zu;
  const betroffen=Object.keys(zu).filter(k=>zu[k]===d.id);
  if(betroffen.length&&!confirm(`${betroffen.length} Bezeichnung${betroffen.length>1?'en zeigen':' zeigt'} auf diese Stelle. Sie werden wieder offen. Fortfahren?`))return;
  betroffen.forEach(k=>delete zu[k]);
  db.stellen.gruppen=stellenDb().gruppen.filter(g=>g.id!==d.id);
  aend();stellenDialog();render();
};
/* Ein Knopf, der zeigt, ob noch etwas offen ist – überall gleich. */
function stellenChip(){
  const liste=stellenListe();
  if(liste.length<2)return '';
  const offen=liste.filter(x=>x.zustand.offen).length;
  const stellen=new Set(liste.filter(x=>!x.zustand.offen&&!x.zustand.aus).map(x=>x.zustand.id));
  return `<button class="klein" data-tun="stellen" title="${esc(liste.length+' Bezeichnungen im Bestand')}">Stellen zuordnen${
    offen?` <span class="pill rand" style="margin-left:4px">${offen} offen</span>`:` <span class="tiny muted">· ${stellen.size} Stelle${stellen.size===1?'':'n'}</span>`}</button>`;
}

/* Kurzname eines Wasserparameters – der Zusatz «(Wasser)» steht in jeder
   Überschrift des Reiters schon im Zusammenhang. */
const gwName=k=>String(NAME[k]||k).replace(' (Wasser)','').replace(' (Giesswasser)','');
/* Farbe je Entnahmestelle, damit Proben vom selben Tag unterscheidbar bleiben.
   Im Diagramm steht die Farbe für den Parameter und die Form für die Stelle –
   in den Karten und Tabellen bleibt die Farbe die Kennung der Stelle. */
function gwFarben(){
  /* Die Farbe kennzeichnet die Stelle, nicht die Schreibweise: zwei
     Bezeichnungen derselben Stelle bekommen dieselbe Farbe. Nachgeschlagen
     wird ueber beides, damit alte Aufrufstellen weiter funktionieren. */
  const st=[...new Set(gwProben().map(stelleSchluessel))].sort();
  const m={};st.forEach((x,i)=>m[x]=FARBEN[i%FARBEN.length]);
  for(const a of gwProben())if(m[stelleSchluessel(a)])m[gwStelle(a)]=m[stelleSchluessel(a)];
  return m;
}
let gwWahl=null,gwSkala='auto',gwLinien='aus',gwLog=true;
/* Die Karte «Am Tank»: drei Grössen, drei Achsen, eine Zeitachse. */
let tkStelle='alle',tkZeit='alles',tkLinien='keine',tkBeigaben=true;
/* Aus dem, was bei einer Messung als Stelle steht – vom Handy der Name der
   Stelle, aus Excel «vorne»/«hinten», von früher gar nichts –, die Stelle,
   wie sie im Bestand heisst. */
function messStelle(m){
  const st=(m&&m.stelle)?String(m.stelle):'';
  if(!st)return 'ohne Stelle';
  if(st==='wurzelraum')return 'Wurzelraum';
  const g=stellenDb().gruppen.find(x=>x.name===st);
  if(g)return g.name;
  const t=st.toLowerCase();
  const v=stellenDb().gruppen.find(x=>/vorne/.test(x.name.toLowerCase())),h=stellenDb().gruppen.find(x=>/hinten/.test(x.name.toLowerCase()));
  if(/vorn|\brv\b/.test(t)&&v)return v.name;
  if(/hint|\brh\b/.test(t)&&h)return h.name;
  return st;
}
function vGiess(){
  const alle=gwProben();
  const farbe=gwFarben();
  /* Nach zugeordneter Stelle, nicht nach Schreibweise. Ausgeschlossene
     Bezeichnungen bleiben in den Tabellen sichtbar, aber aus den Reihen
     draussen - sie würden den Verlauf verfälschen. */
  const sicht=alle.filter(gwSichtbar);
  const stellen=[...new Set(sicht.map(stelleSchluessel))].sort((a,b)=>stelleTitel(a).localeCompare(stelleTitel(b)));
  const messungen=chronoAb(db.messungen.filter(m=>m.datum));
  const rel=chronoAb(db.ereignisse.filter(e=>e.datum&&EVTYPEN[e.typ]&&EVTYPEN[e.typ].kreis));
  const altFormat=alle.filter(a=>a.einheitAlt);

  if(!alle.length&&!messungen.length)return leerHinweis('Noch kein Giesswasser erfasst',
    'Das Giesswasser ist die Quelle des Kreislaufs. In einem Ebbe-Flut-System fliesst nichts ab – was im Wasser hereinkommt, bleibt drin und reichert sich an. Ohne diese Analyse lässt sich nicht sagen, ob Natrium und Chlorid von aussen kommen oder erst im Umlauf entstehen.<br><br>Die Wasserberichte von NovaCropControl werden automatisch gelesen, auch die mit Historie.',
    '<button class="primary" data-tun="pdfWaehlen">Wasserbericht einlesen</button> <button data-tun="manuellNeu" data-typ="giesswasser">Von Hand erfassen</button>');

  /* ── Verlauf: Farbe = Parameter, Form = Entnahmestelle ──
     So bleiben zwei Proben vom selben Tag aus verschiedenen Stellen
     auseinanderzuhalten, auch wenn sie denselben Parameter zeigen. */
  const gwVerf=GW_PARAM.map(k=>'gw_'+k).filter(k=>alle.some(a=>a.werte[k]&&a.werte[k].wert!=null));
  if(!gwWahl)gwWahl=gwVerf.includes('gw_HCO3')?['gw_HCO3']:gwVerf.slice(0,1);
  const gwForm={};stellen.forEach((st,i)=>gwForm[st]=FORMEN[i%FORMEN.length]);
  const gwGroesse=k=>groessenordnung(alle.map(a=>a.werte[k]).filter(w=>w&&w.wert!=null&&!w.unter).map(w=>Math.abs(w.wert)));

  /* Wie im Reiter Nährstoffe: alles Abgeleitete hängt an der Auswahl und
     wird bei jedem Neuzeichnen frisch bestimmt. */
  function gwAb(){
    gwWahl=gwWahl.filter(k=>gwVerf.includes(k));
    if(!gwWahl.length)gwWahl=gwVerf.slice(0,1);
    const achse=gemeinsameAchse(gwWahl,einheit,gwGroesse);
    const sk=gwSkala==='rel'?'rel':(achse.ok?'wert':'rel');
    const max={};gwWahl.forEach(k=>{
      const v=alle.map(a=>a.werte[k]&&!a.werte[k].unter?a.werte[k].wert:null).filter(x=>x!=null);
      max[k]=v.length?Math.max.apply(null,v):null;
    });
    return {achse,einheiten:achse.einheiten,gleich:achse.ok,sk,max,
      erzwungen:gwSkala!=='rel'&&!achse.ok,
      farbe:farbenFuer(gwWahl),
      band:(gwWahl.length===1&&sk==='wert'&&gwRichtVon(gwWahl[0]))?[null,gwRichtVon(gwWahl[0]).bis]:null};
  }

  function gwSerien(Z){
    const gwFarbe=Z.farbe,gwSk=Z.sk,gwMax=Z.max;
    const out=[];
    for(const k of gwWahl)for(const st of stellen){
      const punkte=[];
      for(const a of sicht.filter(x=>stelleSchluessel(x)===st)){
        const w=a.werte[k];if(!w||w.wert==null||w.unter)continue;
        const y=gwSk==='rel'?(gwMax[k]?w.wert/gwMax[k]*100:null):w.wert;
        if(y==null)continue;
        const r=gwRichtVon(k),mg=inMgL(k,w.wert);
        punkte.push({x:+new Date(a.datum),y,xtext:fmtK(a.datum),gruppe:gwLinien==='alle'?null:st,kennung:a.id,
          tipp:tippBau(gwName(k),gwWahl.length>1?gwFarbe[k]:(farbe[st]||gwFarbe[k]),[
            ['Entnahmestelle',stelleName(a)],
            stelleVon(a).roh!==stelleName(a)?['auf dem Bericht',stelleVon(a).roh]:null,
            ['Probe',fmt(a.datum)],
            a.laborId?['Probennummer',a.laborId]:null,
            a.kultur?['Anbau',a.kultur]:null,
            ['Messwert',nz(w.wert)+' '+einheit(k)],
            mg!=null?['entspricht',nz(mg,1)+' mg/l']:null,
            r?['Richtwert (Annahme)','bis '+nz(r.bis)+' '+einheit(k)]:null,
            (r&&w.wert>r.bis)?['Beurteilung','über dem Richtwert']:null],
            'Anklicken öffnet alle Werte dieser Probe.')});
      }
      if(punkte.length)out.push({id:k+'|'+st,name:(gwWahl.length>1?gwName(k)+' · ':'')+stelleTitel(st),
        farbe:gwWahl.length>1?gwFarbe[k]:(farbe[st]||gwFarbe[k]),form:gwForm[st]||'kreis',punkte});
    }
    return out;
  }
  function gwZeichnen(){
    if(alle.length>1){
      const Z=gwAb(),serien=gwSerien(Z),gwSk=Z.sk,gwEinheiten=Z.einheiten,gwBand=Z.band;
      chartPunkte(el('cGw'),{serien,yTyp:'wert',band:gwBand,bandLabel:'Richtwert (Annahme)',
        spannen:beigabenFuer(gwWahl.map(k=>k.slice(3)),Object.fromEntries(gwWahl.map(k=>[k.slice(3),Z.farbe[k]]))),
        xTyp:'datum',xLabel:'Probendatum',hoehe:330,linien:gwLinien!=='aus',aufKlick:true,
        fotos:fotoSpur?fotoGruppen():null,
        yLabel:gwSk==='rel'?'Anteil am höchsten gemessenen Wert, in %':gwEinheiten.join(' · '),
        ereignisse:gwLog?logbuchPunkte(rel):[]});
      el('legGw').innerHTML=legende(serien,diagAus,
        gwSk==='rel'?'100 % = höchster gemessener Wert des jeweiligen Parameters':'Einheit '+esc(gwEinheiten.join(' · ')))
        +(gwBand?`<span class="muted">grünes Band: bis ${nz(gwBand[1])} <span class="tag schaetz">Annahme</span></span>`:'');
    }
    if(messungen.length&&el('cTank'))tkZeichnen();
  }

  /* ── Am Tank: pH, EC und Sauerstoff übereinander ──
     Drei Grössen mit drei Skalen. Bisher teilten sich pH und EC eine Achse –
     zufällig ähnlich gross, und damit eine Vergleichbarkeit, die es nicht
     gibt. Jetzt hat jede ihre eigene Spur; gemeinsam ist nur die Zeit. */
  const tkStellen=()=>[...new Set(db.messungen.map(messStelle))].sort();
  const tkMess=()=>db.messungen.filter(m=>m.datum&&(tkStelle==='alle'||messStelle(m)===tkStelle));
  function tkZeichnen(){
    zoomHaken=art=>{tkZeit=art==='reset'?'alles':null};
    const stellen=tkStellen(),form={};stellen.forEach((st,i)=>form[st]=FORMEN[i%FORMEN.length]);
    const ms=tkMess();
    const lage=messLage(ms,messStelle),mx=m=>lage.x.get(m);
    const reihe=(k,name,farbe,extra)=>stellen.map(st=>{
      const pk=ms.filter(m=>messStelle(m)===st&&m[k]!=null).sort((a,b)=>mx(a)-mx(b));
      return {id:'t|'+k+'|'+st,name:name+(stellen.length>1?' · '+st:''),farbe,form:form[st],
        punkte:pk.map(m=>({x:mx(m),y:m[k],kennung:null,
          tipp:tippBau(name,farbe,[['Stelle',st],['Datum',fmt(m.datum)],zeitZeile(m,lage.folge),[name,nz(m[k],k==='ph'?2:k==='o2'?1:2)+(k==='ph'?'':k==='o2'?' mg/l':' mS/cm')],
            (k==='o2'&&m.temp!=null)?['Sättigungsgrenze bei '+nz(m.temp,1)+' °C',nz(o2Saettigung(m.temp,db.einst.hoeheM),1)+' mg/l (Annahme)']:null,
            (k==='o2'&&m.o2sat!=null)?['Sättigung laut Gerät',nz(m.o2sat,0)+' %']:null,
            m.temp!=null&&k!=='o2'?['Temperatur',nz(m.temp,1)+' °C']:null,
            m.wer?['gemessen von',m.wer]:null,m.beleg?['Beleg',m.beleg]:null],m.notiz||'')}))};
    }).concat(extra||[]).filter(x=>x.punkte.length);
    const ecFrisch=stellen.map(st=>{
      const pk=ms.filter(m=>messStelle(m)===st&&m.ecFrisch!=null).sort((a,b)=>mx(a)-mx(b));
      return {id:'t|ecf|'+st,name:'EC frisch angesetzt'+(stellen.length>1?' · '+st:''),farbe:FARBSTOFF[2],form:'ring',
        punkte:pk.map(m=>({x:mx(m),y:m.ecFrisch,tipp:tippBau('EC frisch angesetzt',FARBSTOFF[2],[['Stelle',st],['Datum',fmt(m.datum)],zeitZeile(m,lage.folge),['EC frisch',nz(m.ecFrisch,2)+' mS/cm'],
          m.ec!=null?['Aufnahme bis zum Rücklauf',nz(m.ecFrisch-m.ec,2)+' mS/cm']:null])}))};
    });
    const ph=reihe('ph','pH',FARBSTOFF[0]),ec=reihe('ec','EC',FARBSTOFF[1],ecFrisch),o2=reihe('o2','Sauerstoff',FARBSTOFF[3]);
    /* Die Sättigungsgrenze als Band in der O₂-Spur: aus der zuletzt
       gemessenen Temperatur, als physikalische Obergrenze gekennzeichnet. */
    const mitTemp=ms.filter(m=>m.o2!=null&&m.temp!=null).sort((a,b)=>mx(a)-mx(b)).slice(-1)[0];
    const grenze=mitTemp?o2Saettigung(mitTemp.temp,db.einst.hoeheM):null;
    const spuren=[
      {titel:'pH im Rücklauf',serien:ph,yTyp:'wert',yLabel:'pH',hoehe:150,leerText:'kein pH in diesem Zeitraum'},
      {titel:'EC im Rücklauf'+(ecFrisch.some(x=>x.punkte.length)?' und frisch angesetzt':''),serien:ec,yTyp:'wert',yLabel:'mS/cm',hoehe:150,leerText:'kein EC in diesem Zeitraum'},
      {titel:'Sauerstoff',serien:o2,yTyp:'wert',yLabel:'mg/l',hoehe:150,band:grenze?[null,grenze]:null,
       bandLabel:grenze?`Sättigungsgrenze bei ${nz(mitTemp.temp,1)} °C, ${nz(db.einst.hoeheM,0)} m (Annahme)`:'',
       leerText:o2.length?'kein Sauerstoff in diesem Zeitraum':'noch nie gemessen – neu am Tank erfassbar'}];
    chartStapel(el('cTank'),{von:koVon,bis:koBis,linien:tkLinien==='reihe',spuren,spannen:beigabenFuer([],{}),
      ereignisse:tkBeigaben?logbuchPunkte(rel):[]});
    el('legTank').innerHTML=legende(ph.concat(ec,o2),diagAus,stellen.length>1?'Form = Stelle · jede Grösse hat ihre eigene Achse':'jede Grösse hat ihre eigene Achse');
  }
  /* Drei Kacheln: der letzte Wert, daneben der von vor einer Woche. Kein
     Ampelurteil – für den Rücklauf-pH gibt es keinen vereinbarten Sollbereich,
     und die App erfindet keinen. */
  function tkKachel(k,name,einheit,dez){
    const ms=tkMess().filter(m=>m[k]!=null).sort(chrono);
    if(!ms.length)return `<div class="kpi"><h4>${esc(name)}</h4><b class="muted">–</b><span class="tiny muted">noch nicht gemessen</span></div>`;
    const l=ms[ms.length-1];
    const vor=ms.filter(m=>tage(m.datum,l.datum)>=6).slice(-1)[0];
    const d=vor?l[k]-vor[k]:null;
    return `<div class="kpi"><h4>${esc(name)}</h4><b>${nz(l[k],dez)}<span class="tiny muted" style="font-weight:400;margin-left:4px">${esc(einheit)}</span></b>
      <span class="tiny muted">${fmtZ(l)}${tkStelle==='alle'?' · '+esc(messStelle(l)):''}${l.wer?' · '+esc(l.wer):''}${
        vor?`<br>vor ${tage(vor.datum,l.datum)} Tagen ${nz(vor[k],dez)} ${d>0.05*Math.max(1,Math.abs(vor[k]))?'↗':d<-0.05*Math.max(1,Math.abs(vor[k]))?'↘':'→'}`:''}</span></div>`;
  }
  function tkKopf(){
    const stellen=tkStellen();
    if(tkStelle!=='alle'&&!stellen.includes(tkStelle))tkStelle='alle';
    const hatO2=db.messungen.some(m=>m.o2!=null);
    let t=`<div class="hd"><div><h2>Am Tank</h2>
      <p class="sub">pH, EC und Sauerstoff im Rücklauf, gemessen vor der neuen Düngergabe – von Hand hier oder vom Handy hinten. Alle Tische hängen am selben Kreislauf.</p></div></div>
      <div class="kpis">${tkKachel('ph','pH','',2)}${tkKachel('ec','EC Rücklauf','mS/cm',2)}${tkKachel('o2','Sauerstoff','mg/l',1)}${tkKachel('temp','Temperatur','°C',1)}</div>
      <div class="werkzeug"><div class="wz haupt mitBeigaben">
        ${stellen.length>1?`<span class="lab">Stelle</span><span class="seg">${[['alle','alle']].concat(stellen.map(x=>[x,x.replace('Reservoir ','')])).map(([v,l])=>`<button class="${tkStelle===v?'on':''}" data-tun="tkStelle" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</span>`:''}
        <span class="lab" style="min-width:0;margin-left:${stellen.length>1?8:0}px">Zeitraum</span>
        <span class="seg">${[['alles','alles'],['90','3 Monate'],['42','6 Wochen'],['7','1 Woche']].map(([v,l])=>`<button class="${tkZeit===v?'on':''}" data-tun="tkZeit" data-v="${v}">${l}</button>`).join('')}</span>
        <span class="lab" style="min-width:0;margin-left:8px">Linien</span>
        <span class="seg">${[['keine','keine'],['reihe','je Reihe']].map(([v,l])=>`<button class="${tkLinien===v?'on':''}" data-tun="tkLinien" data-v="${v}">${l}</button>`).join('')}</span>
        <span class="chip ${tkBeigaben?'on':''}" data-tun="tkBeigaben" style="margin-left:8px">Marken</span>${beigabenSchalter()}
      </div></div>
      <div id="cTank" class="diagramm"></div><div class="legend" id="legTank"></div>`;
    if(!hatO2)t+=`<p class="tiny muted">Sauerstoff wurde noch nie gemessen. Die Spur bleibt leer, bis der erste Wert vom Tank kommt.</p>`;
    else t+=`<p class="tiny muted">Das Band in der Sauerstoffspur ist die <strong>physikalische Sättigungsgrenze</strong> bei der zuletzt gemessenen Temperatur, aus der Löslichkeitstabelle für Süsswasser und der Höhenlage (${nz(db.einst.hoeheM,0)} m, einstellbar) <span class="tag schaetz">Annahme</span>. Sie ist eine Obergrenze, kein Sollwert – was darunter liegt, sagt, wieviel Sauerstoff die Wurzeln und die Mikrobiologie gerade zehren.</p>`;
    return t;
  }
  function gwKopf(){
    const Z=gwAb(),gwFarbe=Z.farbe,gwSk=Z.sk,gwEinheiten=Z.einheiten,gwGleich=Z.gleich,gwAchse=Z.achse,gwErzwungen=Z.erzwungen;
    let t=`<div class="hd"><div><h2>Verlauf des Giesswassers</h2>
      <p class="sub">Jeder Punkt ist eine Wasserprobe – Linien sind zuschaltbar, aber nicht die Vorgabe.
      ${gwWahl.length>1?'Die Farbe steht für den Parameter, die Form für die Entnahmestelle'
        :'Farbe und Form stehen für die Entnahmestelle – dieselben Farben wie in den Karten darunter'} –
      so bleiben zwei Proben vom selben Tag unterscheidbar. Mit dem Zeiger über einem Punkt stehen Name, Datum und Wert; ein Klick öffnet die ganze Probe.</p></div></div>
      <div class="werkzeug">
        <div class="wz haupt"><span class="lab">Parameter</span><span style="display:flex;gap:6px;flex-wrap:wrap;flex:1">
          ${gwVerf.map(k=>`<span class="chip stoff ${gwWahl.includes(k)?'on':''}" data-tun="gwStoff" data-k="${esc(k)}"><span class="dot" style="background:${gwWahl.includes(k)?gwFarbe[k]:'#C3CDBF'}"></span>${esc(gwName(k))}</span>`).join('')}
        </span></div>
        <div class="wz"><span class="lab">Zusammenstellung</span>
          ${[['ballast','Ballast und Puffer'],['naehr','Nährstoffe im Wasser'],['technik','Technik'],['leit','Leitwerte']]
            .map(([v,l])=>`<button class="ghost" data-tun="gwSatzWahl" data-v="${v}">${l}</button>`).join('')}
        </div>
        <div class="wz mitBeigaben">
          <span class="lab">Senkrecht</span>
          <span class="seg">${[['wert','Messwert',!gwGleich],['rel','relativ, in %',false]].map(([v,l,aus])=>`<button class="${gwSk===v?'on':''}"${aus?' disabled title="'+esc(gwAchse.grund==='einheit'?'Die ausgewählten Parameter haben verschiedene Einheiten.':'Die ausgewählten Parameter liegen zu weit auseinander für eine gemeinsame Messwert-Achse.')+'"':''} data-tun="gwSkala" data-v="${v}">${l}</button>`).join('')}</span>
          <span class="lab" style="min-width:0;margin-left:8px">Linien</span>
          <span class="seg">${[['aus','keine'],['stelle','je Stelle'],['alle','durchgehend']].map(([v,l])=>`<button class="${gwLinien===v?'on':''}" data-tun="gwLinien" data-v="${v}">${l}</button>`).join('')}</span>
          <span class="chip ${gwLog?'on':''}" data-tun="gwLog" style="margin-left:8px">Eingriffe einblenden</span>${fotoChip()}${beigabenSchalter()}
          ${stellenChip()}
        </div></div>
      <div id="cGw" class="diagramm"></div><div class="legend" id="legGw"></div>`;
    if(gwErzwungen)t+=`<div class="note">${gwAchse.grund==='einheit'
        ?`Die Auswahl umfasst verschiedene Einheiten (${esc(gwEinheiten.join(', '))}).`
        :`${esc(gwName(gwAchse.hoch.k))} liegt bei rund ${nz(gwAchse.hoch.g)} ${esc(gwEinheiten[0])}, ${esc(gwName(gwAchse.tief.k))} bei rund ${nz(gwAchse.tief.g)} – auf einer gemeinsamen Messwert-Achse wäre ${esc(gwName(gwAchse.tief.k))} nicht mehr zu erkennen.`}
      Gezeigt wird deshalb jeder Parameter als Anteil seines eigenen höchsten Messwerts. Das macht sichtbar, ob zwei Stoffe gemeinsam steigen –
      es sagt nichts darüber, ob ein Wert hoch oder tief ist. Für Messwerte einen einzelnen Parameter wählen.</div>`;
    if(gwLinien==='alle')t+=`<p class="tiny muted">Die Linien laufen durchgehend über alle Entnahmestellen hinweg. Zwischen zwei Stellen liegt kein Verlauf, sondern ein Ortswechsel.</p>`;
    return t;
  }
  const teile=[];if(alle.length>1)teile.push(['gwKarte',gwKopf]);if(messungen.length)teile.push(['tkKarte',tkKopf]);
  if(teile.length)DIAG={teile,zeichnen:gwZeichnen,klick:id=>detail(id)};
  nachRender=gwZeichnen;

  let s='';
  if(altFormat.length)s+=`<div class="note warn">${altFormat.length} Wasseranalyse${altFormat.length>1?'n wurden':' wurde'} vor der Umstellung von Hand erfasst.
    Damals waren die Felder als mg/l beschriftet, das Labor liefert aber mmol/l und µmol/l. Bitte diese Werte kontrollieren.</div>`;

  const stListe=stellenListe(),stOffen=stListe.filter(x=>x.zustand.offen);
  if(stOffen.length&&stListe.length>1)
    s+=`<div class="note"><strong>${stListe.length} verschiedene Bezeichnungen</strong> für Entnahmestellen stehen im Bestand,
      ${stOffen.length===stListe.length?'keine davon ist':stOffen.length+' davon '+(stOffen.length>1?'sind':'ist')+' noch nicht'} zugeordnet
      (${esc(stOffen.map(x=>x.roh).join(', '))}).
      Jede bildet solange ihre eigene Reihe – was derselbe Ort ist, sieht dann aus wie zwei verschiedene.
      <button data-tun="stellen" style="margin-left:8px">Jetzt zuordnen</button></div>`;

  /* Das Diagramm zuoberst, sobald es mehr als eine Probe gibt. */
  if(alle.length>1)s+=`<div class="card haupt" id="gwKarte">${gwKopf()}</div>`;

  s+=`<div class="kpis">
    <div class="kpi"><h4>Entnahmestellen</h4><b>${stellen.length}</b><span class="tiny muted">aus ${stellenListe().length} Bezeichnung${stellenListe().length===1?'':'en'} · ${alle.length} Proben</span></div>
    <div class="kpi"><h4>Neueste Probe</h4><b>${alle.length?fmtK(alle[0].datum):'–'}</b><span class="tiny muted">${alle.length?esc(stelleName(alle[0])):'noch keine'}</span></div>
    <div class="kpi"><h4>Messungen am Tank</h4><b>${messungen.length}</b><span class="tiny muted">pH und EC im Rücklauf</span></div>
  </div>`;

  /* ── Karten je Entnahmestelle ── */
  if(stellen.length){
    s+=`<div class="hd" style="margin:20px 0 12px"><div><h2>Neueste Probe je Entnahmestelle</h2>
      <p class="sub">Jede Entnahmestelle ist eine eigene Reihe. Proben vom selben Tag aus verschiedenen Stellen stehen nebeneinander und tragen jeweils ihren Namen.</p></div></div>`;
    for(const st of stellen){
      const p=sicht.find(a=>stelleSchluessel(a)===st);
      const leit=['gw_EC','gw_pH','gw_HCO3','gw_Na','gw_Cl','gw_NO3','gw_NH4'].filter(k=>p.werte[k]);
      const hin=[];
      for(const k of Object.keys(GW_RICHT_VORGABE)){
        const w=p.werte[k],r=gwRichtVon(k);
        if(!w||w.wert==null||w.unter||!r)continue;
        if(w.wert>r.bis)hin.push({k,w,r});
      }
      /* Was schon im Wasser mitkommt */
      const naehr=['gw_NO3','gw_NH4','gw_K','gw_Ca','gw_Mg','gw_S','gw_P']
        .filter(k=>p.werte[k]&&p.werte[k].wert!=null&&!p.werte[k].unter&&p.werte[k].wert>0);
      s+=`<div class="card"><div class="hd">
        <div><h2 style="display:flex;align-items:center;gap:8px"><span style="width:11px;height:11px;border-radius:50%;background:${farbe[st]};flex:none"></span>${esc(stelleTitel(st))}</h2>
          <p class="sub">${fmt(p.datum)}${p.kultur?' · '+esc(p.kultur):''}${p.laborId?' · Probe '+esc(p.laborId):''}
          ${sicht.filter(a=>stelleSchluessel(a)===st).length>1?` · ${sicht.filter(a=>stelleSchluessel(a)===st).length} Proben insgesamt`:''}
          ${stelleVon(p).offen?'':`<span class="tiny muted">· zugeordnet: ${esc([...new Set(sicht.filter(a=>stelleSchluessel(a)===st).map(a=>gwStelle(a)))].join(', '))}</span>`}</p></div>
        <button data-tun="detail" data-id="${esc(p.id)}">Alle Werte ansehen</button></div>
        <div class="row" style="gap:20px">
          ${leit.map(k=>`<div><div class="tiny muted">${esc(NAME[k].replace(' (Wasser)','').replace(' (Giesswasser)',''))}</div>
            <div class="mono" style="font-size:16px">${zeigeWert(p.werte[k])} <span class="tiny muted">${esc(einheit(k))}</span></div>
            ${einheit(k)==='mmol/l'&&inMgL(k,p.werte[k].wert)!=null?`<div class="tiny muted">${nz(inMgL(k,p.werte[k].wert),1)} mg/l</div>`:''}</div>`).join('')}
        </div>
        ${hin.length?hin.map(x=>`<div class="deutung angebot" style="margin-top:8px">
          <strong>${esc(NAME[x.k].replace(' (Wasser)','').replace(' (Giesswasser)',''))} über dem Richtwert:</strong>
          ${nz(x.w.wert)} ${esc(einheit(x.k))} gegen ${nz(x.r.bis)} <span class="tag schaetz">Annahme</span><br>${esc(x.r.text)}</div>`).join('')
          :'<div class="deutung ok" style="margin-top:8px">Alle hinterlegten Richtwerte eingehalten. Das Wasser bringt weder auffällig viel Ballast noch viel Puffer mit.</div>'}
        ${naehr.length?`<details style="margin-top:8px"><summary>Was mit dem Wasser schon an Nährstoffen hereinkommt</summary>
          <div class="scroll" style="margin-top:8px"><table><thead><tr><th>Nährstoff</th><th>im Wasser</th><th>entspricht</th></tr></thead><tbody>
          ${naehr.map(k=>`<tr><td>${esc(NAME[k].replace(' (Wasser)',''))}</td>
            <td class="mono">${nz(p.werte[k].wert)} ${esc(einheit(k))}</td>
            <td class="mono tiny">${inMgL(k,p.werte[k].wert)!=null?nz(inMgL(k,p.werte[k].wert),1)+' mg/l':'–'}</td></tr>`).join('')}
          </tbody></table></div>
          <p class="tiny muted" style="margin-top:6px">Diese Mengen sind vor jeder Düngung schon im Wasser. Eine Dosierungsrechnung baut die App bewusst nicht – sie zeigt nur, was da ist.</p></details>`:''}
      </div>`;
    }
  }

  /* ── Vergleichstabelle ── */
  if(alle.length>1){
    const spalten=alle.slice(0,6);
    const params=GW_PARAM.map(k=>'gw_'+k).filter(k=>spalten.some(a=>a.werte[k]));
    s+=`<div class="card"><div class="hd"><div><h2>Alle Proben nebeneinander</h2>
      <p class="sub">${spalten.length} Proben, neueste zuerst. Die Farbe kennzeichnet die Entnahmestelle – so bleiben Proben vom selben Tag unterscheidbar.</p></div></div>
      <div class="scroll"><table><thead><tr><th>Parameter</th>
        ${spalten.map(a=>`<th title="${esc(gwStelle(a))} · ${fmt(a.datum)}${a.laborId?' · Probe '+esc(a.laborId):''}">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${farbe[gwStelle(a)]};margin-right:5px"></span>
          ${fmtK(a.datum)}<div style="font-weight:400;text-transform:none;letter-spacing:0">${esc(gwStelle(a).slice(0,18))}</div></th>`).join('')}
        <th>Einheit</th></tr></thead><tbody>
      ${params.map(k=>{
        const r=gwRichtVon(k);
        return `<tr><td><strong>${esc(NAME[k].replace(' (Wasser)','').replace(' (Giesswasser)',''))}</strong>
          ${r?`<div class="tiny muted">Richtwert bis ${nz(r.bis)}</div>`:''}</td>
        ${spalten.map(a=>{const w=a.werte[k];
          const ueber=w&&w.wert!=null&&!w.unter&&r&&w.wert>r.bis;
          return `<td class="mono${ueber?' val-off':''}" title="${esc(gwStelle(a))} · ${fmt(a.datum)}">${w?zeigeWert(w):'–'}</td>`}).join('')}
        <td class="tiny muted">${esc(einheit(k))}</td></tr>`}).join('')}
      </tbody></table></div>
      ${alle.length>6?`<p class="tiny muted">${alle.length-6} ältere Proben nicht angezeigt – sie stehen im Verlauf unten.</p>`:''}
      <p class="tiny muted">Werte über dem hinterlegten Richtwert sind farbig. Die Richtwerte sind gesetzte Annahmen, siehe unten.</p>
    </div>`;
  }

  /* ── Soll-Ist-Bilanz ── */
  s+=bilanzKarte(alle);

  /* ── Kreislauf ── */
  const letzt=db.messungen.filter(x=>x.datum&&x.ec!=null&&x.ecFrisch!=null).sort(chrono).slice(-1)[0];
  const ecReihe=db.messungen.filter(x=>x.datum&&x.ec!=null).sort(chrono);
  let trend='';
  if(ecReihe.length>=4){
    const h=ecReihe.slice(-3),v=ecReihe.slice(0,3);
    const d=mittel(h.map(x=>x.ec))-mittel(v.map(x=>x.ec));
    if(d>0.4)trend=`Der Rücklauf-EC ist von im Mittel ${nz(mittel(v.map(x=>x.ec)),2)} auf ${nz(mittel(h.map(x=>x.ec)),2)} mS/cm gestiegen. Steigt er bei gleicher Düngung, ist das Ballast und kein Nährstoff – dann hilft Ablassen, nicht weniger düngen.`;
    else if(d<-0.4)trend=`Der Rücklauf-EC ist von im Mittel ${nz(mittel(v.map(x=>x.ec)),2)} auf ${nz(mittel(h.map(x=>x.ec)),2)} mS/cm gefallen. Das spricht für stärkere Aufnahme oder eine geringere Zufuhr.`;
  }
  if(messungen.length)s+=`<div class="card haupt" id="tkKarte">${tkKopf()}</div>`;
  s+=`<div class="card"><div class="hd"><div><h2>${messungen.length?'Messung von Hand eintragen':'Der Kreislauf selbst'}</h2>
    <p class="sub">${messungen.length?'Hinten am Tank geht das bequemer über die Eingabemaske fürs Handy (Adresse mit «/maske», QR-Code oben rechts) – hier für Nachträge und den Import.':'pH, EC und Sauerstoff im Rücklauf, gemessen im Tank vor der neuen Düngergabe. Alle Tische hängen am selben Kreislauf.'}</p></div></div>
    <div class="row">
      <div><label class="lab">Datum</label><input type="date" id="mDatum" value="${heute()}"></div>
      <div><label class="lab">Uhrzeit</label><input type="time" id="mZeit" value="${jetztZeit()}"></div>
      <div><label class="lab">Stelle</label><select id="mStelle">${stellenDb().gruppen.map(g=>`<option>${esc(g.name)}</option>`).join('')}<option value="">ohne</option></select></div>
      <div><label class="lab">pH</label><input id="mPh" class="mono" size="5" inputmode="decimal"></div>
      <div><label class="lab">EC Rücklauf</label><input id="mEc" class="mono" size="5" inputmode="decimal"></div>
      <div><label class="lab">EC frisch <span class="muted">(freiwillig)</span></label><input id="mEcF" class="mono" size="5" inputmode="decimal"></div>
      <div><label class="lab">O₂ mg/l</label><input id="mO2" class="mono" size="5" inputmode="decimal"></div>
      <div><label class="lab">Sättigung % <span class="muted">(falls angezeigt)</span></label><input id="mO2s" class="mono" size="4" inputmode="decimal"></div>
      <div><label class="lab">Temperatur °C</label><input id="mTemp" class="mono" size="5" inputmode="decimal"></div>
      <div><label class="lab">Name</label><input id="mWer" size="8" maxlength="20"></div>
      <div style="flex:1;min-width:150px"><label class="lab">Notiz</label><input id="mNotiz" style="width:100%"></div>
      <button class="primary" data-tun="messung">Eintragen</button>
      <button data-tun="tabWaehlen">Excel oder CSV einlesen</button></div>
    <p class="tiny muted" style="margin-top:6px">Der Import liest das Blatt mit den pH- und EC-Messungen samt Bemerkungsspalte.
    Aus den Bemerkungen entstehen Vorschläge für das Logbuch – kontrolliert und bestätigt wird alles, wie bei den PDFs.
    Ohne Internet fehlt die Excel-Bibliothek; ein als CSV gespeichertes Blatt liest die App auch dann.</p>
    <p class="tiny muted" style="margin-top:6px">Die Temperatur ist freiwillig, aber sie erklärt viel: dieselbe organische Grunddüngung liefert bei 15 °C deutlich weniger Stickstoff als bei 25 °C.</p>
    <div class="note neutral" style="margin-top:12px">Notiert ihr zusätzlich den EC direkt nach dem Ansetzen, ist die Differenz zum Rücklauf die beste Verbrauchsmessung ohne Labor.${letzt?` Zuletzt am ${fmt(letzt.datum)}: ${nz(letzt.ecFrisch,2)} frisch gegen ${nz(letzt.ec,2)} zurück, also ${nz(letzt.ecFrisch-letzt.ec,2)} mS/cm aufgenommen.`:''} ${esc(trend)}
    ${alle.length?` Zum Vergleich: das Giesswasser der Stelle «${esc(gwStelle(alle[0]))}» hatte am ${fmt(alle[0].datum)} einen EC von ${alle[0].werte.gw_EC?nz(alle[0].werte.gw_EC.wert,2):'–'} mS/cm – die Differenz zum Rücklauf ist das, was Düngung und Anreicherung zusammen ausmachen.`:''}</div></div>`;

  /* ── Eingriffe und Messungen ── */
  s+=`<div class="card"><div class="hd"><div><h2>Eingriffe am Kreislauf</h2>
    <p class="sub">Dieselben Einträge wie im Logbuch, gefiltert auf das, was pH und EC bewegt.</p></div>
    <button class="primary" data-tun="evNeu" data-vor="Säurezugabe">Eingriff erfassen</button></div>
    ${rel.length?`<div class="scroll"><table><thead><tr><th>Datum</th><th>Art</th><th>Angaben</th><th></th></tr></thead><tbody>
    ${rel.map(e=>`<tr><td class="mono">${fmt(e.datum)}${zeitTag(e)}</td><td>${esc(e.typ)}</td><td class="small">${esc(felderText(e))}</td>
      <td><button class="ghost" data-tun="evNeu" data-id="${esc(e.id)}">bearbeiten</button></td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted small">Noch keine Eingriffe erfasst.</p>'}</div>`;

  if(messungen.length)s+=`<div class="card"><h2>Messungen (${messungen.length})</h2>
    <div class="scroll"><table><thead><tr><th>Datum</th><th>Stelle</th><th>pH</th><th>EC Rücklauf</th><th>EC frisch</th><th>Aufnahme</th><th>O₂</th><th>Temp</th><th>wer</th><th>Notiz</th><th></th></tr></thead><tbody>
    ${messungen.map(x=>`<tr><td class="mono">${fmt(x.datum)}${zeitTag(x)}</td><td class="tiny">${esc(messStelle(x))}</td><td class="mono">${nz(x.ph,2)}</td><td class="mono">${nz(x.ec,2)}</td>
      <td class="mono">${nz(x.ecFrisch,2)}</td><td class="mono">${x.ec!=null&&x.ecFrisch!=null?nz(x.ecFrisch-x.ec,2):'–'}</td>
      <td class="mono">${x.o2!=null?nz(x.o2,1)+(x.o2sat!=null?' <span class="tiny muted">'+nz(x.o2sat,0)+' %</span>':''):'–'}</td>
      <td class="mono">${x.temp!=null?nz(x.temp,1)+' °C':'–'}</td>
      <td class="mono tiny">${esc(x.wer||'')}${x.quelle==='erfassen'?' <span class="tag" title="vom Handy hinten">Tank</span>':x.quelle==='excel'?' <span class="tag">Excel</span>':x.quelle==='paket'?` <span class="tag" title="${esc(x.beleg||'')}">Paket</span>`:''}</td>
      <td class="small muted">${esc(x.notiz||'')}</td>
      <td><button class="ghost" data-tun="messungWeg" data-id="${esc(x.id)}">entfernen</button></td></tr>`).join('')}
    </tbody></table></div></div>`;

  /* ── Alle Proben ── */
  if(alle.length)s+=`<div class="card"><div class="hd"><div><h2>Alle Wasserproben (${alle.length})</h2>
    <p class="sub">Berichte mit Historie werden beim Einlesen in einzelne Proben zerlegt – jede mit eigenem Datum und eigener Probennummer.</p></div>
    <button data-tun="manuellNeu" data-typ="giesswasser">Von Hand erfassen</button></div>
    <div class="scroll"><table><thead><tr><th>Datum</th><th>Entnahmestelle</th><th>EC</th><th>pH</th><th>HCO₃</th><th>Na</th><th>Cl</th><th>Werte</th><th></th></tr></thead><tbody>
    ${alle.map(a=>`<tr class="klick" data-tun="detail" data-id="${esc(a.id)}" title="${esc(gwStelle(a))} · ${fmt(a.datum)}${a.laborId?' · Probe '+esc(a.laborId):''}">
      <td class="mono">${fmt(a.datum)}</td>
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${farbe[gwStelle(a)]};margin-right:6px"></span>${esc(gwStelle(a))}</td>
      <td class="mono">${a.werte.gw_EC?zeigeWert(a.werte.gw_EC,2):'–'}</td>
      <td class="mono">${a.werte.gw_pH?zeigeWert(a.werte.gw_pH,1):'–'}</td>
      <td class="mono">${a.werte.gw_HCO3?zeigeWert(a.werte.gw_HCO3,2):'–'}</td>
      <td class="mono">${a.werte.gw_Na?zeigeWert(a.werte.gw_Na,2):'–'}</td>
      <td class="mono">${a.werte.gw_Cl?zeigeWert(a.werte.gw_Cl,2):'–'}</td>
      <td class="mono tiny">${Object.keys(a.werte).length}</td>
      <td><button class="ghost" data-tun="loeschAnalyse" data-id="${esc(a.id)}">entfernen</button></td></tr>`).join('')}
    </tbody></table></div></div>`;

  /* ── Richtwerte ── */
  s+=`<div class="card"><div class="hd"><div><h2>Richtwerte für das Giesswasser</h2>
    <p class="sub">Das Labor gibt zu Wasserproben keine Sollbereiche vor. Diese Zahlen sind gesetzte Annahmen – sie entscheiden nur darüber, wann ein Wert farbig markiert wird, nie über einen Messwert.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Parameter</th><th>bis</th><th>Einheit</th><th>Warum</th></tr></thead><tbody>
    ${Object.keys(GW_RICHT_VORGABE).map(k=>{const r=gwRichtVon(k);
      return `<tr><td>${esc(NAME[k].replace(' (Wasser)','').replace(' (Giesswasser)',''))} <span class="tag schaetz">Annahme</span></td>
        <td><input class="mono" size="7" value="${r.bis}" data-aend="gwRicht" data-k="${esc(k)}"></td>
        <td class="tiny muted">${esc(einheit(k))}</td>
        <td class="small">${esc(r.text)}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="note neutral">${esc(GW_HERKUNFT)}</div></div>`;
  return s;
}
AKTION.gwStoff=d=>{
  const i=gwWahl.indexOf(d.k);
  if(i>=0){if(gwWahl.length>1)gwWahl.splice(i,1);else return toast('Mindestens ein Parameter muss ausgewählt bleiben.')}
  else{if(gwWahl.length>=NS_MAX)return toast(`Mehr als ${NS_MAX} Parameter werden unübersichtlich – nimm zuerst einen weg.`);gwWahl.push(d.k)}
  diagFrisch();
};
AKTION.gwSatzWahl=d=>{
  const da=k=>db.analysen.some(a=>a.typ==='giesswasser'&&a.werte[k]&&a.werte[k].wert!=null);
  const m={ballast:['gw_Na','gw_Cl','gw_HCO3'],naehr:['gw_NO3','gw_NH4','gw_K','gw_Ca','gw_Mg','gw_S','gw_P'],
           technik:['gw_Fe','gw_Mn','gw_Al','gw_Si'],leit:['gw_EC','gw_pH','gw_KCa']};
  const w=(m[d.v]||[]).filter(da).slice(0,NS_MAX);
  if(!w.length)return toast('Für diese Zusammenstellung liegen keine Messwerte vor.');
  gwWahl=w;diagAus.clear();diagFrisch();
};
AKTION.gwSkala=d=>{gwSkala=d.v;diagFrisch()};
AKTION.gwLinien=d=>{gwLinien=d.v;diagFrisch()};
AKTION.gwLog=()=>{gwLog=!gwLog;diagFrisch()};
AKTION.gwRicht=(d,ev)=>{
  const n=toNum(ev.target.value);
  if(n==null)return toast('Bitte eine Zahl eintragen.');
  db.einst.gwRicht=db.einst.gwRicht||{};
  db.einst.gwRicht[d.k]=n;aend();render();
};

/* ══════════ 12b-1 · Soll-Ist-Bilanz des Giesswassers ══════════
   Was laut Logbuch dosiert wurde, gegen das, was im Wasser gemessen wurde.
   Die Rechnung ist einfach – Menge mal Gehalt geteilt durch Systemvolumen –
   und genau deshalb muss offenliegen, was sie NICHT beruecksichtigt:
   Pflanzenaufnahme, den woechentlichen Wasserwechsel, Ausfaellungen und das,
   was das Frischwasser selbst schon mitbringt. Die Differenz ist die Summe
   all dessen, kein Verlust.
   Ohne lueckenlose Logbuchfuehrung ist die Rechnung wertlos. Bei Luecken
   verweigert die App die Aussage, statt eine falsche Zahl zu zeigen.      */
const ATOMMASSE={N:14.007,P:30.974,K:39.098,Ca:40.078,Mg:24.305,S:32.06,
  Fe:55.845,Mn:54.938,Zn:65.38,B:10.811,Cu:63.546,Mo:95.95,Na:22.99,Cl:35.45,Si:28.086};
const BILANZ_EL=[
 {el:'N', gw:['gw_NO3','gw_NH4'],quellen:['N_gesamt','N','NO3','NH4'],name:'Stickstoff',
  hinweis:'im Wasser gemessen als Nitrat plus Ammonium – beide tragen je ein Stickstoffatom'},
 {el:'P', gw:['gw_P'], quellen:['P'], name:'Phosphor'},
 {el:'K', gw:['gw_K'], quellen:['K'], name:'Kalium'},

 {el:'S', gw:['gw_S'], quellen:['S'], name:'Schwefel',frisch:1},
 {el:'Fe',gw:['gw_Fe'],quellen:['Fe'],name:'Eisen'},
 {el:'Mn',gw:['gw_Mn'],quellen:['Mn'],name:'Mangan'},
 {el:'Zn',gw:['gw_Zn'],quellen:['Zn'],name:'Zink'},
 {el:'Cu',gw:['gw_Cu'],quellen:['Cu'],name:'Kupfer'},

 {el:'Mo',gw:['gw_Mo'],quellen:['Mo'],name:'Molybdän'}];
/* ── Seit wann wird ein Nährstoff beigegeben? ─────────────────────────────
   Aus den Logbucheinträgen der Produkte, die ihn enthalten (Gehalt vom
   Etikett) oder von denen bekannt ist, dass sie ihn liefern («liefert»).
   Mengen spielen hier keine Rolle – nur wann. Eine Lücke von mehr als
   BEIGABE_LUECKE Tagen beendet eine Spanne; endet die letzte innerhalb
   dieser Frist vor heute, gilt sie als «läuft». */
const BEIGABE_LUECKE=28;
const beigabeElement=k=>BILANZ_EL.find(x=>x.el===k||x.quellen.includes(k))||null;
/* Ein Produkt zählt für einen Nährstoff, wenn es ihn ausdrücklich liefert
   («liefert») oder mindestens BEIGABE_MINDESTGEHALT Prozent davon enthält.
   Biovin enthält 0,19 % Zink – aber wer fragt «seit wann geben wir Zink
   dazu», meint das Zinksalz vom August, nicht die Spur im Stickstoffdünger.
   Für Spuren aus dem Hauptdünger gibt es die Eingangsbilanz. */
const BEIGABE_MINDESTGEHALT=1;
function beigabeProdukte(k){
  const e=beigabeElement(k);if(!e)return [];
  return Object.keys(db.produkte||{}).filter(id=>{
    const pr=db.produkte[id];
    const passt=g=>g===e.el||e.quellen.includes(g);
    if((pr.liefert||[]).some(passt))return true;
    return Object.keys(pr.gehalt||{}).some(g=>passt(g)&&+pr.gehalt[g]>=BEIGABE_MINDESTGEHALT);
  });
}
function beigabeSpannen(k){
  const ids=beigabeProdukte(k);if(!ids.length)return [];
  const gaben=db.ereignisse.filter(x=>x.datum&&x.mittel&&ids.includes(x.mittel)&&!isNaN(+new Date(x.datum)))
    .sort((a,b)=>a.datum.localeCompare(b.datum));
  const out=[];let akt=null;
  for(const g of gaben){
    if(!akt||tage(akt.bis,g.datum)>BEIGABE_LUECKE){akt={k,von:g.datum,bis:g.datum,n:0,gaben:[],produkte:new Set()};out.push(akt)}
    akt.bis=g.datum;akt.n++;akt.gaben.push(g);akt.produkte.add(g.mittel);
  }
  for(const sp of out){sp.laeuft=beigabeLaeuft(sp.bis);sp.produkte=[...sp.produkte];}
  /* Zeiträume von Hand der Produkte dieses Nährstoffs – überlappende werden
     eins (Epsotop und Kalisulfat liefern beide Schwefel). */
  const hand=beigabeHand(h=>ids.includes(h.mittel)).sort((a,b)=>a.von.localeCompare(b.von));
  const zus=[];
  for(const h of hand){
    const bis=h.bis||'9999-12-31',l=zus[zus.length-1];
    if(l&&h.von<=l.bisRoh){if(bis>l.bisRoh)l.bisRoh=bis;l.mittel.add(h.mittel);continue}
    zus.push({von:h.von,bisRoh:bis,mittel:new Set([h.mittel])});
  }
  return beigabeMitHand(out,zus.map(z=>({von:z.von,bis:z.bisRoh==='9999-12-31'?null:z.bisRoh,mittel:[...z.mittel]})),gaben,
    sp=>{sp.k=k;sp.produkte=[...new Set(sp.hand.mittel.concat(sp.gaben.map(g=>g.mittel)))]});
}
/* ── Zeiträume von Hand ──────────────────────────────────────────────────
   Die Balken entstehen aus dem Logbuch: von der ersten bis zur letzten Gabe,
   eine Lücke über vier Wochen trennt. Das Logbuch weiss aber nicht, dass
   Magnesium weiterhin dazukommt, wenn es seit Wochen niemand eingetragen hat.
   Darum lässt sich jeder Balken anklicken und von Hand setzen: Beginn, Ende
   oder «läuft noch». Das gilt für alle (liegt im Bestand) und schlägt die
   Automatik: ein automatischer Balken, der einen Zeitraum von Hand berührt,
   geht in ihm auf. */
const beigabeHand=f=>(Array.isArray(db.beigabeZeiten)?db.beigabeZeiten:[]).filter(h=>h&&h.mittel&&h.von&&(!f||f(h)));
function beigabeMitHand(auto,hand,gaben,nachbau){
  if(!hand.length)return auto;
  const h2=hand.map(h=>{const bis=h.bis||heute();
    const g=gaben.filter(x=>x.datum>=h.von&&x.datum<=bis);
    const sp={von:h.von,bis,laeuft:!h.bis,n:g.length,gaben:g,hand:h};
    if(nachbau)nachbau(sp);return sp});
  const frei=auto.filter(a=>!h2.some(h=>a.von<=h.bis&&a.bis>=h.von));
  return frei.concat(h2).sort((a,b)=>a.von.localeCompare(b.von));
}
/* Läuft eine Beigabe noch? Nur, wenn die letzte Gabe keine vier Wochen her
   ist UND die Tanks seither nicht neu angesetzt wurden – mit dem Wasser ist
   auch das Mittel weg. Sonst stünde die Zitronensäure vom 9. September noch
   Wochen nach dem Abpumpen als «seit 31.08.» da. */
function beigabeLaeuft(bis){
  if(tage(bis,heute())>BEIGABE_LUECKE)return false;
  return !db.ereignisse.some(e=>e.typ==='Tank neu angesetzt'&&e.datum&&e.datum>bis&&e.datum<=heute());
}
/* ── Je Mittel statt je Nährstoff ─────────────────────────────────────────
   Die Geschichte für den Chef ist eine Zeile je Mittel: Halades vom 6. bis
   19. August und dann nicht mehr, Phosphorsäure bis 25. August, Schwefelsäure
   seit 16. September. Ohne Etikett «Versuch» – einfach, was gegeben wurde,
   von wann bis wann. Dieselbe Lückenregel wie bei den Nährstoffen. */
const MITTEL_FARBE={biovin:'#2C7A4B',epsotop:'#8A7118',kali:'#A2432E',zink:'#3F7F7A',phosphorsaeure:'#7A4E8C',
  zitronensaeure:'#BE6F16',schwefelsaeure25:'#B0446F',halades:'#3A6DA6',em:'#6D5C3D'};
const mittelKurz=id=>String(evMittelName(id)||id).replace(/\s*\(.*?\)\s*/g,' ').replace(' Bio-Kraftdünger 9N','').replace(/\s+/g,' ').trim();
function beigabeSpannenMittel(id){
  const gaben=db.ereignisse.filter(x=>x.datum&&x.mittel===id&&!isNaN(+new Date(x.datum))).sort((a,b)=>a.datum.localeCompare(b.datum));
  const out=[];let akt=null;
  for(const g of gaben){
    if(!akt||tage(akt.bis,g.datum)>BEIGABE_LUECKE){akt={id,von:g.datum,bis:g.datum,n:0,gaben:[]};out.push(akt)}
    akt.bis=g.datum;akt.n++;akt.gaben.push(g);
  }
  for(const sp of out)sp.laeuft=beigabeLaeuft(sp.bis);
  return beigabeMitHand(out,beigabeHand(h=>h.mittel===id),gaben,sp=>{sp.id=id});
}
/* Summe der Mengen einer Spanne, je Einheit – Gramm und Kilogramm (oder
   Milliliter und Liter) zusammengezählt, sobald beide vorkommen. Gaben ohne
   Menge werden genannt, nicht geschätzt. */
function beigabeSumme(gaben){
  const m={};let ohne=0;
  for(const g of gaben){if(g.menge==null){ohne++;continue}const e=g.einheit||'';m[e]=(m[e]||0)+g.menge*(g.jeReservoir?2:1)}
  if(m.g!=null&&m.kg!=null){m.kg+=m.g/1000;delete m.g}
  if(m.ml!=null&&m.l!=null){m.l+=m.ml/1000;delete m.ml}
  const t=Object.keys(m).map(e=>nz(m[e])+' '+e).join(' + ');
  return (t||'–')+(ohne?` (dazu ${ohne} Gabe${ohne>1?'n':''} ohne notierte Menge)`:'');
}
/* Alle Mittel, die je gegeben wurden – in der Reihenfolge der Stammdaten,
   jedes mit seiner festen Farbe. Dieselbe Liste für Balken und Schalter. */
function beigabeMittelListe(){
  const ids=[...new Set(db.ereignisse.filter(x=>x.mittel&&x.datum).map(x=>x.mittel).concat(beigabeHand().map(h=>h.mittel)))];
  const reihenfolge=Object.keys(db.produkte||{});
  ids.sort((a,b)=>{const ia=reihenfolge.indexOf(a),ib=reihenfolge.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  return ids.map((id,i)=>({id,name:mittelKurz(id),farbe:MITTEL_FARBE[id]||FARBEN[i%FARBEN.length]}));
}
/* Welche Mittel ausgeblendet sind: persönlich, wie die übrige Ansicht.
   Gemerkt wird, was AUS ist – ein neues Mittel erscheint also von selbst. */
let mittelAus=new Set();
function beigabeBalkenMittel(){
  const out=[];
  beigabeMittelListe().forEach(({id,name,farbe})=>{
    if(mittelAus.has(id))return;
    for(const sp of beigabeSpannenMittel(id)){
      const text=sp.laeuft?`${name} seit ${fmtK(sp.von)}`:(sp.von===sp.bis?`${name} ${fmtK(sp.von)}`:`${name} ${fmtK(sp.von)}–${fmtK(sp.bis)}`);
      out.push({k:null,mittel:id,zeile:'m|'+id,laeuft:!!sp.laeuft,x0:+new Date(sp.von),x1:+new Date(sp.laeuft?heute():sp.bis),farbe,text,kennung:'m|'+id+'|'+sp.von,
        tipp:tippBau(name,farbe,[['von',fmt(sp.von)],['bis',sp.laeuft?'läuft – bis heute':fmt(sp.bis)],['Gaben im Logbuch',String(sp.n)],
          ['Menge gesamt',beigabeSumme(sp.gaben)],sp.hand?['Zeitraum','von Hand gesetzt'+(sp.hand.notiz?': '+sp.hand.notiz:'')]:null],
          'Anklicken: jede Gabe sehen, Beginn und Ende setzen.')});
    }
  });
  return out;
}
/* Welche Balken ein Diagramm zeigt, entscheidet EIN Schalter für alle
   Diagramme: alle Mittel (die Geschichte), zur Auswahl (nur die Nährstoffe,
   die gerade gezeigt werden), keine. Persönliche Einstellung. */
let beigabenModus='mittel';
function beigabenFuer(keys,farbe){
  if(beigabenModus==='aus')return [];
  if(beigabenModus==='auswahl')return beigabeBalken(keys||[],farbe||{});
  return beigabeBalkenMittel();
}
function beigabenSchalter(){
  let t=`<span class="lab" style="min-width:0;margin-left:8px">Beigaben</span><span class="seg" title="Balken unter der Zeitachse: seit wann etwas dazugegeben wird, und bis wann.">${

    ${mittelAus.size?`<button class="ghost" data-tun="mittelBandAlle">alle zeigen</button>`:''}</span>`;

/* Für die Diagramme: eine Spanne je Nährstoff, in seiner Farbe, mit Text
   und Infokästchen. Ein Klick öffnet die Liste der Gaben. */
function beigabeBalken(keys,farbe){
  const out=[];
  for(const k of keys)for(const sp of beigabeSpannen(k)){
    const name=NAME[k]||k;
    const text=sp.laeuft?`${name} seit ${fmtK(sp.von)}`:`${name} ${fmtK(sp.von)}–${fmtK(sp.bis)}`;
    out.push({k,zeile:'k|'+k,laeuft:!!sp.laeuft,x0:+new Date(sp.von),x1:+new Date(sp.laeuft?heute():sp.bis),farbe:farbe[k]||'#697A6C',text,
      kennung:k+'|'+sp.von,
      tipp:tippBau(name+' beigegeben',farbe[k]||'#697A6C',[['von',fmt(sp.von)],['bis',sp.laeuft?'läuft':fmt(sp.bis)],
        ['Gaben',String(sp.n)],['Produkte',sp.produkte.map(id=>evMittelName(id)).join(', ')]],'Anklicken zeigt jede Gabe.')});
  }
  return out;
}
