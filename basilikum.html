const BILANZ_HERKUNFT='Berechnet aus den Logbucheinträgen und den Produktangaben unter «Sätze & Einstellungen». Die Gehalte stammen von den Etiketten, nicht aus einer eigenen Analyse.';
const BILANZ_DECKUNG=0.7;   /* darunter verweigert die App die Aussage */
const systemLiter=()=>+db.einst.systemLiter||20000;
/* Elementmasse in Gramm, die ein Logbucheintrag ins System gebracht hat. */
function eintragMasse(e,el){
  const pr=db.produkte&&db.produkte[e.mittel];
  if(!pr||!pr.gehalt)return null;
  let anteil=null;
  for(const q of el.quellen)if(pr.gehalt[q]!=null){anteil=pr.gehalt[q];break}
  if(anteil==null)return null;
  if(e.menge==null)return null;
  const faktor=e.jeReservoir?2:1;
  /* Die Einheit steht am Eintrag selbst – so bleibt eine alte Gabe in kg
     richtig, auch wenn das Produkt heute in Gramm dosiert wird. */
  const einh=e.einheit||evEinheit(e.typ,e.mittel);
  let kgProdukt;
  if(einh==='g')kgProdukt=e.menge*faktor/1000;
  else if(einh==='kg')kgProdukt=e.menge*faktor;
  else if(einh==='ml'){if(!pr.dichte)return {fehlt:'dichte'};kgProdukt=e.menge*faktor*pr.dichte/1000}
  else{
    if(!pr.dichte)return {fehlt:'dichte'};
    kgProdukt=e.menge*faktor*pr.dichte;
  }
  return {g:kgProdukt*1000*anteil/100};
}
/* Zeitfenster, ueber das gerechnet wird. */
function bilanzFenster(probe,alleProben){
  const bis=probe.datum;
  const tank=db.ereignisse.filter(e=>e.typ==='Tank neu angesetzt'&&e.datum&&e.datum<=bis)
    .sort((a,b)=>b.datum.localeCompare(a.datum))[0];
  if(tank)return {von:tank.datum,bis,grund:`seit dem Neuansetzen des Tanks am ${fmt(tank.datum)}`};
  const vorige=alleProben.filter(a=>a.datum<bis).sort((a,b)=>b.datum.localeCompare(a.datum))[0];
  if(vorige)return {von:vorige.datum,bis,grund:`seit der vorigen Wasserprobe am ${fmt(vorige.datum)}`,schwach:1};
  return {von:plus(bis,-28),bis,grund:'über die 28 Tage vor der Probe',schwach:1};
}
/* Wie lueckenlos ist das Logbuch im Fenster? Eine Woche gilt als abgedeckt,
   wenn in ihr mindestens ein Eintrag steht. */
function bilanzDeckung(von,bis){
  const t=Math.max(1,tage(von,bis));
  const wochen=Math.max(1,Math.ceil(t/7));
  const belegt=new Set();
  for(const e of db.ereignisse){
    if(!e.datum||e.datum<=von||e.datum>bis)continue;
    belegt.add(Math.floor(tage(von,e.datum)/7));
  }
  return {wochen,belegt:belegt.size,anteil:belegt.size/wochen};
}
function bilanzGiess(probe,alleProben){
  const f=bilanzFenster(probe,alleProben);
  const deckung=bilanzDeckung(f.von,f.bis);
  const eintraege=db.ereignisse.filter(e=>e.datum&&e.datum>f.von&&e.datum<=f.bis&&
    e.menge!=null&&e.mittel&&db.produkte[e.mittel]&&Object.keys(db.produkte[e.mittel].gehalt||{}).length);
  const ohneDichte=[...new Set(eintraege.filter(e=>{
    const pr=db.produkte[e.mittel];return pr.form!=='fest'&&!pr.dichte}).map(e=>e.mittel))];
  const jeRes=eintraege.filter(e=>e.jeReservoir).length;
  const nurStelle=eintraege.filter(e=>e.stelle&&e.stelle!=='beide').length;
  /* Verduennung: im Fenster nachgefuelltes Wasser aus dem Logbuch. Jede Gabe
     wird mit exp(-nachher nachgefuellte Menge / Systemvolumen) abgewertet –
     das ist das einfachste Modell eines durchmischten Behaelters, dem
     nachgefuellt wird. Es steht und faellt mit lueckenloser Erfassung der
     Wasserzugaben und ist deshalb ausdruecklich als Modell gekennzeichnet. */
  const wasser=db.ereignisse.filter(e=>e.typ==='Wasserzugabe'&&e.menge!=null&&e.datum
    &&e.datum>f.von&&e.datum<=f.bis)
    .map(e=>({datum:e.datum,menge:e.menge*(e.jeReservoir?2:1)}));
  const wasserGesamt=wasser.reduce((a,b)=>a+b.menge,0);
  const nachSpuelung=datum=>wasser.filter(w=>w.datum>datum).reduce((a,b)=>a+b.menge,0);
  const zeilen=[];
  for(const el of BILANZ_EL){
    let g=0,gRest=0,hat=false;
    for(const e of eintraege){
      const m=eintragMasse(e,el);
      if(m&&m.g!=null){
        g+=m.g;hat=true;
        gRest+=m.g*Math.exp(-nachSpuelung(e.datum)/systemLiter());
      }
    }
    if(!hat)continue;
    const mgL=g/systemLiter()*1000;
    const mikro=el.gw.every(k=>GW_MIKRO.indexOf(k.slice(3))>=0);
    const um=x=>mikro?x/ATOMMASSE[el.el]*1000:x/ATOMMASSE[el.el];
    const dosiert=um(mgL);
    const verduennt=wasserGesamt>0?um(gRest/systemLiter()*1000):null;
    let gemessen=null,unter=false;
    for(const k of el.gw){
      const w=probe.werte[k];
      if(!w||w.wert==null)continue;
      gemessen=(gemessen||0)+w.wert;
      if(w.unter)unter=true;
    }
    zeilen.push({el,dosiert,verduennt,gemessen,unter,einheit:mikro?'µmol/l':'mmol/l',
      anteil:(gemessen!=null&&dosiert>0)?gemessen/dosiert:null,
      anteilV:(gemessen!=null&&verduennt>0)?gemessen/verduennt:null});
  }
  return {fenster:f,deckung,eintraege,zeilen,ohneDichte,jeRes,nurStelle,
    wasser,wasserGesamt,
    genug:deckung.anteil>=BILANZ_DECKUNG&&eintraege.length>0};
}

function bilanzKarte(alle){
  if(!alle.length)return '';
  const probe=alle[0];
  const b=bilanzGiess(probe,alle);
  let s=`<div class="card"><div class="hd"><div><h2>Was dosiert wurde und was ankam <span class="tag schaetz">Annahme</span></h2>
    <p class="sub">Aus den Logbucheinträgen und den hinterlegten Produktangaben gerechnet und der Messung der neuesten Probe
    («${esc(gwStelle(probe))}», ${fmt(probe.datum)}) gegenübergestellt. Gerechnet wird ${esc(b.fenster.grund)}, auf ${nz(systemLiter(),0)} Liter Systemvolumen.</p></div></div>`;

  if(!b.eintraege.length){
    s+=`<div class="note warn"><strong>Diese Rechnung ist noch nicht möglich.</strong>
      Im Zeitraum ${fmt(b.fenster.von)} bis ${fmt(b.fenster.bis)} steht kein Logbucheintrag mit Menge und einem Produkt, dessen Gehalte hinterlegt sind.
      Trag die Düngergaben im Logbuch ein – mit Menge – und ergänze unter «Sätze &amp; Einstellungen» die Gehalte der verwendeten Produkte.</div>`;
    return s+'</div>';
  }
  s+=`<div class="row" style="margin-bottom:10px">
      <span class="tag">${b.eintraege.length} Eintrag${b.eintraege.length>1?'e':''} im Zeitraum</span>
      <span class="tag">${b.deckung.belegt} von ${b.deckung.wochen} Wochen mit Logbucheinträgen</span>
      <span class="tag">${fmt(b.fenster.von)} – ${fmt(b.fenster.bis)}</span></div>`;

  if(!b.genug){
    s+=`<div class="note warn"><strong>Die Zahlen bleiben verdeckt, weil das Logbuch Lücken hat.</strong>
      Nur ${b.deckung.belegt} von ${b.deckung.wochen} Wochen des Zeitraums tragen überhaupt einen Eintrag – ${Math.round(b.deckung.anteil*100)} %.
      Eine Bilanz aus lückenhaften Aufzeichnungen sieht aus wie ein Ergebnis, ist aber keins: was nicht eingetragen wurde, erscheint als Verlust.
      Ab ${Math.round(BILANZ_DECKUNG*100)} % Abdeckung zeigt die App die Rechnung.</div>
      <p class="tiny muted">Der schnellste Weg dorthin ist der Excel-Import: er macht aus der Bemerkungsspalte Logbucheinträge.</p>`;
    return s+'</div>';
  }
  const mitV=b.wasserGesamt>0;
  s+=`<div class="scroll"><table><thead><tr><th>Element</th><th>dosiert (berechnet)</th>
    ${mitV?'<th>nach Verdünnung <span class="tag schaetz">Modell</span></th>':''}
    <th>gemessen</th><th>Anteil</th><th>Einheit</th></tr></thead><tbody>
    ${b.zeilen.map(z=>`<tr><td><strong>${esc(z.el.name)}</strong>${z.el.frisch?' <span class="tag">auch im Frischwasser</span>':''}
        ${z.el.hinweis?`<div class="tiny muted">${esc(z.el.hinweis)}</div>`:''}</td>
      <td class="mono">${nz(z.dosiert,z.einheit==='µmol/l'?1:3)}</td>
      ${mitV?`<td class="mono">${z.verduennt==null?'–':nz(z.verduennt,z.einheit==='µmol/l'?1:3)}</td>`:''}
      <td class="mono">${z.gemessen==null?'<span class="muted">nicht gemessen</span>':(z.unter?'&lt;':'')+nz(z.gemessen,z.einheit==='µmol/l'?1:3)}</td>
      <td>${z.anteil==null?'<span class="muted">–</span>':
        `<span class="pill ${z.anteil>=0.6?'ok':z.anteil>=0.2?'na':'off'}">${nz(z.anteil*100,0)} %</span>`
        +(mitV&&z.anteilV!=null?`<div class="tiny muted">${nz(z.anteilV*100,0)} % nach Verdünnung</div>`:'')}</td>
      <td class="tiny muted">${esc(z.einheit)}</td></tr>`).join('')}
    </tbody></table></div>`;
  if(mitV)s+=`<p class="tiny muted" style="margin-top:8px"><strong>Zur Verdünnungsspalte.</strong>
    Im Zeitraum sind ${nz(b.wasserGesamt,0)} Liter Wasserzugabe im Logbuch erfasst, das ist das ${nz(b.wasserGesamt/systemLiter(),1)}-fache des Systemvolumens.
    Die Spalte rechnet jede Gabe mit dem Anteil ab, der nach den späteren Wasserzugaben noch im System wäre – das einfachste Modell eines durchmischten Behälters.
    Es setzt voraus, dass <em>alle</em> Wasserzugaben im Logbuch stehen; fehlt eine, ist die Zahl zu hoch. Sie ist ein Modell, kein Messwert.</p>`;
  else s+=`<p class="tiny muted" style="margin-top:8px">Im Zeitraum ist keine Wasserzugabe im Logbuch erfasst. Ohne sie kann die App die Verdünnung durch das wöchentliche Nachfüllen nicht berücksichtigen – die Spalte «dosiert» ist deshalb eine Obergrenze, und der Anteil rechts entsprechend eine Untergrenze.</p>`;

  s+=`<div class="note neutral"><strong>Was diese Rechnung nicht ist.</strong>
    Sie gilt für eine <em>frisch angesetzte</em> Lösung: Menge mal Gehalt geteilt durch Systemvolumen.
    Der Rücklauf enthält zusätzlich, was die Pflanzen aufgenommen haben, was der wöchentliche Wasserwechsel verdünnt hat und was ausgefallen ist.
    <strong>Die Differenz ist deshalb kein Verlust, sondern die Summe dieser Vorgänge.</strong>
    Um sie zu trennen, bräuchte es eine Messung direkt nach dem Ansetzen und eine im Rücklauf – dieselbe Woche, dasselbe Labor.</div>`;
  if(b.zeilen.some(z=>z.el.frisch))s+=`<p class="tiny muted">Calcium, Magnesium und Schwefel bringt das Frischwasser selbst mit; sie sind in der Spalte «dosiert» nicht enthalten.
    Ein Anteil über 100 % ist dort normal und kein Fehler.</p>`;
  if(b.jeRes)s+=`<p class="tiny muted">Bei ${b.jeRes} Eintrag${b.jeRes>1?'en':''} steht «je Reservoir». Für die Bilanz – sie bezieht sich auf das ganze System – ist dort die doppelte Menge gerechnet. Im Logbuch bleibt die eingetragene Zahl unverändert stehen.</p>`;
  if(b.nurStelle)s+=`<p class="tiny muted">${b.nurStelle} Eintrag${b.nurStelle>1?'e betreffen':' betrifft'} nur ein Reservoir. Gerechnet wird trotzdem auf das ganze Systemvolumen, weil beide Reservoirs verbunden sind – bei getrennt gefahrenen Tanks wäre das falsch.</p>`;
  if(b.ohneDichte.length)s+=`<div class="note">Für ${b.ohneDichte.map(m=>esc(evMittelName(m))).join(', ')} fehlt die Dichte. Flüssige Produkte lassen sich ohne sie nicht von Litern in Kilogramm umrechnen – diese Gaben fehlen in der Rechnung. Unter «Sätze &amp; Einstellungen» nachtragen.</div>`;
  s+=`<div class="note neutral">${esc(BILANZ_HERKUNFT)}</div>`;
  s+=`<p class="tiny muted">Die App sagt bewusst nicht, wieviel zuzugeben wäre. Diese Auswertung beschreibt, was war.</p>`;
  return s+'</div>';
}

/* ══════════ 12b-2 · Tabellenimport (pH und EC) ══════════
   Der Betrieb fuehrt seine Tankmessungen in einer Excel-Datei. Die Zahlen
   gehoeren in messungen[]; der wertvollere Teil ist die Bemerkungsspalte –
   sie enthaelt den groessten Teil der Betriebsgeschichte und wird zu
   Logbuchvorschlaegen.

   Der Parser sucht die Tabellen NICHT an festen Spalten, sondern ueber die
   Kopfzeile. Ein verschobener Kopfblock oder eine eingefuegte Spalte macht
   ihn damit nicht blind. Zwei nebeneinanderstehende Tabellen erkennt er
   daran, dass in derselben Kopfzeile mehrmals «Datum» steht.            */

const TAB_KOPF=[
  ['datum',      /^datum|^tag$/i],
  ['zeit',       /^(uhr)?zeit$|^uhrzeit|^uhr$/i],
  ['ecVorne',    /ec.*vorn|vorn.*ec/i],
  ['ecHinten',   /ec.*hint|hint.*ec/i],
  ['phVorne',    /ph.*vorn|vorn.*ph/i],
  ['phHinten',   /ph.*hint|hint.*ph/i],
  ['bemerkung',  /bemerk|notiz|kommentar/i],
  ['satz',       /^satz|^charge|^kultur/i],
  ['wurzel1',    /(ec.*1.*wurzel)|(wurzel.*1)|^ec\s*1$/i],
  ['wurzel2',    /(ec.*2.*wurzel)|(wurzel.*2)|^ec\s*2$/i],
  ['wurzel3',    /(ec.*3.*wurzel)|(wurzel.*3)|^ec\s*3$/i],
  ['schnitt',    /durchschnitt|mittelwert|^mittel$|^ø/i],
  ['ec',         /^ec$|^ec\b(?!.*(vorn|hint|\d))/i],
  ['ph',         /^ph$|^ph\b(?!.*(vorn|hint))/i],
  ['saeure',     /säurezugabe|säure.*ml|zugabe.*ml|^ml$/i],
  ['temp',       /temperatur|^temp/i],
  ['o2',         /^o2$|^o₂|sauerstoff/i]];
const zelle=v=>v==null?'':String(v).trim();
function kopfArt(t){
  const x=zelle(t);
  if(!x)return null;
  for(const [name,re] of TAB_KOPF)if(re.test(x))return name;
  return null;
}
/* Datum: Excel-Seriennummer, ISO, oder deutsche Kurzform ohne Jahr.
   Fehlt das Jahr, wird es vom zuletzt vollstaendigen Datum uebernommen;
   springt der Monat zurueck, wird das Jahr erhoeht. */
function tabDatum(v,letzt){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&isFinite(v)){
    if(v<20||v>80000)return null;
    const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);
    return isNaN(+d)?null:d.toISOString().slice(0,10);
  }
  if(v instanceof Date&&!isNaN(+v))return new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())).toISOString().slice(0,10);
  /* «17.09.2026 09:05»: die Uhrzeit liest tabZeit, hier zählt das Datum. */
  const t=zelle(v).replace(/\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:uhr|h)?$/i,'');
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  /* «17,06», «2,7», «12,8»: in der Datumsspalte ein Datum mit Komma statt
     Punkt – so steht es in den echten Tabellen. */
  m=t.match(/^(\d{1,2})\s*[.\/,]\s*(\d{1,2})\s*[.\/]?\s*(\d{2,4})?\s*\.?$/);
  if(!m)return null;
  const tag=+m[1],mon=+m[2];
  if(tag<1||tag>31||mon<1||mon>12)return null;
  let jahr=m[3]?+m[3]:null;
  if(jahr!=null&&jahr<100)jahr+=2000;
  if(jahr==null){
    if(!letzt)return null;
    jahr=+letzt.slice(0,4);
    if(mon<+letzt.slice(5,7))jahr++;          /* Jahreswechsel in der Spalte */
  }
  if(jahr<1990||jahr>2100)return null;
  /* Gibt es diesen Tag ueberhaupt? «31.02.» darf nicht stillschweigend zum
     3. Maerz werden – lieber gar kein Datum als ein erfundenes. */
  const probe=new Date(Date.UTC(jahr,mon-1,tag));
  if(probe.getUTCMonth()!==mon-1||probe.getUTCDate()!==tag)return null;
  return `${jahr}-${String(mon).padStart(2,'0')}-${String(tag).padStart(2,'0')}`;
}
/* Uhrzeit aus einer Zelle: Text «09:05» / «9.05 Uhr», Excel-Bruchteil
   eines Tages (0,375 = 09:00) oder ein Datum mit Uhrzeit. Eine Uhrzeit
   00:00 aus einem reinen Datum ist keine Uhrzeit. */
function tabZeit(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&isFinite(v)){
    const f=v-Math.floor(v);if(f<=0)return null;
    const min=Math.round(f*1440)%1440;
    return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
  }
  if(v instanceof Date&&!isNaN(+v)){
    if(!v.getHours()&&!v.getMinutes())return null;
    return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
  }
  const t=zelle(v);
  const m=t.match(/(?:^|[\sT])(\d{1,2}[:.]\d{2})(?::\d{2})?\s*(?:uhr|h)?$/i);
  return m?zeitNorm(m[1]):zeitNorm(t);
}
const tabZahl=v=>{
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  return toNum(String(v).replace(/['’](?=\d)/g,''));
};

/* ── Bemerkungen zu Logbuchvorschlaegen ────────────────────
   Erkannt wird Menge + Einheit + Mittel. Was nicht sicher zuzuordnen ist,
   wird als Notiz mit dem Rohtext vorgeschlagen – nichts geht verloren. */
const MITTEL_MUSTER=[
  {re:/bio-?v[a-zä]*[-\s]?wasser/i,typ:'Wasserzugabe',mittel:null,duenger:true,
   warnung:'«BioV-Wasser» ist Wasser, das mit Dünger angesetzt wurde. Wieviel Dünger darin war, steht in dieser Bemerkung nicht – trag das als eigene Düngergabe ein, wenn du es weisst.'},
  {re:/\bbiovin\b|\bbiov\b/i,typ:'Düngergabe',mittel:'biovin'},
  {re:/\bepsotop\b/i,typ:'Düngergabe',mittel:'epsotop'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])EP?T(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Düngergabe',mittel:'epsotop',streng:1},
  /* Die Kürzel, wie sie hinten geschrieben werden: EPT, KS, Zn, HA, PS, ZS,
     H2SO4 – auch mit Null statt O. «Haldes» ist der Tippfehler für Halades. */
  /* Wörter ohne Rücksicht auf Gross und Klein; die Kürzel dagegen genau so,
     wie sie geschrieben werden – sonst wäre jedes «ha» in einem Satz Halades. */
  {re:/kalisulfat|kaliumsulfat/i,typ:'Zusatzdünger / Spurenelemente',mittel:'kali'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])KS(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Zusatzdünger / Spurenelemente',mittel:'kali',streng:1},
  {re:/\bzink/i,typ:'Zusatzdünger / Spurenelemente',mittel:'zink'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])Zn(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Zusatzdünger / Spurenelemente',mittel:'zink',streng:1},
  {re:/p-?\s?säure|phosphorsäure|p-?saeure/i,typ:'Säurezugabe',mittel:'phosphorsaeure'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])PS(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Säurezugabe',mittel:'phosphorsaeure',streng:1},
  {re:/h2s[o0]4|schwefelsäure|schwefelsaeure/i,typ:'Säurezugabe',mittel:'schwefelsaeure25'},
  {re:/zitronensäure|zitronensaeure|\bcitro/i,typ:'Säurezugabe',mittel:'zitronensaeure'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])ZS(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Säurezugabe',mittel:'zitronensaeure',streng:1},
  {re:/hal[a-z]{0,3}des/i,typ:'Desinfektion',mittel:'halades'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])HA(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Desinfektion',mittel:'halades',streng:1},
  /* «MKBoden» heisst im Betrieb EM (Effektive Mikroorganismen). */
  {re:/mk\s*boden|effektive\s*mikroorganismen/i,typ:'Biologisches Präparat',mittel:'em'},
  {re:/(?:^|[^A-Za-zÄÖÜäöü])EM(?:$|[^A-Za-zÄÖÜäöü])/,typ:'Biologisches Präparat',mittel:'em',streng:1},
  {re:/säurezugabe|\bsäure\b|\bsaeure\b/i,typ:'Säurezugabe',mittel:null,allgemein:1},
  {re:/dünger|duenger/i,typ:'Düngergabe',mittel:null,allgemein:1},
  {re:/wasser|zudosiert|zudosieren|nachgefüllt|nachgefuellt|aufgefüllt/i,typ:'Wasserzugabe',mittel:null,allgemein:1}];
const REIN_MUSTER=[
  /* «kalbriert» steht so in den echten Bemerkungen – der Tippfehler muss
     mitgelesen werden, sonst geht der Eintrag verloren. */
  {re:/kal.{0,2}br/i,typ:'Gerätekalibrierung',titel:'Gerät neu kalibriert'},
  /* «Wasser abgepumpt, Tanks neu gefüllt» ist ein Neuansatz, kein Umpumpen –
     das Wort «neu gefüllt» / «geleert» entscheidet, darum steht es vor dem Pumpen. */
  {re:/neu\s*(angesetzt|gefüllt|gefuellt|befüllt|befuellt|aufgesetzt)|(tanks?|reservoirs?)\s*(geleert|entleert)/i,typ:'Tank neu angesetzt',titel:'Tank neu angesetzt'},
  {re:/gepumpt|umgepumpt|umpumpen/i,typ:'Umpumpen',titel:'umgepumpt'},
  {re:/(dünger|duenger|reservoir|tank).{0,14}leer|leer.{0,14}(dünger|duenger)/i,typ:'Notiz',titel:'leer'}];
const MENGE_RE=/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|lt?r?|liter|%)(?![a-zä])/gi;
const EINH_NORM={l:'l',lt:'l',ltr:'l',liter:'l',ml:'ml',kg:'kg',g:'g','%':'%'};

/* Aus einer Bemerkung Logbuchvorschlaege lesen.
   Grundsaetze, die aus dem ersten Durchlauf an echten Bemerkungen stammen:
   · «Wasser OHNE Dünger» ist keine Düngergabe. Verneinungen werden geprüft.
   · Es gewinnt das Mittel, das im Text ZUERST steht, nicht das erste in der
     Liste. Sonst schlägt «Dünger» jedes «Wasser».
   · Ein Mittel ohne Menge ist meist Erzählung («vor Säurezugabe»), keine
     Zugabe – daraus wird eine Notiz.
   · Stehen mehrere Mengen derselben Einheit im selben Satz, ist die
     Zuordnung unsicher. Dann wird sie benannt statt geraten.               */
function bemerkungLesen(text,datum){
  const roh=zelle(text);
  if(!roh)return [];
  let t=roh.replace(/[’']/g,"'").replace(/(\d)'(\d{3})/g,'$1$2');
  /* RV und RH heissen hinten die Reservoirs – überall dasselbe Wort. */
  t=t.replace(/(?:^|[^A-Za-zÄÖÜäöü])RV(?=$|[^A-Za-zÄÖÜäöü])/g,m=>m.replace('RV','vorne')).replace(/(?:^|[^A-Za-zÄÖÜäöü])RH(?=$|[^A-Za-zÄÖÜäöü])/g,m=>m.replace('RH','hinten'));
  /* «vorne (ca. 5000l)» ist das Volumen des Reservoirs, keine Zugabe. Es
     wird gemerkt und aus dem Text genommen. */
  const volumen={};
  t=t.replace(/\b(vorne|hinten)\s*:?\s*\(\s*ca\.?\s*(\d[\d.]*)\s*l\s*\)/gi,(m,st,v)=>{volumen[st.toLowerCase()]=toNum(v.replace(/\./g,''));return st});
  const stelleVon=x=>/vordere|vorne|vorderes/i.test(x)?'vorne':(/hintere|hinten|hinteres/i.test(x)?'hinten':null);
  const stelleGlobal=stelleVon(t)||'beide';
  /* «je 1kg Zitronensäure RV + RH» heisst je Reservoir; «15'000l (je
     Reservoir ca. 7500l)» dagegen nennt eine Gesamtmenge und erklärt nur,
     wie sie sich verteilt – dann wird nichts verdoppelt. */
  const jeGesamt=/je\s+(reservoir|tank)\s*(ca\.?\s*)?\d/i.test(t);
  const jeText=(/\bje\s+\d/i.test(t)&&/vorne/.test(t)&&/hinten/.test(t))||(/je\s+(reservoir|tank)/i.test(t)&&!jeGesamt);
  /* Trennen: an «+», «;», «und», Pfeilen, «danach», «zusätzlich» – und an
     einem Stellenwort, wenn ein Teil beide Stellen mit Mengen nennt
     («vorne 2100ml, hinten 2100ml»). Ein Stellenwort am Ende eines Teils
     («1l H2SO4 hinten») gehört zum nächsten Teil, nicht zu diesem. */
  let teile=t.split(/\s*\+\s*|\s*;\s*|\s+und\s+|-->|→|\n|,?\s*danach\s*,?|,?\s*zusätzlich\s*/i).map(x=>x.trim()).filter(Boolean);
  teile=teile.flatMap(x=>(x.match(/\b(vorne|hinten)\b/g)||[]).length>=2?x.split(/(?=\b(?:vorne|hinten)\b)/).map(y=>y.trim()).filter(Boolean):[x]);
  for(let i=0;i<teile.length-1;i++){
    const m=teile[i].match(/^(.*\S)\s+(vorne|hinten)\s*:?$/i);
    if(m){teile[i]=m[1];teile[i+1]=m[2]+' '+teile[i+1]}
  }
  const out=[];
  let aktStelle=stelleGlobal,traegerMittel=null;
  for(let ti=0;ti<teile.length;ti++){
    const teil=teile[ti];
    /* nur ein Stellenwort: setzt die Stelle für das Folgende */
    if(/^(vorne|hinten)\s*:?$/i.test(teil)){aktStelle=stelleVon(teil);continue}
    const eigene=stelleVon(teil);
    if(eigene)aktStelle=eigene;
    const stelle=eigene||aktStelle;
    const je=jeText||/je\s+reservoir|pro\s+reservoir|je\s+tank/i.test(teil)&&!jeGesamt;
    const mengen=[];MENGE_RE.lastIndex=0;
    let mm;while((mm=MENGE_RE.exec(teil)))mengen.push({z:toNum(mm[1]),e:EINH_NORM[mm[2].toLowerCase()]||mm[2].toLowerCase(),pos:mm.index});
    const prozent=mengen.find(x=>x.e==='%');
    let echte=mengen.filter(x=>x.e!=='%');
    /* Wasser: Liter ab 500 sind Wasser, nicht Dünger – niemand dosiert
       15 000 Liter Biovin. Solche Mengen werden als Wasserzugabe geführt,
       mit Dünger, wenn im selben Teil einer steht. */
    const wasser=echte.filter(x=>x.e==='l'&&x.z>=500);
    if(wasser.length&&!/bio-?v[a-zä]*[-\s]?wasser/i.test(teil)){
      const mitD=/dünger|duenger|biovin|biov\b|epsotop|\bET\b|EPT/i.test(teil)&&!/\bohne\b/i.test(teil);
      out.push({typ:'Wasserzugabe',mittel:null,menge:wasser[0].z,einheit:'l',jeReservoir:false,stelle,datum,roh,
        felder:{mitDuenger:mitD?'ja':'nein'},warnung:null,dabei:true});
      echte=echte.filter(x=>!wasser.includes(x));
      /* Bleibt ausser dem Wasser nichts mit Menge, ist der Teil erledigt –
         «Wasser ohne Dünger zudosiert» braucht keine zweite Notiz. */
      if(!echte.length&&!mitD)continue;
    }

    /* Ereignisse ohne Menge zuerst: «kalibriert», «umgepumpt», «leer». */
    const rein=REIN_MUSTER.find(mu=>mu.re.test(teil));
    if(rein&&!echte.length){
      out.push({typ:rein.typ,mittel:null,menge:null,einheit:null,jeReservoir:false,stelle,datum,roh,
        titel:rein.titel,felder:rein.typ==='Notiz'?{text:teil.slice(0,180)}:{},warnung:null,dabei:true});
      continue;
    }

    /* Welches Mittel ist gemeint? Ein benanntes Produkt («Epsotop») schlaegt
       ein allgemeines Wort («Düngerzugabe»), auch wenn es spaeter im Satz
       steht. Unter Gleichrangigen gewinnt das zuerst genannte. Verneinungen
       zaehlen nicht: «Wasser ohne Dünger» ist keine Düngergabe. */
    let treffer=null,bestPos=Infinity,bestRang=9;
    for(const mu of MITTEL_MUSTER){
      const m=teil.match(mu.re);
      if(!m)continue;
      const pos=m.index;
      if(/\bohne\s*$/i.test(teil.slice(Math.max(0,pos-8),pos)))continue;
      const rang=mu.allgemein?1:0;
      if(rang<bestRang||(rang===bestRang&&pos<bestPos)){bestRang=rang;bestPos=pos;treffer=mu}
    }
    /* «nach PS (vorne 2100ml, hinten 2100ml)»: das Mittel steht im ersten
       Teil, die Mengen in den folgenden – das Mittel wird mitgetragen. */
    if(treffer&&!treffer.allgemein&&!echte.length)traegerMittel={mu:treffer,pos:0,notizAn:out.length};
    else if(!treffer&&echte.length&&traegerMittel&&eigene){
      treffer=traegerMittel.mu;bestPos=0;
      /* die Notiz «PS erwähnt, ohne Menge» ist damit überholt */
      if(traegerMittel.notizAn!=null){out.splice(traegerMittel.notizAn,1);traegerMittel.notizAn=null}
    }
    else if(treffer)traegerMittel=null;
    /* Ein unbekanntes Mittel mit Menge: Notiz mit klarer Bitte, statt zu raten. */
    if(treffer&&treffer.unbekannt){
      out.push({typ:'Notiz',mittel:null,menge:null,einheit:null,jeReservoir:false,stelle,datum,roh,
        felder:{text:teil.slice(0,180)},warnung:null,dabei:true,
        hinweis:`«${treffer.unbekannt}» ist kein hinterlegtes Produkt${echte.length?' ('+echte.map(x=>nz(x.z)+' '+x.e).join(', ')+')':''} – Art wählen und das Produkt unter «Sätze & Einstellungen» anlegen, dann lässt es sich beim nächsten Import zuordnen.`});
      continue;
    }

    if(treffer&&echte.length){
      const soll=evEinheit(treffer.typ,treffer.mittel);
      /* die Menge, die dem Mittel im Text am naechsten steht */
      const passend=echte.filter(x=>x.e===soll);
      const kandidaten=passend.length?passend:echte;
      /* Steht eine Menge kurz HINTER dem Mittel, ist sie fast immer gemeint
         – «Dünger Biovin zudosiert (15l)». Sonst die naechstliegende. */
      const dahinter=kandidaten.filter(x=>x.pos>bestPos&&x.pos-bestPos<=40)
        .sort((a,b)=>a.pos-b.pos)[0];
      let gut=dahinter||kandidaten[0];
      if(!dahinter)for(const x of kandidaten)if(Math.abs(x.pos-bestPos)<Math.abs(gut.pos-bestPos))gut=x;
      let menge=gut.z,einheit=gut.e;
      if(einheit==='g'&&soll==='kg'){menge=menge/1000;einheit='kg'}
      const mehrdeutig=kandidaten.length>1;
      out.push({typ:treffer.typ,mittel:treffer.mittel,menge,einheit:einheit||soll||null,
        jeReservoir:je,stelle,datum,roh,
        felder:prozent?{dosis:String(prozent.z)}:(treffer.duenger?{mitDuenger:'ja'}:{}),
        warnung:treffer.warnung||(mehrdeutig
          ? `In dieser Bemerkung stehen mehrere Mengen (${kandidaten.map(x=>nz(x.z)+' '+x.e).join(', ')}). Die App hat die nächstliegende gewählt – bitte prüfen, welche gemeint ist, und die übrigen als eigene Einträge erfassen.`
          : null),
        dabei:true});
      continue;
    }
    /* Ein Mittel ohne Menge: meist Erzaehlung, keine Zugabe. */
    if(treffer||rein){
      out.push({typ:'Notiz',mittel:null,menge:null,einheit:null,jeReservoir:false,stelle,datum,roh,
        felder:{text:teil.slice(0,180)},warnung:null,dabei:true,
        hinweis:treffer?`«${treffer.typ}» ist erwähnt, aber ohne Menge – das ist meist eine Beschreibung, keine Zugabe. Als Notiz vorgeschlagen; die Art lässt sich hier ändern.`:null});
      continue;
    }
    /* Eine Menge ohne erkennbares Mittel */
    if(echte.length){
      out.push({typ:'Notiz',mittel:null,menge:null,einheit:null,jeReservoir:false,stelle,datum,roh,
        felder:{text:teil.slice(0,180)},warnung:null,dabei:true,
        hinweis:`Eine Menge (${echte.map(x=>nz(x.z)+' '+x.e).join(', ')}) ohne erkennbares Mittel – bitte Art und Mittel selbst wählen.`});
    }
  }
  if(!out.length)out.push({typ:'Notiz',mittel:null,menge:null,einheit:null,jeReservoir:false,
    stelle:stelleGlobal,datum,roh,felder:{text:roh.slice(0,180)},warnung:null,dabei:true,
    hinweis:'Nicht zugeordnet – wird als Notiz mit dem Rohtext übernommen, damit nichts verloren geht.'});
  return out;
}

/* ── Blattauswertung ── */
function tabBlatt(zeilen){
  const mess=[],wurzel=[],vorschlaege=[],hinweise=[];
  let letztDatum=null;
  for(let r=0;r<zeilen.length;r++){
    const zeile=zeilen[r]||[];
    /* Kopfzeile? mindestens ein «Datum» und ein weiterer erkannter Kopf */
    const arten=zeile.map(kopfArt);
    const datumSpalten=arten.map((a,i)=>a==='datum'?i:-1).filter(i=>i>=0);
    if(!datumSpalten.length||arten.filter(Boolean).length<2)continue;
    /* Bloecke: von einer Datumsspalte bis zur naechsten */
    const bloecke=datumSpalten.map((start,k)=>{
      const ende=k+1<datumSpalten.length?datumSpalten[k+1]:zeile.length;
      const map={};
      for(let c=start;c<ende;c++)if(arten[c]&&map[arten[c]]===undefined)map[arten[c]]=c;
      return map;
    });
    letztDatum=null;
    for(let z=r+1;z<zeilen.length;z++){
      const w=zeilen[z]||[];
      if(w.map(kopfArt).filter(Boolean).length>=2&&w.map(kopfArt).includes('datum')){r=z-1;break}
      if(!w.some(x=>zelle(x)!==''))continue;
      for(const b of bloecke){
        const d=tabDatum(w[b.datum],letztDatum);
        if(d)letztDatum=d;
        const dat=d||letztDatum;
        if(!dat)continue;
        const bem=b.bemerkung!==undefined?zelle(w[b.bemerkung]):'';
        /* Uhrzeit: aus einer eigenen Spalte, sonst aus der Datumszelle. */
        const zeit=(b.zeit!==undefined?tabZeit(w[b.zeit]):null)||(typeof w[b.datum]==='number'||w[b.datum] instanceof Date||/\d:\d\d/.test(zelle(w[b.datum]))?tabZeit(w[b.datum]):null);
        /* Ohne Datum in der Zeile gilt das der Zeile davor – aber gesagt,
           nicht stillschweigend. Ein Datum, das dasteht und nicht lesbar
           ist, ebenso. */
        const datumZelle=zelle(w[b.datum]);
        const inhalt=[b.ecVorne,b.ecHinten,b.phVorne,b.phHinten,b.ec,b.ph,b.o2,b.bemerkung,b.wurzel1].some(c=>c!==undefined&&zelle(w[c])!=='');
        if(inhalt&&!datumZelle)hinweise.push(`Zeile ${z+1}: kein Datum – das der Zeile davor (${fmtK(dat)}) übernommen, bitte prüfen.`);
        else if(inhalt&&datumZelle&&!d)hinweise.push(`Zeile ${z+1}: Datum «${datumZelle}» nicht lesbar – das der Zeile davor (${fmtK(dat)}) übernommen, bitte prüfen.`);
        /* Reservoirblock */
        if(b.ecVorne!==undefined||b.phVorne!==undefined||b.ec!==undefined||b.ph!==undefined){
          const paare=[['vorne',b.ecVorne,b.phVorne],['hinten',b.ecHinten,b.phHinten]];
          if(b.ecVorne===undefined&&b.ecHinten===undefined)paare.length=0;
          if(!paare.length&&(b.ec!==undefined||b.ph!==undefined))paare.push(['beide',b.ec,b.ph]);
          let gesetzt=false;
          /* Sauerstoff: das Gerät hängt im Reservoir vorne – die Spalte
             gehört zur vorderen Messung. */
          const o2=b.o2!==undefined?tabZahl(w[b.o2]):null;
          for(const [stelle,ce,cp] of paare){
            const ec=ce!==undefined?tabZahl(w[ce]):null;
            const ph=cp!==undefined?tabZahl(w[cp]):null;
            const o2hier=(stelle==='vorne'||stelle==='beide')?o2:null;
            if(ec==null&&ph==null&&o2hier==null)continue;
            gesetzt=true;
            const warn=[];
            if(ph!=null&&(ph<3||ph>10))warn.push(`pH ${nz(ph,2)} liegt ausserhalb 3–10 – Tippfehler?`);
            if(ec!=null&&(ec<0||ec>10))warn.push(`EC ${nz(ec,2)} ist für einen Rücklauf unwahrscheinlich – Tippfehler?`);
            mess.push({id:uid(),datum:dat,zeit,stelle,ec,ph,ecFrisch:null,o2:o2hier,o2sat:null,wer:null,
              temp:b.temp!==undefined?tabZahl(w[b.temp]):null,
              notiz:bem||null,quelle:'excel',dabei:true,zeile:z+1,warnung:warn.length?warn.join(' '):null});
          }
          if(!gesetzt&&bem)hinweise.push(`Zeile ${z+1}: nur eine Bemerkung, kein Messwert – daraus entsteht nur ein Logbuchvorschlag.`);
        }
        /* Wurzelblock */
        if(b.wurzel1!==undefined||b.satz!==undefined){
          const werte=[b.wurzel1,b.wurzel2,b.wurzel3].filter(c=>c!==undefined).map(c=>tabZahl(w[c])).filter(x=>x!=null);
          const satz=b.satz!==undefined?zelle(w[b.satz]):'';
          if(werte.length)wurzel.push({id:uid(),datum:dat,satz:satz||null,werte,
            schnitt:b.schnitt!==undefined?tabZahl(w[b.schnitt]):null,dabei:true,zeile:z+1});
        }
        if(bem)vorschlaege.push(...bemerkungLesen(bem,dat).map(v=>Object.assign(v,{zeile:z+1,zeit})));
      }
    }
    if(r>=zeilen.length-1)break;
  }
  return {mess,wurzel,vorschlaege,hinweise};
}
/* Doppelte Vorschlaege aus derselben Zeile zusammenfassen */
function tabZusammen(teile){
  const mess=[],wurzel=[],vorschlaege=[],hinweise=[];
  const gesehen=new Set();
  for(const t of teile){
    for(const m of t.mess){
      const k=m.datum+'|'+(m.zeit||'')+'|'+m.stelle+'|'+m.ec+'|'+m.ph+'|'+(m.notiz||'')+'|'+m.zeile;
      if(gesehen.has(k))continue;gesehen.add(k);mess.push(m);
    }
    for(const x of t.wurzel){
      const k='w'+x.datum+'|'+x.satz+'|'+x.werte.join(',');
      if(gesehen.has(k))continue;gesehen.add(k);wurzel.push(x);
    }
    for(const v of t.vorschlaege){
      const k='v'+v.datum+'|'+v.typ+'|'+v.mittel+'|'+v.menge+'|'+v.roh;
      if(gesehen.has(k))continue;gesehen.add(k);vorschlaege.push(v);
    }
    hinweise.push(...t.hinweise);
  }
  return {mess,wurzel,vorschlaege,hinweise:[...new Set(hinweise)]};
}

/* ── Einlesen ── */
let TABPRUEF=null;
const csvZeilen=text=>{
  const kopf=(text.split('\n')[0]||'');
  const trenner=kopf.split('\t').length>1?'\t':(kopf.split(';').length>kopf.split(',').length?';':',');
  const out=[];let feld='',zeile=[],inAnf=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inAnf){ if(c==='"'){ if(text[i+1]==='"'){feld+='"';i++} else inAnf=false } else feld+=c; continue }
    if(c==='"'){inAnf=true;continue}
    if(c===trenner){zeile.push(feld);feld='';continue}
    if(c==='\n'){zeile.push(feld);out.push(zeile);zeile=[];feld='';continue}
    if(c==='\r')continue;
    feld+=c;
  }
  zeile.push(feld);if(zeile.some(x=>x!==''))out.push(zeile);
  return out;
};
async function tabelleEinlesen(file){
  const csv=/\.csv$/i.test(file.name);
  let blaetter=[];
  try{
    if(csv){
      blaetter=[{name:file.name,zeilen:csvZeilen(await file.text())}];
    }else{
      if(typeof XLSX==='undefined')
        return dialog('Die Excel-Bibliothek fehlt',
          `<p class="small">Zum Lesen von Excel-Dateien braucht die App die Bibliothek SheetJS aus dem Netz. Sie konnte nicht geladen werden – vermutlich besteht gerade keine Internetverbindung.</p>
           <p class="small">Alles Übrige funktioniert weiter. Zwei Auswege: die Seite mit Verbindung neu laden, oder das Blatt in Excel als <strong>CSV</strong> speichern – CSV liest die App ohne jede Bibliothek.</p>`,
          '<button data-tun="dlgZu">Schliessen</button>');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
      blaetter=wb.SheetNames.map(n=>({name:n,
        zeilen:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:true})}));
    }
  }catch(err){
    return dialog('Die Datei liess sich nicht lesen',
      `<p class="small">${esc(err&&err.message||String(err))}</p>
       <p class="small">Prüfe, ob es wirklich eine Excel- oder CSV-Datei ist. Als Ausweg lässt sich das Blatt in Excel als CSV speichern.</p>`,
      '<button data-tun="dlgZu">Schliessen</button>');
  }
  const teile=blaetter.map(b=>{const r=tabBlatt(b.zeilen);r.blatt=b.name;return r});
  const alles=tabZusammen(teile);
  alles.blaetter=blaetter.map((b,i)=>({name:b.name,zeilen:b.zeilen.length,
    mess:teile[i].mess.length,wurzel:teile[i].wurzel.length,vor:teile[i].vorschlaege.length}));
  alles.datei=file.name;
  if(!alles.mess.length&&!alles.vorschlaege.length&&!alles.wurzel.length)
    return dialog('Nichts erkannt',
      `<p class="small">In «${esc(file.name)}» wurde keine Tabelle mit einer Kopfzeile gefunden, die «Datum» und dazu EC oder pH enthält.</p>
       <div class="scroll"><table><thead><tr><th>Blatt</th><th>Zeilen</th></tr></thead><tbody>
       ${blaetter.map(b=>`<tr><td>${esc(b.name)}</td><td class="mono">${b.zeilen.length}</td></tr>`).join('')}</tbody></table></div>
       <p class="small">Der Import sucht die Spalten über ihre Überschrift, nicht über feste Positionen. Es genügt, dass in einer Zeile «Datum» steht und daneben etwas mit «EC» oder «pH».</p>`,
      '<button data-tun="dlgZu">Schliessen</button>');
  TABPRUEF=alles;
  tabDialog();
}

function tabDialog(){
  const t=TABPRUEF;
  const nm=t.mess.filter(x=>x.dabei).length,nw=t.wurzel.filter(x=>x.dabei).length,nv=t.vorschlaege.filter(x=>x.dabei).length;
  const zeitraum=(()=>{const d=t.mess.concat(t.vorschlaege).map(x=>x.datum).filter(Boolean).sort();
    return d.length?`${fmt(d[0])} bis ${fmt(d[d.length-1])}`:'–'})();
  let h=`<p class="small">Aus <strong>${esc(t.datei)}</strong>, Zeitraum ${zeitraum}.
    Nichts wandert ungeprüft in den Bestand – jede Zeile lässt sich einzeln abwählen und im Feld korrigieren.</p>
    <div class="row" style="margin-bottom:10px">
      ${t.blaetter.map(b=>`<span class="tag">${esc(b.name)}: ${b.mess} Messungen · ${b.vor} Bemerkungen</span>`).join('')}
    </div>`;
  if(t.hinweise.length)h+=`<div class="note">${t.hinweise.slice(0,6).map(esc).join('<br>')}${t.hinweise.length>6?`<br><span class="muted">… und ${t.hinweise.length-6} weitere</span>`:''}</div>`;

  h+=`<div class="hd" style="margin:16px 0 8px"><div><h2 style="font-size:16px">Messungen am Tank (${nm} von ${t.mess.length})</h2>
    <p class="sub">Zwei Entnahmestellen ergeben zwei Messungen je Zeile. Mehrere Zeilen mit demselben Datum bleiben erhalten – die Bemerkung unterscheidet sie.</p></div></div>`;
  const warnMess=t.mess.filter(m=>m.warnung).length;
  if(warnMess)h+=`<div class="note warn">${warnMess} Messwert${warnMess>1?'e sind':' ist'} unwahrscheinlich und rot markiert – bitte prüfen, bevor du übernimmst. Sie sind angehakt, damit nichts stillschweigend wegfällt.</div>`;
  h+=t.mess.length?`<div class="scroll"><table><thead><tr><th></th><th>Zeile</th><th>Datum</th><th>Uhrzeit</th><th>Stelle</th><th>EC</th><th>pH</th><th>O₂</th><th>Bemerkung</th></tr></thead><tbody>
    ${t.mess.map((m,i)=>`<tr><td><input type="checkbox" data-aend="tabAn" data-k="mess" data-i="${i}"${m.dabei?' checked':''}></td>
      <td class="tiny muted">${m.zeile}</td>
      <td><input type="date" data-aend="tabFeld" data-k="mess" data-i="${i}" data-f="datum" value="${esc(m.datum)}"></td>
      <td><input type="time" data-aend="tabFeld" data-k="mess" data-i="${i}" data-f="zeit" value="${esc(m.zeit||'')}"></td>
      <td><select data-aend="tabFeld" data-k="mess" data-i="${i}" data-f="stelle">${STELLEN.map(x=>`<option${m.stelle===x?' selected':''}>${esc(x)}</option>`).join('')}</select></td>
      <td><input class="mono" size="5" data-aend="tabFeld" data-k="mess" data-i="${i}" data-f="ec" value="${m.ec==null?'':m.ec}"></td>
      <td><input class="mono${m.warnung&&/pH/.test(m.warnung)?' val-off':''}" size="5" data-aend="tabFeld" data-k="mess" data-i="${i}" data-f="ph" value="${m.ph==null?'':m.ph}"${m.warnung?` title="${esc(m.warnung)}"`:''}></td>
      <td><input class="mono" size="4" data-aend="tabFeld" data-k="mess" data-i="${i}" data-f="o2" value="${m.o2==null?'':m.o2}"></td>
      <td class="tiny ${m.warnung?'val-off':'muted'}">${m.warnung?esc(m.warnung)+' · ':''}${esc((m.notiz||'').slice(0,60))}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted small">Keine Messwerte erkannt.</p>';

  if(t.wurzel.length)h+=`<div class="hd" style="margin:16px 0 8px"><div><h2 style="font-size:16px">EC im Wurzelraum (${nw} von ${t.wurzel.length})</h2>
    <p class="sub">Mehrere Einzelmessungen je Satz. Sie werden als eigene Messungen mit dem Satznamen in der Notiz abgelegt.</p></div></div>
    <div class="scroll"><table><thead><tr><th></th><th>Zeile</th><th>Datum</th><th>Satz</th><th>Werte</th><th>Durchschnitt</th></tr></thead><tbody>

AKTION.tabAn=(d,ev)=>{const x=TABPRUEF[d.k][+d.i];if(x)x.dabei=ev.target.checked};
AKTION.tabFeld=(d,ev)=>{
  const x=TABPRUEF[d.k][+d.i];if(!x)return;
  if(d.f==='jeReservoir'){x.jeReservoir=ev.target.checked;return tabDialog()}
  if(d.f==='menge'||d.f==='ec'||d.f==='ph'||d.f==='o2'){x[d.f]=ev.target.value===''?null:toNum(ev.target.value);return}
  if(d.f==='zeit'){x.zeit=zeitNorm(ev.target.value);return}

};
AKTION.tabUeber=()=>{
  const t=TABPRUEF;if(!t)return;
  let nm=0,nw=0,nv=0;
  for(const m of t.mess.filter(x=>x.dabei)){
    if(!m.datum)continue;
    /* O₂ und Uhrzeit gehen mit – bis zum 30.09. fiel der Sauerstoff hier
       stillschweigend weg, obwohl der Dialog ihn zeigte. */
    db.messungen.push({id:uid(),datum:m.datum,zeit:zeitNorm(m.zeit),stelle:m.stelle,ph:m.ph,ec:m.ec,ecFrisch:null,
      temp:m.temp==null?null:m.temp,o2:m.o2==null?null:m.o2,o2sat:null,wer:null,notiz:m.notiz||null,quelle:'excel'});nm++;
  }
  for(const x of t.wurzel.filter(y=>y.dabei)){
    const s=x.schnitt!=null?x.schnitt:mittel(x.werte);
    if(s==null)continue;
    db.messungen.push({id:uid(),datum:x.datum,stelle:'wurzelraum',ph:null,ec:s,ecFrisch:null,temp:null,
      notiz:`EC im Wurzelraum${x.satz?' · Satz '+x.satz:''} · Einzelwerte ${x.werte.map(v=>nz(v,2)).join(' / ')}`,
      quelle:'excel'});nw++;
  }
  for(const v of t.vorschlaege.filter(x=>x.dabei)){
    if(!v.datum)continue;
    db.ereignisse.push({id:uid(),datum:v.datum,zeit:zeitNorm(v.zeit),typ:v.typ,titel:v.titel||null,mittel:v.mittel||null,
      menge:v.menge,einheit:v.menge!=null?(v.einheit||evEinheit(v.typ,v.mittel)):null,
      jeReservoir:!!(v.menge!=null&&v.jeReservoir),stelle:v.stelle||'beide',
      notiz:v.roh,felder:Object.assign({},v.felder||{}),geltung:'alle',saetze:[],quelle:'excel'});nv++;
  }
  TABPRUEF=null;
  aend();el('dlg').close();setTab('logbuch');
  toast(`${nm} Messungen, ${nw} Wurzel-EC und ${nv} Logbucheinträge übernommen. Nicht vergessen zu sichern.`);
};

  if(el('paketErsetzen')&&el('paketErsetzen').checked){
    const a=paketAltImport(p),w=new Set(a.mess.concat(a.ev).map(x=>x.id));weg=w.size;
    db.messungen=db.messungen.filter(x=>!w.has(x.id));db.ereignisse=db.ereignisse.filter(x=>!w.has(x.id));
  }
  const ids=new Set(db.messungen.map(x=>x.id).concat(db.ereignisse.map(x=>x.id)));
  let nm=0,ne=0;
  for(const m of p.messungen)if(!ids.has(m.id)){db.messungen.push(JSON.parse(JSON.stringify(m)));nm++}
  for(const e of p.ereignisse)if(!ids.has(e.id)){db.ereignisse.push(JSON.parse(JSON.stringify(e)));ne++}
  /* Laufende Beigaben – nur, wo nicht schon jemand für dasselbe Mittel einen
     Zeitraum von Hand gesetzt hat, der sich damit überschneidet. */
  db.beigabeZeiten=beigabeHand();
  for(const z of (p.zeiten||[])){
    if(db.beigabeZeiten.some(h=>h.id===z.id))continue;
    if(db.beigabeZeiten.some(h=>h.mittel===z.mittel&&(h.bis||'9999-12-31')>=z.von))continue;
    db.beigabeZeiten.push(JSON.parse(JSON.stringify(z)));
  }
  db.pakete=Object.assign({},db.pakete||{});db.pakete[p.id]={aktiviert:heute(),abgelehnt:false,version:p.version||1};
  aend();if(el('dlg').open)el('dlg').close();setTab('giess');
  toast(`Aktiviert: ${nm} Messungen und ${ne} Logbucheinträge${weg?`, ${weg} Einträge aus dem früheren Tabellenimport ersetzt`:''}.`);
};

/* ══════════ 12c · Fotos ══════════
   Ein Foto ist der schnellste Weg, eine Managementaenderung mit einer
   sichtbaren Wirkung zu verbinden. Fotos liegen als verkleinerte JPEG in
   derselben Sicherungsdatei wie alles andere – Leitplanke 2 laesst keinen
   Ordnerzugriff und keinen Browserspeicher zu. Darum wird beim Einlesen
   verkleinert und die Dateigroesse offengelegt.                            */
const FOTO_KANTE=1400, FOTO_GUETE=0.72, FOTO_WARN=40*1024*1024;

/* Aufnahmedatum aus dem EXIF-Block eines JPEG. Faellt es aus, wird das
   Dateidatum genommen; beides wird in der Oberflaeche als Herkunft benannt,
   damit niemand ein falsches Datum fuer gemessen haelt. */
function exifDatum(buf){
  try{
    const d=new DataView(buf);
    if(d.getUint16(0)!==0xFFD8)return null;
    let off=2;
    while(off<d.byteLength-4){
      if(d.getUint8(off)!==0xFF)return null;
      const marke=d.getUint8(off+1);
      if(marke===0xD8||marke===0xD9||(marke>=0xD0&&marke<=0xD7)){off+=2;continue}
      if(marke===0xDA)return null;                       /* ab hier Bilddaten */
      const len=d.getUint16(off+2);
      if(marke===0xE1&&d.getUint32(off+4)===0x45786966){ /* «Exif» */
        const t=off+10;
        const klein=d.getUint16(t)===0x4949;
        const g16=q=>d.getUint16(q,klein),g32=q=>d.getUint32(q,klein);
        if(g16(t+2)!==0x002A)return null;
        const feld=(start,tag)=>{
          const n=g16(start);
          for(let k=0;k<n;k++){const e=start+2+k*12;if(g16(e)===tag)return e}
          return null;
        };
        const ifd0=t+g32(t+4);
        let e=feld(ifd0,0x0132);                          /* DateTime */
        const unter=feld(ifd0,0x8769);
        if(unter){const sub=t+g32(unter+8);
          const e2=feld(sub,0x9003)||feld(sub,0x9004);    /* DateTimeOriginal */
          if(e2)e=e2}
        if(!e)return null;
        const anz=g32(e+4),pos=anz>4?t+g32(e+8):e+8;
        let txt='';
        for(let k=0;k<Math.min(19,anz);k++)txt+=String.fromCharCode(d.getUint8(pos+k));
        const m=txt.match(/^(\d{4})[:\-](\d{2})[:\-](\d{2})/);
        if(!m||+m[1]<1990||+m[1]>2100)return null;
        return `${m[1]}-${m[2]}-${m[3]}`;
      }
      off+=2+len;
    }
  }catch(err){}
  return null;
}

/* Verkleinern ueber ein <canvas>. Die Ausrichtung ueberlassen wir dem
   Browser: aktuelle Fassungen von Firefox und Chromium drehen ein Bild
   anhand des EXIF-Felds schon beim Zeichnen. Wuerden wir zusaetzlich
   drehen, staende es doppelt gedreht. */
function bildVerkleinern(file){
  return new Promise((fertig,fehler)=>{
    const fr=new FileReader();
    fr.onerror=()=>fehler(new Error('Die Datei liess sich nicht lesen.'));
    fr.onload=()=>{
      const bild=new Image();
      bild.onerror=()=>fehler(new Error('Das ist kein lesbares Bild.'));
      bild.onload=()=>{
        try{
          const f=Math.min(1,FOTO_KANTE/Math.max(bild.width,bild.height));
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round(bild.width*f));
          c.height=Math.max(1,Math.round(bild.height*f));
          const g=c.getContext('2d');
          g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
          g.drawImage(bild,0,0,c.width,c.height);
          fertig({daten:c.toDataURL('image/jpeg',FOTO_GUETE),breite:c.width,hoehe:c.height,
                  vorher:file.size,name:file.name});
        }catch(err){fehler(err)}
      };
      bild.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const dataUrlBytes=u=>{const i=String(u||'').indexOf(',');return i<0?0:Math.round((u.length-i-1)*3/4)};
const dbBytes=()=>{try{return JSON.stringify(db).length}catch(e){return 0}};
const mb=b=>nz(b/1048576,1)+' MB';
const fotosNach=d=>db.fotos.filter(f=>f.datum===d);
const fotoZuAnalyse=id=>db.fotos.filter(f=>f.analyseId===id);

/* ── Einlesen ── */
let FOTOPRUEF=[];
async function fotosEinlesen(files){
  const liste=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name));
  if(!liste.length)return toast('Keine Bilddateien dabei.');
  toast(`${liste.length} Bild${liste.length>1?'er werden':' wird'} verkleinert …`);
  const out=[];
  for(const file of liste){
    let datum=null,herkunft='heute';
    try{
      const buf=await file.arrayBuffer();
      const ex=exifDatum(buf);
      if(ex){datum=ex;herkunft='Aufnahmedatum aus dem Bild'}
    }catch(err){}
    if(!datum&&file.lastModified){
      const d=new Date(file.lastModified);
      if(!isNaN(d)){datum=d.toISOString().slice(0,10);herkunft='Dateidatum'}
    }
    if(!datum){datum=heute();herkunft='heute – im Bild stand kein Datum'}
    try{
      const b=await bildVerkleinern(file);
      out.push({id:uid(),datum,herkunft,titel:file.name.replace(/\.[^.]+$/,'').slice(0,60),
        notiz:'',satz:'',etage:'',analyseId:'',dabei:true,
        daten:b.daten,breite:b.breite,hoehe:b.hoehe,vorher:b.vorher});
    }catch(err){
      toast(`«${file.name}» liess sich nicht lesen: ${err.message}`);
    }
  }
  if(!out.length)return;
  FOTOPRUEF=out;
  fotoPruefdialog();
}

   selben Tag sonst noch erfasst wurde. */

/* ── Fotospur im Diagramm ──────────────────────────────────
   Je Tag ein Kamerasymbol unter der Messwertflaeche. Mehrere Fotos desselben
   Tages werden zu einem Symbol mit Anzahl gebuendelt. Miniaturbilder in der
   Messwertflaeche selbst waeren huebsch und wuerden die Punkte verdecken –
   darum eine eigene Spur. */
let fotoSpur=true;

function fotoGruppen(){
  const m=new Map();
  for(const f of db.fotos){
    if(!f.datum)continue;
    const l=m.get(f.datum)||[];l.push(f);m.set(f.datum,l);
  }
  return [...m.entries()].map(([datum,liste])=>({
    datum,x:+new Date(datum),anzahl:liste.length,
    tipp:tippBau(liste.length>1?`${liste.length} Fotos`:(liste[0].titel||'Foto'),FARBSTOFF[2],
      [['Datum',fmt(datum)],
       liste[0].satz?['Satz',liste[0].satz]:null,
       liste[0].etage?['Etage',liste[0].etage]:null],
      'Anklicken öffnet die Bilder.')
      +`<img src="${liste[0].daten}" alt="">`
  })).sort((a,b)=>a.x-b.x);
}
/* Schaltflaeche fuer die Werkzeugleiste der Diagramme */
const fotoChip=()=>db.fotos.length

/* ══════════ 13 · Logbuch ══════════
   Das Logbuch ist die Grundlage des Reiters Wirkung und damit der Leitfrage
   des Betriebs. Es muss so bequem sein, dass es tatsaechlich gepflegt wird:
   Schnellerfassung oben in einer Zeile, Zeitstrahl darunter, Duplizieren
   mit einem Klick.                                                          */
const EVFARBE=(()=>{const m={};Object.keys(EVTYPEN).forEach((t,i)=>m[t]=FARBSTOFF[i%FARBSTOFF.length]);return m})();
const evFarbe=t=>EVFARBE[t]||'#8C9A88';
/* Menge eines Eintrags als Text, mit dem «je Reservoir»-Vorbehalt. */
function evMenge(e){
  if(e.menge==null)return '';
  const t=nz(e.menge)+' '+(e.einheit||'');
  return e.jeReservoir?`${t} je Reservoir (zusammen ${nz(e.menge*2)} ${e.einheit||''})`:t;
}
function felderText(e){
  const d=evTypDef(e.typ),t=[];
  if(e.mittel)t.push(evMittelName(e.mittel));
  if(e.menge!=null)t.push(evMenge(e));
  for(const [k,label] of (d.f||[]))if(e.felder&&e.felder[k])t.push(`${label}: ${e.felder[k]}`);
  if(e.notiz)t.push(e.notiz);
  return t.join(' · ');
}
/* Auswahl der Mittel: Produktstammdaten zuerst, dann alles je Verwendetes. */
function evMittelListe(){
  const aus=Object.keys(db.produkte||{}).map(k=>[k,db.produkte[k].name]);
  const frei=[...new Set(db.ereignisse.map(e=>e.mittel).filter(m=>m&&!db.produkte[m]))];
  return aus.concat(frei.map(m=>[m,m]));
}

      <span class="dot" style="background:${lbFilter.has(t)?evFarbe(t):'#C3CDBF'}"></span>${esc(t)} <span class="muted">${alle.filter(e=>e.typ===t).length}</span></span>`).join('')}

  if(!sicht.length){

  }else{

      const m=(e.datum||'').slice(0,7);
      if(m!==monat){monat=m;s+=`<div class="zs-monat">${esc(monatName(m))}</div>`}

        <div class="row" style="gap:10px;align-items:baseline">
          <span class="mono" style="min-width:82px">${fmt(e.datum)}${zeitTag(e)}</span>
          <strong>${esc(e.typ)}</strong>
          ${e.titel?`<span class="tag">${esc(e.titel)}</span>`:''}

      : 'Wenn eine Änderung nur einen Teil der Sätze betrifft, trag das unter «Gilt für» ein. Dann dienen die übrigen Sätze als Vergleichsgruppe – das ist der einzige Weg, im laufenden Betrieb eine belastbare Aussage zu bekommen.'}</div>`;

  s+='</div>';

}
const monatName=m=>{
  if(!m||m.length<7)return 'ohne Datum';

  return N[+m.slice(5,7)-1]+' '+m.slice(0,4);
};

AKTION.lbFeld=(d,ev)=>{

AKTION.lbSpeichern=()=>{
  const n=lbNeu,d=evTypDef(n.typ);
  if(!n.datum)return toast('Datum fehlt.');
  let mittel=n.mittel==='__neu'?(n.mittelFrei||'').trim():n.mittel;
  if(n.mittel==='__neu'&&!mittel)return toast('Bitte das Mittel benennen – oder die Auswahl ändern.');
  let menge=null;
  if(d.m&&String(n.menge).trim()!==''){
    menge=toNum(n.menge);
    if(menge==null)return toast('Die Menge ist keine Zahl.');
    if(menge<0)return toast('Eine negative Menge ergibt keinen Sinn.');
  }
  if(n.geltung==='saetze'&&!(n.saetze||[]).length)return toast('Bitte mindestens einen Satz wählen – oder «ganzes Gewächshaus».');
  if(n.zeit&&!zeitNorm(n.zeit))return toast('Die Uhrzeit ist keine Uhrzeit (HH:MM).');
  db.ereignisse.push({id:uid(),datum:n.datum,zeit:zeitNorm(n.zeit),typ:n.typ,titel:(n.titel||'').trim()||null,

    jeReservoir:!!(menge!=null&&n.jeReservoir),stelle:n.stelle||'beide',
    notiz:(n.notiz||'').trim()||null,felder:Object.assign({},n.felder||{}),
    geltung:n.geltung||'alle',saetze:n.geltung==='saetze'?(n.saetze||[]):[],quelle:'hand'});
  const merk={datum:n.datum,typ:n.typ,mittel:n.mittel,stelle:n.stelle};
  lbNeu=Object.assign(lbFrisch(),merk);
  aend();render();toast('Eingetragen.');
};

    ${EV.beleg?`<p class="tiny muted" style="margin-top:8px">Beleg: ${esc(EV.beleg)}</p>`:''}`,
    `<button class="primary" data-tun="evSpeichern">Speichern</button><button data-tun="dlgZu">Abbrechen</button>`);
  evFelder(typ);
}
AKTION.evTyp=(d,ev)=>{EV.felder={};evFelder(ev.target.value)};
function evFelder(typ){
  const def=evTypDef(typ);
  EV.typ=typ;
  const einh=evEinheit(typ,EV.mittel);
  const s=alleSaetze();
  let h='<div class="row">';
  if(def.mittel)h+=`<div><label class="lab">Mittel</label><select data-em="mittel"><option value="">–</option>
    ${evMittelListe().map(([k,n])=>`<option value="${esc(k)}"${EV.mittel===k?' selected':''}>${esc(n)}</option>`).join('')}
    ${(EV.mittel&&!evMittelListe().some(x=>x[0]===EV.mittel))?`<option value="${esc(EV.mittel)}" selected>${esc(EV.mittel)}</option>`:''}
    </select></div>`;
  if(def.m)h+=`<div><label class="lab">${esc(def.m.l)} <span class="muted">${esc(einh)}</span></label>
      <input class="mono" size="8" inputmode="decimal" data-em="menge" value="${EV.menge==null?'':esc(EV.menge)}"></div>
    <div><label class="lab">&nbsp;</label><label class="small" style="display:block;padding-top:7px">
      <input type="checkbox" data-em="jeReservoir"${EV.jeReservoir?' checked':''}> je Reservoir</label></div>`;
  h+=`<div><label class="lab">Stelle</label><select data-em="stelle">
      ${STELLEN.map(x=>`<option${(EV.stelle||'beide')===x?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  for(const [k,label,art] of (def.f||[])){
    const v=(EV.felder&&EV.felder[k])||'';
    if(art==='z')h+=`<div><label class="lab">${esc(label)}</label><input class="mono" size="8" inputmode="decimal" data-ef="${esc(k)}" value="${esc(v)}"></div>`;
    else if(art&&art.indexOf('w:')===0)h+=`<div><label class="lab">${esc(label)}</label><select data-ef="${esc(k)}">${art.slice(2).split('|').map(o=>`<option${v===o?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
    else if(art==='ws')h+=`<div><label class="lab">${esc(label)}</label><select data-ef="${esc(k)}"><option value="">–</option>${SCHAEDEN.map(x=>`<option${v===x.name?' selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
    else h+=`<div><label class="lab">${esc(label)}</label><input data-ef="${esc(k)}" value="${esc(v)}" size="16"></div>`;
  }
  h+=`<div><label class="lab">Gilt für</label><select id="eGeltung" data-aend="evGeltung">
      <option value="alle"${EV.geltung!=='saetze'?' selected':''}>ganzes Gewächshaus</option>
      <option value="saetze"${EV.geltung==='saetze'?' selected':''}>nur bestimmte Sätze</option></select></div>
    <div id="eSaetze" ${EV.geltung==='saetze'?'':'hidden'}><label class="lab">Sätze <span class="muted">(mehrere mit Strg/Cmd)</span></label>
      <select multiple size="${Math.min(5,Math.max(2,s.length))}" id="eSatzListe">
      ${s.map(x=>`<option${(EV.saetze||[]).indexOf(x)>=0?' selected':''}>${esc(x)}</option>`).join('')}</select></div></div>`;
  if(def.satz)h+='<p class="tiny muted" style="margin-top:8px">Dieser Typ betrifft in der Regel einzelne Sätze. Trag sie unter «Gilt für» ein – daraus entsteht im Reiter Wirkung eine Vergleichsgruppe.</p>';
  if(def.hinweis)h+=`<p class="tiny muted" style="margin-top:8px">${esc(def.hinweis)}</p>`;
  el('eFelder').innerHTML=h;
}
AKTION.evGeltung=(d,ev)=>{const b=el('eSaetze');if(b)b.hidden=ev.target.value!=='saetze'};
AKTION.evSpeichern=()=>{
  const ev=EV,box=el('eFelder');
  ev.datum=el('eDatum').value;ev.typ=el('eTyp').value;
  const zt=el('eZeit')?el('eZeit').value:'';
  if(zt&&!zeitNorm(zt))return toast('Die Uhrzeit ist keine Uhrzeit (HH:MM).');
  ev.zeit=zeitNorm(zt);
  ev.titel=el('eTitel').value||null;ev.notiz=el('eNotiz').value||null;
  ev.felder={};box.querySelectorAll('[data-ef]').forEach(i=>{if(i.value)ev.felder[i.dataset.ef]=i.value});
  const g=n=>box.querySelector(`[data-em="${n}"]`);
  ev.mittel=g('mittel')?(g('mittel').value||null):null;
  ev.stelle=g('stelle')?g('stelle').value:'beide';
  ev.jeReservoir=g('jeReservoir')?!!g('jeReservoir').checked:false;
  if(g('menge')){
    const t=String(g('menge').value).trim();
    if(t===''){ev.menge=null;ev.einheit=null}
    else{
      const z=toNum(t);
      if(z==null)return toast('Die Menge ist keine Zahl.');
      if(z<0)return toast('Eine negative Menge ergibt keinen Sinn.');
      ev.menge=z;ev.einheit=evEinheit(ev.typ,ev.mittel);
    }
  }else{ev.menge=null;ev.einheit=null}
  if(ev.menge==null)ev.jeReservoir=false;
  ev.geltung=el('eGeltung').value;
  const ls=el('eSatzListe');
  ev.saetze=ev.geltung==='saetze'&&ls?[...ls.selectedOptions].map(o=>o.value):[];
  if(!ev.datum)return toast('Datum fehlt.');
  if(ev.geltung==='saetze'&&!ev.saetze.length)return toast('Bitte mindestens einen Satz wählen – oder «ganzes Gewächshaus».');
  if(!ev.quelle)ev.quelle='hand';
  const i=db.ereignisse.findIndex(x=>x.id===ev.id);
  if(i>=0)db.ereignisse[i]=ev;else db.ereignisse.push(ev);
  aend();el('dlg').close();render();toast('Gespeichert.');
};

/* ── Wirkung einer Änderung prüfen ──────────────────────────────────────
   Früher ein eigener Reiter. Als Dialog am Logbucheintrag ist es besser
   aufgehoben: die Frage entsteht dort, wo die Änderung steht.
   Der Vergleichsgruppen-Teil ist der einzige Modus, der Management von
   Kulturalter und Jahreszeit trennt – gleiches Haus, gleiche Woche, nur ein
   Teil betroffen. Genau deshalb ist er nicht mit weggefallen.            */
let WK=null;
AKTION.wirkung=d=>{WK={ev:d.id,vor:null,nach:null};wirkungDialog()};
AKTION.wkVor=(d,ev)=>{WK.vor=ev.target.value||null;wirkungDialog()};
AKTION.wkNach=(d,ev)=>{WK.nach=ev.target.value||null;wirkungDialog()};
function wirkungDialog(){
  const ev=db.ereignisse.find(x=>x.id===WK.ev);
  if(!ev)return toast('Diesen Eintrag gibt es nicht mehr.');
  const betroffen=ev.geltung==='saetze'&&ev.saetze&&ev.saetze.length?ev.saetze:null;
  const erh=erhebungen();
  const passt=e=>!betroffen||betroffen.includes(e.satz);
  const autoVor=erh.filter(e=>e.datum<ev.datum&&passt(e)).pop();
  const autoNach=erh.find(e=>e.datum>=ev.datum&&passt(e));
  const vor=erh.find(e=>e.id===WK.vor)||autoVor;
  const nach=erh.find(e=>e.id===WK.nach)||autoNach;
  const opt=(e,sel)=>`<option value="${esc(e.id)}"${sel?' selected':''}>${fmt(e.datum)} · ${esc(e.satz)}${e.zustand?' ('+esc(e.zustand)+')':''} · ${e.alter.woche!=null?(e.alter.sicher?'':'~')+nz(e.alter.woche,1)+' W':'Alter ?'}</option>`;

  let inhalt='';
  if(vor&&nach){
    const zeilen=kern().map(k=>{
      const bv=vor.bew[k],bn=nach.bew[k];
      if(!bv||bv.fehlt||!bn||bn.fehlt||bv.art!==bn.art)return null;
      const mv=(bv.mass||bv.werte),mn=(bn.mass||bn.werte);
      const av=mittel(mv.map(w=>abstand(lage(w.wert,w.opt))).filter(x=>x!=null));
      const an=mittel(mn.map(w=>abstand(lage(w.wert,w.opt))).filter(x=>x!=null));
      if(av==null||an==null)return null;
      return {k,blatt:bv.art,vor:mittel(mv.map(w=>w.wert)),nach:mittel(mn.map(w=>w.wert)),
        delta:av-an,stNach:bn.ok?'ok':bn.st};
    }).filter(Boolean).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
    if(zeilen.length){
      const bes=zeilen.filter(z=>z.delta>0.02).length,sch=zeilen.filter(z=>z.delta<-0.02).length;
      const iv=vor.index?Math.round(vor.index.anteil*100):null,inx=nach.index?Math.round(nach.index.anteil*100):null;
      const wochen=Math.round(tage(vor.datum,nach.datum)/7);
      const g=[];
      if(vor.satz!==nach.satz)g.push(`die Proben stammen aus verschiedenen Sätzen (${vor.satz} und ${nach.satz}), die sich auch ohne die Änderung unterscheiden würden`);
      if(vor.alter.woche!=null&&nach.alter.woche!=null&&Math.abs(vor.alter.woche-nach.alter.woche)>1.5)
        g.push(`die Bestände waren unterschiedlich alt (${nz(vor.alter.woche,1)} gegen ${nz(nach.alter.woche,1)} Wochen), und mit dem Alter erschöpft sich die Grunddüngung`);
      if(wochen>8)g.push(`zwischen den Erhebungen liegen ${wochen} Wochen, in denen sich auch die Jahreszeit verändert hat`);
      if(wochen<2)g.push(`zwischen der Änderung und der zweiten Erhebung liegen nur ${wochen===0?'wenige Tage':wochen+' Woche'} – im Blattsaft ist eine Wirkung meist erst nach zwei bis drei Wochen sichtbar`);
      const spaeter=db.ereignisse.filter(x=>x.id!==ev.id&&x.datum>ev.datum&&x.datum<=nach.datum);
      if(spaeter.length)g.push(`dazwischen liegen ${spaeter.length} weitere Einträge im Logbuch (${spaeter.map(x=>x.titel||x.typ).join(', ')})`);
      inhalt=`<div class="row" style="gap:26px;margin-bottom:12px">
        <div><h4>Anteil im Optimum</h4><div style="display:flex;align-items:baseline;gap:8px">
          <b style="font-family:'Bricolage Grotesque';font-size:24px">${iv==null?'–':iv+' %'}</b><span class="muted">→</span>
          <b style="font-family:'Bricolage Grotesque';font-size:24px" class="${(inx||0)>=(iv||0)?'val-ok':'val-off'}">${inx==null?'–':inx+' %'}</b></div></div>
        <div><h4>Bewegung</h4><div class="small">${bes} Nährstoffe Richtung Sollbereich, ${sch} davon weg</div>
          <div class="tiny muted">${zeilen.length} von ${kern().length} vergleichbar, jeder am massgeblichen Blatt</div></div></div>
        <div class="scroll"><table><thead><tr><th>Nährstoff</th><th>Blatt</th><th>vorher</th><th>nachher</th><th>Richtung</th></tr></thead><tbody>
        ${zeilen.map(z=>`<tr><td><strong>${esc(NAME[z.k]||z.k)}</strong></td>
          <td class="tiny muted">${esc(z.blatt==='beide'?'jung und alt':z.blatt+'blatt')}</td>
          <td class="mono">${nz(z.vor)}</td><td class="mono">${nz(z.nach)} <span class="tiny muted">${esc(einheit(z.k))}</span></td>
          <td class="small ${z.delta>0.02?'val-ok':z.delta<-0.02?'val-off':''}">${z.delta>0.02?'↗ Richtung Sollbereich':z.delta<-0.02?'↘ weiter weg':'→ unverändert'}${istOk(z.stNach)?' ✓':''}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="tiny muted" style="margin-top:8px">Verglichen wird der Abstand zum Sollbereich, nicht die Rohdifferenz. Ein Wert, der von weit unter dem Soll auf knapp darunter steigt, gilt als Bewegung Richtung Sollbereich, auch wenn er ihn noch nicht erreicht.</p>
        <div class="note">Das ist ein Indiz, kein Beweis.${g.length?' Konkret: '+esc(g.join('; '))+'.':''} Belastbar wird es, wenn dieselbe Änderung ein zweites Mal in dieselbe Richtung zeigt – oder über eine Vergleichsgruppe.</div>`;
    }else inhalt='<div class="note">Vorher und nachher gibt es keinen Nährstoff, der in beiden Erhebungen am selben Blatt beurteilbar wäre.</div>';
  }else inhalt='<div class="note">Für diese Änderung fehlt eine Erhebung davor oder danach. Der Rhythmus Analyse – Änderung – Analyse ist genau der, der hier auswertbar wird. Im Planer lässt sich die nächste Beprobung dafür eintragen.</div>';

  let gruppe='';
  if(betroffen){
    const bis=plus(ev.datum,56);
    const nachher=erh.filter(e=>e.datum>=ev.datum&&e.datum<=bis&&e.index);
    const a=nachher.filter(e=>betroffen.includes(e.satz)),b=nachher.filter(e=>!betroffen.includes(e.satz));
    gruppe=`<h4 style="margin-top:18px">Vergleichsgruppe</h4>
      <p class="tiny muted">Gleiches Haus, gleiche Wochen, nur ein Teil der Sätze betroffen – der einzige Modus, der Management von Kulturalter und Jahreszeit trennt.</p>
      ${a.length&&b.length?`<div class="row" style="gap:26px;margin-top:8px">
        <div><h4>Betroffen (${esc(betroffen.join(', '))})</h4>
          <b style="font-family:'Bricolage Grotesque';font-size:22px">${Math.round(mittel(a.map(e=>e.index.anteil))*100)} %</b>
          <div class="tiny muted">${a.length} Erhebung${a.length>1?'en':''}</div></div>
        <div><h4>Nicht betroffen</h4>
          <b style="font-family:'Bricolage Grotesque';font-size:22px">${Math.round(mittel(b.map(e=>e.index.anteil))*100)} %</b>
          <div class="tiny muted">${b.length} Erhebung${b.length>1?'en':''}</div></div>
        <div><h4>Unterschied</h4>
          <div class="small">${Math.round((mittel(a.map(e=>e.index.anteil))-mittel(b.map(e=>e.index.anteil)))*100)} Prozentpunkte zugunsten der ${mittel(a.map(e=>e.index.anteil))>=mittel(b.map(e=>e.index.anteil))?'betroffenen':'nicht betroffenen'} Sätze</div>
          <div class="tiny muted">bei ${a.length} gegen ${b.length} Erhebungen ist das ein Hinweis, noch kein Beweis</div></div></div>`
      :`<div class="note">Im Fenster von acht Wochen nach der Änderung fehlt ${!a.length?'eine Erhebung in den betroffenen Sätzen':'eine Erhebung in den übrigen Sätzen'}. Beprobt beide Gruppen im selben Zeitraum, dann entsteht hier ein echter Vergleich.</div>`}`;
  }else{
    gruppe=`<div class="note neutral" style="margin-top:16px">Diese Änderung betrifft das ganze Gewächshaus. Damit gibt es keine Vergleichsgruppe – und der Vergleich oben kann Management, Kulturalter und Jahreszeit nicht trennen.
      Änderungen, die nur einen Teil der Sätze betreffen, sind fachlich weit ergiebiger: trag das unter «Gilt für» ein, wenn es zutrifft.</div>`;
  }

  dialog(`Wirkung von «${ev.titel||ev.typ}» vom ${fmt(ev.datum)}`,
    `<div class="row" style="margin-bottom:14px">
      <div><label class="lab">Erhebung davor</label><select data-aend="wkVor">
        <option value="">automatisch${autoVor?' ('+fmt(autoVor.datum)+')':''}</option>
        ${erh.filter(e=>e.datum<ev.datum).map(e=>opt(e,vor&&e.id===vor.id&&WK.vor)).join('')}</select></div>
      <div><label class="lab">Erhebung danach</label><select data-aend="wkNach">
        <option value="">automatisch${autoNach?' ('+fmt(autoNach.datum)+')':''}</option>
        ${erh.filter(e=>e.datum>=ev.datum).map(e=>opt(e,nach&&e.id===nach.id&&WK.nach)).join('')}</select></div>
    </div>${inhalt}${gruppe}`,
    '<button data-tun="dlgZu">Schliessen</button>');
}

/* ══════════ 14 · Rundgang ══════════ */
let rg={datum:heute(),satz:'alle',eintraege:{},notiz:'',kultur:''};
function vRund(){
  const liste=db.einst.schaeden.map(schaden);
  const kr=liste.filter(s=>s.art==='Krankheit'),sc=liste.filter(s=>s.art==='Schädling');
  const zeile=s=>`<tr><td><strong>${esc(s.name)}</strong>${s.hinweis?`<div class="tiny muted">${esc(s.hinweis)}</div>`:''}</td>
    <td style="text-align:right"><span class="stufen">${STUFEN.map((t,i)=>
      `<button class="${(rg.eintraege[s.id]||0)===i?'on'+(i===0?' null':''):''}" data-tun="rgStufe" data-s="${esc(s.id)}" data-i="${i}" title="${esc(t)}">${i===0?'–':i}</button>`).join('')}</span></td></tr>`;
  const alt=[...db.rundgaenge].sort((a,b)=>b.datum.localeCompare(a.datum));
  const weiter=SCHAEDEN.filter(s=>db.einst.schaeden.indexOf(s.id)<0);
  /* Kulturbild gegen Nährstofflage – als Beobachtung, ohne Kausalität */
  const erh=erhebungen();
  const kb=new Map();
  for(const r of db.rundgaenge){
    if(!r.kultur)continue;
    const nah=erh.filter(e=>Math.abs(tage(e.datum,r.datum))<=10&&(r.satz==='alle'||r.satz===e.satz)&&e.index);
    if(!nah.length)continue;
    if(!kb.has(r.kultur))kb.set(r.kultur,[]);
    nah.forEach(e=>kb.get(r.kultur).push(e.index.anteil));
  }
  return `<div class="card"><div class="hd"><div><h2>Wöchentlicher Rundgang</h2>
    <p class="sub">0 kein Befund, 1 einzelne Pflanzen, 2 Herde, 3 flächig. Auch ein Rundgang ohne Befund lohnt sich – nur so entsteht eine Linie statt einzelner Punkte.</p></div></div>
    <div class="row" style="margin-bottom:14px">
      <div><label class="lab">Datum</label><input type="date" id="rgDatum" value="${esc(rg.datum)}" data-aend="rgDatum"></div>
      <div><label class="lab">Bereich</label><select data-aend="rgSatz">
        <option value="alle"${rg.satz==='alle'?' selected':''}>ganzes Gewächshaus</option>
        ${alleSaetze().map(s=>`<option value="${esc(s)}"${rg.satz===s?' selected':''}>Satz ${esc(s)}</option>`).join('')}</select>
        <div class="tiny muted" style="margin-top:3px">Pro Satz erfasst wird im Reiter Wirkung vergleichbar.</div></div>
      <div style="flex:1;min-width:190px"><label class="lab">Kulturbild allgemein</label><select data-aend="rgKultur">
        ${KULTURBILD.map(t=>`<option value="${esc(t)}"${rg.kultur===t?' selected':''}>${esc(t||'keine Angabe')}</option>`).join('')}</select></div></div>
    <div class="grid g2">
      <div><h4>Krankheiten</h4><table>${kr.map(zeile).join('')}</table></div>
      <div><h4>Schädlinge</h4><table>${sc.map(zeile).join('')}</table></div></div>
    <div style="margin-top:14px"><label class="lab">Notiz</label><textarea rows="2" id="rgNotiz" style="width:100%" data-aend="rgNotiz">${esc(rg.notiz)}</textarea></div>
    <div class="row" style="margin-top:14px"><button class="primary" data-tun="rgSpeichern">Rundgang speichern</button>
      ${weiter.length?`<select id="rgW"><option value="">weiteren Schaden aufnehmen …</option>${weiter.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>
      <button data-tun="rgDazu">hinzufügen</button>`:''}</div></div>
  ${kb.size>1?`<div class="card"><div class="hd"><div><h2>Kulturbild und Nährstofflage</h2>
    <p class="sub">Mittlerer Anteil im Optimum bei Erhebungen, die zeitlich zu einem Rundgang mit diesem Kulturbild passen. Eine Beobachtung, kein Zusammenhang – das Kulturbild wird von Licht, Wärme und Wasser mindestens ebenso stark bestimmt wie von der Ernährung.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Kulturbild</th><th>Erhebungen</th><th>im Optimum</th></tr></thead><tbody>
    ${[...kb].sort((a,b)=>mittel(b[1])-mittel(a[1])).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="mono">${v.length}</td>
      <td style="min-width:140px"><span class="mono">${Math.round(mittel(v)*100)} %</span></td></tr>`).join('')}
    </tbody></table></div></div>`:''}
  <div class="card"><h2>Bisherige Rundgänge (${alt.length})</h2>
    ${alt.length?`<div class="scroll"><table><thead><tr><th>Datum</th><th>Bereich</th><th>Kulturbild</th><th>Befunde</th><th>Notiz</th><th></th></tr></thead><tbody>
    ${alt.map(r=>`<tr><td class="mono">${fmt(r.datum)}</td><td>${r.satz==='alle'?'ganzes Haus':'Satz '+esc(r.satz)}</td>
      <td class="small">${esc(r.kultur||'–')}</td>
      <td>${r.eintraege.filter(x=>x.stufe>0).map(x=>`<span class="tag ${x.stufe>1?'gelb':''}">${esc(schaden(x.schaden).name)} ${x.stufe}</span>`).join(' ')||'<span class="tag gruen">ohne Befund</span>'}</td>
      <td class="small muted">${esc(r.notiz||'')}</td>
      <td><button class="ghost" data-tun="rgWeg" data-id="${esc(r.id)}">entfernen</button></td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted small">Noch keine Rundgänge erfasst.</p>'}</div>`;
}
AKTION.rgStufe=d=>{rg.eintraege[d.s]=+d.i;render()};
AKTION.rgDatum=(d,ev)=>{rg.datum=ev.target.value};
AKTION.rgSatz=(d,ev)=>{rg.satz=ev.target.value};
AKTION.rgKultur=(d,ev)=>{rg.kultur=ev.target.value};
AKTION.rgNotiz=(d,ev)=>{rg.notiz=ev.target.value};
