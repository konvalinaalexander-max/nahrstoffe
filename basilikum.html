  return {db:d,notizen,von};
}

/* ── Kulturalter ────────────────────────────────────────── */
const montagKW=(jahr,kw)=>{const d=new Date(Date.UTC(jahr,0,4));d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+(kw-1)*7);return d};
/* Aus der Kalenderwoche im Satznamen das Aussaatdatum schätzen.
   Gewählt wird der KW-Montag, der dem Bezugsdatum am NÄCHSTEN liegt und nicht
   nach ihm liegt. Die alte Fassung nahm den letzten Montag davor und sprang
   dadurch ein volles Jahr zurück, sobald das Bezugsdatum wenige Tage vor dem
   Beginn der eigenen Kalenderwoche lag. */
function ausKW(satz,bezug){
  const m=String(satz||'').match(/^\s*(\d{1,2})\s*-/);if(!m||!bezug)return null;
  const kw=+m[1];if(kw<1||kw>53)return null;
  const bez=new Date(bezug);if(isNaN(bez))return null;
  let best=null;
  for(const j of [bez.getUTCFullYear()+1,bez.getUTCFullYear(),bez.getUTCFullYear()-1]){
    const d=montagKW(j,kw),w=(bez-d)/6048e5;
    if(w<-1.5)continue;                         /* Aussaat deutlich nach der Probe: ausgeschlossen */
    if(best==null||Math.abs(w)<Math.abs(best.w))best={d,w};
  }
  if(!best)return null;
  const grenze=Math.max(20,(db.einst.dauerWinter||10)*2);
  return {datum:best.d.toISOString().slice(0,10),wochen:best.w,plausibel:best.w<=grenze,grenze};
}
/* Bezug ist die früheste BLATTSAFT-Probe. Substratproben werden oft vor dem
   Topfen gezogen und liegen damit vor der Aussaat – sie würden die Schätzung
   verziehen. */
function bezugFuer(satz){
  const ds=db.analysen.filter(a=>a.satz===satz&&a.datum&&a.typ==='blattsaft').map(a=>a.datum).sort();
  if(ds.length)return ds[0];
  const alle=db.analysen.filter(a=>a.satz===satz&&a.datum).map(a=>a.datum).sort();
  return alle[0]||heute();
}
function aussaatVon(satz){
  const st=db.saetze[satz]||{};
  if(st.aussaat)return {datum:st.aussaat,quelle:'eingetragen',plausibel:true};
  const abg=ausKW(satz,bezugFuer(satz));
  return abg?{datum:abg.datum,quelle:'abgeleitet',plausibel:abg.plausibel,wochen:abg.wochen,grenze:abg.grenze}
            :{datum:null,quelle:'unbekannt',plausibel:true};
}
function kulturdauer(satz){
  const st=db.saetze[satz]||{};
  if(st.dauer)return st.dauer;
  const a=aussaatVon(satz).datum;
  if(!a)return db.einst.dauerSommer;
  const m=monat(a);
  return (m>=4&&m<=9)?db.einst.dauerSommer:db.einst.dauerWinter;
}
function alter(a){
  const satz=a&&a.satz;
  if(!satz||!a.datum)return {woche:null,text:'Satz oder Datum fehlt',sicher:false,plausibel:true};
  const q=aussaatVon(satz);
  if(!q.datum)return {woche:null,text:'Aussaatdatum unbekannt – unter «Sätze» nachtragen.',sicher:false,plausibel:true};
  const w=tage(q.datum,a.datum)/7;
  const kw=String(satz).match(/^\s*(\d{1,2})-/);
  return {woche:Math.round(w*10)/10,aussaat:q.datum,quelle:q.quelle,sicher:q.quelle==='eingetragen',
    plausibel:q.plausibel!==false&&w>=-0.5,
    text:q.quelle==='eingetragen'
      ? `Aussaat ${fmt(q.datum)} eingetragen · Probe ${fmt(a.datum)} · ${nz(w,1)} Wochen`
      : `KW ${kw?kw[1]:'?'} aus dem Satznamen → Aussaat geschätzt ${fmt(q.datum)} · Probe ${fmt(a.datum)} · rund ${nz(w,1)} Wochen`};
}

/* ── Optimum-Bereiche ───────────────────────────────────── */
/* Eigene Werte schlagen Laborwerte – aber je Grenze einzeln. Ist nur eine
   eigene Grenze eingetragen, bleibt die andere vom Labor bestehen. */
function optVon(a,k){
  const lab=(a&&a.optima&&a.optima[k])||null;
  const eig=(db.eigeneOptima&&db.eigeneOptima[k])||null;
  if(!eig)return lab;
  const lo=eig[0]!=null?eig[0]:(lab?lab[0]:null);
  const hi=eig[1]!=null?eig[1]:(lab?lab[1]:null);
  return (lo==null&&hi==null)?null:[lo,hi];
}
function optQuelle(a,k){
  const lab=(a&&a.optima&&a.optima[k])||null;
  const eig=(db.eigeneOptima&&db.eigeneOptima[k])||null;
  if(!eig)return lab?'Labor':null;
  if(eig[0]!=null&&eig[1]!=null)return 'eigener Wert';
  return lab?'eigener Wert + Labor':'eigener Wert';
}
const optEigen=k=>!!(db.eigeneOptima&&db.eigeneOptima[k]);
const toleranz=()=>(+db.einst.toleranz||0)/100;
/* Fünf Stufen statt drei: die Randstufen fangen Messrauschen ab, damit
   0,79 gegen eine Untergrenze von 0,80 kein Alarmbefund mehr wird. */
function status(v,o,unter){
  if(v==null||!o||unter)return null;
  const lo=o[0],hi=o[1],t=toleranz();
  if(lo!=null&&v<lo)return v>=lo*(1-t)?'randtief':'tief';
  if(hi!=null&&v>hi)return v<=hi*(1+t)?'randhoch':'hoch';
  return 'ok';
}
const istOk=s=>s==='ok'||s==='randtief'||s==='randhoch';
const istRand=s=>s==='randtief'||s==='randhoch';
const STTEXT={tief:'unter Optimum',randtief:'knapp unter Optimum',ok:'im Optimum',randhoch:'knapp über Optimum',hoch:'über Optimum'};
/* Lagewert 0–3: [0,1] zu tief · [1,2] Optimum · [2,3] zu hoch – begrenzt */
function lage(v,o){
  if(v==null||!o)return null;
  const lo=o[0],hi=o[1];
  if(lo==null&&hi==null)return null;
  if(lo==null)return hi>0?(v<=hi?1+Math.min(1,v/hi):2+Math.min(1,(v-hi)/hi)):null;
  if(hi==null||hi<=lo)return v<lo?(lo>0?Math.max(0,v/lo):0):1.5;
  if(v<lo)return lo>0?Math.max(0,Math.min(1,v/lo)):0;
  if(v<=hi)return 1+(v-lo)/(hi-lo);
  return 2+Math.min(1,(v-hi)/(hi||1));
}
const abstand=l=>l==null?null:(l<1?1-l:l>2?l-2:0);
/* Ausmass einer Abweichung, für die Einstufung der Schwere */
function ausmass(v,o){
  if(v==null||!o)return 0;
  const lo=o[0],hi=o[1];
  if(lo!=null&&v<lo&&lo>0)return (lo-v)/lo;
  if(hi!=null&&v>hi&&hi>0)return (v-hi)/hi;
  return 0;
}
const schwereVon=a=>a>=0.5?'hoch':a>=0.15?'mittel':'info';

/* ── Erhebungen und Bewertung ───────────────────────────── */
function erhebungen(){
  const m=new Map();
  for(const a of db.analysen.filter(x=>x.typ==='blattsaft'&&x.datum)){
    const k=(a.satz||'?')+'|'+a.datum+'|'+(a.zustand||'');
    if(!m.has(k))m.set(k,{id:k,satz:a.satz,datum:a.datum,zustand:a.zustand||null,proben:{},liste:[]});
    const e=m.get(k);e.proben[a.blattalter||'misch']=a;e.liste.push(a);
  }
  const out=[...m.values()];
  out.forEach(e=>{e.alter=alter(e.liste[0]);e.bew=bewerte(e);e.index=indexVon(e.bew)});
  return out.sort((a,b)=>a.datum.localeCompare(b.datum)||String(a.satz).localeCompare(String(b.satz)));
}
/* Welches Blatt ist für diesen Nährstoff überhaupt aussagekräftig?
   Mobil → Altblatt (dort zeigt sich Knappheit zuerst).
   Immobil → Jungblatt (dorthin kommt der Nachschub nicht).
   Teilmobil → beide, versorgt nur wenn beide stimmen. */
function massgebliche(e,k){
  const j=e.proben.jung,a=e.proben.alt,mi=e.proben.misch;
  const hat=p=>p&&p.werte[k]&&p.werte[k].wert!=null;
  const m=MOBIL[k]||'unbekannt';
  if(m==='mobil'&&hat(a))return {art:'alt',ps:[a]};
  if(m==='immobil'&&hat(j))return {art:'jung',ps:[j]};
  if(hat(j)&&hat(a))return {art:'beide',ps:[j,a]};
  const eine=[j,a,mi].filter(hat);
  if(!eine.length)return null;
  const p=eine[0];
  return {art:p===j?'jung':p===a?'alt':'misch',ps:[p],ersatz:m==='mobil'||m==='immobil'};
}
/* Asymmetrisch, und das mit Absicht:
   MANGEL wird nur am massgeblichen Blatt festgestellt – bei einem mobilen
   Nährstoff sagt ein volles Jungblatt nichts, solange das Altblatt leer ist.
   ÜBERSCHUSS zählt dagegen an JEDEM Blatt. Ein Nährstoff, der irgendwo über
   dem Optimum liegt, ist im Überschuss, egal wo er sich staut – und im
   Umlaufsystem ist Anreicherung der wahrscheinlichere Fehler als Mangel. */
function bewerte(e){
  const out={};
  for(const k of kern()){
    const m=massgebliche(e,k);
    if(!m){out[k]={k,fehlt:true};continue}
    const ps=alleProben(e).filter(p=>p.werte[k]&&p.werte[k].wert!=null);
    const ws=ps.map(p=>{const w=p.werte[k],o=optVon(p,k);
      return {blattalter:p.blattalter||'misch',wert:w.wert,unter:!!w.unter,opt:o,st:status(w.wert,o,w.unter),
              massgeblich:m.ps.indexOf(p)>=0,probe:p}});
    const gem=ws.filter(w=>w.st!=null);
    if(!gem.length){out[k]={k,fehlt:true,werte:ws,grund:ws.some(w=>w.unter)?'Nachweisgrenze':'kein Optimum hinterlegt'};continue}
    const mass=gem.filter(w=>w.massgeblich),basis=mass.length?mass:gem;
    const tief=basis.some(w=>w.st==='tief');
    const hoch=gem.some(w=>w.st==='hoch');
    const ok=!tief&&!hoch;
    const daneben=(tief?basis:gem).filter(w=>!istOk(w.st));
    out[k]={k,art:m.art,ersatz:!!m.ersatz,werte:ws,mass:basis,ok,rand:ok&&gem.some(w=>istRand(w.st)),
      st:ok?'ok':(tief?'tief':'hoch'),
      hochAn:hoch&&!tief?gem.filter(w=>w.st==='hoch').map(w=>w.blattalter):[],
      ausmass:daneben.length?Math.max.apply(null,daneben.map(w=>ausmass(w.wert,w.opt))):0};
  }
  return out;
}
function indexVon(bew){
  const v=Object.values(bew).filter(x=>!x.fehlt);
  if(!v.length)return null;
  const ok=v.filter(x=>x.ok).length;
  return {anteil:ok/v.length,n:v.length,ok,fehlt:kern().length-v.length};
}
const leitProbe=e=>e.proben.jung||e.proben.misch||e.proben.alt;
const alleProben=e=>['jung','alt','misch'].map(a=>e.proben[a]).filter(Boolean);
const alleSaetze=()=>[...new Set([...db.analysen.map(a=>a.satz),...Object.keys(db.saetze)])].filter(Boolean).sort();
function satzSichern(satz,daten){
  if(!satz)return;
  db.saetze[satz]=Object.assign({},db.saetze[satz]||{},daten||{});
}
/* Welcher Nährstoff ist über alle Erhebungen hinweg chronisch daneben?
   Rechnet auf derselben Grundlage wie die Kennzahl im Überblick. */
function bilanz(){
  const erh=erhebungen(),m=new Map();
  for(const e of erh){
    for(const k of kern()){
      const b=e.bew[k];if(!b||b.fehlt)continue;
      if(!m.has(k))m.set(k,{k,n:0,ok:0,tief:0,hoch:0,rand:0,lagen:[],art:b.art});
      const x=m.get(k);x.n++;
      if(b.ok){x.ok++;if(b.rand)x.rand++}else if(b.st==='tief')x.tief++;else x.hoch++;
      const l=b.werte.map(w=>lage(w.wert,w.opt)).filter(v=>v!=null);
      if(l.length)x.lagen.push(mittel(l));
    }
  }
  return [...m.values()].map(b=>({...b,mittel:mittel(b.lagen),quote:b.ok/b.n,haupt:HAUPT.includes(b.k)}))
    .sort((a,b)=>a.quote-b.quote||b.n-a.n);
}
/* Verhältnis zweier Werte in derselben Probe – vom Kulturalter unabhängig
   und darum bei dieser Datenlage die belastbarste Auswertung. */
function verh(p,a,b){
  const x=p&&p.werte[a],y=p&&p.werte[b];
  if(!x||!y||x.wert==null||y.wert==null||!y.wert||x.unter||y.unter)return null;
  return x.wert/y.wert;
}
/* Substratprobe, die zeitlich am besten zu einer Erhebung passt */
function substratZu(satz,datum,fenster){
  const f=fenster||28;
  const c=db.analysen.filter(a=>a.typ==='substrat'&&a.satz===satz&&a.datum&&Math.abs(tage(a.datum,datum))<=f);
  if(!c.length)return null;
  return c.sort((x,y)=>Math.abs(tage(x.datum,datum))-Math.abs(tage(y.datum,datum)))[0];
}

/* ══════════ 5 · Regeln ══════════
   Grundsätze dieses Regelwerks:
   · Je Nährstoff entsteht höchstens EIN Befund. Verknüpfende Regeln, die eine
     Ursache benennen, unterdrücken die Einzelbefunde, die sie erklären.
   · Verhältnisregeln laufen einmal je Erhebung, nicht einmal je Blattalter –
     ein Kationen-Ungleichgewicht ist eine Eigenschaft der Nährlösung.
   · Beurteilt wird dasselbe Blatt, mit dem auch die Kennzahl rechnet.
   · Die Schwere richtet sich nach dem Ausmass, nicht nach der Regelart.
   · Jede gesetzte Schwelle steht im Feld «regel» und ist in den Einstellungen
     änderbar.                                                                */
function befunde(e){
  const S=db.einst,out=[],belegt=new Set();
  const ps=alleProben(e);if(!ps.length)return out;
  const ir=leitProbe(e);
  const o=k=>optVon(ir,k);
  const w=(p,k)=>{const x=p&&p.werte[k];return (x&&!x.unter&&x.wert!=null)?x.wert:null};
  const j=e.proben.jung,a=e.proben.alt,mi=e.proben.misch;
  const add=x=>{out.push(Object.assign({id:x.art+':'+(x.param||'-'),ausmass:0},x))};
  const einh=k=>einheit(k);
  const nOpt=(k,i)=>{const x=o(k);return x&&x[i]!=null?nz(x[i]):'–'};
  /* höchstes Verhältnis über alle Blattalter, mit Angabe wo */
  const maxVerh=(x,y)=>{
    let b=null;
    for(const p of ps){const v=verh(p,x,y);if(v!=null&&(b==null||v>b.v))b={v,p}}
    return b;
  };

  /* ── R1 · Stickstoff als Leitbefund ──────────────────── */
  if(o('NO3')){
    const n3=ps.map(p=>({p,v:w(p,'NO3')})).filter(x=>x.v!=null);
    if(n3.length&&n3.every(x=>status(x.v,o('NO3'))==='tief')){
      const bel=[`Nitrat ${n3.map(x=>`${x.p.blattalter||'Probe'} ${nz(x.v)}`).join(', ')} ${einh('NO3')} · Optimum ab ${nOpt('NO3',0)}`];
      const zu=ps.map(p=>({p,v:w(p,'Zucker')})).filter(x=>x.v!=null&&o('Zucker')&&status(x.v,o('Zucker'))==='hoch');
      if(zu.length)bel.push(`Zucker gleichzeitig über Optimum: ${zu.map(x=>nz(x.v,2)).join(', ')} % (Optimum bis ${nOpt('Zucker',1)}) – Assimilate stauen sich, weil sie ohne Stickstoff nicht in Wachstum umgesetzt werden`);
      const ec=w(j||ir,'EC');
      if(ec!=null&&o('EC')&&status(ec,o('EC'))==='tief')bel.push(`Saft-EC ${nz(ec,1)} mS/cm unter Optimum (ab ${nOpt('EC',0)}) – bestätigt die tiefe Gesamtbeladung`);
      const sub=substratZu(e.satz,e.datum);
      const nmin=sub&&sub.werte.sub_Nmin?sub.werte.sub_Nmin.wert:null;
      if(nmin!=null)bel.push(`Substrat vom ${fmt(sub.datum)}: Nmin ${nz(nmin)} mg/l – ${nmin<30?'auch im Substrat ist wenig mineralisierter Stickstoff vorhanden, das Angebot fehlt':'im Substrat liegt Stickstoff bereit, er kommt aber nicht in der Pflanze an'}`);
      add({art:'stickstoff',schwere:'hoch',param:'NO3',ausmass:1,titel:'Stickstoff limitiert das Wachstum',belege:bel,
        ursache:'Nitrat ist der Sofortvorrat der Pflanze. Ist er in allen Blattaltern leer, kommt zu wenig pflanzenverfügbarer Stickstoff nach – bei organischer Düngung heisst das meist, dass die Mineralisierung nicht mit dem Bedarf mithält.',
        tun:nmin!=null&&nmin<30
          ? 'Stickstoffzufuhr erhöhen oder auf einen schneller verfügbaren Dünger wechseln. Weil auch das Substrat wenig Nmin führt, fehlt das Angebot und nicht die Aufnahme.'
          : 'Stickstoffzufuhr erhöhen oder auf einen schneller verfügbaren Dünger wechseln. Substrattemperatur mitprüfen: die Mineralisierung läuft temperaturabhängig, bei 15 °C liefert dieselbe Grunddüngung deutlich weniger als bei 25 °C.',
        regel:'Nitrat in allen gemessenen Proben unter Optimum'});
      ['NO3','N_gesamt','N_aus_NO3','Zucker','EC'].forEach(k=>belegt.add(k));
    }
  }

  /* ── R2 · Ammonium verdrängt Kalium ──────────────────── */
  /* Der agronomisch wichtigste Zusammenhang bei organischer Düngung im
     Umlaufsystem: beide Werte stammen aus derselben Probe, der Befund ist
     damit vom Kulturalter unabhängig. */
  {
    const nh=ps.map(p=>({p,v:w(p,'NH4')})).filter(x=>x.v!=null&&o('NH4')&&status(x.v,o('NH4'))==='hoch');
    const bk=e.bew.K;
    if(nh.length&&bk&&!bk.fehlt&&!bk.ok&&bk.st==='tief'){
      const hoch=nh.sort((x,y)=>y.v-x.v)[0];
      const kw=bk.werte.filter(x=>x.st!=null).sort((x,y)=>x.wert-y.wert)[0];
      add({art:'nh4k',schwere:'hoch',param:'K',ausmass:Math.max(bk.ausmass,ausmass(hoch.v,o('NH4'))),
        titel:'Ammoniumüberschuss bremst die Kaliumaufnahme',
        belege:[`Ammonium ${hoch.p.blattalter||'Probe'} ${nz(hoch.v)} ${einh('NH4')} · Optimum bis ${nOpt('NH4',1)}`,
                `Kalium ${kw.blattalter} ${nz(kw.wert)} ${einh('K')} · Optimum ab ${kw.opt&&kw.opt[0]!=null?nz(kw.opt[0]):'–'}`],
        ursache:'Ammonium und Kalium konkurrieren an denselben Aufnahmestellen der Wurzel. Solange Ammonium im Überschuss anfällt – bei organischer Düngung typischerweise schubweise nach der Mineralisierung – bleibt Kalium tief, auch wenn im Substrat genug davon bereitsteht. Zusätzlich versauert die Ammoniumaufnahme die Wurzelzone.',
        tun:'Nicht einfach mehr Kalium geben. Zuerst die Stickstoffform prüfen: langsamer freisetzenden Dünger oder kleinere, häufigere Gaben, damit weniger Ammonium auf einmal anfällt. Rücklauf-pH beobachten – fällt er, bestätigt das die Ammoniumaufnahme. Erst danach Kalium anheben.',
        regel:'Ammonium über Optimum und Kalium unter Optimum in derselben Erhebung'});
      belegt.add('NH4');belegt.add('K');
    }
  }

  /* ── R3 · Stickstoffform ─────────────────────────────── */
  if(!belegt.has('NH4')){
    const r=maxVerh('NH4','NO3');
    if(r&&r.v>S.nh4no3){
      const n3=w(r.p,'NO3'),tief=o('NO3')&&status(n3,o('NO3'))==='tief';
      add({art:'stickstoffform',schwere:tief?'mittel':'info',param:'NH4',ausmass:Math.min(1,r.v/(S.nh4no3*4)),
        titel:'Ammonium dominiert die Stickstoffform',
        belege:[`${r.p.blattalter||'Probe'}: NH4 ${nz(w(r.p,'NH4'))} zu NO3 ${nz(n3)} ${einh('NO3')} · Verhältnis ${nz(r.v,2)}`],
        ursache:'Bei organischer Düngung fällt Ammonium schubweise an, während Nitrat erst über die Mineralisierung nachkommt. Ammonium konkurriert mit Kalium, Calcium und Magnesium um die Aufnahme und versauert die Wurzelzone.',
        tun:'Kationenversorgung im Auge behalten. Fällt gleichzeitig der Rücklauf-pH, spricht das für Ammoniumaufnahme – dann kleinere, häufigere Gaben statt einzelner Schübe.',
        regel:`NH4/NO3 über ${nz(S.nh4no3,2)}`});
      belegt.add('NH4');
    }
  }
  /* Ammoniumüberschuss auch ohne tiefes Nitrat melden */
  if(!belegt.has('NH4')&&o('NH4')){
    const h=ps.map(p=>({p,v:w(p,'NH4')})).filter(x=>x.v!=null&&status(x.v,o('NH4'))==='hoch');
    if(h.length){
      const t=h.sort((x,y)=>y.v-x.v)[0];
      add({art:'ueberschuss',schwere:schwereVon(ausmass(t.v,o('NH4'))),param:'NH4',ausmass:ausmass(t.v,o('NH4')),
        titel:'Ammonium über Optimum',
        belege:[`${t.p.blattalter||'Probe'} ${nz(t.v)} ${einh('NH4')} · Optimum bis ${nOpt('NH4',1)}`],
        ursache:'Ein Ammoniumüberschuss bei ausreichendem Nitrat entsteht typischerweise kurz nach einer organischen Kopfdüngung im warmen Gewächshaus. Er konkurriert mit Kalium, Calcium und Magnesium und versauert die Wurzelzone.',
        tun:'Beobachten, ob die Kationen in der nächsten Erhebung nachgeben. Kleinere, häufigere Gaben verteilen den Schub.',
        regel:'Ammonium über Optimum'});
      belegt.add('NH4');
    }
  }

  /* ── R4 · Kationenverhältnisse, einmal je Erhebung ───── */
  const kmg=maxVerh('K','Mg'),kca=maxVerh('K','Ca');
  if(kmg&&kmg.v>S.kMg&&e.bew.Mg&&!e.bew.Mg.fehlt&&e.bew.Mg.st==='tief'&&!belegt.has('Mg')){
    add({art:'kmg',schwere:'mittel',param:'Mg',ausmass:e.bew.Mg.ausmass,
      titel:'Magnesium wird durch Kalium verdrängt',
      belege:[`${kmg.p.blattalter||'Probe'}: K/Mg = ${nz(kmg.v,1)} bei Magnesium ${nz(w(kmg.p,'Mg'))} ${einh('Mg')} unter Optimum (ab ${nOpt('Mg',0)})`],
      ursache:'Kalium und Magnesium konkurrieren an denselben Aufnahmestellen der Wurzel. Steht das Verhältnis so weit auf der Kaliumseite, bleibt eine Magnesiumgabe weitgehend wirkungslos.',
      tun:'Kaliumanteil senken oder beides gemeinsam anpassen, statt nur Magnesium nachzulegen.',
      regel:`K/Mg über ${nz(S.kMg,1)} bei Magnesium unter Optimum`});
    belegt.add('Mg');
  }
  if(kca&&kca.v>S.kCa&&e.bew.Ca&&!e.bew.Ca.fehlt&&e.bew.Ca.st==='tief'&&!belegt.has('Ca')){
    add({art:'kca',schwere:'mittel',param:'Ca',ausmass:e.bew.Ca.ausmass,
      titel:'Calciumaufnahme durch Kalium gebremst',
      belege:[`${kca.p.blattalter||'Probe'}: K/Ca = ${nz(kca.v,2)} bei Calcium ${nz(w(kca.p,'Ca'))} ${einh('Ca')} unter Optimum (ab ${nOpt('Ca',0)})`],
      ursache:'Kalium konkurriert mit Calcium um die Aufnahme. Zusammen mit einem schwachen Transpirationsstrom ist das der übliche Weg zu Blattrandschäden.',
      tun:'Kaliumanteil prüfen und das Klima stabilisieren – Calcium kommt nur mit dem Transpirationsstrom in die Spitze.',
      regel:`K/Ca über ${nz(S.kCa,2)} bei Calcium unter Optimum`});
    belegt.add('Ca');
  }

  /* ── R5 · Mangan und Substrat-pH ─────────────────────── */
  /* Liest jedes vorhandene Blattalter, nicht nur das Jungblatt – bei einer
     Mischprobe schwieg diese Regel früher ganz. */
  {
    const mn=ps.map(p=>({p,v:w(p,'Mn')})).filter(x=>x.v!=null&&o('Mn')&&status(x.v,o('Mn'))!=='ok'&&!istRand(status(x.v,o('Mn'))));
    if(mn.length&&!belegt.has('Mn')){
      const t=mn.sort((x,y)=>y.v-x.v)[0],hoch=status(t.v,o('Mn'))==='hoch';
      const sub=substratZu(e.satz,e.datum);
      const ph=sub&&sub.werte.sub_pH?sub.werte.sub_pH.wert:null;
      const bel=[`${t.p.blattalter||'Probe'} ${nz(t.v,2)} ${einh('Mn')} · Optimum ${nOpt('Mn',0)}–${nOpt('Mn',1)}`];
      let passt=false;
      if(ph!=null){
        bel.push(`Substrat vom ${fmt(sub.datum)}: pH ${nz(ph,1)}`);
        passt=(hoch&&ph<5.5)||(!hoch&&ph>6.8);
        if(passt)bel.push(hoch?'pH unter 5,5 macht Mangan stark verfügbar – das erklärt den hohen Blattwert'
                              :'pH über 6,8 legt Mangan fest – das erklärt den tiefen Blattwert trotz Vorrat im Substrat');
      }
      add({art:hoch?'ueberschuss':'mangel',schwere:passt?'mittel':schwereVon(ausmass(t.v,o('Mn'))),param:'Mn',
        ausmass:ausmass(t.v,o('Mn')),
        titel:hoch?'Mangan über Optimum':'Mangan unter Optimum',
        belege:bel,
        ursache:'Die Manganverfügbarkeit hängt stark am Wurzel-pH: unter pH 5,5 steigt sie bis zur Toxizität, über pH 6,8 fällt Mangan aus und wird knapp, obwohl im Substrat genug vorhanden ist.',
        tun:ph==null?'Substrat-pH messen – ohne ihn lässt sich nicht unterscheiden, ob es an der Menge oder an der Verfügbarkeit liegt.'
           :passt?(hoch?'Substrat-pH anheben. Eine Reduktion der Manganzufuhr hilft hier nicht, weil nicht die Menge, sondern die Verfügbarkeit das Problem ist.'
                       :'Substrat-pH senken, damit das vorhandene Mangan wieder verfügbar wird.')
           :'Substrat-pH liegt im üblichen Bereich – die Ursache liegt eher bei der Zufuhr als bei der Verfügbarkeit.',
        regel:'Mangan ausserhalb des Optimums, mit Substrat-pH als Kontext'});
      belegt.add('Mn');
    }
  }

  /* ── R6 · Ballastionen ───────────────────────────────── */
  /* Natrium und Chlorid werden nie zugedüngt. Nur «zu hoch» ist ein Befund;
     tiefe Werte sind im Umlaufsystem der erwünschte Zustand. */
  for(const k of BALLAST){
    if(!o(k))continue;
    const h=ps.map(p=>({p,v:w(p,k)})).filter(x=>x.v!=null&&status(x.v,o(k))==='hoch');
    if(!h.length)continue;
    const t=h.sort((x,y)=>y.v-x.v)[0];
    const gw=db.analysen.filter(x=>x.typ==='giesswasser'&&x.datum).sort((x,y)=>y.datum.localeCompare(x.datum))[0];
    const gwv=gw&&gw.werte['gw_'+k]?gw.werte['gw_'+k].wert:null;
    const bel=[`${h.map(x=>`${x.p.blattalter||'Probe'} ${nz(x.v)}`).join(', ')} ${einh(k)} · Optimum bis ${nOpt(k,1)}`];
    if(gwv!=null)bel.push(`Giesswasser vom ${fmt(gw.datum)}: ${nz(gwv)} mg/l ${NAME[k]} – ${gwv>50?'die Quelle liegt im Giesswasser selbst':'das Giesswasser ist unauffällig, die Anreicherung entsteht im Umlauf'}`);
    add({art:'ballast',schwere:schwereVon(ausmass(t.v,o(k))),param:k,ausmass:ausmass(t.v,o(k)),
      titel:`${NAME[k]} reichert sich an`,belege:bel,
      ursache:`${NAME[k]} wird von der Pflanze kaum aufgenommen. Im Ebbe-Flut-Kreislauf bleibt zurück, was nicht aufgenommen wird, und reichert sich Gabe für Gabe an. Der Rücklauf-EC steigt dadurch, ohne dass mehr Nährstoff im Wasser ist.`,
      tun:'Giesswasser analysieren und den Rücklauf-EC im Reiter «Substrat & Wasser» verfolgen. Bestätigt sich die Anreicherung, den Tank ablassen und neu ansetzen – weniger zu düngen wäre genau die falsche Antwort, weil es den Nährstoffanteil senkt und den Ballastanteil unberührt lässt.',
      regel:`${NAME[k]} über Optimum`});
    belegt.add(k);
  }

  /* ── R7 · Weiches Gewebe (ausdrücklich Hypothese) ────── */
  if(!belegt.has('Ca')){
    const p=j||mi;
    const N=w(p,'N_gesamt'),Ca=w(p,'Ca');
    if(N!=null&&Ca!=null&&o('Ca')&&o('N_gesamt')&&status(Ca,o('Ca'))==='tief'&&status(N,o('N_gesamt'))!=='tief')
      add({art:'weich',schwere:'info',param:'Ca',ausmass:ausmass(Ca,o('Ca')),hypothese:true,
        titel:'Weiches Gewebe – erhöhter Infektionsdruck',
        belege:[`${p.blattalter||'Probe'}: Stickstoff gesamt ${nz(N)} ${einh('N_gesamt')} nicht tief, Calcium ${nz(Ca)} ${einh('Ca')} unter Optimum (ab ${nOpt('Ca',0)})`],
        ursache:'Calcium vernetzt die Pektine der Zellwand. Viel Stickstoff bei knappem Calcium ergibt dünnwandiges, saftreiches Gewebe. Dass daraus bei Basilikum mehr Mehltau folgt, ist plausibel, aber mit eurer Datenlage nicht belegt.',
        tun:'Vor der nächsten Stickstofferhöhung Calcium und Klima stabilisieren.',
        regel:'Calcium unter Optimum bei nicht tiefem Gesamtstickstoff'});
  }

  /* ── R8 · Einzelbefunde je Nährstoff ─────────────────── */
  const rand=[];
  for(const k of kern()){
    if(belegt.has(k))continue;
    const b=e.bew[k];if(!b||b.fehlt)continue;
    if(b.ok){if(b.rand)rand.push(b);continue}
    const ok=optVon(j||a||ir,k);
    const vj=w(j,k),va=w(a,k),m=MOBIL[k]||'unbekannt';
    const stelle=b.werte.filter(x=>x.st!=null).sort((x,y)=>y.st==='tief'?1:-1);
    const zeig=b.werte.filter(x=>x.st!=null).map(x=>`${x.blattalter} ${nz(x.wert)}`).join(', ');
    const zeigMass=(b.mass||b.werte).filter(x=>x.st!=null).map(x=>`${x.blattalter} ${nz(x.wert)}`).join(', ');
    const sw=schwereVon(b.ausmass);

    if(b.st==='hoch'){
      const wo=(b.hochAn&&b.hochAn.length)?b.hochAn.join(' und ')+'blatt':(b.art==='beide'?'Jung- und Altblatt':b.art+'blatt');
      add({art:'ueberschuss',schwere:sw,param:k,ausmass:b.ausmass,
        titel:`${NAME[k]} über Optimum`,
        belege:[`${zeig} ${einh(k)} · Optimum bis ${nOpt(k,1)}`,`über dem Optimum am ${wo} (${m})`],
        ursache:'In einem Umlaufsystem ist Anreicherung der wahrscheinlichere Fehler als Mangel: was die Pflanze nicht aufnimmt, bleibt im Kreislauf und kommt bei der nächsten Gabe dazu. Ein Überschuss verdrängt zudem konkurrierende Kationen an der Wurzel.',
        tun:`Zufuhr von ${NAME[k]} zurücknehmen und prüfen, ob der Rücklauf-EC bei gleicher Dosierung steigt. Bei anhaltendem Überschuss den Tank ablassen.`,
        regel:`${NAME[k]} über Optimum am massgeblichen Blatt`});
      continue;
    }
    /* Verlagerung: gilt jetzt für ALLE phloemmobilen Nährstoffe. Früher hatten
       nur sechs davon eine Auffangregel, der Rest fiel stillschweigend durch. */
    if(m==='mobil'&&vj!=null&&va!=null&&va>0&&vj/va>S.verlagerung&&istOk(status(vj,ok))){
      add({art:'verlagerung',schwere:'mittel',param:k,ausmass:b.ausmass,
        titel:`${NAME[k]}: das Altblatt wird ausgeräumt`,
        belege:[`alt ${nz(va)} ${einh(k)} unter Optimum (ab ${nOpt(k,0)}), jung ${nz(vj)} noch im Sollbereich · Verhältnis ${nz(vj/va,2)}`],
        ursache:`${NAME[k]} ist im Phloem beweglich. Bei Knappheit zieht die Pflanze den Nährstoff aus alten Blättern in die Spitze. Das Jungblatt sieht darum noch gut aus, während die Versorgung schon nicht mehr reicht.`,
        tun:'Zufuhr erhöhen, solange das Jungblatt noch im Optimum liegt – das ist das Zeitfenster für eine Korrektur ohne Qualitätsverlust.',
        regel:`${NAME[k]}: Altblatt unter Optimum und jung/alt über ${nz(S.verlagerung,2)}`});
      continue;
    }
    if(m==='immobil'&&vj!=null&&status(vj,ok)==='tief'&&(va==null||va>=vj*0.9)){
      add({art:'transport',schwere:sw,param:k,ausmass:b.ausmass,
        titel:`${NAME[k]}: die Versorgung der Spitze stockt`,
        belege:[`jung ${nz(vj)} ${einh(k)} unter Optimum (ab ${nOpt(k,0)})${va!=null?`, alt ${nz(va)} und damit nicht tiefer`:''}`],
        ursache:`${NAME[k]} wird nicht verlagert und kommt nur mit dem Transpirationsstrom ins junge Blatt. Steht dieser Strom still – hohe Luftfeuchte, Nacht, zu hoher EC, zu selten geflutet – fehlt der Nährstoff in der Spitze, obwohl im Tank genug davon ist.`,
        tun:'Zuerst Klima und Bewässerung prüfen: Entfeuchtung nachts, Luftbewegung, Flutrhythmus, EC im Rücklauf. Zudüngen hilft nur, wenn auch das Altblatt tief liegt.',
        regel:`${NAME[k]}: Jungblatt unter Optimum bei mindestens gleich hohem Altblatt`});
      continue;
    }
    add({art:'mangel',schwere:sw,param:k,ausmass:b.ausmass,
      titel:`${NAME[k]} unter Optimum`,
      belege:[`${zeigMass} ${einh(k)} · Optimum ab ${nOpt(k,0)}`,`beurteilt am ${b.art==='beide'?'Jung- und Altblatt':b.art+'blatt'} (${m}) – dort zeigt sich Knappheit zuerst`],
      ursache:m==='mobil'?'Kein Verlagerungsmuster: auch die Reserve in den alten Blättern ist aufgebraucht. Das Angebot reicht nicht.'
        :m==='immobil'?'Beide Blattalter sind tief – anders als bei einem reinen Transportproblem fehlt der Nährstoff auch dort, wo er einmal angekommen ist.'
        :'Beide Blattalter liegen unter dem Optimum. Das Angebot an der Wurzel reicht nicht, oder die Aufnahme ist blockiert.',
      tun:m==='immobil'?`Klima und EC prüfen, danach die Zufuhr von ${NAME[k]} erhöhen.`:`Zufuhr von ${NAME[k]} erhöhen und in der nächsten Erhebung kontrollieren.`,
      regel:`${NAME[k]} unter Optimum am massgeblichen Blatt, ohne Verlagerungsmuster`});
  }
  /* Randlagen gebündelt statt als Einzelalarme */
  if(rand.length)
    add({art:'rand',schwere:'info',param:null,ausmass:0,
      titel:`${rand.length} Nährstoff${rand.length>1?'e liegen':' liegt'} knapp am Rand des Optimums`,
      belege:[rand.map(b=>{const x=b.werte.find(y=>istRand(y.st))||b.werte[0];
        return `${NAME[b.k]} ${x.blattalter} ${nz(x.wert)} (${STTEXT[x.st]})`}).join(' · ')],
      ursache:`Diese Werte liegen innerhalb von ${nz(db.einst.toleranz,0)} % der Optimumgrenze. Das ist im Bereich der Messgenauigkeit einer Blattsaftanalyse und zählt darum als versorgt.`,
      tun:'Nicht handeln, aber in der nächsten Erhebung im Auge behalten. Wandert ein Wert weiter, wird daraus ein eigener Befund.',
      regel:`innerhalb von ${nz(db.einst.toleranz,0)} % der Optimumgrenze (Annahme, in den Einstellungen änderbar)`});

  const rang={hoch:0,mittel:1,info:2};
  return out.sort((x,y)=>rang[x.schwere]-rang[y.schwere]||(y.ausmass||0)-(x.ausmass||0));
}
/* Welcher Befund ist wiederholt aufgetreten? Bei wenigen Analysen ist das
   die belastbarere Frage als ein Einzelbefund. */
function wiederkehrend(){
  const erh=erhebungen(),m=new Map();
  for(const e of erh)for(const f of befunde(e)){
    if(f.schwere==='info')continue;
    if(!m.has(f.id))m.set(f.id,{id:f.id,titel:f.titel,param:f.param,n:0,wann:[]});
    const x=m.get(f.id);x.n++;x.wann.push({datum:e.datum,satz:e.satz});
  }
  return [...m.values()].filter(x=>x.n>1).sort((a,b)=>b.n-a.n);
}

/* ══════════ 5b · Drei Auswertungen, die die Leitfragen beantworten ══════
   Sie sind bewusst klein und rechnen nur mit dem, was da ist.             */

/* ── Eingangsbilanz: welches Element hat überhaupt eine Quelle? ──────────
   Die Frage klingt banal und ist es nicht. Ein Element, das kein Produkt
   liefert, kann im Blatt nicht auftauchen – dann braucht sein Mangel keine
   weitere Erklärung. */
function eingangsbilanz(){
  const gw=db.analysen.filter(a=>a.typ==='giesswasser'&&a.datum)
    .sort((a,b)=>b.datum.localeCompare(a.datum));
  return BILANZ_EL.map(el=>{
    const quellen=[];
    for(const k of Object.keys(db.produkte||{})){
      const pr=db.produkte[k];
      let anteil=null;
      for(const q of el.quellen)if(pr.gehalt&&pr.gehalt[q]!=null){anteil=pr.gehalt[q];break}
      if(anteil==null||anteil<=0)continue;
      const gaben=db.ereignisse.filter(e=>e.mittel===k&&e.menge!=null&&e.datum)
        .sort((a,b)=>b.datum.localeCompare(a.datum));
      quellen.push({produkt:k,name:pr.name,anteil,gaben:gaben.length,zuletzt:gaben.length?gaben[0].datum:null});
    }
    /* Was im Wasser gemessen wurde – Rücklauf, nicht Rohwasser */
    let imWasser=null,wasserDatum=null,wasserUnter=false;
    for(const a of gw){
      let sum=null;
      for(const k of el.gw){const w=a.werte[k];if(w&&w.wert!=null){sum=(sum||0)+w.wert;if(w.unter)wasserUnter=true}}
      if(sum!=null){imWasser=sum;wasserDatum=a.datum;break}
    }
    return {el,quellen,imWasser,wasserDatum,wasserUnter,
      ohneQuelle:quellen.length===0,
      nieGegeben:quellen.length>0&&quellen.every(q=>q.gaben===0)};
  });
}

/* ── Rangliste der Mängel über alle Erhebungen ───────────────────────────
   Über ALLE Parameter, nicht nur die der Kennzahl – die Frage lautet «woran
   fehlt es wirklich», und die Antwort darf nicht von einer Auswahl abhängen,
   die jemand vor Monaten getroffen hat.
   Sortiert nach Anteil ausserhalb mal mittlerem Abstand: ein Nährstoff, der
   immer knapp danebenliegt, steht unter einem, der immer weit danebenliegt. */
function rangliste(){
  const erh=erhebungen();
  const params=[...new Set(erh.flatMap(e=>alleProben(e).flatMap(p=>Object.keys(p.werte))))]
    .filter(k=>NAME[k]&&k!=='K/Ca');
  const out=[];
  for(const k of params){
    const punkte=[];
    for(const e of erh){
      const m=massgebliche(e,k);
      if(!m)continue;
      const pr=m.ps[0],w=pr.werte[k];
      if(!w||w.wert==null||w.unter)continue;
      const o=optVon(pr,k);
      const st=status(w.wert,o,w.unter);
      if(st==null)continue;
      punkte.push({datum:e.datum,satz:e.satz,wert:w.wert,st,
        abstand:ausmass(w.wert,o),lage:lage(w.wert,o),blatt:m.art});
    }
    if(punkte.length<2)continue;
    punkte.sort((a,b)=>a.datum.localeCompare(b.datum));
    const daneben=punkte.filter(p=>!istOk(p.st));
    const tief=daneben.filter(p=>p.st==='tief').length;
    const hoch=daneben.filter(p=>p.st==='hoch').length;
    const anteil=daneben.length/punkte.length;
    const schnitt=mittel(daneben.map(p=>p.abstand))||0;
    /* Trend: erstes gegen letztes Drittel, auf der Lage-Skala */
    const n=punkte.length,d=Math.max(1,Math.floor(n/3));
    const frueh=mittel(punkte.slice(0,d).map(p=>p.lage).filter(x=>x!=null));
    const spaet=mittel(punkte.slice(-d).map(p=>p.lage).filter(x=>x!=null));
    const delta=(frueh!=null&&spaet!=null)?spaet-frueh:null;
    out.push({k,n:punkte.length,daneben:daneben.length,anteil,tief,hoch,
      richtung:tief&&hoch?'gemischt':tief?'Mangel':hoch?'Überschuss':'im Rahmen',
      schwere:anteil*Math.min(3,schnitt),schnitt,
      letzter:punkte[punkte.length-1],delta,frueh,spaet,
      blatt:punkte[punkte.length-1].blatt,punkte});
  }
  return out.sort((a,b)=>b.schwere-a.schwere);
}

/* ── Jung gegen Alt ───────────────────────────────────────────────────────
   Das Verhältnis der Blattetagen verrät, ob ein Nährstoff umverteilt wird.
   Bei mobilen Nährstoffen heisst ein hohes Verhältnis: die Pflanze räumt das
   Altblatt aus. Bei immobilen ist ein hohes Verhältnis normal – sie kommen
   im Altblatt nie an. Genau darum entscheidet die Blattetage eines Symptoms
   zwischen Magnesium und Eisen oder Zink. */
function jungAlt(){
  const erh=erhebungen().filter(e=>e.proben.jung&&e.proben.alt);
  const params=[...new Set(erh.flatMap(e=>[...Object.keys(e.proben.jung.werte),...Object.keys(e.proben.alt.werte)]))]
    .filter(k=>NAME[k]&&k!=='K/Ca'&&k!=='pH');
  return params.map(k=>{
    const paare=[];
    for(const e of erh){
      const j=e.proben.jung.werte[k],a=e.proben.alt.werte[k];
      if(!j||!a||j.wert==null||a.wert==null||j.unter||a.unter||!a.wert)continue;
      paare.push({datum:e.datum,satz:e.satz,jung:j.wert,alt:a.wert,v:j.wert/a.wert});
    }
    if(!paare.length)return null;
    const m=mittel(paare.map(p=>p.v));
    const mob=MOBIL[k]||'unbekannt';
    return {k,mob,n:paare.length,mittel:m,paare,
      /* Erwartung aus der Mobilität, nicht aus den Daten */
      erwartet:mob==='mobil'?'um 1 oder darunter':mob==='immobil'?'über 1':'um 1',
      auffaellig:(mob==='mobil'&&m>db.einst.verlagerung)||(mob==='immobil'&&m<0.9)};
  }).filter(Boolean).sort((a,b)=>b.mittel-a.mittel);
}
const pfeil=d=>d==null?'':(d>0.15?'↗':d<-0.15?'↘':'→');
const pfeilText=(d,richtung)=>{
  if(d==null)return 'kein Verlauf erkennbar';
  if(Math.abs(d)<=0.15)return 'unverändert';
  const besser=(richtung==='Mangel'&&d>0)||(richtung==='Überschuss'&&d<0);
  return (d>0?'steigend':'fallend')+(besser?' – Richtung Sollbereich':' – weiter weg vom Sollbereich');
};

/* ══════════ 6 · Diagramme ══════════ */
const FARBEN=['#2C7A4B','#BE6F16','#3A6DA6','#7A4E8C','#A2432E','#3F7F7A','#8A7118','#556B2F'];
const svgAuf=(w,h,t)=>`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(t)}" style="display:block">`;
const leerBox=(box,t)=>{box.innerHTML=`<p class="muted small" style="padding:18px 0">${esc(t)}</p>`};

/* ── Sofort-Tooltip ──────────────────────────────────────
   Der eingebaute <title>-Tooltip der Browser erscheint erst nach rund einer
   Sekunde, laesst sich nicht gestalten und bricht lange Texte hart um.
   Stattdessen traegt jedes anfassbare Element data-tipp mit fertigem,
   bereits maskiertem HTML; ein einziger Zeiger-Beobachter zeigt es an. */
let TIPP=null;
function tippKasten(){
  if(!TIPP){TIPP=document.createElement('div');TIPP.className='tipp';document.body.appendChild(TIPP)}
  return TIPP;
}
function tippZeigen(html,x,y){
  const t=tippKasten();
  t.innerHTML=html;t.classList.add('an');
  const b=t.getBoundingClientRect();
  let lx=x+14,ly=y+16;
  if(lx+b.width>window.innerWidth-8)lx=x-b.width-14;
  if(lx<8)lx=8;
  if(ly+b.height>window.innerHeight-8)ly=y-b.height-14;
  if(ly<8)ly=8;
  t.style.left=lx+'px';t.style.top=ly+'px';
}
const tippWeg=()=>{if(TIPP)TIPP.classList.remove('an')};
/* Ein Beobachter fuer das ganze Dokument statt einer Bindung je Diagramm:
   ueberlebt jedes Neuzeichnen, weil er nicht an den Elementen haengt. */
document.addEventListener('mousemove',ev=>{
  const t=ev.target&&ev.target.closest?ev.target.closest('[data-tipp]'):null;
  if(!t)return tippWeg();
  tippZeigen(t.dataset.tipp,ev.clientX,ev.clientY);
},{passive:true});
document.addEventListener('mouseleave',tippWeg);
window.addEventListener('scroll',tippWeg,{passive:true});
document.addEventListener('click',ev=>{
  const t=ev.target&&ev.target.closest?ev.target.closest('[data-tipp]'):null;
  if(t&&t.dataset.tun===undefined)tippZeigen(t.dataset.tipp,ev.clientX,ev.clientY);
});

/* ── Markierungsformen ───────────────────────────────────
   Die Farbe steht fuer den Naehrstoff, die Form fuer die zweite Dimension
   (Blattalter bzw. Entnahmestelle). Wer nur die Farbe unterscheiden kann,
   liest die Form – und umgekehrt. */
const FORMEN=['kreis','raute','quadrat','dreieck','kreuz','ring'];
function marke(form,x,y,r,farbe,deckung){
  const o=deckung!=null?deckung:1,f=`fill="${farbe}" opacity="${o}"`;
  switch(form){
    case 'raute':   return `<polygon points="${x},${y-r*1.25} ${x+r*1.15},${y} ${x},${y+r*1.25} ${x-r*1.15},${y}" ${f}/>`;
    case 'quadrat': return `<rect x="${x-r*0.92}" y="${y-r*0.92}" width="${r*1.84}" height="${r*1.84}" rx="1" ${f}/>`;
    case 'dreieck': return `<polygon points="${x},${y-r*1.3} ${x+r*1.2},${y+r*0.85} ${x-r*1.2},${y+r*0.85}" ${f}/>`;
    case 'kreuz':   return `<path d="M${x-r} ${y-r}L${x+r} ${y+r}M${x-r} ${y+r}L${x+r} ${y-r}" stroke="${farbe}" stroke-width="${r*0.75}" stroke-linecap="round" fill="none" opacity="${o}"/>`;
    case 'ring':    return `<circle cx="${x}" cy="${y}" r="${r*0.95}" fill="#fff" stroke="${farbe}" stroke-width="${r*0.62}" opacity="${o}"/>`;
    default:        return `<circle cx="${x}" cy="${y}" r="${r}" ${f}/>`;
  }
}
/* Legende als Bedienelement: ein Klick blendet eine Reihe aus und wieder ein. */
function legende(serien,aus,zusatz){
  const t=serien.map(se=>`<span class="pos${aus&&aus.has(se.id)?' aus':''}" data-tun="diagSerie" data-id="${esc(se.id)}"
      title="Anklicken blendet diese Reihe aus oder wieder ein">
    <svg width="16" height="14" viewBox="0 0 16 14">${marke(se.form,8,7,5,se.farbe)}</svg>${esc(se.name)}</span>`).join('');
  return t+(zusatz?`<span class="muted">${zusatz}</span>`:'');
}
/* Ausgeblendete Reihen: gehoeren zum Diagramm, nicht zu den Daten.
   Werden beim Reiterwechsel geleert, ueberleben aber jedes Neuzeichnen. */
let diagAus=new Set();
AKTION.diagSerie=d=>{diagAus.has(d.id)?diagAus.delete(d.id):diagAus.add(d.id);diagFrisch()};
AKTION.diagPunkt=d=>{if(DIAG&&DIAG.klick)DIAG.klick(d.id)};

/* ── Punktdiagramm ───────────────────────────────────────
   Punkte sind die Messung, eine Linie ist eine Behauptung ueber das, was
   zwischen zwei Messungen geschah. Darum sind Punkte die Vorgabe und Linien
   zuschaltbar – und selbst dann nie ueber eine Satzgrenze hinweg.
   o = {serien:[{id,name,farbe,form,punkte:[{x,y,xtext,tipp,kennung,gruppe}]}],
        yTyp:'wert'|'lage', band, bandLabel, xTyp:'datum'|'zahl', xLabel, yLabel,
        ereignisse, linien, hoehe, aufKlick} */
function chartPunkte(box,o){
  const {band,bandLabel='Optimum',xTyp='datum',xLabel='',yLabel='',ereignisse=[],hoehe=320,linien=false,aufKlick=null}=o;
  const lageSkala=o.yTyp==='lage';
  const serien=(o.serien||[]).filter(se=>se.punkte&&se.punkte.length&&!diagAus.has(se.id));
  const pts=serien.flatMap(se=>se.punkte);
  if(!pts.length)return leerBox(box,(o.serien||[]).length?'Alle Reihen sind ausgeblendet – in der Legende wieder einblenden.':'Keine Werte für diese Auswahl.');
  /* Fotospur: eine eigene Zeile unter der Messwertflaeche. Sie bekommt Platz
     im unteren Rand, damit sie keinen Messpunkt verdeckt. */
  const spur=(xTyp==='datum'&&o.fotos&&o.fotos.length)?o.fotos:null;
  /* Beigabe-Spannen: nur auf der Zeitachse, als eigene Zeilen im unteren Rand. */
  const spannen=(xTyp==='datum'&&o.spannen&&o.spannen.length)?o.spannen:[];
  /* Logbuch: eine eigene Zeile unter den Datumsmarken. */
  const lbH=(xTyp==='datum'&&ereignisse.length)?24:0;
  const W=Math.max(box.clientWidth||820,540),ml=lageSkala?100:66,mr=22,mt=26;
  /* Die Zeitachse reicht so weit wie die Messungen – und so weit wie die
     Beigabe-Spannen: eine Gabe nach der letzten Analyse gehört ins Bild,
     gerade weil noch keine Analyse dazu vorliegt. */
  const xs=pts.map(p=>p.x).concat(spannen.flatMap(sp=>[sp.x0,sp.x1]));
  let x0=Math.min(...xs),x1=Math.max(...xs);
  if(x0===x1){const d=xTyp==='datum'?6048e5:1;x0-=d;x1+=d}
  const sp=(x1-x0)*0.07;x0-=sp;x1+=sp;
  const X=v=>ml+(v-x0)/((x1-x0)||1)*(W-ml-mr);
  const SZ=spannenZeilen(spannen,X,x0,x1,W-4);
  const spH=SZ.n?10+SZ.n*BALKEN_ZEILE:0;
  const H=hoehe+(spur?30:0)+spH+lbH,mb=48+(spur?30:0)+spH+lbH;
  let y0,y1;
  if(lageSkala){y0=0;y1=3}
  else{
    const ys=pts.map(p=>p.y);
    y0=Math.min(...ys,band&&band[0]!=null?band[0]:Infinity);
    y1=Math.max(...ys,band&&band[1]!=null?band[1]:-Infinity);
    if(!isFinite(y0))y0=Math.min(...ys);
    if(!isFinite(y1))y1=Math.max(...ys);
    const pad=((y1-y0)||Math.abs(y1)||1)*0.14;y0-=pad;y1+=pad;
    if(y0>0&&y0<pad*3)y0=0;
  }
  const Y=v=>mt+(1-(v-y0)/((y1-y0)||1))*(H-mt-mb);

  /* Punkte auf derselben Senkrechten auffaechern, damit Proben vom selben
     Tag sichtbar nebeneinander stehen statt sich zu verdecken. */
  const spalten=new Map();
  serien.forEach(se=>se.punkte.forEach(p=>{
    const k=Math.round(X(p.x)*2);
    if(!spalten.has(k))spalten.set(k,[]);
    spalten.get(k).push({se,p});
  }));
  const lage2=new Map();
  for(const gr of spalten.values()){
    const n=gr.length,schritt=n>4?3.4:4.6;
    gr.forEach((g,i)=>lage2.set(g.p,{x:X(g.p.x)+(n>1?(i-(n-1)/2)*schritt:0),y:Y(g.p.y)}));
  }
  const P=p=>lage2.get(p)||{x:X(p.x),y:Y(p.y)};

  let s=svgAuf(W,H,xLabel||'Diagramm');
  if(lageSkala){
    s+=`<rect x="${ml}" y="${Y(3)}" width="${W-ml-mr}" height="${Y(2)-Y(3)}" fill="#FBEEDC"/>`;
    s+=`<rect x="${ml}" y="${Y(2)}" width="${W-ml-mr}" height="${Y(1)-Y(2)}" fill="#E3F0E1"/>`;
    s+=`<rect x="${ml}" y="${Y(1)}" width="${W-ml-mr}" height="${Y(0)-Y(1)}" fill="#FBEEDC"/>`;
    s+=`<text x="${ml-8}" y="${(Y(3)+Y(2))/2+4}" text-anchor="end" font-size="11" fill="#BE6F16">über Optimum</text>`;
    s+=`<text x="${ml-8}" y="${(Y(2)+Y(1))/2+4}" text-anchor="end" font-size="11" fill="#2C7A4B">im Optimum</text>`;
    s+=`<text x="${ml-8}" y="${(Y(1)+Y(0))/2+4}" text-anchor="end" font-size="11" fill="#BE6F16">unter Optimum</text>`;
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(2)}" y2="${Y(2)}" stroke="#A8CDA6"/><line x1="${ml}" x2="${W-mr}" y1="${Y(1)}" y2="${Y(1)}" stroke="#A8CDA6"/>`;
  }else{
    if(band&&(band[0]!=null||band[1]!=null)){
      const b1=Y(band[1]!=null?band[1]:y1),b0=Y(band[0]!=null?band[0]:y0);
      s+=`<rect x="${ml}" y="${b1}" width="${W-ml-mr}" height="${Math.max(1,b0-b1)}" fill="#E3F0E1"/>`;
      s+=`<text x="${W-mr-4}" y="${b1+13}" text-anchor="end" font-size="10.5" fill="#2C7A4B">${esc(bandLabel)}</text>`;
    }
    for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);
      s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#EDF1E9"/><text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#697A6C" font-family="JetBrains Mono,monospace">${nz(v)}</text>`}
  }
  if(yLabel)s+=`<text x="${ml}" y="${mt-9}" font-size="10.5" fill="#697A6C">${esc(yLabel)}</text>`;
  let davor=0,danach=0;
  for(const ev of ereignisse){if(ev.x<x0)davor++;else if(ev.x>x1)danach++}
  if(lbH){
    const yL=H-mb+34;
    s+=`<text x="${ml-8}" y="${yL+3.5}" text-anchor="end" font-size="10" fill="#697A6C">Logbuch</text>`;
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${yL}" y2="${yL}" stroke="#EDF1E9"/>`;
    for(const b of logbuchBuendel(ereignisse,X,x0,x1))s+=logbuchMarke(b,yL,mt,yL-6);
  }
  /* Eintraege ausserhalb des Zeitraums gehoeren an die Zeitachse, nicht an
     den oberen Rand – dort stiessen sie mit der Achsenbeschriftung zusammen. */
  const ausserhalb=[davor?`← ${davor} Logbucheintrag${davor>1?'e':''} davor`:'',
                    danach?`${danach} danach →`:''].filter(Boolean).join(' · ');

  /* Linien nur innerhalb einer Gruppe – ueber eine Satzgrenze hinweg waere
     die Verbindung eine Behauptung ueber zwei verschiedene Bestaende. */
  if(linien)for(const se of serien){
    const gr=new Map();
    for(const q of se.punkte){const g=q.gruppe==null?'':String(q.gruppe);if(!gr.has(g))gr.set(g,[]);gr.get(g).push(q)}
    for(const liste of gr.values()){
      if(liste.length<2)continue;
      const sp2=[...liste].sort((a,b)=>a.x-b.x).map(q=>{const c=P(q);return c.x+','+c.y});
      s+=`<polyline fill="none" stroke="${se.farbe}" stroke-width="1.8" opacity=".55" stroke-dasharray="${se.strich||''}" points="${sp2.join(' ')}"/>`;
    }
  }
  let hits='';
  for(const se of serien)for(const q of se.punkte){
    const c=P(q);
    s+=marke(se.form,c.x,c.y,5,se.farbe,q.blass?0.4:1);
    hits+=`<circle class="hit" cx="${c.x}" cy="${c.y}" r="10" data-tipp="${esc(q.tipp||'')}"${
      aufKlick&&q.kennung?` data-tun="diagPunkt" data-id="${esc(q.kennung)}" style="cursor:pointer"`:' style="cursor:help"'}/>`;
  }
  s+=hits;
  /* Achsenbeschriftung: doppelte und zu dicht stehende Marken weglassen */
  let letztX=-1e9;const gesehen=new Set();
  for(const p of [...pts].sort((a,b)=>a.x-b.x)){
    if(!p.xtext||gesehen.has(p.xtext))continue;
    const x=X(p.x);
    if(x-letztX<38)continue;
    gesehen.add(p.xtext);letztX=x;
    s+=`<text x="${x}" y="${H-mb+16}" text-anchor="middle" font-size="10.5" fill="#697A6C">${esc(p.xtext)}</text>`;
  }
  s+=`<text x="${(ml+W-mr)/2}" y="${H-(spur?36:6)}" text-anchor="middle" font-size="10.5" fill="#697A6C">${esc(xLabel)}${ausserhalb?' · '+esc(ausserhalb):''}</text>`;
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" stroke="#141D17"/>`;
  if(SZ.n){
    const spO=H-mb+24+lbH;
    s+=`<text x="${ml-8}" y="${spO+15}" text-anchor="end" font-size="10.5" font-weight="600" fill="#4F5E53">Beigaben</text>`;
    s+=spannenSvg(SZ,spO+2);
  }
  if(spur){
    const y=H-16;
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${y-13}" y2="${y-13}" stroke="#EDF1E9"/>`;
    s+=`<text x="${ml-8}" y="${y+3}" text-anchor="end" font-size="10" fill="#697A6C">Fotos</text>`;
    let letzt=-1e9;
    for(const g of spur){
      const x=X(g.x);
      if(x<ml-6||x>W-mr+6)continue;
      if(x-letzt<13)continue;                     /* zu dicht: nicht doppelt zeichnen */
      letzt=x;
      s+=`<g style="cursor:pointer" data-tun="fotoTag" data-datum="${esc(g.datum)}" data-tipp="${esc(g.tipp)}">
        <rect x="${x-9}" y="${y-9}" width="18" height="18" rx="4" fill="transparent"/>
        <rect x="${x-7}" y="${y-5}" width="14" height="10" rx="2.5" fill="#3A6DA6"/>
        <rect x="${x-2.5}" y="${y-7.5}" width="5" height="3" rx="1" fill="#3A6DA6"/>
        <circle cx="${x}" cy="${y}" r="2.6" fill="#fff"/>
        ${g.anzahl>1?`<circle cx="${x+8}" cy="${y-7}" r="6" fill="#141D17"/><text x="${x+8}" y="${y-4}" text-anchor="middle" font-size="8.5" fill="#fff" font-weight="600">${g.anzahl}</text>`:''}
      </g>`;
    }
  }
  box.innerHTML=s+'</svg>';
}
/* ── Gestapeltes Diagramm mit gemeinsamer Zeitachse ──────────────────────
   Mehrere Spuren untereinander, eine einzige x-Achse. Jede Spur hat ihre
   eigene y-Achse – Blattsaft in ppm und Wasser in mmol/l messen verschiedene
   Dinge, und zwischen ihnen steht die Wurzel. Sie ineinander umzurechnen
   würde eine Massenbilanz suggerieren, die es nicht gibt.
   o = {spuren:[{titel,serien,yTyp,band,bandLabel,yLabel,hoehe,leerText}],
        von,bis, ereignisse, fotos, aufKlick}                              */
function chartStapel(box,o){
  const spuren=o.spuren||[];
  if(!spuren.length)return leerBox(box,'Nichts ausgewählt.');
  const W=Math.max(box.clientWidth||900,560),ml=104,mr=44;
  const spannen=(o.spannen||[]);
  let x0=o.von,x1=o.bis;
  if(x0==null||x1==null||!(x1>x0)){
    const alle=spuren.flatMap(sp=>(sp.serien||[]).flatMap(se=>se.punkte.map(p=>p.x)));
    if(!alle.length)return leerBox(box,'Keine Werte im gewählten Zeitraum.');
    for(const sp of spannen){alle.push(sp.x0,sp.x1)}
    x0=Math.min(...alle);x1=Math.max(...alle);
    if(x0===x1){x0-=6048e5;x1+=6048e5}
    const sp=(x1-x0)*0.05;x0-=sp;x1+=sp;
  }
  const X=v=>ml+(v-x0)/((x1-x0)||1)*(W-ml-mr);
  const SZ=spannenZeilen(spannen,X,x0,x1,W-4);
  const spH=SZ.n?10+SZ.n*BALKEN_ZEILE:0;
  const evH=((o.ereignisse&&o.ereignisse.length)||(o.fotos&&o.fotos.length)?38:0)+spH;
  const achseH=34;
  const hoehen=spuren.map(sp=>sp.hoehe||190);
  const H=hoehen.reduce((a,b)=>a+b,0)+evH+achseH+10;
  let s=svgAuf(W,H,'Blattsaft und Giesswasser auf gemeinsamer Zeitachse');
  let oben=6;
  const treffer=[];

  spuren.forEach((sp,si)=>{
    const h=hoehen[si],mt=oben+20,unten=oben+h-8;
    const serien=(sp.serien||[]).filter(se=>se.punkte&&se.punkte.length&&!diagAus.has(se.id));
    const sicht=serien.flatMap(se=>se.punkte.filter(p=>p.x>=x0&&p.x<=x1));
    const lageSkala=sp.yTyp==='lage';
    let y0,y1;
    if(lageSkala){y0=0;y1=3}
    else{
      const ys=sicht.map(p=>p.y);
      if(!ys.length){y0=0;y1=1}
      else{
        /* Die Achse folgt den MESSWERTEN. Ein Richtwert, der weit über allem
           liegt – etwa 20 µmol/l Eisen gegen gemessene 3 –, würde sonst die
           Auflösung dorthin ziehen, wo nichts steht. Das Band wird dann
           einfach auf die sichtbare Fläche beschnitten. */
        y0=Math.min(...ys);y1=Math.max(...ys);
        if(sp.band){
          const spanne=(y1-y0)||Math.abs(y1)||1;
          if(sp.band[0]!=null&&sp.band[0]>y0-2*spanne&&sp.band[0]<y1+2*spanne)y0=Math.min(y0,sp.band[0]);
          if(sp.band[1]!=null&&sp.band[1]<y1+2*spanne&&sp.band[1]>y0-2*spanne)y1=Math.max(y1,sp.band[1]);
        }
        const pad=((y1-y0)||Math.abs(y1)||1)*0.16;y0-=pad;y1+=pad;
        /* Eine negative Konzentration gibt es nicht */
        if(y0<0&&Math.min(...ys)>=0)y0=0;
        else if(y0>0&&y0<pad*3)y0=0;
      }
    }
    const Y=v=>mt+(1-(v-y0)/((y1-y0)||1))*(unten-mt);
    /* Hintergrund der Spur */
    s+=`<rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${unten-mt}" fill="${si%2?'#FCFDFB':'#fff'}"/>`;
    if(lageSkala){
      s+=`<rect x="${ml}" y="${Y(3)}" width="${W-ml-mr}" height="${Y(2)-Y(3)}" fill="#FBEEDC"/>`;
      s+=`<rect x="${ml}" y="${Y(2)}" width="${W-ml-mr}" height="${Y(1)-Y(2)}" fill="#E3F0E1"/>`;
      s+=`<rect x="${ml}" y="${Y(1)}" width="${W-ml-mr}" height="${Y(0)-Y(1)}" fill="#FBEEDC"/>`;
      s+=`<text x="${ml-8}" y="${(Y(2)+Y(1))/2+4}" text-anchor="end" font-size="10.5" fill="#2C7A4B">Sollbereich</text>`;
      s+=`<text x="${ml-8}" y="${Y(3)+12}" text-anchor="end" font-size="10" fill="#BE6F16">darüber</text>`;
      s+=`<text x="${ml-8}" y="${Y(0)-4}" text-anchor="end" font-size="10" fill="#BE6F16">darunter</text>`;
    }else{
      if(sp.band&&(sp.band[0]!=null||sp.band[1]!=null)){
        const roh1=Y(sp.band[1]!=null?sp.band[1]:y1),roh0=Y(sp.band[0]!=null?sp.band[0]:y0);
        const b1=Math.max(mt,Math.min(roh1,roh0)),b0=Math.min(unten,Math.max(roh1,roh0));
        if(b0>b1){
          s+=`<rect x="${ml}" y="${b1}" width="${W-ml-mr}" height="${Math.max(1,b0-b1)}" fill="#E3F0E1"/>`;
          s+=`<text x="${W-mr-4}" y="${b1+12}" text-anchor="end" font-size="10" fill="#2C7A4B">${esc(sp.bandLabel||'Sollbereich')}${(roh1<mt||roh0>unten)?' (reicht über den Ausschnitt hinaus)':''}</text>`;
        }
      }
      for(let k=0;k<=3;k++){const v=y0+(y1-y0)*k/3,y=Y(v);
        s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#EDF1E9"/>`+
           `<text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#697A6C" font-family="JetBrains Mono,monospace">${nz(v)}</text>`}
    }
    /* Titel und Einheit der Spur */
    s+=`<text x="${ml}" y="${oben+13}" font-size="11.5" font-weight="600" fill="#141D17">${esc(sp.titel)}</text>`;
    if(sp.yLabel)s+=`<text x="${W-mr}" y="${oben+13}" text-anchor="end" font-size="10.5" fill="#697A6C">${esc(sp.yLabel)}</text>`;
    /* Linien vor den Punkten, damit sie nicht darüber liegen. Verbunden wird
       nur innerhalb einer Reihe - über zwei Blattetagen oder zwei
       Entnahmestellen hinweg wäre die Linie eine Behauptung über zwei
       verschiedene Dinge. */
    if(o.linien)for(const se of serien){
      if(se.klein)continue;                          /* die dichte Tankebene bleibt punktiert */
      const sicht2=se.punkte.filter(q=>q.x>=x0&&q.x<=x1).sort((a,b)=>a.x-b.x);
      if(sicht2.length<2)continue;
      s+=`<polyline fill="none" stroke="${se.farbe}" stroke-width="1.6" opacity=".5" points="${
        sicht2.map(q=>X(q.x)+','+Y(q.y)).join(' ')}"/>`;
    }
    /* Punkte */
    for(const se of serien)for(const q of se.punkte){
      if(q.x<x0||q.x>x1)continue;
      const cx=X(q.x),cy=Y(q.y);
      s+=marke(se.form,cx,cy,se.klein?3.5:5,se.farbe,se.klein?0.55:1);
      treffer.push({cx,cy,tipp:q.tipp,kennung:q.kennung,klein:se.klein});
    }
    if(!sicht.length)s+=`<text x="${(ml+W-mr)/2}" y="${(mt+unten)/2}" text-anchor="middle" font-size="11" fill="#A8B3A4">${esc(sp.leerText||'keine Messung in diesem Zeitraum')}</text>`;
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${unten}" y2="${unten}" stroke="#DCE3D5"/>`;
    oben+=h;
  });

  /* Ereignis- und Fotospur */
  const evO=oben;
  if(evH){
    if((o.ereignisse||[]).length){
      s+=`<text x="${ml-8}" y="${evO+14}" text-anchor="end" font-size="10" fill="#697A6C">Logbuch</text>`;
      s+=`<line x1="${ml}" x2="${W-mr}" y1="${evO+11}" y2="${evO+11}" stroke="#EDF1E9"/>`;
      for(const b of logbuchBuendel(o.ereignisse,X,x0,x1))s+=logbuchMarke(b,evO+11,6,evO+5);
    }
    if((o.fotos||[]).length){
      s+=`<text x="${ml-8}" y="${evO+32}" text-anchor="end" font-size="10" fill="#697A6C">Fotos</text>`;
      let letzt=-1e9;
      for(const g of o.fotos){
        if(g.x<x0||g.x>x1)continue;
        const x=X(g.x);
        if(x-letzt<13)continue;letzt=x;
        s+=`<g style="cursor:pointer" data-tun="fotoTag" data-datum="${esc(g.datum)}" data-tipp="${esc(g.tipp)}">
          <rect x="${x-8}" y="${evO+21}" width="16" height="16" rx="3" fill="transparent"/>
          <rect x="${x-6}" y="${evO+25}" width="12" height="9" rx="2" fill="#3A6DA6"/>
          <circle cx="${x}" cy="${evO+29.5}" r="2.2" fill="#fff"/>
          ${g.anzahl>1?`<circle cx="${x+7}" cy="${evO+23}" r="5" fill="#141D17"/><text x="${x+7}" y="${evO+26}" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="600">${g.anzahl}</text>`:''}
        </g>`;
      }
    }
  }

  /* Beigabe-Spannen: ein Balken je Nährstoff, seit wann er dazugegeben
     wird. Nur auf der Zeitachse sinnvoll; die Mengen stehen im Kästchen. */
  if(SZ.n){
    const spO=evO+evH-spH;
    s+=`<text x="${ml-8}" y="${spO+15}" text-anchor="end" font-size="10.5" font-weight="600" fill="#4F5E53">Beigaben</text>`;
    s+=spannenSvg(SZ,spO+2);
  }
  /* Gemeinsame Zeitachse, einmal */
  const achseY=evO+evH+2;
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${achseY}" y2="${achseY}" stroke="#141D17"/>`;
  for(const t of zeitMarken(x0,x1))
    s+=`<line x1="${X(t.x)}" x2="${X(t.x)}" y1="${achseY}" y2="${achseY+4}" stroke="#141D17"/>`+
       `<text x="${X(t.x)}" y="${achseY+16}" text-anchor="middle" font-size="10.5" fill="#697A6C">${esc(t.text)}</text>`;
  s+=`<text x="${W-mr}" y="${achseY+29}" text-anchor="end" font-size="10" fill="#A8B3A4">Ziehen verschiebt · Rad zoomt · Doppelklick setzt zurück</text>`;

  /* Trefferflaechen zuletzt, damit sie oben liegen */
  for(const t of treffer)
    s+=`<circle class="hit" cx="${t.cx}" cy="${t.cy}" r="${t.klein?7:11}" data-tipp="${esc(t.tipp||'')}"${
      (o.aufKlick&&t.kennung)?` data-tun="diagPunkt" data-id="${esc(t.kennung)}" style="cursor:pointer"`:' style="cursor:help"'}/>`;
  s+=`<line class="zeiger" x1="-99" x2="-99" y1="4" y2="${achseY}" stroke="#141D17" stroke-width="1" opacity=".35" pointer-events="none"/>`;
  box.innerHTML=s+'</svg>';
  stapelBedienung(box,{W,ml,mr,x0,x1});
}
/* Sinnvolle Marken auf der Zeitachse, je nach Spannweite */
function zeitMarken(x0,x1){
  const t=(x1-x0)/864e5,out=[];
  const d0=new Date(x0);
  if(t<=3){                                         /* Stunden – seit es Uhrzeiten gibt */
    const schritt=t<=1.2?3:t<=2.2?6:12;
    const d=new Date(Math.ceil(x0/36e5)*36e5);
    while(d.getUTCHours()%schritt)d.setUTCHours(d.getUTCHours()+1);
    for(;+d<=x1;d.setUTCHours(d.getUTCHours()+schritt)){
      const h=d.getUTCHours();
      out.push({x:+d,text:h===0?fmtK(d.toISOString().slice(0,10)):String(h).padStart(2,'0')+':00'});
    }
  }else if(t<=16){                                  /* Tage */
    const d=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),d0.getUTCDate()));
    const schritt=t<=9?1:2;
    for(;+d<=x1;d.setUTCDate(d.getUTCDate()+schritt))
      if(+d>=x0)out.push({x:+d,text:fmtK(d.toISOString().slice(0,10))});
  }else if(t<=70){                                  /* Wochen */
    const d=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),d0.getUTCDate()));
    while(d.getUTCDay()!==1)d.setUTCDate(d.getUTCDate()+1);
    for(;+d<=x1;d.setUTCDate(d.getUTCDate()+7))
      if(+d>=x0)out.push({x:+d,text:fmtK(d.toISOString().slice(0,10))});
  }else{                                            /* Monate */
    const d=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),1));
    const N=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    for(;+d<=x1;d.setUTCMonth(d.getUTCMonth()+1))
      if(+d>=x0)out.push({x:+d,text:N[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2)});
  }
  return out.length?out:[{x:x0,text:fmtK(new Date(x0).toISOString().slice(0,10))}];
}
/* Ziehen, Zoomen, Zuruecksetzen – wirkt auf alle Spuren gleichzeitig, weil
   sie sich denselben x-Bereich teilen. */
let koVon=null,koBis=null;
/* Wer die gemeinsame Zeitachse gerade benutzt, meldet hier an, was bei
   Zoom («zoom») und Zurücksetzen («reset») mit seinem Zeitraum-Knopf
   geschehen soll. Vorher stand hier fest der Reiter Verlauf drin – die
   Karte «Am Tank» braucht dasselbe. */
let zoomHaken=null;
const zoomMelden=art=>{if(zoomHaken)try{zoomHaken(art)}catch(e){}};
/* Der Zustand des Ziehens liegt bewusst AUSSERHALB der Funktion. Jede
   Verschiebung zeichnet das Diagramm neu, dabei werden die Ereignisbehandler
   ersetzt – laege der Zustand in ihrer Umgebung, waere das Ziehen nach dem
   ersten Bildpunkt zu Ende, und man muesste die Maustaste immer wieder neu
   druecken. */
let zieht=false,ziehBewegt=false,ziehStart=0,ziehVon=0,ziehBis=0;
function stapelBedienung(box,g){
  const svg=box.querySelector('svg');if(!svg)return;
  const zeiger=box.querySelector('.zeiger');
  const zuX=ev=>{
    const r=svg.getBoundingClientRect();
    if(!r.width)return null;
    return (ev.clientX-r.left)*(g.W/r.width);
  };
  const zuZeit=px=>g.x0+(px-g.ml)/((g.W-g.ml-g.mr)||1)*(g.x1-g.x0);
  if(zieht)box.style.cursor='grabbing';
  box.onmousedown=ev=>{
    const px=zuX(ev);if(px==null||px<g.ml)return;
    zieht=true;ziehBewegt=false;ziehStart=px;ziehVon=g.x0;ziehBis=g.x1;
    box.style.cursor='grabbing';ev.preventDefault();
  };
  box.onmousemove=ev=>{
    const px=zuX(ev);if(px==null)return;
    if(zeiger&&px>=g.ml){zeiger.setAttribute('x1',px);zeiger.setAttribute('x2',px)}
    if(!zieht)return;
    if(Math.abs(px-ziehStart)<2)return;
    ziehBewegt=true;
    const d=(ziehStart-px)/((g.W-g.ml-g.mr)||1)*(ziehBis-ziehVon);
    koVon=ziehVon+d;koBis=ziehBis+d;zoomMelden('zoom');
    /* Waehrend des Ziehens wird nur die Zeichnung erneuert, nicht die Tabellen
       darunter – sonst ruckelt es. Der Rest folgt beim Loslassen. */
    if(DIAG&&DIAG.zeichnen){tippWeg();DIAG.zeichnen()}else diagFrisch();
  };
  /* Nur nach einer echten Verschiebung wird der ganze Reiter erneuert. Sonst
     wuerde schon ein einfacher Klick die Zeichnung austauschen – und ein
     Doppelklick koennte gar nicht mehr entstehen, weil sein erstes Ziel
     zwischendurch aus dem Dokument verschwaende. */
  const los=()=>{const b=zieht&&ziehBewegt;zieht=false;ziehBewegt=false;box.style.cursor='';if(b)diagFrisch()};
  box.onmouseup=los;
  box.onmouseleave=()=>{los();if(zeiger){zeiger.setAttribute('x1',-99);zeiger.setAttribute('x2',-99)}};
  box.addEventListener('wheel',ev=>{
    const px=zuX(ev);if(px==null||px<g.ml)return;
    ev.preventDefault();
    const mitte=zuZeit(px);
    const f=ev.deltaY>0?1.25:0.8;
    const nv=mitte-(mitte-g.x0)*f,nb=mitte+(g.x1-mitte)*f;
    if(nb-nv<3*864e5)return;                        /* nicht enger als drei Tage */
    koVon=nv;koBis=nb;zoomMelden('zoom');diagFrisch();
  },{passive:false});
  box.ondblclick=()=>{koVon=koBis=null;zoomMelden('reset');diagFrisch()};
}

/* Baustein fuer den Inhalt des Infokaestchens. Alles wird hier maskiert,
   damit ein Satzname mit spitzer Klammer kein Markup einschleusen kann. */
/* ── Logbuch in den Zeitdiagrammen ─────────────────────────────────────
   Früher: je Eintrag eine gestrichelte Linie über das ganze Diagramm und
   sein Titel oben dran – bei siebzig Einträgen ein Textbrei. Jetzt: eine
   eigene Zeile «Logbuch» unter der Zeitachse. Je Tag eine Marke in der
   Farbe der Art; was näher als 10 Bildpunkte beieinanderliegt, wird eine
   Marke mit Zahl. Das Kästchen nennt jeden Eintrag. Die Hilfslinie hinauf
   ins Diagramm ist kaum zu sehen und wird deutlich, wenn man auf die Marke
   zeigt. Aufrufer geben logbuchPunkte(liste) mit. */
const logbuchPunkte=liste=>(liste||[]).filter(e=>e&&e.datum&&!isNaN(+new Date(e.datum))).map(e=>({x:zeitpunkt(e),e}));
function logbuchBuendel(items,X,x0,x1){
  const sicht=(items||[]).filter(it=>it&&it.e&&it.x>=x0&&it.x<=x1).sort((a,b)=>a.x-b.x);
  const out=[];
  for(const it of sicht){
    const px=X(it.x),letzt=out[out.length-1];
    if(letzt&&px-letzt.bis<10){letzt.eintraege.push(it.e);letzt.bis=px;continue}
    out.push({von:px,bis:px,eintraege:[it.e]});
  }
  for(const b of out){
    b.x=(b.von+b.bis)/2;
    const typen=[...new Set(b.eintraege.map(e=>e.typ))];
    b.farbe=typen.length===1?evFarbe(typen[0]):'#4F5E53';
    b.tipp=logbuchTipp(b.eintraege);
  }
  return out;
}
function logbuchTipp(liste){
  const l=[...liste].sort(chrono);
  if(l.length===1){const e=l[0];
    return tippBau(e.typ+(e.titel&&e.titel!==e.typ?' · '+e.titel:''),evFarbe(e.typ),[['Datum',fmtZ(e)],
      e.mittel?['Mittel',evMittelName(e.mittel)]:null,e.menge!=null?['Menge',evMenge(e)]:null,
      e.stelle&&e.stelle!=='beide'?['Stelle',e.stelle]:null,e.wer?['eingetragen von',e.wer]:null],
      e.notiz||(e.felder&&e.felder.text)||'');
  }
  const tage=[...new Set(l.map(e=>e.datum))];
  const kopf=`${l.length} Logbucheinträge · ${tage.length>1?fmtK(tage[0])+'–'+fmtK(tage[tage.length-1]):fmt(tage[0])}`;
  const zeilen=l.slice(0,12).map(e=>{
    const wann=((tage.length>1?fmtK(e.datum):'')+(e.zeit?' '+e.zeit:'')).trim();
    const was=[e.typ,e.mittel?mittelKurz(e.mittel):null,e.menge!=null?evMenge(e):null,e.stelle&&e.stelle!=='beide'?e.stelle:null].filter(Boolean).join(' · ');
    return wann?[wann,was]:was;
  });
  if(l.length>12)zeilen.push(`… und ${l.length-12} weitere – im Logbuch`);
  return tippBau(kopf,'#4F5E53',zeilen,'');
}
/* Beigabe-Balken in Zeilen legen: Zeiträume desselben Mittels teilen sich
   eine Zeile, solange Balken und Beschriftung nicht aneinanderstossen.
   Vorher bekam jeder Zeitraum seine eigene Zeile – vierzehn Zeilen für
   neun Mittel. */
/* Die Balken selbst (seit 30.09. grösser): 18 Bildpunkte hoch, satt in der
   Farbe des Mittels, die Beschriftung weiss im Balken – passt sie nicht
   hinein, steht sie dunkel gleich rechts daneben. Ein Balken, der noch
   läuft, endet in einer Spitze: es geht weiter. */
const BALKEN_ZEILE=23,BALKEN_H=18,BALKEN_ZEICHEN=6.4;
function spannenZeilen(spannen,X,x0,x1,rechts){
  const zeilen=[],liste=[];
  const grenze=rechts!=null?rechts:X(x1)+20;
  for(const sp of spannen){
    const a=Math.max(x0,sp.x0),b=Math.min(x1,sp.x1);if(b<a)continue;
    const xa=X(a),xb=Math.max(X(b),xa+6),textW=String(sp.text||'').length*BALKEN_ZEICHEN;
    const spitze=sp.laeuft?8:0;
    /* Die Beschriftung: im Balken, sonst rechts daneben – und wo rechts der
       Rand kommt (ein kurzer Balken, der bis heute läuft), links davor. */
    let lage,links,ende;
    if(xb-xa>=textW+18){lage='innen';links=xa;ende=xb+spitze}
    else if(xb+spitze+6+textW<=grenze){lage='rechts';links=xa;ende=xb+spitze+6+textW}
    else{lage='links';links=xa-6-textW;ende=xb+spitze}
    links-=6;ende+=12;
    const key=sp.zeile||sp.kennung;
    let z=zeilen.findIndex(r=>r.key===key&&r.ende<=links);
    if(z<0){zeilen.push({key,ende});z=zeilen.length-1}else zeilen[z].ende=ende;
    liste.push({sp,z,xa,xb,lage,innen:lage==='innen',spitze,links,ende});
  }
  return {liste,n:zeilen.length};
}
/* Eine Farbe um f dunkler – damit weisse Schrift auch auf Orange lesbar ist. */
function dunkler(hex,f){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||''));if(!m)return hex;
  const n=parseInt(m[1],16),k=c=>Math.round(c*(1-f)).toString(16).padStart(2,'0');
  return '#'+k(n>>16&255)+k(n>>8&255)+k(n&255);
}
function spannenSvg(SZ,oben){
  let s='';
  for(const {sp,z,xa,xb,lage,spitze} of SZ.liste){
    const y=oben+z*BALKEN_ZEILE,h=BALKEN_H,f=dunkler(sp.farbe,.12);
    s+=`<g class="spb" style="cursor:pointer" data-tun="spanne" data-id="${esc(sp.kennung)}" data-tipp="${esc(sp.tipp||'')}">`;
    s+=`<rect x="${xa}" y="${y}" width="${xb-xa}" height="${h}" rx="5" fill="${f}"/>`;
    if(spitze)s+=`<path d="M${xb-5} ${y}L${xb+spitze} ${y+h/2}L${xb-5} ${y+h}Z" fill="${f}"/>`;
    const dunkel=dunkler(sp.farbe,.35);
    s+=lage==='innen'
      ?`<text x="${xa+8}" y="${y+12.6}" font-size="11" font-weight="600" fill="#fff">${esc(sp.text)}</text>`
      :lage==='links'
      ?`<text x="${xa-6}" y="${y+12.6}" text-anchor="end" font-size="11" font-weight="600" fill="${dunkel}">${esc(sp.text)}</text>`
      :`<text x="${xb+spitze+6}" y="${y+12.6}" font-size="11" font-weight="600" fill="${dunkel}">${esc(sp.text)}</text>`;
    s+=`</g>`;
  }
  return s;
}
function logbuchMarke(b,y,oben,unten){
  const n=b.eintraege.length,x=b.x,w=n>9?22:18;
  const marke=n>1
    ? `<rect x="${x-w/2}" y="${y-7}" width="${w}" height="14" rx="7" fill="${b.farbe}"/><text x="${x}" y="${y+3.4}" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">${n}</text>`
    : `<circle cx="${x}" cy="${y}" r="5" fill="${b.farbe}" stroke="#fff" stroke-width="1.5"/>`;
  /* Die unsichtbare Trefferfläche liegt zuoberst: sie fängt den Zeiger für
     die ganze Marke, samt Zahl. */
  return `<g class="lbm" data-tipp="${esc(b.tipp)}" style="cursor:help"><line class="lbl" x1="${x}" x2="${x}" y1="${oben}" y2="${unten}" stroke="${b.farbe}" stroke-width="1.3"/>`+
    `${marke}<rect class="lbt" x="${x-w/2-2}" y="${y-9}" width="${w+4}" height="18" fill="transparent"/></g>`;
}
function tippBau(kopf,farbe,zeilen,fuss){
  let t=`<b><i style="background:${farbe}"></i>${esc(kopf)}</b>`;
  for(const z of zeilen.filter(Boolean)){
    if(Array.isArray(z))t+=`<div class="z">${esc(z[0])}: <span class="w">${esc(z[1])}</span></div>`;
    else t+=`<div class="z">${esc(z)}</div>`;
  }
  if(fuss)t+=`<div class="k">${esc(fuss)}</div>`;
  return t;
}

/* Anteil im Optimum über die Zeit.
   Die Zeitachse spannt nur über die Erhebungen. Logbucheinträge ausserhalb
   werden am Rand vermerkt statt die Achse zu strecken – ein einzelner alter
   Eintrag drückte früher alle Balken an den Rand.
   Erhebungen am selben Tag (grün und gelb) werden nebeneinander gesetzt. */
function chartIndex(box,erh){
  const mitIdx=erh.filter(e=>e.index);
  if(!mitIdx.length)return leerBox(box,'Noch keine Erhebung mit auswertbaren Werten.');
  const W=Math.max(box.clientWidth||820,540),H=252,ml=52,mr=22,mt=30,mb=50;
  const zs=mitIdx.map(e=>+new Date(e.datum));
  let x0=Math.min(...zs),x1=Math.max(...zs);
  if(x0===x1){x0-=12096e5;x1+=12096e5}
  const sp=(x1-x0)*0.08;x0-=sp;x1+=sp;
  const X=v=>ml+(v-x0)/(x1-x0)*(W-ml-mr),Y=p=>mt+(1-p)*(H-mt-mb);
  let s=svgAuf(W,H,'Anteil der Nährstoffe im Optimum über die Zeit');
  for(let i=0;i<=4;i++){const p=i/4,y=Y(p);
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#EDF1E9"/><text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#697A6C">${p*100} %</text>`}
  let davor=0,danach=0;
  for(const ev of db.ereignisse){
    const t=+new Date(ev.datum);if(isNaN(t))continue;
    if(t<x0){davor++;continue}
    if(t>x1){danach++;continue}
    const x=X(t);
    s+=`<line x1="${x}" x2="${x}" y1="${mt}" y2="${H-mb}" stroke="#141D17" stroke-dasharray="3 4" opacity=".5"/>`;
    s+=`<rect x="${x-5}" y="${mt}" width="10" height="${H-mb-mt}" fill="transparent" style="cursor:help" data-tipp="${esc(tippBau('Logbuch','#141D17',[[fmt(ev.datum),ev.titel||ev.typ]]))}"/>`;
    s+=`<text x="${x+3}" y="${mt-8}" font-size="10" fill="#141D17">${esc(String(ev.titel||ev.typ).slice(0,18))}</text>`;
  }
  if(davor)s+=`<text x="${ml+2}" y="${mt-8}" font-size="10" fill="#697A6C">← ${davor} Eintrag${davor>1?'e':''} davor</text>`;
  if(danach)s+=`<text x="${W-mr-2}" y="${mt-8}" text-anchor="end" font-size="10" fill="#697A6C">${danach} Eintrag${danach>1?'e':''} danach →</text>`;
  /* gleiche Datumswerte auffächern */
  const proTag=new Map();
  mitIdx.forEach(e=>{const k=e.datum;if(!proTag.has(k))proTag.set(k,[]);proTag.get(k).push(e)});
  const bwBasis=Math.max(9,Math.min(40,(W-ml-mr)/Math.max(mitIdx.length,3)*0.55));
  if(mitIdx.length>1){
    const linie=[...proTag.entries()].map(([d,gr])=>[X(+new Date(d)),Y(mittel(gr.map(g=>g.index.anteil)))]);
    s+=`<polyline fill="none" stroke="#2C7A4B" stroke-width="1.5" opacity=".4" points="${linie.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
  }
  for(const [d,gruppe] of proTag){
    const n=gruppe.length,bw=n>1?Math.max(7,bwBasis/n-2):bwBasis;
    gruppe.forEach((e,i)=>{
      const mitte=X(+new Date(d)),off=(i-(n-1)/2)*(bw+2);
      const x=mitte+off,y=Y(e.index.anteil);
      const farbe=e.zustand==='gelb'?'#BE6F16':'#2C7A4B';
      const tp=tippBau('Satz '+(e.satz||'?')+(e.zustand?' · '+e.zustand:''),farbe,
        [['Probe',fmt(e.datum)],e.alter.woche!=null?['Kulturwoche',nz(e.alter.woche,1)]:null,
         ['Im Optimum',`${e.index.ok} von ${e.index.n} (${Math.round(e.index.anteil*100)} %)`]],'Anklicken öffnet alle Werte dieser Erhebung.');
      s+=`<rect x="${x-bw/2}" y="${y}" width="${bw}" height="${Math.max(1,H-mb-y)}" rx="3" fill="${farbe}" opacity=".75" style="cursor:pointer" data-tipp="${esc(tp)}" data-tun="erhebung" data-id="${esc(e.id)}"/>`;
      s+=`<text x="${x}" y="${y-6}" text-anchor="middle" font-size="10.5" fill="#141D17" font-weight="500">${Math.round(e.index.anteil*100)}</text>`;
      s+=`<text x="${x}" y="${H-mb+15}" text-anchor="middle" font-size="9.5" fill="#697A6C">${esc(String(e.satz||''))}</text>`;
      if(n>1&&e.zustand)s+=`<text x="${x}" y="${H-mb+26}" text-anchor="middle" font-size="9" fill="#697A6C">${esc(e.zustand)}</text>`;
    });
    s+=`<text x="${X(+new Date(d))}" y="${H-mb+(n>1?37:26)}" text-anchor="middle" font-size="9.5" fill="#697A6C">${fmtK(d)}</text>`;
  }
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" stroke="#141D17"/>`;
  box.innerHTML=s+'</svg>';
}

function chartSaetze(box,saetze){
  const mit=saetze.filter(s=>s.aussaat);
  if(!mit.length)return leerBox(box,'Noch kein Satz mit bekanntem oder ableitbarem Aussaatdatum.');
  const W=Math.max(box.clientWidth||820,540),ml=92,mr=24,zh=26,H=mit.length*zh+56;
  const heuteT=+new Date(heute());
  const alle=mit.flatMap(s=>[+new Date(s.aussaat),+new Date(s.ende)]).concat(heuteT);
  let x0=Math.min(...alle),x1=Math.max(...alle);
  const sp=(x1-x0)*0.05||6048e5;x0-=sp;x1+=sp;
  const X=v=>ml+(v-x0)/(x1-x0)*(W-ml-mr);
  let s=svgAuf(W,H,'Laufzeit der Sätze');
  for(const ev of db.ereignisse){
    const t=+new Date(ev.datum);if(isNaN(t))continue;
    const x=X(t);if(x<ml||x>W-mr)continue;
    s+=`<line x1="${x}" x2="${x}" y1="18" y2="${H-30}" stroke="#141D17" stroke-dasharray="3 4" opacity=".4"/>`;
    s+=`<rect x="${x-4}" y="18" width="8" height="${H-48}" fill="transparent" style="cursor:help" data-tipp="${esc(tippBau('Logbuch','#141D17',[[fmt(ev.datum),ev.titel||ev.typ]]))}"/>`;
  }
  const xh=X(heuteT);
  if(xh>=ml&&xh<=W-mr)s+=`<line x1="${xh}" x2="${xh}" y1="18" y2="${H-30}" stroke="#A2432E" stroke-width="1.5"/><text x="${xh+4}" y="14" font-size="10.5" fill="#A2432E">heute</text>`;
  mit.forEach((z,i)=>{
    const y=22+i*zh,xa=X(+new Date(z.aussaat)),xe=X(+new Date(z.ende));
    s+=`<text x="${ml-8}" y="${y+13}" text-anchor="end" font-size="11.5" fill="#141D17" font-family="JetBrains Mono,monospace">${esc(z.id)}</text>`;
    s+=`<rect x="${xa}" y="${y+4}" width="${Math.max(3,xe-xa)}" height="13" rx="3" fill="${z.laufend?'#2C7A4B':'#DCE3D5'}" opacity="${z.laufend?.55:.9}" style="cursor:help" data-tipp="${esc(tippBau('Satz '+z.id,z.laufend?'#2C7A4B':'#8C9A88',[['Aussaat',fmt(z.aussaat)],['Ende etwa',fmt(z.ende)],z.laufend?['Heute Woche',nz(z.woche,1)]:null]))}"/>`;
    for(const an of z.analysen){const x=X(+new Date(an.datum));
      s+=`<circle cx="${x}" cy="${y+10.5}" r="4.5" fill="#141D17" style="cursor:help" data-tipp="${esc(tippBau('Beprobung','#141D17',[['Datum',fmt(an.datum)],['Kulturwoche',nz(an.woche,1)]]))}"/>`}
    for(const g of z.geplant){const x=X(+new Date(g.datum));
      s+=`<circle cx="${x}" cy="${y+10.5}" r="4.5" fill="none" stroke="#3A6DA6" stroke-width="1.6" style="cursor:help" data-tipp="${esc(tippBau('Geplante Beprobung','#3A6DA6',[['Datum',fmt(g.datum)],['Kulturwoche',nz(g.woche,1)]]))}"/>`}
  });
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${H-30}" y2="${H-30}" stroke="#141D17"/>`;
  for(let i=0;i<=4;i++){const t=x0+(x1-x0)*i/4;
    s+=`<text x="${X(t)}" y="${H-14}" text-anchor="middle" font-size="10.5" fill="#697A6C">${fmtK(new Date(t).toISOString().slice(0,10))}</text>`}
  box.innerHTML=s+'</svg>';
}

/* «Wirkung» ist entfallen: Vorher/Nachher um ein Ereignis leistet der Reiter
   «Verlauf» mit Ereignismarkern und Zoom besser, und die alte Ansicht war
   ohnehin nur qualitativ. */
const TABS=[['lage','Überblick'],['analysen','Analysen'],['verlauf','Verlauf'],['naehrstoff','Nährstoffe'],
 ['substrat','Substrat'],['giess','Giesswasser'],['logbuch','Logbuch'],['fotos','Fotos'],['rundgang','Rundgang'],['planer','Planer'],['saetze','Sätze & Einstellungen']];
const ANSICHT={lage:()=>vLage(),analysen:()=>vAnalysen(),verlauf:()=>vVerlauf(),naehrstoff:()=>vNaehr(),
 substrat:()=>vSubstrat(),giess:()=>vGiess(),logbuch:()=>vLogbuch(),fotos:()=>vFotos(),rundgang:()=>vRund(),planer:()=>vPlaner(),saetze:()=>vSaetze()};
function render(){
  const yVor=window.scrollY||window.pageYOffset||0;
  tippWeg();   /* das Kästchen zeigt sonst auf einen Punkt, den es nicht mehr gibt */
  el('nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'active':''}" data-tun="reiter" data-reiter="${k}">${esc(l)}</button>`).join('')
    +`<span style="flex:1"></span><span class="seg" title="Wesentlich: nur das Diagramm mit seiner Auswahl – zum Zeigen. Alles: Tabellen, Zahlen, Vorbehalte."><button class="${wesentlich?'on':''}" data-tun="wesentlich">Wesentlich</button><button class="${wesentlich?'':'on'}" data-tun="wesentlich">Alles</button></span>`;
  document.body.classList.toggle('wesentlich',wesentlich);
  kopfStand();
  const f=ANSICHT[tab]||ANSICHT.lage;
  DIAG=null;zoomHaken=null;
  if(letzterTab!==tab){diagAus.clear();koVon=koBis=null}
  try{el('view').innerHTML=paketHinweis()+f()}
  catch(err){el('view').innerHTML=`<div class="card"><h2>Diese Ansicht liess sich nicht aufbauen</h2>
    <p class="muted">Die übrigen Reiter funktionieren weiter, und deine Daten sind unverändert. Sichere sie und schick mir die Meldung unten.</p>
    <pre class="tiny mono" style="white-space:pre-wrap;background:var(--card2);padding:12px;border-radius:8px;border:1px solid var(--line)">${esc(err&&err.stack||err)}</pre></div>`;
    nachRender=null}
  /* Nur ein echter Reiterwechsel springt an den Seitenanfang. Frueher tat
     das jede Zustandsaenderung – wer unten im Diagramm den Naehrstoff
     wechselte, landete wieder ganz oben. */
  if(letzterTab!==tab){letzterTab=tab;window.scrollTo({top:0})}
  else window.scrollTo({top:yVor});
  if(nachRender){const g=nachRender;nachRender=null;try{g()}catch(err){}}
  ansichtMerken();
}
let letzterTab=null;

/* Diagramm allein neu bauen: die Bedienelemente und das Diagramm werden
   ersetzt, der Rest der Seite und die Scrollposition bleiben unberuehrt.
   Faellt etwas aus, wird auf den vollstaendigen Aufbau zurueckgefallen. */
function diagFrisch(){
  tippWeg();
  if(!DIAG)return render();
  /* Zwischen dem Ersetzen der Bedienelemente und dem Zeichnen ist die Seite
     kurz um die Hoehe des Diagramms kuerzer. Der Browser begrenzt die
     Scrollposition dann auf das neue Seitenende und holt sie nicht zurueck,
     wenn die Seite wieder waechst – wer unten stand, landete oben. Darum
     wird sie hier gemerkt und danach wiederhergestellt. */
  const yVor=window.scrollY||window.pageYOffset||0;
  try{
    for(const [id,fn] of DIAG.teile){const b=el(id);if(!b)return render();b.innerHTML=fn()}
    if(DIAG.zeichnen)DIAG.zeichnen();
    if((window.scrollY||window.pageYOffset||0)!==yVor)window.scrollTo({top:yVor});
    ansichtMerken();
  }catch(err){render()}
}
