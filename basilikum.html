function alterTag(a){
  if(!a||a.woche==null)return '<span class="tag">Alter unbekannt</span>';
  if(!a.plausibel)return `<span class="tag warn" title="${esc(a.text)} – das ist für Basilikum unplausibel. Bitte das Aussaatdatum unter «Sätze» eintragen.">Woche ${nz(a.woche,1)} · unplausibel</span>`;
  return `<span class="tag ${a.sicher?'':'schaetz'}" title="${esc(a.text)}">${a.sicher?'':'~'}Woche ${nz(a.woche,1)}</span>`;
}
const zustandTag=z=>z?`<span class="tag ${z==='gelb'?'gelb':'gruen'}">${esc(z)}</span>`:'';
const leerHinweis=(titel,text,knopf)=>`<div class="card"><div class="leer"><h3>${esc(titel)}</h3>
  <p class="muted" style="max-width:56ch;margin:0 auto 14px">${text}</p>${knopf||''}</div></div>`;
/* Wie belastbar ist die aktuelle Datenlage? Steht überall dort, wo es zählt. */
function datenlage(){
  const erh=erhebungen();
  const saetzeMehrfach=new Set();
  const proSatz=new Map();
  erh.forEach(e=>{const l=proSatz.get(e.satz)||[];l.push(e);proSatz.set(e.satz,l)});
  proSatz.forEach((l,s)=>{if(new Set(l.map(x=>x.datum)).size>1)saetzeMehrfach.add(s)});
  return {erhebungen:erh.length,saetze:proSatz.size,mehrfach:saetzeMehrfach.size,
    ereignisse:db.ereignisse.length,substrat:db.analysen.filter(a=>a.typ==='substrat').length,
    unplausibel:erh.filter(e=>e.alter.woche!=null&&!e.alter.plausibel).length};
}

/* ══════════ 8 · Überblick ══════════ */
let ueParams=null;
function vLage(){
  if(!db.analysen.length)return `<div class="card"><h2>Willkommen</h2>
    <p class="muted" style="max-width:64ch">Dieses Werkzeug sammelt eure Blattsaft- und Substratanalysen und beantwortet drei Fragen:
      Was haben unsere Entscheidungen bewirkt · nähern wir uns dem Optimum · was passiert mit einer Pflanze während ihrer Kulturzeit.</p>
    <p class="muted" style="max-width:64ch">Beginne mit dem Einlesen eines PDFs. Alles, was du übernimmst, wandert in die Sicherungsdatei; die Originale werden danach nicht mehr gebraucht.</p>
    <div class="row"><button class="primary" data-tun="reiter" data-reiter="analysen">Erste Analyse einlesen</button>
      <button data-tun="dateiOeffnen">Bestehende Datei öffnen</button></div></div>`;
  const erh=erhebungen();
  if(!erh.length)return leerHinweis('Noch keine Blattsaftanalyse',
    'Substrat- und Giesswasseranalysen sind erfasst, aber die Auswertung baut auf dem Blattsaft auf. Lies eine NovaCropControl-Analyse ein, dann füllt sich dieser Reiter.',
    '<button class="primary" data-tun="reiter" data-reiter="analysen">Zu den Analysen</button>');
  const bil=bilanz(),dl=datenlage(),wk=wiederkehrend();
  const letzte=erh[erh.length-1],vorletzte=erh[erh.length-2];
  const iL=letzte&&letzte.index?Math.round(letzte.index.anteil*100):null;
  const gleicherSatz=vorletzte&&vorletzte.satz===letzte.satz;
  const iV=vorletzte&&vorletzte.index?Math.round(vorletzte.index.anteil*100):null;
  const laufend=saetzeListe().filter(s=>s.laufend).length;
  const offen=erh.length?befunde(letzte).filter(f=>f.schwere==='hoch').length:0;
  const verf=[...new Set(erh.flatMap(e=>Object.keys(e.bew).filter(k=>!e.bew[k].fehlt)))];
  if(!ueParams)ueParams=bil.slice(0,5).map(b=>b.k);
  ueParams=ueParams.filter(k=>verf.includes(k));
  if(!ueParams.length)ueParams=verf.slice(0,4);

  nachRender=()=>{
    if(erh.length<2)return;                 /* bei einer Erhebung gibt es keine Diagramme */
    chartIndex(el('cIndex'),erh);
    const serien=ueParams.map((k,i)=>({name:NAME[k],farbe:FARBEN[i%FARBEN.length],
      punkte:erh.map(e=>{const b=e.bew[k];if(!b||b.fehlt)return null;
        const l=mittel(b.werte.map(x=>lage(x.wert,x.opt)).filter(v=>v!=null));
        return l==null?null:{x:+new Date(e.datum),y:l,xtext:fmtK(e.datum),
          titel:`${e.satz} · ${fmt(e.datum)}: ${b.werte.filter(x=>x.st!=null).map(x=>x.blattalter+' '+nz(x.wert)).join(', ')} ${einheit(k)}`}}).filter(Boolean)}))
      .filter(s=>s.punkte.length);
    chartLinien(el('cBand'),{serien,bands3:true,xTyp:'datum',xLabel:'Probendatum',
      ereignisse:db.ereignisse.filter(x=>!isNaN(+new Date(x.datum))).map(e=>({x:+new Date(e.datum),label:e.titel||e.typ})),hoehe:300});
    el('legBand').innerHTML=serien.map(s=>`<span><i style="background:${s.farbe}"></i>${esc(s.name)}</span>`).join('');
  };

  let s='';
  if(dl.unplausibel)s+=`<div class="note warn"><strong>${dl.unplausibel} Altersangabe${dl.unplausibel>1?'n sind':' ist'} unplausibel.</strong>
    Das abgeleitete Aussaatdatum liegt mehr als ${nz(Math.max(20,(db.einst.dauerWinter||10)*2),0)} Wochen vor der Probe – für Basilikum ist das zu lang.
    Meist stimmt die Kalenderwoche im Satznamen nicht mit dem tatsächlichen Aussaatjahr überein.
    <button style="margin-left:8px" data-tun="reiter" data-reiter="saetze">Aussaatdatum eintragen</button></div>`;

  s+=`<div class="kpis">

      <span class="tiny muted">${iL==null?'nicht bewertbar':
        (gleicherSatz&&iV!=null?`${iL>iV?'+':''}${iL-iV} Punkte gegenüber der vorigen Erhebung desselben Satzes`
         :vorletzte?`Satz ${esc(letzte.satz)} · die vorige Erhebung war ein anderer Satz und darum kein Verlauf`
         :'erste Erhebung')}</span></div>
    <div class="kpi"><h4>Dringende Befunde</h4><b class="${offen?'val-off':'val-ok'}">${offen}</b><span class="tiny muted">in der neuesten Erhebung</span></div>
    <div class="kpi"><h4>Sätze laufend</h4><b>${laufend}</b><span class="tiny muted">von ${alleSaetze().length} erfasst</span></div>
  </div>`;

  s+=befundKarten();

  s+= erh.length>1
   ? `<div class="card"><div class="hd"><div><h2>Nähern wir uns dem Optimum?</h2>
      <p class="sub">Anteil der Kernnährstoffe im Sollbereich, je Erhebung. Senkrechte Linien sind Einträge aus dem Logbuch. Grün und gelb desselben Tages stehen nebeneinander.</p></div></div>
      <div id="cIndex" class="scroll"></div>
      <p class="tiny muted" style="margin-top:10px">Gerechnet wird über ${kern().length} Nährstoffe, jeder gleich gewichtet, jeder an dem Blatt, an dem er überhaupt aussagekräftig ist –
      phloemmobile am Altblatt, immobile am Jungblatt. Die Zahl ist ein grobes Mass für die Gesamtlage und ersetzt den Blick auf den einzelnen Nährstoff nicht.
      ${erh.some(e=>e.alter.woche!=null)?`Beachte: die Bestände waren bei der Probenahme unterschiedlich alt (${nz(Math.min(...erh.map(e=>e.alter.woche).filter(x=>x!=null)),1)} bis ${nz(Math.max(...erh.map(e=>e.alter.woche).filter(x=>x!=null)),1)} Wochen), was den Vergleich zwischen den Balken einschränkt.`:''}</p>
    </div>`
   : `<div class="card"><div class="hd"><div><h2>Nähern wir uns dem Optimum?</h2></div></div>
      <div class="leer"><h3>Dafür braucht es eine zweite Erhebung</h3>
      <p class="muted" style="max-width:58ch;margin:0 auto">Mit einer einzigen Analyse gibt es keinen Verlauf – nur einen Zustand.

  if(wk.length)s+=`<div class="card"><div class="hd"><div><h2>Was immer wieder auftritt</h2>
    <p class="sub">Befunde, die in mehr als einer Erhebung entstanden sind. Bei wenigen Analysen ist das die belastbarere Frage als ein Einzelbefund – ein wiederholtes Muster ist kein Ausreisser.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Befund</th><th>wie oft</th><th>wann</th></tr></thead><tbody>
    ${wk.map(x=>`<tr><td><strong>${esc(x.titel)}</strong></td>

      <td class="tiny muted">${x.wann.map(y=>esc(y.satz)+' '+fmtK(y.datum)).join(' · ')}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  s+=`<div class="card"><div class="hd"><div><h2>Welche Nährstoffe sind chronisch daneben?</h2>
    <p class="sub">Über alle bisherigen Erhebungen gerechnet. Diese Auswertung ist vom Kulturalter unabhängig und darum auch bei unregelmässiger Beprobung belastbar.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Nährstoff</th><th>im Optimum</th><th>beurteilt am</th><th>Richtung</th><th>mittlere Lage</th></tr></thead><tbody>
    ${bil.map(b=>`<tr><td><strong>${esc(NAME[b.k])}</strong>${b.haupt?' <span class="tag">Hauptnährstoff</span>':''}

      <td class="small">${b.tief&&b.hoch?`${b.tief}× zu tief, ${b.hoch}× zu hoch`:b.tief?'immer zu tief':b.hoch?'immer zu hoch':'im Rahmen'}${b.rand?` <span class="tiny muted">(${b.rand}× knapp)</span>`:''}</td>
      <td style="min-width:150px">${lageBalken(b.mittel)}</td></tr>`).join('')}
    </tbody></table></div>
    ${bil.filter(b=>b.quote===0&&b.haupt).length?`<div class="note">${bil.filter(b=>b.quote===0&&b.haupt).map(b=>NAME[b.k]).join(', ')} lag in keiner einzigen Erhebung im Optimum. Das ist kein Ausreisser, sondern ein Grundzustand der Düngung – dort liegt der grösste Hebel.</div>`:''}
  </div>`;

  if(erh.length>1)s+=`<div class="card"><div class="hd"><div><h2>Nährstofflage über die Zeit</h2>
    <p class="sub">Alle Nährstoffe auf eine gemeinsame Skala gebracht: das grüne Band ist der Sollbereich, unabhängig von der Einheit.</p></div></div>
    <div class="row" style="margin-bottom:12px"><div style="flex:1"><label class="lab">Nährstoffe</label><div class="row" style="gap:6px">

  /* Die Befunde sind der Inhalt, nicht die Diagramme. Sie stehen deshalb

  function befundKarten(){
    const neu=new Map();
    for(const e of [...erh].reverse()){const k=e.satz+'|'+(e.zustand||'');if(!neu.has(k))neu.set(k,e)}
    let t=`<div class="hd" style="margin:22px 0 12px"><div><h2>${neu.size>1?'Neueste Erhebung je Satz':'Die Auswertung'}</h2>
      <p class="sub">${neu.size>1?'Für jeden Satz die jüngste Erhebung.':'Was in dieser Analyse steht und was daraus folgt.'}</p></div></div>`;
    for(const e of neu.values()){
      const f=befunde(e),top=f.slice(0,3),rest=f.slice(3);
      t+=`<div class="card"><div class="hd">
        <div><h2>Satz ${esc(e.satz||'?')} ${zustandTag(e.zustand)}</h2>

        ${e.index?`<div style="text-align:right"><b style="font-family:'Bricolage Grotesque';font-size:23px" class="${e.index.anteil>=0.5?'val-ok':'val-off'}">${Math.round(e.index.anteil*100)} %</b>
          <div class="tiny muted">${e.index.ok} von ${e.index.n} im Optimum${e.index.fehlt?` · ${e.index.fehlt} nicht bewertbar`:''}</div></div>`:''}
        <button class="primary" data-tun="erhebung" data-id="${esc(e.id)}">Alle Werte ansehen</button></div></div>
        ${streifen(e)}
        <p class="tiny muted" style="margin-top:8px">${esc(e.alter.text||'')}</p>
        <div style="margin-top:12px">${top.length?top.map(befundHtml).join(''):'<p class="muted small">Keine Auffälligkeiten nach den hinterlegten Regeln.</p>'}</div>
        ${rest.length?`<details><summary>${rest.length} weitere${rest.length>1?'':'r'} Befund${rest.length>1?'e':''}</summary><div style="margin-top:10px">${rest.map(befundHtml).join('')}</div></details>`:''}
      </div>`;
    }
    return t;
  }
  return s;
}

    return `<tr><td><strong>${esc(NAME[k]||k)}</strong>

      <td>${!inKern?'<span class="tiny muted">nicht in der Kennzahl</span>'
        :b&&!b.fehlt?stPill(b.ok?(b.rand?'randtief':'ok'):b.st)
        :`<span class="pill na">${esc(b&&b.grund||'nicht bewertbar')}</span>`}</td></tr>`;
  };
  const gruppe=([titel,ks])=>{
    const z=ks.map(zeile).filter(Boolean).join('');
    if(!z)return '';
    return `<tr><td colspan="${spalten.length+3}" style="background:var(--card2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:14px">${esc(titel)}</td></tr>`+z;
  };

  dialog(`Satz ${e.satz||'?'} · ${fmt(e.datum)}`,
    `<div class="row" style="margin-bottom:12px;align-items:center">

      ${spalten.map(([l])=>`<span class="tag ${esc(l)}">${esc(l)}</span>`).join('')}
      <span class="tag">${esc(ref.labor||'manuell')}</span>

      ${e.index?`<div style="text-align:right"><b style="font-family:'Bricolage Grotesque';font-size:22px" class="${e.index.anteil>=0.5?'val-ok':'val-off'}">${Math.round(e.index.anteil*100)} %</b>
        <div class="tiny muted">${e.index.ok} von ${e.index.n} im Optimum</div></div>`:''}
    </div>
    <p class="tiny muted">${esc(e.alter.text||'')}${ref.kultur?' · Herkunft laut Bericht: '+esc(ref.kultur):''}</p>
    ${streifen(e)}
    <div class="scroll" style="margin-top:16px"><table><thead><tr><th>Parameter</th>
      ${spalten.map(([l])=>`<th>${esc(l)}</th>`).join('')}
      <th>Optimum</th><th>Bewertung</th></tr></thead><tbody>
      ${GRUPPEN.map(gruppe).join('')}
      ${rest.length?gruppe(['Sonstige',rest]):''}
    </tbody></table></div>
    <p class="tiny muted" style="margin-top:8px">Hinterlegte Spalten sind das Blatt, das für diesen Nährstoff zählt: phloemmobile am Altblatt, immobile am Jungblatt, teilmobile an beiden.
    Werte mit vorangestelltem &lt; lagen unter der Nachweisgrenze und werden nicht bewertet.</p>
    <h3 style="margin:20px 0 10px">${f.length} Befund${f.length===1?'':'e'}</h3>
    ${f.length?f.map(befundHtml).join(''):'<p class="muted small">Keine Auffälligkeiten nach den hinterlegten Regeln.</p>'}
    ${spalten.map(([l,p])=>p.quelle&&p.quelle.datei?`<p class="tiny muted">${esc(l)}: aus ${esc(p.quelle.datei)}${p.laborId?' · Probennummer '+esc(p.laborId):''}</p>`:'').join('')}`,
    `<button data-tun="reiter" data-reiter="naehrstoff" data-zu="1">Einen Nährstoff im Detail</button>
     <div style="flex:1"></div><button data-tun="dlgZu">Schliessen</button>`);
}

function lageBalken(l){

}

  if(typeof pdfjsLib==='undefined'||!pdfBereit){
    return dialog('PDFs lassen sich gerade nicht lesen',
      `<p>Zum Einlesen von PDFs lädt die App die Bibliothek <code>pdf.js</code> aus dem Internet. Diesmal hat das nicht geklappt – vermutlich besteht keine Verbindung.</p>
       <p><strong>Alles Übrige funktioniert weiter:</strong> gespeicherte Daten ansehen und auswerten, Werte von Hand erfassen, sichern und laden.</p>
       <p class="small muted">Sobald wieder eine Verbindung besteht, die Seite neu laden – dann geht auch das Einlesen wieder.</p>`,
      `<button class="primary" data-tun="dlgZu">Verstanden</button>`);
  }
  toast('Lese '+liste.length+' Datei'+(liste.length>1?'en':'')+' …');
  const v=[];
  for(const f of liste){
    try{
      const roh=await f.file.arrayBuffer();
      const r=parseAuto(await pdfSeiten(roh.slice(0)),await pdfPunkte(roh.slice(0)));
      r.proben.forEach(p=>v.push(Object.assign({id:uid(),typ:r.typ||'blattsaft',labor:r.labor,
        quelle:{datei:f.pfad,text:(r.rohtext||'').slice(0,20000)},hinweise:(r.hinweise||[]).slice()},p)));
    }catch(e){toast('Fehler bei '+f.pfad+': '+e.message)}
  }
  if(v.length)pruefdialog(v);else toast('Es liessen sich keine Proben lesen.');
}

/* Felder nach Nährstoffgruppen sortiert statt in einem flachen Raster –
   in derselben Reihenfolge, in der sie im Laborbericht stehen. */
function feldGruppen(i,p,keys){
  const rest=keys.filter(k=>!GRUPPEN.some(g=>g[1].indexOf(k)>=0));
  const bloecke=GRUPPEN.concat(rest.length?[['Weitere Werte',rest]]:[])
    .map(([titel,ks])=>{
      const vorhanden=ks.filter(k=>keys.indexOf(k)>=0);
      if(!vorhanden.length)return '';
      return `<div style="margin-bottom:12px"><div class="lab" style="border-bottom:1px solid var(--line2);padding-bottom:3px;margin-bottom:7px">${esc(titel)}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px">
        ${vorhanden.map(k=>feldHtml(i,k,p.werte[k],p)).join('')}</div></div>`;
    }).join('');
  return bloecke||'<p class="muted small">Noch keine Messwerte – unten ergänzen.</p>';
}
function feldHtml(i,k,w,p){
  const o=(p&&p.optima&&p.optima[k])||null;
  const st=(w&&w.wert!=null&&o)?status(w.wert,o,w.unter):null;
  /* Diese Markierung soll Uebertragungsfehler fangen, nicht echte Extremwerte.
     Ammonium bei 178 gegen ein Optimum bis 55 ist real; Kalium bei 104000
     gegen 4800 ist ein verrutschtes Komma. Die Schwelle liegt deshalb hoch. */
  const weit=st&&!istOk(st)&&ausmass(w.wert,o)>5;
  return `<div data-feld="${esc(k)}"><label class="lab">${esc(NAME[k]||k)} <span class="muted">${esc(einheit(k))}</span></label>
  <input class="mono" style="width:100%${weit?';border-color:var(--alarm);background:var(--alarm-soft)':''}"
    value="${w&&w.wert!=null?(w.unter?'<':'')+w.wert:''}" data-aend="pruefFeld" data-i="${i}" data-w="${esc(k)}"
    title="Ein vorangestelltes &lt; kennzeichnet einen Wert unter der Nachweisgrenze.">
  <div class="tiny muted" style="margin-top:2px">${o?`Soll ${o[0]!=null?nz(o[0]):'offen'}–${o[1]!=null?nz(o[1]):'offen'}`:'&nbsp;'}${weit?' <span class="val-off">ungewöhnlich – bitte prüfen</span>':''}</div></div>`;
}
AKTION.feldDazu=d=>{
  const i=+d.i,k=el('neuP'+i).value,box=document.querySelector(`[data-werte="${i}"]`);
  if(!k||!box||box.querySelector(`[data-feld="${k}"]`))return;
  const ziel=box.querySelector('[data-feld]')?box.querySelector('[data-feld]').parentNode:box;
  ziel.insertAdjacentHTML('beforeend',feldHtml(i,k,null,PRUEF[i]));
  const o=el('neuP'+i).querySelector(`option[value="${k}"]`);if(o)o.remove();
};
AKTION.pruefFeld=()=>pruefPruefen();
function pruefLesen(){
  const v=PRUEF,body=el('dlgBody');
  body.querySelectorAll('[data-f]').forEach(e=>{
    const p=v[+e.dataset.i];if(!p)return;
    if(e.dataset.f==='ok')p.__ok=e.checked;
    else if(e.dataset.f==='tiefe')p.tiefe=toNum(e.value);
    else p[e.dataset.f]=e.value||null;
  });
  body.querySelectorAll('[data-s]').forEach(e=>{
    const p=v[+e.dataset.i];if(!p)return;
    p.__satzdaten=p.__satzdaten||{};p.__satzdaten[e.dataset.s]=e.value||null;
  });
  body.querySelectorAll('[data-w]').forEach(e=>{
    const p=v[+e.dataset.i];if(!p)return;
    const k=e.dataset.w,roh=String(e.value||'').trim(),n=toNum(roh);
    if(n==null)delete p.werte[k];else p.werte[k]={wert:n,unter:isLim(roh)};
  });
  return v;
}
function pruefPruefen(){
  const v=pruefLesen();let blocker=0;
  v.forEach((p,i)=>{
    const box=document.querySelector(`[data-warn="${i}"]`),ab=document.querySelector(`[data-alter="${i}"]`);
    if(!box)return;
    const w=[];
    if(p.__ok!==false){
      if(!p.datum)w.push('Probendatum fehlt.');
      if(p.typ==='blattsaft'&&!p.blattalter)w.push('Blattalter ist nicht zugeordnet. Ohne diese Angabe lassen sich Verlagerung und Verhältnisse nicht auswerten.');
      if(p.typ==='giesswasser'){
        if(!p.stelle)w.push('Ohne Namen der Entnahmestelle lassen sich Proben vom selben Tag nicht auseinanderhalten.');
        if(p.stelle&&p.datum&&db.analysen.some(x=>x.id!==p.id&&x.typ==='giesswasser'&&x.datum===p.datum&&(x.stelle||'')===p.stelle))
          w.push('Für diese Entnahmestelle und dieses Datum existiert bereits eine Probe.');
      }
      else if(!p.satz)w.push('Ohne Satznummer lässt sich die Probe keiner Kultur und keinem Alter zuordnen.');
      if(p.typ==='blattsaft'&&p.satz&&p.datum&&p.blattalter&&db.analysen.some(x=>x.id!==p.id&&x.typ==='blattsaft'&&x.satz===p.satz&&x.datum===p.datum&&x.blattalter===p.blattalter&&(x.zustand||'')===(p.zustand||'')))
        w.push('Für diesen Satz, dieses Datum und dieses Blattalter existiert bereits eine Probe.');
      if(p.typ==='blattsaft'&&p.blattalter&&v.some((q,j)=>j!==i&&q.__ok!==false&&q.typ==='blattsaft'&&q.satz===p.satz&&q.datum===p.datum&&q.blattalter===p.blattalter&&(q.zustand||'')===(p.zustand||'')))
        w.push('Zwei Proben in diesem Import tragen dieselbe Kennzeichnung.');
      if(!Object.keys(p.werte||{}).length)w.push('Keine Messwerte erfasst.');
      if(p.typ==='substrat'&&p.tiefe==null)w.push('Ohne Entnahmetiefe lässt sich diese Probe später nicht mit anderen vergleichen. Freiwillig, aber empfohlen.');
    }
    blocker+=w.filter(x=>/Blattalter|Probendatum fehlt/.test(x)).length;
    box.innerHTML=w.length?`<div class="note">${w.map(esc).join('<br>')}</div>`:'';
    if(ab){
      const aus=p.__satzdaten&&p.__satzdaten.aussaat;
      if(p.typ==='blattsaft'&&p.satz&&p.datum){
        if(aus){const wo=tage(aus,p.datum)/7;ab.textContent=`Kulturalter: Aussaat ${fmt(aus)} eingetragen → ${nz(wo,1)} Wochen bei der Probenahme.`}
        else{const g=ausKW(p.satz,p.datum);
          ab.innerHTML=g?`Kulturalter geschätzt: KW ${esc(p.satz.split('-')[0])} aus dem Satznamen → Aussaat rund ${fmt(g.datum)} → etwa ${nz(g.wochen,1)} Wochen bei der Probenahme.${g.plausibel?'':' <strong class="val-off">Das ist für Basilikum unplausibel – bitte das Aussaatdatum eintragen.</strong>'}`
            :'Kulturalter nicht bestimmbar – Satzname enthält keine Kalenderwoche.'}
      }else ab.textContent='';
    }
  });
  const b=el('btnUeber');
  if(b){b.disabled=blocker>0;const h=el('pruefHint');if(h)h.textContent=blocker?'Bitte zuerst die markierten Angaben ergänzen.':''}
}
AKTION.uebernehmen=()=>{
  const v=pruefLesen();let n=0;
  for(const p of v){
    if(p.__ok===false)continue;
    const sd=p.__satzdaten;
    const rein=Object.assign({},p);
    delete rein.__ok;delete rein.hinweise;delete rein.__satzdaten;delete rein.optArt;
    rein.optima=JSON.parse(JSON.stringify(rein.optima||{}));
    if(sd&&p.satz){const clean={};for(const k in sd)if(sd[k])clean[k]=sd[k];if(Object.keys(clean).length)satzSichern(p.satz,clean)}
    if(p.satz&&!db.saetze[p.satz])satzSichern(p.satz,{});
    const i=db.analysen.findIndex(x=>x.id===p.id);
    if(i>=0)db.analysen[i]=rein;else db.analysen.push(rein);
    n++;
  }
  db.analysen.sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));
  ueParams=null;aend();el('dlg').close();
  /* Nach dem Import nicht in der Liste stehen bleiben, sondern die Auswertung
     zeigen. Das ist der Schritt, an dem der Weg «Datei hochladen und
     verstehen» vorher endete. */
  const neuIds=[...new Set(v.filter(p=>p.__ok!==false&&p.typ==='blattsaft'&&p.satz&&p.datum)
    .map(p=>(p.satz||'?')+'|'+p.datum+'|'+(p.zustand||'')))];
  if(!PRUEF_BEARB&&neuIds.length){
    tab='lage';render();
    toast(`${n} Probe${n>1?'n':''} übernommen. Nicht vergessen: sichern.`);
    if(neuIds.length===1)setTimeout(()=>erhebungDetail(neuIds[0]),120);
    return;
  }
  render();
  toast(PRUEF_BEARB?'Gespeichert.':`${n} Probe${n>1?'n':''} übernommen. Nicht vergessen: sichern.`);
};

let sb='K',sbAchse='datum',sbRel=false;
function vNaehr(){
  const erh=erhebungen();
  if(!erh.length)return leerHinweis('Noch keine Blattsaftanalyse','Dieser Reiter zeigt einen einzelnen Nährstoff über die Zeit oder über das Kulturalter.',
    '<button class="primary" data-tun="reiter" data-reiter="analysen">Zu den Analysen</button>');
  const params=[...new Set(erh.flatMap(e=>alleProben(e).flatMap(p=>Object.keys(p.werte))))].filter(k=>k!=='K/Ca'&&NAME[k]);
  if(!params.includes(sb))sb=params.includes('K')?'K':params[0];
  const mob=MOBIL[sb]||'unbekannt';
  const inKern=kern().includes(sb);
  const ov=erh.map(e=>optVon(leitProbe(e)||{optima:{}},sb)).find(Boolean);
  const nachAlter=sbAchse==='woche';
  const mitAlter=erh.filter(e=>e.alter.woche!=null&&e.alter.plausibel);
  const proSatz=new Map();
  mitAlter.forEach(e=>{const l=proSatz.get(e.satz)||[];l.push(e);proSatz.set(e.satz,l)});
  const mehrfach=[...proSatz.values()].filter(a=>a.length>1).length;

  nachRender=()=>{
    let serien;
    if(nachAlter){
      serien=[...proSatz].map(([satz,liste],i)=>({name:'Satz '+satz,farbe:FARBEN[i%FARBEN.length],linie:liste.length>1,
        punkte:liste.map(e=>{const p=e.proben.jung||e.proben.misch||e.proben.alt;
          const wv=p&&p.werte[sb];if(!wv||wv.wert==null||wv.unter)return null;
          const y=sbRel?lage(wv.wert,optVon(p,sb)):wv.wert;
          return y==null?null:{x:e.alter.woche,y,xtext:nz(e.alter.woche,0)+' W',
            titel:`${satz} · ${fmt(e.datum)} · Woche ${nz(e.alter.woche,1)}: ${nz(wv.wert)} ${einheit(sb)}`}}).filter(Boolean)}))
        .filter(s=>s.punkte.length);
    }else{
      const gr=new Map();
      for(const e of erh)for(const al of ['jung','alt','misch']){
        const p=e.proben[al];if(!p)continue;
        const wv=p.werte[sb];if(!wv||wv.wert==null||wv.unter)continue;
        if(!gr.has(al))gr.set(al,[]);
        gr.get(al).push({e,p,v:wv.wert});
      }
      serien=[...gr].map(([al,arr],i)=>({name:al,farbe:FARBEN[i%FARBEN.length],strich:al==='alt'?'5 4':'',linie:true,
        punkte:arr.map(x=>({x:+new Date(x.e.datum),y:sbRel?lage(x.v,optVon(x.p,sb)):x.v,xtext:fmtK(x.e.datum),
          titel:`${x.e.satz} · ${fmt(x.e.datum)} · ${al}: ${nz(x.v)} ${einheit(sb)}`}))}));
    }
    chartLinien(el('cNaehr'),{serien,band:sbRel?null:ov,bands3:sbRel,xTyp:nachAlter?'zahl':'datum',
      xLabel:nachAlter?'Kulturwoche bei der Probenahme':'Probendatum',
      ereignisse:nachAlter?[]:db.ereignisse.filter(x=>!isNaN(+new Date(x.datum))).map(e=>({x:+new Date(e.datum),label:e.titel||e.typ})),hoehe:300});
    el('legNaehr').innerHTML=serien.map(s=>`<span><i style="background:${s.farbe}"></i>${esc(s.name)}</span>`).join('')
      +`<span class="muted">${sbRel?'Lage auf der Skala 0–3':'Einheit '+esc(einheit(sb))}</span>`;
  };

  const zeilen=erh.map(e=>{
    const wj=e.proben.jung&&e.proben.jung.werte[sb],wa=e.proben.alt&&e.proben.alt.werte[sb],wm=e.proben.misch&&e.proben.misch.werte[sb];
    const o=optVon(leitProbe(e),sb);
    const vj=wj&&!wj.unter?wj.wert:null,va=wa&&!wa.unter?wa.wert:null;
    return {e,wj,wa,wm,o,v:(vj!=null&&va)?vj/va:null,b:e.bew[sb]};
  });

  return `<div class="card"><div class="hd"><div><h2>${esc(NAME[sb]||sb)}</h2>
      <p class="sub">Ein Nährstoff, beide Blattalter, mit Sollbereich.</p></div>

      <span class="chip ${sbRel?'on':''}" data-tun="sbRel">Lage statt Absolutwert</span></div></div>
    <div class="row" style="gap:20px;align-items:flex-start;margin-bottom:14px">
      <div style="flex:1;min-width:290px"><h4>Verhalten in der Pflanze</h4><p class="small">${MOBILTEXT[mob]}</p></div>
      <div style="min-width:200px"><h4>Einordnung</h4>
        <div class="small">Mobilität: <strong>${esc(mob)}</strong></div>
        <div class="small">Massgebliches Blatt: <strong>${mob==='mobil'?'Altblatt':mob==='immobil'?'Jungblatt':'beide'}</strong></div>
        <div class="small">Einheit: ${esc(einheit(sb))}</div>
        <div class="small">Optimum: ${ov?`${ov[0]!=null?nz(ov[0]):'offen'}–${ov[1]!=null?nz(ov[1]):'offen'} <span class="tiny muted">(${esc(optQuelle(leitProbe(erh[0]),sb)||'')})</span>`:'nicht hinterlegt'}</div>
        <div class="small">In der Kennzahl: <strong>${inKern?'ja':'nein'}</strong></div></div>
    </div>
    <div id="cNaehr" class="scroll"></div><div class="legend" id="legNaehr"></div>
    ${nachAlter?(mehrfach?`<div class="note gut">${mehrfach} Satz${mehrfach>1?' wurden':' wurde'} mehrfach beprobt – dort entsteht eine echte Entwicklungskurve statt einer Punktwolke.</div>`
      :`<div class="note">Bisher wurde kein Satz zweimal beprobt. Jeder Punkt ist deshalb eine Momentaufnahme eines anderen Satzes an seinem jeweiligen Alter – zusammen ein grobes Bild, aber keine Entwicklung. Im Planer kannst du festlegen, welchen Satz ihr über seine Kulturzeit begleiten wollt.</div>`)
      :''}
    ${nachAlter&&erh.length>mitAlter.length?`<p class="tiny muted">${erh.length-mitAlter.length} Erhebung(en) fehlen hier, weil ihr Kulturalter unbekannt oder unplausibel ist.</p>`:''}
  </div>
  <div class="card"><h2>${esc(NAME[sb]||sb)} je Erhebung</h2>
    <div class="scroll"><table><thead><tr><th>Datum</th><th>Satz</th><th>Alter</th><th>jung</th><th>alt</th><th>jung/alt</th><th>Bewertung</th><th>Lesart</th></tr></thead><tbody>
    ${zeilen.map(r=>{
      const stj=r.wj?status(r.wj.wert,r.o,r.wj.unter):null,sta=r.wa?status(r.wa.wert,r.o,r.wa.unter):null;
      let lese='–';
      if(mob==='mobil'){
        lese=r.v!=null&&r.v>db.einst.verlagerung&&sta==='tief'?'Altblatt wird ausgeräumt – Angebot zu knapp, Jungblatt noch versorgt'
          :sta==='tief'&&stj==='tief'?'beide tief – flächige Unterversorgung'
          :sta==='tief'?'Altblatt tief'
          :sta==null?'am Altblatt nicht bewertbar':'unauffällig';
      }else if(mob==='immobil'){
        lese=stj==='tief'&&(sta==null||!(r.wa&&r.wa.wert<r.wj.wert*0.9))?'Jungblatt tief bei intaktem Altblatt – zuerst Klima und EC prüfen'
          :stj==='tief'?'Jungblatt tief':stj==null?'am Jungblatt nicht bewertbar':'unauffällig';
      }else{
        lese=(stj==='tief'||sta==='tief')?'unter Optimum':(stj==='hoch'||sta==='hoch')?'über Optimum':'unauffällig';
      }
      return `<tr><td class="mono">${fmt(r.e.datum)}</td><td class="mono">${esc(r.e.satz||'')} ${zustandTag(r.e.zustand)}</td>
        <td class="tiny">${alterTag(r.e.alter)}</td>
        <td style="min-width:150px">${balken(r.wj,r.o)}</td><td style="min-width:150px">${balken(r.wa,r.o)}</td>
        <td class="mono">${r.v!=null?nz(r.v,2):'–'}</td>
        <td>${r.b&&!r.b.fehlt?stPill(r.b.ok?(r.b.rand?'randtief':'ok'):(r.b.st==='tief'?'tief':'hoch')):'<span class="pill na">nicht in der Kennzahl</span>'}</td>
        <td class="small">${esc(lese)}</td></tr>`}).join('')}
    </tbody></table></div>
    ${zeilen.some(r=>(r.wj&&r.wj.unter)||(r.wa&&r.wa.unter))?'<p class="tiny muted" style="margin-top:8px">Werte mit vorangestelltem &lt; lagen unter der Nachweisgrenze und werden nicht bewertet.</p>':''}
    ${erh.some(e=>e.proben.misch)?'<p class="tiny muted">Mischproben erscheinen in dieser Tabelle nicht in den Spalten jung und alt – im Streifen im Überblick sind sie enthalten.</p>':''}
  </div>`;
}

/* ══════════ 11 · Wirkung ══════════ */
let wk=null,wkVor=null,wkNach=null;
function vWirkung(){
  const evs=[...db.ereignisse].filter(e=>e.datum).sort((a,b)=>a.datum.localeCompare(b.datum));
  if(!evs.length)return leerHinweis('Noch keine Änderung erfasst',
    'Das ist die Leitfrage: was haben unsere Entscheidungen bewirkt? Trage im Logbuch ein, was ihr geändert habt – Dünger, Dosierung, Substrat, ein Präparat. Danach vergleicht die App die Erhebung davor mit der danach.',
    '<button class="primary" data-tun="reiter" data-reiter="logbuch">Zum Logbuch</button>');
  if(!wk||!evs.some(e=>e.id===wk)){wk=evs[evs.length-1].id;wkVor=wkNach=null}
  const ev=evs.find(e=>e.id===wk);
  const betroffen=ev.geltung==='saetze'&&ev.saetze&&ev.saetze.length?ev.saetze:null;
  const erh=erhebungen();
  const passt=e=>!betroffen||betroffen.includes(e.satz);
  const autoVor=erh.filter(e=>e.datum<ev.datum&&passt(e)).pop();
  const autoNach=erh.find(e=>e.datum>=ev.datum&&passt(e));
  const vor=erh.find(e=>e.id===wkVor)||autoVor;
  const nach=erh.find(e=>e.id===wkNach)||autoNach;
  const opt=(e,sel)=>`<option value="${esc(e.id)}"${sel?' selected':''}>${fmt(e.datum)} · Satz ${esc(e.satz)}${e.zustand?' ('+esc(e.zustand)+')':''} · ${e.alter.woche!=null?(e.alter.sicher?'':'~')+nz(e.alter.woche,1)+' W':'Alter ?'}</option>`;

  let inhalt='';
  if(vor&&nach){
    const zeilen=kern().map(k=>{
      const bv=vor.bew[k],bn=nach.bew[k];
      if(!bv||bv.fehlt||!bn||bn.fehlt)return null;
      if(bv.art!==bn.art)return null;
      const mv=(bv.mass||bv.werte),mn=(bn.mass||bn.werte);
      const av=mittel(mv.map(w=>abstand(lage(w.wert,w.opt))).filter(x=>x!=null));
      const an=mittel(mn.map(w=>abstand(lage(w.wert,w.opt))).filter(x=>x!=null));
      if(av==null||an==null)return null;
      return {k,blatt:bv.art,vor:mittel(mv.map(w=>w.wert)),nach:mittel(mn.map(w=>w.wert)),
        delta:av-an,stNach:bn.ok?'ok':bn.st};
    }).filter(Boolean).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
    if(zeilen.length){
      nachRender=()=>chartProfil(el('cProfil'),zeilen);
      const bes=zeilen.filter(z=>z.delta>0.02).length,sch=zeilen.filter(z=>z.delta<-0.02).length;
      const iv=vor.index?Math.round(vor.index.anteil*100):null,inx=nach.index?Math.round(nach.index.anteil*100):null;
      const wochen=Math.round(tage(vor.datum,nach.datum)/7);
      const g=[];
      if(vor.satz!==nach.satz)g.push(`die Proben stammen aus verschiedenen Sätzen (${vor.satz} und ${nach.satz}), die sich auch ohne die Änderung unterscheiden würden`);
      if(vor.alter.woche!=null&&nach.alter.woche!=null&&Math.abs(vor.alter.woche-nach.alter.woche)>1.5)
        g.push(`die Bestände waren unterschiedlich alt (${nz(vor.alter.woche,1)} gegen ${nz(nach.alter.woche,1)} Wochen), und mit dem Alter erschöpft sich die Grunddüngung`);
      if(wochen>8)g.push(`zwischen den Erhebungen liegen ${wochen} Wochen, in denen sich auch die Jahreszeit verändert hat`);
      if(wochen<2)g.push(`zwischen der Änderung und der zweiten Erhebung liegen nur ${wochen===0?'wenige Tage':wochen+' Woche'} – im Blattsaft ist eine Wirkung meist erst nach zwei bis drei Wochen sichtbar`);
      const spaeter=db.ereignisse.filter(x=>x.id!==ev.id&&x.datum>ev.datum&&x.datum<=nach.datum);
      if(spaeter.length)g.push(`dazwischen liegen ${spaeter.length} weitere Einträge im Logbuch (${spaeter.map(x=>x.titel||x.typ).join(', ')})`);
      inhalt=`<div class="row" style="gap:26px;margin-bottom:12px">
        <div><h4>Anteil im Optimum</h4><div style="display:flex;align-items:baseline;gap:8px">
          <b style="font-family:'Bricolage Grotesque';font-size:24px">${iv==null?'–':iv+' %'}</b><span class="muted">→</span>
          <b style="font-family:'Bricolage Grotesque';font-size:24px" class="${(inx||0)>=(iv||0)?'val-ok':'val-off'}">${inx==null?'–':inx+' %'}</b></div></div>
        <div><h4>Bewegung</h4><div class="small">${bes} Nährstoffe Richtung Optimum, ${sch} davon weg</div>
          <div class="tiny muted">${zeilen.length} von ${kern().length} Nährstoffen vergleichbar, jeder am massgeblichen Blatt</div></div></div>
        <div id="cProfil" class="scroll"></div>
        <p class="tiny muted" style="margin-top:10px">Der Balken zeigt die Veränderung des Abstands zum Optimum, nicht die Rohdifferenz. Ein Wert, der von weit unter dem Soll auf knapp darunter steigt, wandert nach rechts, auch wenn er das Optimum noch nicht erreicht.
        Verglichen wird je Nährstoff dasselbe Blatt wie in der Kennzahl – phloemmobile am Altblatt, immobile am Jungblatt.</p>
        <div class="note">Das ist ein Indiz, kein Beweis.${g.length?' Konkret: '+esc(g.join('; '))+'.':''} Belastbar wird es, wenn dieselbe Änderung ein zweites Mal in dieselbe Richtung zeigt – oder über eine Vergleichsgruppe.</div>`;
    }else inhalt='<div class="note">Vorher und nachher gibt es keinen Nährstoff, der in beiden Erhebungen am selben Blatt beurteilbar wäre.</div>';
  }else inhalt='<div class="note">Für diese Änderung fehlt eine Erhebung davor oder danach. Der Rhythmus Analyse – Änderung – Analyse ist genau der, der hier auswertbar wird. Im Planer kannst du die nächste Beprobung dafür einplanen.</div>';

  /* Vergleichsgruppe: der einzige Modus, der Management von Alter und
     Jahreszeit trennt – gleiches Haus, gleiche Woche, nur ein Teil betroffen. */
  let gruppe='';
  if(betroffen){
    const fenster=[ev.datum,plus(ev.datum,56)];
    const nachher=erh.filter(e=>e.datum>=fenster[0]&&e.datum<=fenster[1]&&e.index);
    const a=nachher.filter(e=>betroffen.includes(e.satz)),b=nachher.filter(e=>!betroffen.includes(e.satz));
    gruppe=`<div class="card"><div class="hd"><div><h2>Vergleichsgruppe</h2>
      <p class="sub">Diese Änderung betrifft nur einen Teil der Sätze. Die übrigen standen im selben Haus, unter demselben Klima, in denselben Wochen – das ist der einzige Vergleich, der Management von Kulturalter und Jahreszeit trennt.</p></div></div>
      ${a.length&&b.length?`<div class="row" style="gap:30px">
        <div><h4>Betroffen (${esc(betroffen.join(', '))})</h4>
          <b style="font-family:'Bricolage Grotesque';font-size:24px" class="val-ok">${Math.round(mittel(a.map(e=>e.index.anteil))*100)} %</b>
          <div class="tiny muted">Mittel aus ${a.length} Erhebung${a.length>1?'en':''}</div></div>
        <div><h4>Nicht betroffen</h4>
          <b style="font-family:'Bricolage Grotesque';font-size:24px">${Math.round(mittel(b.map(e=>e.index.anteil))*100)} %</b>
          <div class="tiny muted">Mittel aus ${b.length} Erhebung${b.length>1?'en':''}</div></div>
        <div style="flex:1;min-width:230px"><h4>Unterschied</h4>
          <div class="small">${Math.round((mittel(a.map(e=>e.index.anteil))-mittel(b.map(e=>e.index.anteil)))*100)} Prozentpunkte zugunsten der ${mittel(a.map(e=>e.index.anteil))>=mittel(b.map(e=>e.index.anteil))?'betroffenen':'nicht betroffenen'} Sätze</div></div></div>
      <div class="note">Auch das ist noch kein Beweis: Die Sätze wurden nicht zufällig zugeteilt, und bei ${a.length+b.length} Erhebungen trägt der Vergleich noch wenig. Aber er ist der belastbarste, den euer Betrieb im laufenden Geschäft erzeugen kann.</div>`
      :`<div class="note">Im Fenster von acht Wochen nach der Änderung fehlt ${!a.length?'eine Erhebung in den betroffenen Sätzen':'eine Erhebung in den übrigen Sätzen'}. Beprobt beide Gruppen im selben Zeitraum, dann entsteht hier ein echter Vergleich.</div>`}
    </div>`;
  }

  /* Rundgänge: nur die des betroffenen Bereichs, nicht alle vermischt */
  const t=+new Date(ev.datum),f=42*864e5;
  const rgPasst=r=>!betroffen||r.satz==='alle'||betroffen.includes(r.satz);
  const vorR=db.rundgaenge.filter(r=>{const x=+new Date(r.datum);return x<t&&x>=t-f&&rgPasst(r)});
  const nachR=db.rundgaenge.filter(r=>{const x=+new Date(r.datum);return x>=t&&x<=t+f&&rgPasst(r)});
  const arten=[...new Set([...vorR,...nachR].flatMap(r=>r.eintraege.map(e=>e.schaden)))];
  const mit=(rs,art)=>{const v=rs.map(r=>{const x=r.eintraege.find(y=>y.schaden===art);return x?x.stufe:null}).filter(x=>x!=null);return v.length?mittel(v):null};
  const bef=arten.map(art=>({art,vor:mit(vorR,art),nach:mit(nachR,art)})).filter(x=>x.vor!=null||x.nach!=null);

  return `<div class="card"><div class="hd"><div><h2>Wirkung einer Änderung</h2>
      <p class="sub">${esc(ev.typ)}${ev.titel?' · '+esc(ev.titel):''} vom ${fmt(ev.datum)}${betroffen?` · nur Sätze ${esc(betroffen.join(', '))}`:' · ganzes Haus'}</p></div>
    <select data-aend="wkWahl">${evs.map(e=>`<option value="${esc(e.id)}"${e.id===wk?' selected':''}>${fmt(e.datum)} – ${esc(e.titel||e.typ)}</option>`).join('')}</select></div>
    <div class="row" style="margin-bottom:14px">
      <div><label class="lab">Erhebung davor</label><select data-aend="wkVor">
        ${erh.filter(e=>e.datum<ev.datum).map(e=>opt(e,vor&&e.id===vor.id)).join('')||'<option>keine</option>'}</select></div>
      <div><label class="lab">Erhebung danach</label><select data-aend="wkNach">
        ${erh.filter(e=>e.datum>=ev.datum).map(e=>opt(e,nach&&e.id===nach.id)).join('')||'<option>keine</option>'}</select></div>
      <div class="tiny muted" style="max-width:300px">Am aussagekräftigsten ist ein Paar aus demselben Satz oder wenigstens aus Beständen ähnlichen Alters.</div>
    </div>
    ${inhalt}</div>
  ${gruppe}
  <div class="card"><div class="hd"><div><h2>Befall in derselben Zeit</h2>
    <p class="sub">Mittlere Befallsstufe der Rundgänge sechs Wochen davor und danach${betroffen?', nur für die betroffenen Sätze und Ganzhaus-Rundgänge':''} – als Beobachtung nebeneinander, nicht als Zusammenhang.</p></div></div>
    ${bef.length?`<div class="scroll"><table><thead><tr><th>Schaden</th><th>davor</th><th>danach</th><th>Richtung</th></tr></thead><tbody>
      ${bef.map(x=>{const d=(x.nach==null?0:x.nach)-(x.vor==null?0:x.vor);
        return `<tr><td>${esc(schaden(x.art).name)}</td><td class="mono">${x.vor==null?'–':nz(x.vor,1)}</td><td class="mono">${x.nach==null?'–':nz(x.nach,1)}</td>
        <td>${x.vor==null||x.nach==null?'<span class="muted">nicht vergleichbar</span>':d<-0.2?'<span class="pill ok">zurückgegangen</span>':d>0.2?'<span class="pill off">zugenommen</span>':'<span class="pill na">unverändert</span>'}</td></tr>`}).join('')}
      </tbody></table></div>
      <div class="note">Befallsdruck folgt zuerst Jahreszeit und Klima. Ob die Ernährung mitspielt, lässt sich aus solchen Paaren nicht ableiten. Die App behauptet hier bewusst keine Kausalität.</div>`
      :'<p class="muted small">In diesem Zeitfenster liegen keine passenden Rundgänge vor.</p>'}</div>`;
}
AKTION.wkWahl=(d,ev)=>{wk=ev.target.value;wkVor=wkNach=null;render()};
AKTION.wkVor=(d,ev)=>{wkVor=ev.target.value;render()};
AKTION.wkNach=(d,ev)=>{wkNach=ev.target.value;render()};

/* ══════════ 12 · Substrat und Wasser ══════════ */
/* Richtwerte für das Substrat sind GESETZTE ANNAHMEN, keine Laborvorgaben.
   Labor Ins liefert zu Substratproben keine Optimum-Bereiche. Die Zahlen unten
   sind Orientierungswerte für Topfkultur im H2O-Auszug und in den Einstellungen
   änderbar. Sie entscheiden nur über die Einordnung «Angebot knapp / reicht»,
   nie über eine Zahl, die als Messwert erscheint. */
const RICHT_VORGABE={sub_Nmin:[50,150],sof_K2O:[80,250],sof_Mg:[30,120],sof_Ca:[100,400],sub_pH:[5.5,6.5],sub_Salz:[0.8,2.0]};
/* Woher die Zahlen stammen – damit nachvollziehbar bleibt, worauf sie beruhen. */
const RICHT_HERKUNFT={
  sub_Nmin:'Orientierungswert für Topfkultur im H2O-Auszug. Nicht vom Labor vorgegeben.',
  sof_K2O:'Orientierungswert für Topfkultur im H2O-Auszug. Nicht vom Labor vorgegeben.',
  sof_Mg:'Orientierungswert für Topfkultur im H2O-Auszug. Nicht vom Labor vorgegeben.',
  sof_Ca:'Orientierungswert für Topfkultur im H2O-Auszug. Nicht vom Labor vorgegeben.',
  sub_pH:'Bereich, in dem Mangan, Eisen und Phosphor gleichzeitig verfügbar bleiben. Lehrbuchwissen, kein Laborwert.',
  sub_Salz:'Orientierungswert für Topfkultur. Nicht vom Labor vorgegeben.'};
const richtVon=k=>((db.einst.richt&&db.einst.richt[k])||RICHT_VORGABE[k]||null);

function vSubstrat(){
  const subs=db.analysen.filter(a=>a.typ==='substrat'&&a.datum).sort((a,b)=>b.datum.localeCompare(a.datum));
  const erh=erhebungen();

  /* Paare bilden: Substratprobe und Blattsafterhebung desselben Satzes */
  const paare=[];
  for(const e of erh){
    const sub=substratZu(e.satz,e.datum);
    if(!sub)continue;
    const zeilen=PAARE.map(P=>{
      const sw=sub.werte[P.sub],b=e.bew[P.blatt];
      if(!sw||sw.wert==null||sw.unter)return null;
      const r=richtVon(P.sub);
      const angebot=r?(sw.wert<r[0]?'knapp':sw.wert>r[1]?'reichlich':'ausreichend'):'unbekannt';
      const aufnahme=(!b||b.fehlt)?null:(b.ok?'ok':b.st);
      let art='offen',text='';
      if(aufnahme==null){art='offen';text='Im Blattsaft ist dieser Nährstoff nicht bewertbar – ohne ihn lässt sich Angebot und Aufnahme nicht trennen.'}
      else if(aufnahme==='ok'){art='ok';text='Angebot und Aufnahme passen zusammen. Hier ist nichts zu tun.'}
      else if(aufnahme==='hoch'){art='ok';text='Im Blattsaft liegt der Nährstoff über dem Optimum – die Zufuhr ist eher zu hoch als zu tief.'}
      else if(angebot==='knapp'){art='angebot';text='Beides ist tief: Es fehlt am Angebot, nicht an der Aufnahme. Zudüngen wirkt hier.'}
      else if(angebot==='unbekannt'){art='offen';text='Ohne Richtwert für das Substrat lässt sich das Angebot nicht einordnen.'}
      else{art='aufnahme';text='Im Substrat ist genug vorhanden, im Blattsaft nicht. Das ist ein Aufnahmeproblem – mehr desselben Düngers wirkt hier kaum.'}
      return {P,sw,b,r,angebot,aufnahme,art,text};
    }).filter(Boolean);
    if(zeilen.length)paare.push({e,sub,zeilen,abstand:tage(sub.datum,e.datum)});
  }
  paare.sort((a,b)=>b.e.datum.localeCompare(a.e.datum));
  const jung=erh.length?erh[erh.length-1]:null;

  let s='';
  /* ── Angebot gegen Aufnahme ── */
  s+=`<div class="card"><div class="hd"><div><h2>Angebot gegen Aufnahme</h2>
    <p class="sub">Der direkteste Weg zur Frage «liegt es am Angebot oder an der Aufnahme». Links steht, was im Substrat bereitliegt, rechts, was in der Pflanze ankommt. Nur wenn beides tief ist, hilft mehr Dünger.</p></div></div>`;
  if(!paare.length){
    s+=`<div class="leer"><h3>Noch kein Paar aus Substrat- und Blattsaftprobe</h3>
      <p class="muted" style="max-width:58ch;margin:0 auto">Dafür braucht es zu einem Satz beides: eine Substratanalyse und eine Blattsaftanalyse innerhalb von sechs Wochen.
      ${subs.length?`Es sind ${subs.length} Substratanalyse${subs.length>1?'n':''} erfasst, aber keine passt zeitlich zu einer Blattsafterhebung desselben Satzes.`:'Bisher ist keine Substratanalyse erfasst.'}</p></div>`;
  }
  for(const pa of paare){
    s+=`<div style="border:1px solid var(--line);border-radius:var(--rs);padding:14px;margin-bottom:12px;background:var(--card2)">
      <div class="hd" style="margin-bottom:10px"><div><h3>Satz ${esc(pa.e.satz)} ${zustandTag(pa.e.zustand)}</h3>
        <p class="tiny muted">Blattsaft ${fmt(pa.e.datum)} · Substrat ${fmt(pa.sub.datum)}${pa.sub.tiefe?` aus ${esc(pa.sub.tiefe)} cm Tiefe`:' · Entnahmetiefe nicht erfasst'}
          · ${Math.abs(pa.abstand)} Tage ${pa.abstand>0?'vor':pa.abstand<0?'nach':'am selben Tag wie'} der Blattprobe</p></div></div>
      ${Math.abs(pa.abstand)>14?`<div class="note">Zwischen den beiden Proben liegen ${Math.abs(pa.abstand)} Tage. In dieser Zeit ändert sich das Substrat durch Aufnahme, Mineralisierung und Nachdüngung deutlich – der Vergleich ist ein Anhaltspunkt, kein Momentbild. Am aussagekräftigsten sind Proben aus derselben Woche.</div>`:''}
      ${pa.abstand<-3?`<div class="note">Die Substratprobe ist <strong>jünger</strong> als die Blattprobe. Sie zeigt damit nicht das Angebot, aus dem die Pflanze zum Zeitpunkt der Blattanalyse geschöpft hat. Lies das Paar entsprechend vorsichtig.</div>`:''}`;
    for(const z of pa.zeilen){
      const bw=z.b&&!z.b.fehlt?z.b.werte.filter(x=>x.st!=null):[];
      s+=`<div class="paar">
        <div><div class="tiny muted">Angebot im Substrat</div>
          <div class="mono"><strong>${nz(z.sw.wert)}</strong> ${esc(einheit(z.P.sub))} <span class="tiny muted">${esc(NAME[z.P.sub])}</span></div>
          <div class="tiny">${z.r?`Richtwert ${nz(z.r[0])}–${nz(z.r[1])} <span class="tag schaetz">Annahme</span>`:'kein Richtwert hinterlegt'}
            ${z.angebot!=='unbekannt'?`· <strong>${esc(z.angebot)}</strong>`:''}</div></div>
        <div class="pfeil">→</div>
        <div><div class="tiny muted">Aufnahme in der Pflanze</div>
          <div class="mono">${bw.length?bw.map(x=>`<strong>${nz(x.wert)}</strong> <span class="tiny muted">${esc(x.blattalter)}</span>`).join(' · '):'<span class="muted">nicht bewertbar</span>'} ${bw.length?esc(einheit(z.P.blatt)):''}</div>
          <div class="tiny">${esc(NAME[z.P.blatt])}${z.b&&!z.b.fehlt?' · '+stPill(z.b.ok?'ok':z.b.st):''}</div></div>
      </div>
      <div class="deutung ${z.art==='angebot'?'angebot':z.art==='aufnahme'?'aufnahme':z.art==='ok'?'ok':''}">
        <strong>${esc(z.P.titel)}:</strong> ${esc(z.text)}
        <div class="tiny" style="margin-top:4px;opacity:.85">${esc(z.P.hinweis)}</div></div>`;
    }
    /* pH-Folgen */
    const ph=pa.sub.werte.sub_pH;
    if(ph&&ph.wert!=null){
      const treffer=PH_FOLGEN.filter(f=>{
        const b=pa.e.bew[f.k];if(!b||b.fehlt)return false;
        if(f.richtung==='hoch')return ph.wert<f.schwelle&&b.st==='hoch';
        return ph.wert>f.schwelle&&b.st==='tief';
      });
      s+=`<div class="deutung ${treffer.length?'aufnahme':'ok'}" style="margin-top:8px">
        <strong>Substrat-pH ${nz(ph.wert,1)}</strong>${(()=>{const r=richtVon('sub_pH');return r?` · Richtwert ${nz(r[0],1)}–${nz(r[1],1)} <span class="tag schaetz">Annahme</span>`:''})()}
        ${treffer.length?'<br>'+treffer.map(f=>esc(NAME[f.k]+': '+f.text)).join('<br>'):'<br>Keine der hinterlegten pH-Folgen trifft auf diese Erhebung zu.'}</div>`;
    }else s+=`<div class="note neutral" style="margin-top:8px">Für diese Substratprobe ist kein pH erfasst. Der pH entscheidet über die Verfügbarkeit von Mangan, Eisen und Phosphor – ohne ihn lässt sich nicht sagen, ob ein Nährstoff fehlt oder nur festgelegt ist.</div>`;
    s+='</div>';
  }
  if(paare.length)s+=`<div class="note neutral">Die Richtwerte für das Substrat sind gesetzte Annahmen für Topfkultur, keine Laborvorgaben – Labor Ins liefert zu Substratproben keine Optimum-Bereiche. Sie entscheiden nur über die Einordnung «knapp» oder «ausreichend»; die Messwerte selbst bleiben unberührt. Unter «Sätze &amp; Einstellungen» änderbar.</div>`;
  s+='</div>';

  /* ── Substratanalysen ── */
  s+=`<div class="card"><div class="hd"><div><h2>Substratanalysen (${subs.length})</h2>
    <p class="sub">Reserven im AAE10-Auszug, sofort Verfügbares im H2O-Auszug, dazu Spurenelemente, Salz, Nmin und pH.</p></div>
    <button data-tun="manuellNeu" data-typ="substrat">Von Hand erfassen</button></div>
    ${subs.length?`<div class="scroll"><table><thead><tr><th>Datum</th><th>Satz</th><th>Tiefe</th><th>pH</th><th>Nmin</th><th>Salz</th><th>K₂O sofort</th><th>Werte</th></tr></thead><tbody>
    ${subs.map(a=>`<tr class="klick" data-tun="detail" data-id="${esc(a.id)}">
      <td class="mono">${fmt(a.datum)}</td><td class="mono">${esc(a.satz||'–')} ${zustandTag(a.zustand)}</td>
      <td class="mono tiny">${a.tiefe?esc(a.tiefe)+' cm':'<span class="muted">–</span>'}</td>
      <td class="mono">${zeigeWert(a.werte.sub_pH,1)}</td><td class="mono">${zeigeWert(a.werte.sub_Nmin)}</td>
      <td class="mono">${zeigeWert(a.werte.sub_Salz,2)}</td><td class="mono">${zeigeWert(a.werte.sof_K2O)}</td>
      <td class="mono tiny">${Object.keys(a.werte).length}</td></tr>`).join('')}
    </tbody></table></div>
    ${subs.some(a=>!a.tiefe)?`<div class="note">${subs.filter(a=>!a.tiefe).length} Substratprobe(n) ohne Entnahmetiefe. Bei Ebbe und Flut steigt Wasser von unten und verdunstet oben – Salze wandern nach oben, die Wurzelspitzen sitzen unten. Eine Probe aus 2 cm und eine aus 8 cm sind zwei verschiedene Welten. Ohne die Angabe sind Substratproben untereinander nur eingeschränkt vergleichbar.</div>`:''}`
    :'<p class="muted small">Noch keine Substratanalyse erfasst.</p>'}</div>`;

  return s;
}
AKTION.messung=()=>{
  const d=el('mDatum').value;if(!d)return toast('Datum fehlt.');
  const ph=toNum(el('mPh').value),ec=toNum(el('mEc').value),ecF=toNum(el('mEcF').value),tp=toNum(el('mTemp').value);
  if(ph==null&&ec==null&&ecF==null&&tp==null)return toast('Bitte mindestens einen Wert eintragen.');
  db.messungen.push({id:uid(),datum:d,ph,ec,ecFrisch:ecF,temp:tp,notiz:el('mNotiz').value||null});
  aend();render();toast('Messung eingetragen.');
};
AKTION.messungWeg=d=>{db.messungen=db.messungen.filter(y=>y.id!==d.id);aend();render()};

/* ══════════ 12b · Giesswasser ══════════
   Das Wasser ist die Quelle des Kreislaufs. Was hier hereinkommt, reichert
   sich an, weil in einem Ebbe-Flut-System nichts abfliesst.
   Die Richtwerte sind gesetzte Annahmen mit offengelegter Herkunft. */
const GW_RICHT_VORGABE={
  gw_EC:  {bis:0.5, text:'Ab hier bringt das Wasser selbst nennenswert Salz mit, das bei jeder Gabe im Kreislauf bleibt.'},
  gw_Na:  {bis:1.5, text:'Natrium wird von der Pflanze kaum aufgenommen und reichert sich im Umlauf an.'},
  gw_Cl:  {bis:1.5, text:'Chlorid verhält sich wie Natrium: es bleibt im Kreislauf zurück.'},
  gw_HCO3:{bis:4.0, text:'Hydrogencarbonat puffert den pH nach oben und verbraucht Säure. Über diesem Wert ist eine pH-Korrektur üblich.'},
  gw_Fe:  {bis:20,  text:'Höhere Eisengehalte können in Tropfern und Düsen ausfallen.'},
  gw_Mn:  {bis:20,  text:'Wie Eisen – Ausfällungsgefahr in der Technik.'}};
const GW_HERKUNFT='Orientierungswert für Giesswasser im geschlossenen Kreislauf. Nicht vom Labor vorgegeben und nicht aus der Literatur belegt – eine gesetzte Annahme wie die Schwellen im Regelwerk.';
const gwRichtVon=k=>{
  const eig=db.einst.gwRicht&&db.einst.gwRicht[k];
  const vor=GW_RICHT_VORGABE[k];
  if(!vor)return null;
  return {bis:(eig!=null?eig:vor.bis),text:vor.text};
};
const gwProben=()=>db.analysen.filter(a=>a.typ==='giesswasser'&&a.datum)
  .slice().sort((a,b)=>b.datum.localeCompare(a.datum)||String(a.stelle||'').localeCompare(String(b.stelle||'')));
const gwStelle=a=>a.stelle||'ohne Namen';
/* Farbe je Entnahmestelle, damit Proben vom selben Tag unterscheidbar bleiben */
function gwFarben(){
  const st=[...new Set(gwProben().map(gwStelle))].sort();
  const m={};st.forEach((x,i)=>m[x]=FARBEN[i%FARBEN.length]);
  return m;
}
let gwParam='gw_HCO3';
function vGiess(){
  const alle=gwProben();
  const farbe=gwFarben();
  const stellen=[...new Set(alle.map(gwStelle))].sort();
  const messungen=[...db.messungen].sort((a,b)=>b.datum.localeCompare(a.datum));
  const rel=db.ereignisse.filter(e=>EVTYPEN[e.typ]&&EVTYPEN[e.typ].kreis).sort((a,b)=>b.datum.localeCompare(a.datum));
  const altFormat=alle.filter(a=>a.einheitAlt);

  if(!alle.length&&!messungen.length)return leerHinweis('Noch kein Giesswasser erfasst',
    'Das Giesswasser ist die Quelle des Kreislaufs. In einem Ebbe-Flut-System fliesst nichts ab – was im Wasser hereinkommt, bleibt drin und reichert sich an. Ohne diese Analyse lässt sich nicht sagen, ob Natrium und Chlorid von aussen kommen oder erst im Umlauf entstehen.<br><br>Die Wasserberichte von NovaCropControl werden automatisch gelesen, auch die mit Historie.',
    '<button class="primary" data-tun="pdfWaehlen">Wasserbericht einlesen</button> <button data-tun="manuellNeu" data-typ="giesswasser">Von Hand erfassen</button>');

  nachRender=()=>{
    /* Verlauf: eine Serie je Entnahmestelle, der Name steht im Tooltip */
    const serien=stellen.map(st=>({name:st,farbe:farbe[st],
      punkte:alle.filter(a=>gwStelle(a)===st&&a.werte[gwParam]&&a.werte[gwParam].wert!=null)
        .map(a=>({x:+new Date(a.datum),y:a.werte[gwParam].wert,xtext:fmtK(a.datum),
          titel:`${fmt(a.datum)}: ${a.werte[gwParam].unter?'unter der Nachweisgrenze, ':''}${nz(a.werte[gwParam].wert)} ${einheit(gwParam)}`}))}))
      .filter(x=>x.punkte.length);
    const r=gwRichtVon(gwParam);
    chartLinien(el('cGw'),{serien,band:r?[null,r.bis]:null,bandLabel:'Richtwert (Annahme)',xTyp:'datum',xLabel:'Probendatum',hoehe:280});
    el('legGw').innerHTML=serien.map(x=>`<span><i style="background:${x.farbe}"></i>${esc(x.name)}</span>`).join('')
      +`<span class="muted">${esc(einheit(gwParam))}</span>`+(r?`<span class="muted">grünes Band: bis ${nz(r.bis)} <span class="tag schaetz">Annahme</span></span>`:'');
    if(messungen.length){
      const ms=[
        {name:'pH Rücklauf',farbe:FARBEN[0],punkte:db.messungen.filter(x=>x.ph!=null).map(x=>({x:+new Date(x.datum),y:x.ph,xtext:fmtK(x.datum),titel:'pH '+nz(x.ph,2)+' am '+fmt(x.datum)}))},
        {name:'EC Rücklauf',farbe:FARBEN[1],punkte:db.messungen.filter(x=>x.ec!=null).map(x=>({x:+new Date(x.datum),y:x.ec,xtext:fmtK(x.datum),titel:'EC '+nz(x.ec,2)+' am '+fmt(x.datum)}))},
        {name:'EC frisch angesetzt',farbe:FARBEN[2],strich:'5 4',punkte:db.messungen.filter(x=>x.ecFrisch!=null).map(x=>({x:+new Date(x.datum),y:x.ecFrisch,xtext:fmtK(x.datum),titel:'EC frisch '+nz(x.ecFrisch,2)}))}
      ].filter(x=>x.punkte.length);
      chartLinien(el('cKreis'),{serien:ms,xTyp:'datum',xLabel:'Datum',
        ereignisse:rel.filter(x=>!isNaN(+new Date(x.datum))).map(e=>({x:+new Date(e.datum),label:e.titel||e.typ}))});
      el('legKreis').innerHTML=ms.map(x=>`<span><i style="background:${x.farbe}"></i>${esc(x.name)}</span>`).join('');
    }
  };

  let s='';
  if(altFormat.length)s+=`<div class="note warn">${altFormat.length} Wasseranalyse${altFormat.length>1?'n wurden':' wurde'} vor der Umstellung von Hand erfasst.
    Damals waren die Felder als mg/l beschriftet, das Labor liefert aber mmol/l und µmol/l. Bitte diese Werte kontrollieren.</div>`;

  s+=`<div class="kpis">
    <div class="kpi"><h4>Entnahmestellen</h4><b>${stellen.length}</b><span class="tiny muted">${alle.length} Proben insgesamt</span></div>
    <div class="kpi"><h4>Neueste Probe</h4><b>${alle.length?fmtK(alle[0].datum):'–'}</b><span class="tiny muted">${alle.length?esc(gwStelle(alle[0])):'noch keine'}</span></div>
    <div class="kpi"><h4>Messungen am Tank</h4><b>${messungen.length}</b><span class="tiny muted">pH und EC im Rücklauf</span></div>
  </div>`;

  /* ── Karten je Entnahmestelle ── */
  if(stellen.length){
    s+=`<div class="hd" style="margin:20px 0 12px"><div><h2>Neueste Probe je Entnahmestelle</h2>
      <p class="sub">Jede Entnahmestelle ist eine eigene Reihe. Proben vom selben Tag aus verschiedenen Stellen stehen nebeneinander und tragen jeweils ihren Namen.</p></div></div>`;
    for(const st of stellen){
      const p=alle.find(a=>gwStelle(a)===st);
      const leit=['gw_EC','gw_pH','gw_HCO3','gw_Na','gw_Cl','gw_NO3','gw_NH4'].filter(k=>p.werte[k]);
      const hin=[];
      for(const k of Object.keys(GW_RICHT_VORGABE)){
        const w=p.werte[k],r=gwRichtVon(k);
        if(!w||w.wert==null||w.unter||!r)continue;
        if(w.wert>r.bis)hin.push({k,w,r});
      }
      /* Was schon im Wasser mitkommt */
      const naehr=['gw_NO3','gw_NH4','gw_K','gw_Ca','gw_Mg','gw_S','gw_P']
        .filter(k=>p.werte[k]&&p.werte[k].wert!=null&&!p.werte[k].unter&&p.werte[k].wert>0);
      s+=`<div class="card"><div class="hd">
        <div><h2 style="display:flex;align-items:center;gap:8px"><span style="width:11px;height:11px;border-radius:50%;background:${farbe[st]};flex:none"></span>${esc(st)}</h2>
          <p class="sub">${fmt(p.datum)}${p.kultur?' · '+esc(p.kultur):''}${p.laborId?' · Probe '+esc(p.laborId):''}
          ${alle.filter(a=>gwStelle(a)===st).length>1?` · ${alle.filter(a=>gwStelle(a)===st).length} Proben insgesamt`:''}</p></div>
        <button data-tun="detail" data-id="${esc(p.id)}">Alle Werte ansehen</button></div>
        <div class="row" style="gap:20px">
          ${leit.map(k=>`<div><div class="tiny muted">${esc(NAME[k].replace(' (Wasser)','').replace(' (Giesswasser)',''))}</div>
            <div class="mono" style="font-size:16px">${zeigeWert(p.werte[k])} <span class="tiny muted">${esc(einheit(k))}</span></div>
            ${einheit(k)==='mmol/l'&&inMgL(k,p.werte[k].wert)!=null?`<div class="tiny muted">${nz(inMgL(k,p.werte[k].wert),1)} mg/l</div>`:''}</div>`).join('')}
        </div>
        ${hin.length?hin.map(x=>`<div class="deutung angebot" style="margin-top:8px">
          <strong>${esc(NAME[x.k].replace(' (Wasser)','').replace(' (Giesswasser)',''))} über dem Richtwert:</strong>
          ${nz(x.w.wert)} ${esc(einheit(x.k))} gegen ${nz(x.r.bis)} <span class="tag schaetz">Annahme</span><br>${esc(x.r.text)}</div>`).join('')
          :'<div class="deutung ok" style="margin-top:8px">Alle hinterlegten Richtwerte eingehalten. Das Wasser bringt weder auffällig viel Ballast noch viel Puffer mit.</div>'}
        ${naehr.length?`<details style="margin-top:8px"><summary>Was mit dem Wasser schon an Nährstoffen hereinkommt</summary>
          <div class="scroll" style="margin-top:8px"><table><thead><tr><th>Nährstoff</th><th>im Wasser</th><th>entspricht</th></tr></thead><tbody>
          ${naehr.map(k=>`<tr><td>${esc(NAME[k].replace(' (Wasser)',''))}</td>
            <td class="mono">${nz(p.werte[k].wert)} ${esc(einheit(k))}</td>
            <td class="mono tiny">${inMgL(k,p.werte[k].wert)!=null?nz(inMgL(k,p.werte[k].wert),1)+' mg/l':'–'}</td></tr>`).join('')}
          </tbody></table></div>
          <p class="tiny muted" style="margin-top:6px">Diese Mengen sind vor jeder Düngung schon im Wasser. Eine Dosierungsrechnung baut die App bewusst nicht – sie zeigt nur, was da ist.</p></details>`:''}
      </div>`;
    }
  }

  /* ── Vergleichstabelle ── */
  if(alle.length>1){
    const spalten=alle.slice(0,6);
    const params=GW_PARAM.map(k=>'gw_'+k).filter(k=>spalten.some(a=>a.werte[k]));
    s+=`<div class="card"><div class="hd"><div><h2>Alle Proben nebeneinander</h2>
      <p class="sub">${spalten.length} Proben, neueste zuerst. Die Farbe kennzeichnet die Entnahmestelle – so bleiben Proben vom selben Tag unterscheidbar.</p></div></div>
      <div class="scroll"><table><thead><tr><th>Parameter</th>
        ${spalten.map(a=>`<th title="${esc(gwStelle(a))} · ${fmt(a.datum)}${a.laborId?' · Probe '+esc(a.laborId):''}">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${farbe[gwStelle(a)]};margin-right:5px"></span>
          ${fmtK(a.datum)}<div style="font-weight:400;text-transform:none;letter-spacing:0">${esc(gwStelle(a).slice(0,18))}</div></th>`).join('')}
        <th>Einheit</th></tr></thead><tbody>
      ${params.map(k=>{
        const r=gwRichtVon(k);
        return `<tr><td><strong>${esc(NAME[k].replace(' (Wasser)','').replace(' (Giesswasser)',''))}</strong>
          ${r?`<div class="tiny muted">Richtwert bis ${nz(r.bis)}</div>`:''}</td>
        ${spalten.map(a=>{const w=a.werte[k];
          const ueber=w&&w.wert!=null&&!w.unter&&r&&w.wert>r.bis;
          return `<td class="mono${ueber?' val-off':''}" title="${esc(gwStelle(a))} · ${fmt(a.datum)}">${w?zeigeWert(w):'–'}</td>`}).join('')}
        <td class="tiny muted">${esc(einheit(k))}</td></tr>`}).join('')}
      </tbody></table></div>
      ${alle.length>6?`<p class="tiny muted">${alle.length-6} ältere Proben nicht angezeigt – sie stehen im Verlauf unten.</p>`:''}
      <p class="tiny muted">Werte über dem hinterlegten Richtwert sind farbig. Die Richtwerte sind gesetzte Annahmen, siehe unten.</p>
    </div>`;
  }

  /* ── Verlauf ── */
  if(alle.length>1){
    const wahl=GW_PARAM.map(k=>'gw_'+k).filter(k=>alle.some(a=>a.werte[k]));
    if(wahl.indexOf(gwParam)<0)gwParam=wahl[0];
    s+=`<div class="card"><div class="hd"><div><h2>Verlauf</h2>
      <p class="sub">Ein Parameter über die Zeit, eine Linie je Entnahmestelle. Mit dem Zeiger über einem Punkt erscheint Name, Datum und Wert.</p></div>
      <select data-aend="gwParam">${wahl.map(k=>`<option value="${esc(k)}"${gwParam===k?' selected':''}>${esc(NAME[k].replace(' (Wasser)','').replace(' (Giesswasser)',''))}</option>`).join('')}</select></div>
      <div id="cGw" class="scroll"></div><div class="legend" id="legGw"></div></div>`;
  }

  /* ── Kreislauf ── */
  const letzt=db.messungen.filter(x=>x.ec!=null&&x.ecFrisch!=null).sort((a,b)=>a.datum.localeCompare(b.datum)).slice(-1)[0];
  const ecReihe=db.messungen.filter(x=>x.ec!=null).sort((a,b)=>a.datum.localeCompare(b.datum));
  let trend='';
  if(ecReihe.length>=4){
    const h=ecReihe.slice(-3),v=ecReihe.slice(0,3);
    const d=mittel(h.map(x=>x.ec))-mittel(v.map(x=>x.ec));
    if(d>0.4)trend=`Der Rücklauf-EC ist von im Mittel ${nz(mittel(v.map(x=>x.ec)),2)} auf ${nz(mittel(h.map(x=>x.ec)),2)} mS/cm gestiegen. Steigt er bei gleicher Düngung, ist das Ballast und kein Nährstoff – dann hilft Ablassen, nicht weniger düngen.`;
    else if(d<-0.4)trend=`Der Rücklauf-EC ist von im Mittel ${nz(mittel(v.map(x=>x.ec)),2)} auf ${nz(mittel(h.map(x=>x.ec)),2)} mS/cm gefallen. Das spricht für stärkere Aufnahme oder eine geringere Zufuhr.`;
  }
  s+=`<div class="card"><div class="hd"><div><h2>Der Kreislauf selbst</h2>
    <p class="sub">pH und EC im Rücklauf, gemessen im Tank vor der neuen Düngergabe. Alle Tische hängen am selben Kreislauf.</p></div></div>
    <div class="row">
      <div><label class="lab">Datum</label><input type="date" id="mDatum" value="${heute()}"></div>
      <div><label class="lab">pH</label><input id="mPh" class="mono" size="5" inputmode="decimal"></div>
      <div><label class="lab">EC Rücklauf</label><input id="mEc" class="mono" size="5" inputmode="decimal"></div>
      <div><label class="lab">EC frisch <span class="muted">(freiwillig)</span></label><input id="mEcF" class="mono" size="5" inputmode="decimal"></div>
      <div><label class="lab">Substrattemperatur °C <span class="muted">(freiwillig)</span></label><input id="mTemp" class="mono" size="5" inputmode="decimal"></div>
      <div style="flex:1;min-width:150px"><label class="lab">Notiz</label><input id="mNotiz" style="width:100%"></div>
      <button class="primary" data-tun="messung">Eintragen</button></div>
    <p class="tiny muted" style="margin-top:6px">Die Temperatur ist freiwillig, aber sie erklärt viel: dieselbe organische Grunddüngung liefert bei 15 °C deutlich weniger Stickstoff als bei 25 °C.</p>
    ${messungen.length?`<div id="cKreis" class="scroll" style="margin-top:16px"></div><div class="legend" id="legKreis"></div>`:''}
    <div class="note neutral" style="margin-top:12px">Notiert ihr zusätzlich den EC direkt nach dem Ansetzen, ist die Differenz zum Rücklauf die beste Verbrauchsmessung ohne Labor.${letzt?` Zuletzt am ${fmt(letzt.datum)}: ${nz(letzt.ecFrisch,2)} frisch gegen ${nz(letzt.ec,2)} zurück, also ${nz(letzt.ecFrisch-letzt.ec,2)} mS/cm aufgenommen.`:''} ${esc(trend)}
    ${alle.length?` Zum Vergleich: das Giesswasser der Stelle «${esc(gwStelle(alle[0]))}» hatte am ${fmt(alle[0].datum)} einen EC von ${alle[0].werte.gw_EC?nz(alle[0].werte.gw_EC.wert,2):'–'} mS/cm – die Differenz zum Rücklauf ist das, was Düngung und Anreicherung zusammen ausmachen.`:''}</div></div>`;

  /* ── Eingriffe und Messungen ── */
  s+=`<div class="card"><div class="hd"><div><h2>Eingriffe am Kreislauf</h2>

/* ══════════ 15 · Planer ══════════ */
/* Liefert ALLE Sätze. Sätze ohne ableitbares Aussaatdatum fielen früher aus
   der Liste – und damit auch aus der Maske, in der man es nachtragen würde. */
function saetzeListe(){
  const h=heute();
  return alleSaetze().map(id=>{
    const q=aussaatVon(id);
    const aus=q.datum,dauer=kulturdauer(id);
    const ende=aus?plus(aus,dauer*7):null;
    const analysen=db.analysen.filter(a=>a.satz===id&&a.typ==='blattsaft'&&a.datum)
      .map(a=>({datum:a.datum,woche:alter(a).woche}))
      .filter((v,i,arr)=>arr.findIndex(x=>x.datum===v.datum)===i)
      .sort((a,b)=>a.datum.localeCompare(b.datum));
    const geplant=(db.plan.geplant||[]).filter(g=>g.satz===id&&!g.erledigt)
      .map(g=>Object.assign({},g,{woche:aus?tage(aus,g.datum)/7:null}));
    return {id,aussaat:aus,quelle:q.quelle,plausibel:q.plausibel!==false,dauer,ende,
      woche:aus?tage(aus,h)/7:null,analysen,geplant,
      laufend:!!(aus&&ende&&aus<=h&&h<=ende),kuenftig:!!(aus&&aus>h),
      st:db.saetze[id]||{}};
  }).sort((a,b)=>{
    if(!a.aussaat&&!b.aussaat)return String(a.id).localeCompare(String(b.id));
    if(!a.aussaat)return -1;if(!b.aussaat)return 1;
    return b.aussaat.localeCompare(a.aussaat);
  });
}
let VORSCHLAEGE=[];
function vorschlaege(){
  const h=heute(),liste=saetzeListe(),out=[];
  const nahAn=(an,datum,tol)=>an.some(a=>Math.abs(tage(a.datum,datum))<=(tol||6));
  const geplantAn=(s,datum,tol)=>s.geplant.some(g=>Math.abs(tage(g.datum,datum))<=(tol||6));

  /* A · Wirkung einer Änderung prüfen – beantwortet die Leitfrage */
  const wirkung=new Map();
  for(const ev of db.ereignisse){
    if(!ev.datum||ev.datum>h||tage(ev.datum,h)>84)continue;
    const betroffen=ev.geltung==='saetze'&&ev.saetze&&ev.saetze.length?ev.saetze:null;
    for(const s of liste){
      if(betroffen&&betroffen.indexOf(s.id)<0)continue;
      if(!s.laufend||!s.aussaat)continue;
      if(ev.datum<s.aussaat)continue;
      if(s.analysen.some(a=>a.datum>=ev.datum))continue;
      const ziel=plus(ev.datum,17);
      if(s.ende&&ziel>s.ende)continue;
      const wann=ziel<h?h:ziel;
      if(geplantAn(s,wann))continue;
      const vorher=s.analysen.some(a=>a.datum<ev.datum);
      const eintrag={art:'wirkung',satz:s.id,datum:wann,woche:Math.round(tage(s.aussaat,wann)/7*10)/10,
        titel:`Wirkung von «${ev.titel||ev.typ}» in Satz ${s.id} prüfen`,
        warum:vorher?`Dieser Satz wurde vor der Änderung vom ${fmt(ev.datum)} beprobt, danach noch nicht. Eine zweite Probe macht den Vergleich möglich – das ist die wertvollste Beprobung, die ihr gerade machen könnt.`
          :`Seit der Änderung vom ${fmt(ev.datum)} gibt es für diesen Satz keine Analyse. Rund zwei bis drei Wochen danach ist die Wirkung im Blattsaft sichtbar.`,
        dringend:true,rang:vorher?0:1,evDatum:ev.datum};
      const alt=wirkung.get(s.id);
      if(!alt||eintrag.rang<alt.rang||(eintrag.rang===alt.rang&&ev.datum>alt.evDatum))wirkung.set(s.id,eintrag);
    }
  }
  out.push(...wirkung.values());

  /* B · Vergleichsgruppe vervollständigen */
  for(const ev of db.ereignisse){
    if(!ev.datum||ev.datum>h||tage(ev.datum,h)>84)continue;
    if(ev.geltung!=='saetze'||!ev.saetze||!ev.saetze.length)continue;
    const ohne=liste.filter(s=>s.laufend&&ev.saetze.indexOf(s.id)<0&&!s.analysen.some(a=>a.datum>=ev.datum));
    for(const s of ohne.slice(0,2)){
      if(geplantAn(s,h))continue;
      if(out.some(o=>o.satz===s.id))continue;
      out.push({art:'gruppe',satz:s.id,datum:h,woche:s.woche==null?null:Math.round(s.woche*10)/10,
        titel:`Satz ${s.id} als Vergleichsgruppe beproben`,
        warum:`«${ev.titel||ev.typ}» vom ${fmt(ev.datum)} betrifft diesen Satz nicht. Beprobt ihr ihn im selben Zeitraum wie die betroffenen, entsteht ein Vergleich im selben Haus, unter demselben Klima – der einzige, der Management von Alter und Jahreszeit trennt.`,
        dringend:true,rang:2});
    }
  }

  /* C · begleitete Sätze über ihre Kulturzeit */
  for(const id of (db.plan.begleitet||[])){
    const s=liste.find(x=>x.id===id);if(!s||!s.aussaat)continue;
    for(const w of db.plan.zielwochen){
      const d=plus(s.aussaat,Math.round(w*7));
      if(d<plus(h,-14))continue;
      if(nahAn(s.analysen,d)||geplantAn(s,d))continue;
      out.push({art:'begleiten',satz:id,datum:d,woche:w,
        titel:`Satz ${id} in Woche ${w} beproben`,
        warum:`Ihr begleitet diesen Satz über seine Kulturzeit. Woche ${w} ist am ${fmt(d)} erreicht. Erst ein mehrfach beprobter Satz zeigt, was mit einer Pflanze während der Kultur passiert.`,
        dringend:d<=plus(h,7)&&d>=plus(h,-14),rang:3});
    }
  }

  /* D · gleiches Alter über mehrere Sätze */
  const zw=db.plan.zielwochen[Math.floor(db.plan.zielwochen.length/2)]||4;
  for(const s of liste){
    if(!s.aussaat||(!s.laufend&&!s.kuenftig))continue;
    if((db.plan.begleitet||[]).indexOf(s.id)>=0)continue;
    const d=plus(s.aussaat,Math.round(zw*7));
    if(d<h)continue;
    if(nahAn(s.analysen,d)||geplantAn(s,d))continue;
    if(out.some(o=>o.satz===s.id&&o.art==='wirkung'))continue;
    out.push({art:'alter',satz:s.id,datum:d,woche:zw,
      titel:`Satz ${s.id} erreicht Woche ${zw} am ${fmt(d)}`,
      warum:'Wenn ihr jeden Satz im gleichen Alter beprobt, werden die Sätze untereinander vergleichbar – dann zeigt ein Unterschied wirklich das Management und nicht das Alter.',
      dringend:false,rang:4});
  }
  return out.sort((a,b)=>(a.rang-b.rang)||a.datum.localeCompare(b.datum));
}

AKTION.planAus=d=>{
  const x=VORSCHLAEGE[+d.i];if(!x)return;
  db.plan.geplant=db.plan.geplant||[];
  db.plan.geplant.push({id:uid(),satz:x.satz,datum:x.datum,zweck:x.titel,erledigt:false});
  aend();render();toast('Eingeplant.');
};
AKTION.begleiten=d=>{
  db.plan.begleitet=db.plan.begleitet||[];
  const i=db.plan.begleitet.indexOf(d.satz);
  i<0?db.plan.begleitet.push(d.satz):db.plan.begleitet.splice(i,1);
  aend();render();
};
AKTION.zielwochen=(d,ev)=>{
  const w=ev.target.value.split(/[,;\s]+/).map(toNum).filter(x=>x!=null&&x>0&&x<30).sort((a,b)=>a-b);

};

    ${Object.keys(RICHT_VORGABE).map(k=>{const r=richtVon(k);
      return `<tr><td>${esc(NAME[k]||k)} <span class="tag schaetz">Annahme</span></td>
        <td><input class="mono" size="7" value="${r?r[0]:''}" data-aend="richt" data-k="${esc(k)}" data-i="0"></td>
        <td><input class="mono" size="7" value="${r?r[1]:''}" data-aend="richt" data-k="${esc(k)}" data-i="1"></td>
        <td class="tiny muted">${esc(einheit(k))}</td></tr>`}).join('')}
    </tbody></table></div></div>

  <div class="card"><h2>Datenstand</h2>
    <p class="small">${db.analysen.length} Analysen · ${db.ereignisse.length} Einträge im Logbuch · ${db.messungen.length} Messungen · ${db.rundgaenge.length} Rundgänge · ${alleSaetze().length} Sätze · Schema ${db.schema}</p>
    <p class="small muted" style="max-width:70ch">Alle Angaben liegen in der Sicherungsdatei; die Original-PDFs werden nicht mehr gebraucht. Beim Sichern entsteht jedes Mal eine neue Datei mit Datum und Uhrzeit, ältere Stände bleiben erhalten. Es gibt bewusst keine automatische Speicherung – der Speicherschritt ist eure Kontrolle darüber, was in den gemeinsamen Ordner wandert.</p>
    <div class="row"><button class="primary" data-tun="sichern">Jetzt sichern</button><button data-tun="dateiOeffnen">Datei öffnen</button>
      <button data-tun="zuruecksetzen">Alles zurücksetzen</button></div>
    ${dirty?'<div class="note">Es gibt ungesicherte Änderungen.</div>':''}</div>`;
}
AKTION.einst=(d,ev)=>{const n=toNum(ev.target.value);if(n!=null){db.einst[d.k]=n;aend();render()}else toast('Bitte eine Zahl eintragen.')};
AKTION.optimum=(d,ev)=>{
  const k=d.k,i=+d.i,n=toNum(ev.target.value);
  const cur=db.eigeneOptima[k]?db.eigeneOptima[k].slice():[null,null];
  cur[i]=n;
  if(cur[0]==null&&cur[1]==null)delete db.eigeneOptima[k];else db.eigeneOptima[k]=cur;
  aend();render();
};
AKTION.richt=(d,ev)=>{
  db.einst.richt=db.einst.richt||JSON.parse(JSON.stringify(RICHT_VORGABE));
  const k=d.k,i=+d.i,n=toNum(ev.target.value);
  const cur=(db.einst.richt[k]||RICHT_VORGABE[k]||[null,null]).slice();
  cur[i]=n;db.einst.richt[k]=cur;aend();render();
};
AKTION.kernUm=d=>{
  const cur=kern().slice(),i=cur.indexOf(d.k);
  if(i<0)cur.push(d.k);else cur.splice(i,1);
  if(!cur.length)return toast('Mindestens ein Nährstoff muss zählen.');
  db.einst.kern=KERN_WAEHLBAR.filter(k=>cur.indexOf(k)>=0);
  ueParams=null;aend();render();
};
AKTION.kernZurueck=()=>{db.einst.kern=KERN_VORGABE.slice();ueParams=null;aend();render();toast('Vorgabe wiederhergestellt.')};
AKTION.satzNeu=d=>satzDialog(d&&d.satz);
function satzDialog(id){
  const st=id?(db.saetze[id]||{}):{};
  dialog(id?'Satz '+id+' bearbeiten':'Satz anlegen',`<div class="row">
    <div><label class="lab">Satznummer</label><input id="sId" value="${esc(id||'')}" placeholder="28-478" size="10" ${id?'readonly':''}></div>
    <div><label class="lab">Aussaat</label><input type="date" id="sAus" value="${esc(st.aussaat||'')}"></div>
    <div><label class="lab">Kulturdauer (Wochen)</label><input class="mono" size="5" id="sDauer" value="${esc(st.dauer||'')}" placeholder="${id?kulturdauer(id):db.einst.dauerSommer}"></div>
    <div><label class="lab">Tisch</label><input id="sTisch" value="${esc(st.tisch||'')}" size="12"></div>
    <div><label class="lab">Substrat</label><input id="sSub" value="${esc(st.substrat||'')}" size="16"></div>
    <div><label class="lab">Dünger</label><input id="sDue" value="${esc(st.duenger||'')}" size="16"></div></div>
    <div style="margin-top:12px"><label class="lab">Notiz</label><input id="sNotiz" value="${esc(st.notiz||'')}" style="width:100%"></div>
    <p class="tiny muted" style="margin-top:10px">Ohne Aussaatdatum leitet die App es aus der Kalenderwoche im Satznamen ab. Substrat und Dünger sind nicht nur Notizen: Sätze mit unterschiedlichem Substrat lassen sich im Reiter Wirkung als Vergleichsgruppe auswerten, wenn du den Wechsel im Logbuch mit «Gilt für» erfasst.</p>`,
    `<button class="primary" data-tun="satzSpeichern">Speichern</button><button data-tun="dlgZu">Abbrechen</button>`);
}
AKTION.satzSpeichern=()=>{
  const id=el('sId').value.trim();if(!id)return toast('Satznummer fehlt.');
  satzSichern(id,{aussaat:el('sAus').value||null,dauer:toNum(el('sDauer').value),tisch:el('sTisch').value||null,
    substrat:el('sSub').value||null,duenger:el('sDue').value||null,notiz:el('sNotiz').value||null});
  aend();el('dlg').close();render();
};
AKTION.zuruecksetzen=()=>{
  if(!confirm('Wirklich alle Daten in diesem Fenster verwerfen? Gesicherte Dateien bleiben erhalten.'))return;
  db=leer();ueParams=null;dirty=false;render();
};

/* ══════════ 17 · Sichern und Laden ══════════ */
AKTION.sichern=()=>sichern();
AKTION.dateiOeffnen=()=>el('fileJson').click();
function sichern(){
  db.version++;db.gespeichert=new Date().toISOString();
  const st=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
  a.download=`basilikum-daten_${st}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  dirty=false;render();toast('Datei gesichert – im gemeinsamen Ordner ablegen.');
}
async function laden(file){
  let roh;
  try{roh=JSON.parse(await file.text())}
  catch(e){return toast('Diese Datei ist kein gültiges JSON.')}
  if(!roh||!Array.isArray(roh.analysen))return toast('Diese Datei sieht nicht nach einer Sicherung dieses Werkzeugs aus.');
  if(dirty&&!confirm('Es gibt ungesicherte Änderungen. Trotzdem laden?'))return;
  let erg;
  try{erg=migriere(roh)}
  catch(e){return toast('Die Datei liess sich nicht übernehmen: '+e.message)}
  db=erg.db;ueParams=null;dirty=erg.von<4;render();
  if(erg.von<4&&erg.notizen.length){
    dialog('Ältere Sicherung übernommen',
      `<p>Die Datei war im Format ${erg.von}, dieses Werkzeug arbeitet mit Format 4. Alles wurde übernommen. Was dabei angepasst wurde:</p>
       <ul style="margin:0 0 12px;padding-left:20px">${erg.notizen.map(n=>`<li style="margin-bottom:6px">${esc(n)}</li>`).join('')}</ul>
       <div class="note neutral">Deine alte Datei bleibt unverändert liegen. Erst wenn du hier sicherst, entsteht eine neue Datei im neuen Format – die alte kannst du als Sicherheitskopie behalten.</div>
       <p class="small">${db.analysen.length} Analysen · ${db.ereignisse.length} Logbucheinträge · ${alleSaetze().length} Sätze geladen.</p>`,
      `<button class="primary" data-tun="dlgZu">Verstanden</button>`);
  }else toast(`Geladen: ${db.analysen.length} Analysen, ${alleSaetze().length} Sätze.`);
}

/* ══════════ 18 · Verdrahtung ══════════ */
el('fileJson').onchange=e=>{const f=e.target.files[0];if(f)laden(f);e.target.value=''};
el('filePdf').onchange=e=>{const l=[...e.target.files].map(f=>({pfad:f.name,file:f}));if(l.length)einlesen(l);e.target.value=''};
/* PDFs lassen sich auf jedem Reiter ablegen, nicht nur auf «Analysen».
   Ohne preventDefault auf dragover oeffnet der Browser die Datei stattdessen. */
const ziehtDatei=e=>!!(e.dataTransfer&&[...(e.dataTransfer.types||[])].indexOf('Files')>=0);
document.addEventListener('dragover',e=>{if(!ziehtDatei(e))return;e.preventDefault();const d=el('drop');if(d)d.classList.add('over')});
document.addEventListener('dragleave',()=>{const d=el('drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{
  e.preventDefault();const d=el('drop');if(d)d.classList.remove('over');
  const fs=[...((e.dataTransfer&&e.dataTransfer.files)||[])].filter(f=>/\.pdf$/i.test(f.name));
  if(fs.length){if(tab!=='analysen'){tab='analysen';render()}einlesen(fs.map(f=>({pfad:f.name,file:f})))}
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(['lage','naehrstoff','wirkung','substrat','planer'].indexOf(tab)>=0&&!el('dlg').open)render()},250)});
document.addEventListener('keydown',e=>{
  if(e.key==='s'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sichern()}
});
/* Die App muss auch ohne Netz vollständig bedienbar sein: Daten ansehen,
   von Hand erfassen, sichern und laden. Nur das Einlesen von PDFs braucht
   pdf.js vom CDN. Fällt das aus, sagt die App das – sie bleibt aber stehen. */
let pdfBereit=false;
async function pdfVorbereiten(){
  if(typeof pdfjsLib==='undefined')return false;
  try{
    const w=await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    if(!w.ok)throw new Error('Status '+w.status);
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await w.text()],{type:'application/javascript'}));
  }catch(e){
    try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
    catch(e2){return false}
  }
  return true;
}
(async()=>{
  try{pdfBereit=await pdfVorbereiten()}catch(e){pdfBereit=false}
  try{render()}
  catch(e){
    document.getElementById('view').innerHTML='<div class="card"><h2>Die App liess sich nicht starten</h2>'+
      '<p class="muted">Bitte die Seite neu laden. Bleibt es dabei, hilft die Meldung unten weiter.</p>'+
      '<pre class="tiny mono" style="white-space:pre-wrap">'+esc(e&&e.stack||e)+'</pre></div>';
  }
})();
</script>
</body>
</html>
