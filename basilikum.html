<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basilikum · Blattsaft und Giesswasser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#F3F6EF;--card:#FFF;--card2:#FAFCF7;--ink:#141D17;--muted:#697A6C;--line:#DCE3D5;--line2:#EDF1E9;
  --ok:#2C7A4B;--ok-soft:#E3F0E1;--ok-line:#A8CDA6;
  --off:#BE6F16;--off-soft:#FBEEDC;--off-line:#E7C48A;
  --alarm:#A2432E;--alarm-soft:#F7E8E3;--alarm-line:#DCAE9F;
  --info:#3A6DA6;--info-soft:#E5EEF6;--info-line:#A9C4DC;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.55}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
h1{font-size:17px}h2{font-size:18px}h3{font-size:15px}
h4{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:Inter,sans-serif;margin-bottom:6px}
p{margin:0 0 10px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
button{font:inherit;cursor:pointer;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;transition:border-color .12s,background .12s}
button:hover{border-color:var(--ink)}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
button.primary:hover{background:#25352B}
button.ghost{border-color:transparent;background:none;color:var(--muted);padding:5px 8px}
button.ghost:hover{color:var(--ink);background:var(--line2)}
button.klein{padding:3px 10px;font-size:12px;border-radius:20px;color:var(--muted)}
button.klein:hover{color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:var(--rs);background:#fff;color:var(--ink);max-width:100%}
input[type=date]{min-width:142px}
label.lab,span.lab{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;font-weight:500}
header.top{position:sticky;top:0;z-index:40;background:rgba(243,246,239,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{display:flex;gap:12px;align-items:center;padding:11px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
nav{display:flex;gap:2px;padding:0 14px 8px;overflow-x:auto}
nav button{border:0;background:none;padding:7px 12px;border-radius:20px;color:var(--muted);font-weight:500;white-space:nowrap}
nav button:hover{background:var(--line2);color:var(--ink)}
nav button.active{background:var(--ink);color:#fff}
main{padding:20px;max-width:1160px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.hd .sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;max-width:78ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.kpi b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tr.klick:hover{background:var(--card2);cursor:pointer}
tr.gruppe td{background:var(--card2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:14px}
.liste{max-height:620px;overflow:auto;border:1px solid var(--line2);border-radius:var(--rs)}
.liste thead th{position:sticky;top:0;background:var(--card);z-index:1}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:#fff}
.tag.jung{background:var(--ok-soft);border-color:var(--ok-line);color:#215C39}
.tag.alt{background:#F0EEE3;border-color:#DDD8C4;color:#675F44}
.tag.misch{background:var(--info-soft);border-color:var(--info-line);color:#2A5177}
.tag.gelb{background:var(--off-soft);border-color:var(--off-line);color:#8A5210}
.tag.gruen{background:var(--ok-soft);border-color:var(--ok-line);color:#215C39}
.tag.warn{background:var(--alarm-soft);border-color:var(--alarm-line);color:var(--alarm)}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.na{background:var(--line2);color:var(--muted)}
.pill.off{background:var(--off-soft);color:var(--off)}
/* Wert mit Optimum: grün ist der Bereich des Labors, der Strich der Wert. */
.wertzeile{display:flex;align-items:center;gap:8px}
.wertzeile .w{min-width:62px;text-align:right}
.bar{position:relative;height:14px;background:#EFF1EC;border-radius:4px;min-width:90px;overflow:hidden;flex:1}
.bar .opt{position:absolute;top:0;bottom:0;background:#CDE4C9;border-left:1px solid #9CC79A;border-right:1px solid #9CC79A}
.bar .mk{position:absolute;top:1px;bottom:1px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.val-off{color:var(--off)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;background:#fff;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);background:var(--card2)}
.drop.over{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.note{background:var(--off-soft);border:1px solid var(--off-line);color:#7C4A0C;padding:9px 12px;border-radius:var(--rs);font-size:12.5px;margin:10px 0}
.note.neutral{background:var(--card2);border-color:var(--line);color:var(--muted)}
.note.gut{background:var(--ok-soft);border-color:var(--ok-line);color:#215C39}
.note.warn{background:var(--alarm-soft);border-color:var(--alarm-line);color:var(--alarm)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--rs);z-index:90;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.22);max-width:88vw}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:0;max-width:min(980px,95vw);width:100%;background:var(--paper)}
dialog::backdrop{background:rgba(18,28,20,.4)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.dlg-b{padding:18px;max-height:72vh;overflow:auto}
.dlg-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--paper);position:sticky;bottom:0;flex-wrap:wrap}
details>summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:'▸ ';font-size:10px}
details[open]>summary:before{content:'▾ '}
.scroll{overflow-x:auto}
.vorschlag{border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;margin-bottom:9px;background:var(--card2)}
.leer{text-align:center;padding:34px 18px;color:var(--muted)}
.leer h3{color:var(--ink);margin-bottom:6px}

/* ── Werkzeugleiste über dem Diagramm ──
   Was das Diagramm steuert, steht darüber und zeichnet nur das Diagramm
   neu – die Seite bleibt stehen, wo sie ist. */
.werkzeug{background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;margin-bottom:14px}
.wz{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.wz+.wz{margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.wz>.lab{margin:0;min-width:96px;flex:none}
.wz .lab2{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;padding:4px 12px;font-size:12px;background:none;color:var(--muted);border-right:1px solid var(--line2);display:inline-flex;align-items:center;gap:5px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.seg button svg,.zeichen svg{display:block;overflow:visible}
.zeichen{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-left:6px}
.chip.stoff{padding-left:8px}
.chip.stoff .dot{width:9px;height:9px}
/* Das Diagramm hat eine Mindestbreite; auf dem Handy scrollt es im eigenen
   Kasten zur Seite, die Seite selbst bleibt schmal. */
.diagramm{position:relative;overflow-x:auto}
.diagramm svg{display:block}
.diagramm .hit{fill:transparent}
.diagramm .hit:hover{fill:rgba(20,29,23,.10)}
.spb rect,.spb path,.spb circle{transition:filter .12s}.spb:hover rect,.spb:hover path,.spb:hover circle{filter:brightness(1.12) saturate(1.1)}
.unterDiagramm{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}

/* Sofort sichtbares Infokästchen statt des <title>-Tooltips des Browsers,
   der erst nach rund einer Sekunde erscheint und nicht gestaltbar ist. */
.tipp{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;
  padding:8px 11px;font-size:12px;line-height:1.45;max-width:300px;box-shadow:0 6px 20px rgba(20,29,23,.28);opacity:0;transition:opacity .09s}
.tipp.an{opacity:1}
.tipp b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;margin-bottom:3px}
.tipp b i{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tipp .z{color:#C9D6C9;white-space:nowrap}
.tipp .z .w,.tipp .z.w{color:#fff;font-family:'JetBrains Mono',monospace}
.tipp .k{color:#9FB39F;margin-top:4px;font-size:11px;white-space:normal}

#qrDruck{display:none}
@media print{body.druckQr>*:not(#qrDruck){display:none!important}
  body.druckQr #qrDruck{display:block;text-align:center;padding-top:30mm;font-family:sans-serif}
  #qrDruck h1{font-size:26pt;margin:0 0 12mm}#qrDruck .qr svg{width:120mm;height:120mm}
  #qrDruck p{font-size:16pt;margin:8mm 0 0}#qrDruck .klein{font-size:13pt;color:#444;margin-top:4mm}}
@media (max-width:700px){main{padding:12px}.card{padding:14px}.topbar{padding:10px 12px}.wz>.lab{min-width:0;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top">
  <div class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22C12 22 3 15.5 3 9.5C3 5.4 6.6 2 12 2C17.4 2 21 5.4 21 9.5C21 15.5 12 22 12 22Z" fill="none" stroke="#2C7A4B" stroke-width="1.6"/><path d="M12 22V7" stroke="#2C7A4B" stroke-width="1.6" stroke-linecap="round"/><path d="M12 12L8 9M12 15L16 12" stroke="#2C7A4B" stroke-width="1.4" stroke-linecap="round"/></svg>

<input type="file" id="fileJson" accept=".json,.html,.htm" hidden>
<input type="file" id="filePdf" accept="application/pdf" multiple hidden>

<!-- Hier legt die Anwendung ihre Daten ab, wenn du sie als HTML sicherst.
     Im ausgelieferten Werkzeug steht hier bewusst nur «null»: eine frische
     Datei ist leer. Beim Sichern schreibt sich die Seite selbst neu und
     setzt an dieser Stelle den ganzen Bestand ein. Nicht von Hand
     bearbeiten - eine kaputte Zeile hier macht die Datei unlesbar. -->
<script type="application/json" id="datenblock">null</script>

<script>
"use strict";
/* ══════════ 1 · Werkzeug ══════════ */
/* Alle Klickziele laufen über data-Attribute statt über zusammengesetzte
   onclick-Zeichenketten. Ein Apostroph in einem Namen kann damit
   keinen Aufruf mehr zerlegen. Die Ablage steht zuoberst, damit auch die
   Diagramme ihre Aktionen dort eintragen können.
   Verdrahtet wird sie in Abschnitt 6. */
const AKTION={};
const NUM=/^[<>]?-?\d+(?:[.,]\d+)?$/;
const toNum=t=>{if(t==null||t==='')return null;const v=parseFloat(String(t).trim().replace(/^[<>]\s*/,'').replace(',','.'));return isNaN(v)?null:v};
const isLim=t=>/^[<>]/.test(String(t).trim());
const tk=l=>l.trim().split(/\s+/).filter(Boolean);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* Das Datum des Geräts, nicht das in Greenwich: kurz nach Mitternacht
   Schweizer Zeit ist in UTC noch gestern – mit Uhrzeiten fiele das auf. */
const heute=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=d=>d?d.split('-').reverse().join('.'):'–';
const fmtK=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.':'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=i=>document.getElementById(i);
const tage=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
/* ── Uhrzeit ──
   «HH:MM», Ortszeit des Geräts, das misst oder einträgt. Fehlt sie, ist sie
   unbekannt – geraten wird sie nie. Auf den Zeitachsen liegt ein Tag bei
   UTC-Mitternacht; die Uhrzeit wird in Minuten dazugezählt, damit dieselbe
   Achse Tage und Stunden trägt. */
const zeitNorm=t=>{if(t==null)return null;const m=String(t).trim().match(/^([01]?\d|2[0-3])\s*[:.hH]\s*([0-5]\d)(?:\s*(?:uhr|h))?$/i);return m?m[1].padStart(2,'0')+':'+m[2]:null};
const zeitMin=t=>{const z=zeitNorm(t);return z?(+z.slice(0,2))*60+(+z.slice(3)):null};
const zeitpunkt=x=>+new Date(x.datum)+(zeitMin(x&&x.zeit)||0)*6e4;
const fmtZ=x=>fmt(x.datum)+(x&&x.zeit?', '+x.zeit:'');
const zeitTag=x=>x&&x.zeit?` <span class="tiny muted mono">${x.zeit}</span>`:'';
/* Chronologisch: Datum, dann Uhrzeit. Ohne Uhrzeit steht ein Eintrag vor
   denen mit – und untereinander in der Reihenfolge, in der er kam. */
const chrono=(a,b)=>(a.datum||'').localeCompare(b.datum||'')||((zeitMin(a.zeit)??-1)-(zeitMin(b.zeit)??-1));
const chronoAb=liste=>[...liste].reverse().sort((a,b)=>chrono(b,a));
/* Wo auf der Zeitachse eine Messung steht. Mit Uhrzeit genau. Ohne Uhrzeit
   und allein am Tag: auf dem Tag. Mehrere am selben Tag und derselben
   Stelle ohne Uhrzeit (alte Tabellen: «morgens vor PS», «abends nach PS»):
   in ihrer Reihenfolge zwischen 6 und 20 Uhr verteilt, damit sie nicht
   übereinander liegen – das Kästchen sagt dann, dass die Uhrzeit fehlt. */
function messLage(ms,stelleVon){
  const x=new Map(),folge=new Map(),gruppen={};
  for(const m of ms){
    if(zeitNorm(m.zeit)){x.set(m,zeitpunkt(m));continue}
    const k=m.datum+'|'+(stelleVon?stelleVon(m):(m.stelle||''));
    (gruppen[k]=gruppen[k]||[]).push(m);
  }
  for(const k in gruppen){
    const g=gruppen[k],n=g.length;
    g.forEach((m,i)=>{
      x.set(m,+new Date(m.datum)+(n>1?Math.round((6+14*i/(n-1))*60)*6e4:0));
      if(n>1)folge.set(m,{i:i+1,n});
    });
  }
  return {x,folge};
}
const zeitZeile=(m,folge)=>m.zeit?['Uhrzeit',m.zeit]:(folge&&folge.get(m)?['Uhrzeit',`nicht erfasst – ${folge.get(m).i}. von ${folge.get(m).n} Messungen an diesem Tag`]:null);
const summe=a=>a.reduce((x,y)=>x+y,0);
const mittel=a=>a.length?summe(a)/a.length:null;
/* Zahlen: kleine Werte behalten ihre Stellen, grosse werden nicht überpräzise */
function nz(v,d){
  if(v==null||v===''||isNaN(v))return '–';
  const a=Math.abs(v);
  let dez=d!=null?d:(a>=100?0:a>=10?1:2);
  if(a>0&&a<1)dez=Math.max(dez,a<0.01?4:a<0.1?3:2);
  if(a>=1000)dez=0;
  return (+(+v).toFixed(dez)).toLocaleString('de-CH',{maximumFractionDigits:dez});
}
/* Wert mit Nachweisgrenze: «<0,05» statt einer erfundenen Zahl */
const zeigeWert=(w,d)=>w==null?'–':(w.unter?'&lt;'+nz(w.wert,d):esc(nz(w.wert,d)));

/* ══════════ 2 · Fachwissen ══════════ */
/* Blattsaft-Parameter (NovaCropControl) */
const NAME={Zucker:'Zucker',pH:'pH (Saft)',EC:'EC (Saft)',K:'Kalium',Ca:'Calcium','K/Ca':'K/Ca',Mg:'Magnesium',Na:'Natrium',
 NH4:'Ammonium',NO3:'Nitrat',N_aus_NO3:'N aus Nitrat',N_gesamt:'Stickstoff gesamt',Cl:'Chlorid',S:'Schwefel',P:'Phosphor',
 Si:'Silizium',Fe:'Eisen',Mn:'Mangan',Zn:'Zink',B:'Bor',Cu:'Kupfer',Mo:'Molybdän',Al:'Aluminium',
 /* Substrat (Labor Ins) – eigener Namensraum, damit nichts mit dem Blattsaft verwechselt wird */
 sub_pH:'pH (Substrat)',sub_Salz:'Salz (Substrat)',sub_Nmin:'Nmin (Substrat)',
 res_P2O5:'P₂O₅ Reserve',res_K2O:'K₂O Reserve',res_Mg:'Mg Reserve',res_Ca:'Ca Reserve',
 sof_P2O5:'P₂O₅ sofort verfügbar',sof_K2O:'K₂O sofort verfügbar',sof_Mg:'Mg sofort verfügbar',sof_Ca:'Ca sofort verfügbar',
 sub_Mn:'Mangan (Substrat)',sub_Cu:'Kupfer (Substrat)',sub_Zn:'Zink (Substrat)',sub_Fe:'Eisen (Substrat)',sub_B:'Bor (Substrat)',
 /* Giesswasser – NovaCropControl liefert Makronährstoffe in mmol/l und
    Spurenelemente in µmol/l, nicht in mg/l. */
 gw_EC:'EC (Giesswasser)',gw_pH:'pH (Giesswasser)',gw_KCa:'K/Ca (Giesswasser)',gw_NO2:'Nitrit (Wasser)',
 gw_NH4:'Ammonium (Wasser)',gw_K:'Kalium (Wasser)',gw_Na:'Natrium (Wasser)',gw_Ca:'Calcium (Wasser)',
 gw_Mg:'Magnesium (Wasser)',gw_Si:'Silizium (Wasser)',gw_NO3:'Nitrat (Wasser)',gw_Cl:'Chlorid (Wasser)',
 gw_S:'Schwefel (Wasser)',gw_HCO3:'Hydrogencarbonat (Wasser)',gw_P:'Phosphor (Wasser)',
 gw_Fe:'Eisen (Wasser)',gw_Mn:'Mangan (Wasser)',gw_Zn:'Zink (Wasser)',gw_B:'Bor (Wasser)',
 gw_Cu:'Kupfer (Wasser)',gw_Mo:'Molybdän (Wasser)',gw_Al:'Aluminium (Wasser)'};
const EINH={Zucker:'%',EC:'mS/cm',pH:'','K/Ca':'',sub_pH:'',gw_pH:'',gw_EC:'mS/cm',gw_KCa:''};
/* Giesswasser: Makronährstoffe kommen vom Labor in mmol/l, Spurenelemente in
   µmol/l. Die Zuordnung folgt der Chemie und dem Berichtslayout von
   NovaCropControl; sie ist an den drei vorliegenden Berichten geprüft. */
const GW_MAKRO=['NH4','K','Na','Ca','Mg','Si','NO3','NO2','Cl','S','HCO3','P'];
const GW_MIKRO=['Fe','Mn','Zn','B','Cu','Mo','Al'];
const GW_PARAM=['EC','pH','KCa'].concat(GW_MAKRO,GW_MIKRO);
function einheit(k){
  if(EINH[k]!==undefined)return EINH[k];
  if(/^(res_|sof_)/.test(k)||k==='sub_Nmin')return 'mg/l';
  if(k==='sub_Salz')return 'g/l';
  if(/^sub_/.test(k))return 'mg/l';
  if(/^gw_/.test(k)){
    const b=k.slice(3);
    if(GW_MAKRO.indexOf(b)>=0)return 'mmol/l';
    if(GW_MIKRO.indexOf(b)>=0)return 'µmol/l';
    return '';
  }
  return 'ppm';
}
/* Molmassen, um mmol/l für den Vergleich mit anderen Quellen in mg/l zu zeigen */
const MOLMASSE={NH4:18.04,K:39.1,Na:22.99,Ca:40.08,Mg:24.31,Si:28.09,NO3:62.0,NO2:46.01,Cl:35.45,S:32.06,HCO3:61.02,P:30.97,
  Fe:55.85,Mn:54.94,Zn:65.38,B:10.81,Cu:63.55,Mo:95.95,Al:26.98};
function inMgL(k,v){
  if(v==null)return null;
  const b=k.slice(3),m=MOLMASSE[b];
  if(!m)return null;
  if(GW_MAKRO.indexOf(b)>=0)return v*m;          /* mmol/l → mg/l */
  if(GW_MIKRO.indexOf(b)>=0)return v*m/1000;     /* µmol/l → mg/l */
  return null;
}

/* Arten von Einträgen – so heissen die Gaben und Ereignisse vom Handy, aus

const EVTYPEN={

/* Feste Einheit eines Eintrags: bei «auto» entscheidet die Form des Produkts. */
function evEinheit(typ,mittel){

/* ══════════ 3 · Parser ══════════ */
const NCC=[['Zucker','Zucker'],['pH','pH'],['EC','EC'],['K - Kalium','K'],['Ca - Kalzium','Ca'],['K / Ca','K/Ca'],
 ['Mg - Magnesium','Mg'],['Na - Natrium','Na'],['NH4 - Ammonium','NH4'],['NO3 - Nitrat','NO3'],['N aus Nitrat','N_aus_NO3'],
 ['N - Gesamt Stickstoff','N_gesamt'],['Cl - Chlorid','Cl'],['S - Schwefel','S'],['P - Phosphor','P'],['Si - Silizium','Si'],
 ['Fe - Eisen','Fe'],['Mn - Mangan','Mn'],['Zn - Zink','Zn'],['B - Bor','B'],['Cu - Kupfer','Cu'],['Mo - Molybdän','Mo'],['Al - Aluminium','Al']];
const INS={reserven:{P2O5:'res_P2O5',K2O:'res_K2O',Mg:'res_Mg',Ca:'res_Ca',Salz:'sub_Salz',Nmin:'sub_Nmin'},
 sofort:{P2O5:'sof_P2O5',K2O:'sof_K2O',Mg:'sof_Mg',Ca:'sof_Ca'},
 spuren:{Mn:'sub_Mn',Cu:'sub_Cu',Zn:'sub_Zn',Fe:'sub_Fe',B:'sub_B'}};

/* Die Spaltenmarker ¹ ² stehen im NovaCropControl-PDF auf eigenen Zeilen.
   Deshalb wird NUR eine Zeile geleert, die ausschliesslich aus einem Marker
   besteht – innerhalb einer Zeile wird nichts entfernt. Ein Messwert von
   genau 1 oder 2 bleibt damit erhalten. */
const nurMarker=l=>/^[\s ]*[12¹²][\s ]*$/.test(l);
const putz=l=>nurMarker(l)?'':String(l).replace(/ /g,' ').replace(/[¹²]/g,' ').trimEnd();

function findeZustand(...t){
  const s=t.filter(Boolean).join(' ');const m=s.match(/\b(gelb\w*|gr[üu]n\w*)\b/i);
  return m?{wert:/gelb/i.test(m[1])?'gelb':'grün',beleg:m[0]}:null;
}
function findeTiefe(...t){
  const s=t.filter(Boolean).join(' ');const m=s.match(/(\d{1,2})\s*(?:-\s*\d{1,2}\s*)?cm/i);
  return m?{wert:+m[1],beleg:m[0]}:null;
}
/* «<0,50 - <0,50» ist keine Spanne, sondern die Nachweisgrenze des Labors.
   Solche Angaben werden als Obergrenze gelesen, nicht als Unter = Obergrenze. */
function leseOptimum(rest,anzahl){
  const om=rest.match(/([<>]?\s*[\d.,]+)\s*-\s*([<>]?\s*[\d.,]+)\s*$/);
  if(om&&anzahl>=3){
    const a=om[1].replace(/\s/g,''),b=om[2].replace(/\s/g,'');
    const lo=toNum(a),hi=toNum(b);
    if(isLim(a)&&isLim(b)&&lo===hi)return {opt:[null,hi],art:'nachweisgrenze'};
    return {opt:[isLim(a)?null:lo,hi],art:'spanne'};
  }
  const o=rest.match(/<\s*([\d.,]+)\s*$/);
  if(o&&anzahl>=2)return {opt:[null,toNum(o[1])],art:'nachweisgrenze'};
  return null;
}
function parseNCC(seiten){
  const lines=[].concat(...seiten).map(l=>String(l).replace(/ /g,' ').trimEnd());
  const text=lines.join('\n');
  const r={labor:'NovaCropControl',typ:'blattsaft',proben:[],hinweise:[],rohtext:text};
  const d=text.match(/Probendatum:\s*(\d{1,2})-(\d{1,2})-(\d{4})/);
  const datum=d?`${d[3]}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`:null;
  if(!datum)r.hinweise.push('Probendatum nicht gefunden – bitte eintragen.');
  const anbauAlle=[...text.matchAll(/Anbau:\s*(.+)/g)].map(m=>m[1].trim());
  if(anbauAlle.length>1)r.hinweise.push('Mehrere «Anbau»-Angaben gefunden – bitte den Satz kontrollieren.');
  const anbau=anbauAlle[0]||'';
  const lage=(text.match(/Lage\/Grundst[üu]ck:\s*(.+)/)||[])[1]||'';
  const hinw=(text.match(/Hinweise([\s\S]{0,320}?)Parameter/)||[])[1]||'';
  const sm=anbau.match(/(\d{1,2}\s*-\s*\d{2,4})/);
  const satz=sm?sm[1].replace(/\s+/g,''):null;
  if(!satz)r.hinweise.push('Satznummer nicht erkannt – bitte eintragen.');
  const ids=[...text.matchAll(/\b(\d{12})\b/g)].map(m=>m[1]);
  const z=findeZustand(hinw,anbau);
  const tz=(text.match(/Pflanzenteil:.*/)||[])[0]||'';
  const gef=[...tz.matchAll(/Blatt\s*\((Jung|Alt|Mix|Misch)[^)]*\)/gi)]
    .map(m=>({roh:m[0],wert:/jung/i.test(m[1])?'jung':/alt/i.test(m[1])?'alt':'misch'}));
  let teile=gef;
  if(!teile.length){teile=[{roh:null,wert:''}];r.hinweise.push('Pflanzenteil steht nicht im Dokument – bitte selbst zuordnen.')}
  const werte=teile.map(()=>({})),optima={},optArt={};
  for(let i=0;i<lines.length;i++){
    const L=putz(lines[i]).trim();
    if(!L)continue;
    const tr=NCC.find(p=>L.startsWith(p[0]));
    if(!tr)continue;
    const rest=L.slice(tr[0].length);
    const zahlen=tk(rest).filter(t=>NUM.test(t));
    if(!zahlen.length)continue;
    const lo=leseOptimum(rest,zahlen.length);
    if(lo){optima[tr[1]]=lo.opt;optArt[tr[1]]=lo.art}
    werte[0][tr[1]]={wert:toNum(zahlen[0]),unter:isLim(zahlen[0])};
    if(teile.length<2)continue;
    for(let j=i+1;j<Math.min(i+6,lines.length);j++){
      const M=putz(lines[j]).trim();if(!M)continue;
      if(NCC.some(p=>M.startsWith(p[0])))break;
      const mz=tk(M).filter(t=>NUM.test(t));
      if(mz.length){werte[1][tr[1]]={wert:toNum(mz[0]),unter:isLim(mz[0])};break}
    }
  }
  /* Jede Probe bekommt eine EIGENE Kopie der Optima – sonst verändert das
     Bearbeiten der einen Probe stillschweigend die andere. */
  teile.forEach((t,k)=>r.proben.push({laborId:ids[k]||null,datum,satz,kultur:lage||anbau,blattalter:t.wert,
    blattalterBeleg:t.roh?`Kopfzeile: «${t.roh}»`:null,zustand:z?z.wert:null,
    zustandBeleg:z?`Fundstelle: «${z.beleg}»`:null,werte:werte[k]||{},
    optima:JSON.parse(JSON.stringify(optima)),optArt:JSON.parse(JSON.stringify(optArt))}));
  const n=Object.keys(werte[0]).length;
  if(n<15)r.hinweise.push(`Nur ${n} von 23 Parametern gelesen – bitte kontrollieren.`);
  if(teile.length===2&&Object.keys(werte[1]).length<n-2)
    r.hinweise.push(`Die zweite Probe hat nur ${Object.keys(werte[1]).length} Werte gegenüber ${n} bei der ersten – bitte kontrollieren.`);
  return r;
}
function parseIns(seiten){
  const r={labor:'Labor Ins AG',typ:'substrat',proben:[],hinweise:[],rohtext:[].concat(...seiten).join('\n')};
  for(const seite of seiten){
    const lines=seite.map(l=>String(l).replace(/ /g,' ').trimEnd());
    const text=lines.join('\n');
    if(!/Parzelle/.test(text)||!/Messwert/.test(text))continue;
    const p=text.match(/Parzelle\s+(.+?)\s+Probenummer\s+(\d+)/);if(!p)continue;
    const label=p[1].trim(),sm=label.match(/(\d{1,2}-\d{2,4})/),z=findeZustand(label),ti=findeTiefe(label);
    const ad=(text.match(/Auftragsdatum\s+(\d{2}\.\d{2}\.\d{4})/)||[])[1];
    const ph=text.match(/pH-Wert\s+pH-H2OSU\s+pH\s+([\d.,]+)/);
    const werte={};if(ph)werte.sub_pH={wert:toNum(ph[1])};
    let spuren=false;
    for(let i=0;i<lines.length;i++){
      if(/^Spurenelemente\s*$/.test(lines[i].trim()))spuren=true;
      if(!/^Parameter\s+/.test(lines[i].trim()))continue;
      const par=tk(lines[i]).slice(1);let meth=null,mw=null;
      for(let j=i+1;j<Math.min(i+8,lines.length);j++){
        const t=lines[j].trim();
        if(/^Methode \(Reserven\)/.test(t))meth=spuren?'spuren':'reserven';
        if(/^Methode \(sofort verf[üu]gbar\)/.test(t))meth='sofort';
        if(/^Messwert\s+/.test(t)){mw=tk(t).slice(1);break}
      }
      if(!meth||!mw)continue;
      par.forEach((q,idx)=>{const key=INS[meth][q];
        if(key&&mw[idx]!=null&&NUM.test(mw[idx]))werte[key]={wert:toNum(mw[idx]),unter:isLim(mw[idx])}});
    }
    r.proben.push({laborId:p[2],datum:ad?ad.split('.').reverse().join('-'):null,parzelle:label,
      satz:sm?sm[1]:null,blattalter:null,zustand:z?z.wert:null,zustandBeleg:z?`Parzellenfeld: «${label}»`:null,
      tiefe:ti?ti.wert:null,tiefeBeleg:ti?`Parzellenfeld: «${ti.beleg}»`:null,werte,optima:{},optArt:{}});
  }
  if(!r.proben.length)r.hinweise.push('Keine Substratproben erkannt.');
  else r.hinweise.push('Substratproben tragen keine Optimum-Bereiche vom Labor.');
  return r;
}
/* ── Giesswasser (NovaCropControl) ────────────────────────
   Der Wasserbericht ist eine um 90 Grad gedrehte Tabelle. Die Rekonstruktion
   über Zeilen verliert dort Werte, weil Zellen je nach Rundung in dieselbe
   oder in verschiedene Zeilen fallen. Deshalb wird hier direkt mit den
   Koordinaten gearbeitet: die y-Position bestimmt den Parameter, die
   x-Position die Spalte.

   Ein Bericht enthält eine Spalte «Analyse» und beliebig viele Spalten
   «Historie». Die erste Historiespalte ist dieselbe Probe wie die Analyse –
   erkennbar an derselben Probennummer – und wird zusammengefasst. Jede
   übrige Spalte ist eine eigene, ältere Probe mit eigenem Datum.

   Der Name der Entnahmestelle steht in der Kopfzeile
   «Analysebericht:Giesswasser; <Lage>/<Stelle>» und gilt für alle Spalten
   des Berichts – die Historie ist die Historie derselben Stelle. */
const GW_NAMEN=[['EC','gw_EC'],['pH','gw_pH'],['K/Ca','gw_KCa'],['NH4','gw_NH4'],['K','gw_K'],['Na','gw_Na'],
 ['Ca','gw_Ca'],['Mg','gw_Mg'],['Si','gw_Si'],['NO3','gw_NO3'],['Cl','gw_Cl'],['S','gw_S'],['HCO3','gw_HCO3'],
 ['P','gw_P'],['Fe','gw_Fe'],['Mn','gw_Mn'],['Zn','gw_Zn'],['B','gw_B'],['Cu','gw_Cu'],['Mo','gw_Mo'],['Al','gw_Al']];
function parseGiess(seiten,punkte){
  const text=[].concat(...seiten).join('\n');
  const r={labor:'NovaCropControl',typ:'giesswasser',proben:[],hinweise:[],rohtext:text};
  if(!punkte||!punkte.length){
    r.hinweise.push('Die Koordinaten des Dokuments liessen sich nicht lesen – bitte von Hand erfassen.');
    return r;
  }
  /* Der Laborbericht kommt aus Deutschland und schreibt «Gießwasser» mit ß.
     Die Oberfläche bleibt in Schweizer Rechtschreibung – hier muss der
     Ausdruck aber den fremden Text treffen, deshalb beide Formen. */
  const kopf=(text.match(/Analysebericht:\s*Gie[ßs]wasser;\s*([^\n]*?)\s*(?:Name:|Adresse:|$)/)||[])[1]||'';
  const teil=kopf.split('/');
  const lage=(teil[0]||'').trim();
  let stelle=(teil.slice(1).join('/')||'').trim();
  if(!stelle){
    const an=(text.match(/Anbau:?\s*([^\n]*)/)||[])[1]||'';
    stelle=an.replace(/\bErnte:?.*/,'').replace(/\bSonstiges\b/,'').trim();
  }
  for(const seite of punkte){
    /* y je Parameter aus der Namensspalte */
    const yVon=new Map();
    for(const [roh,key] of GW_NAMEN){
      const t=seite.filter(i=>i.s===roh);
      if(t.length)yVon.set(key,t[0].y);
    }
    if(yVon.size<10)continue;
    /* Kopfzeile der Spalten: Probendatum ganz unten, Probennummer darüber */
    const daten=seite.filter(i=>i.y<40&&/^\d{1,2}-\d{1,2}-\d{4}$/.test(i.s));
    if(!daten.length)continue;
    const nummern=seite.filter(i=>i.y>60&&i.y<110&&/^\d{10,14}$/.test(i.s));
    const spalten=daten.map(d=>({x:d.x,
      datum:(()=>{const m=d.s.split('-');return `${m[2]}-${m[1].padStart(2,'0')}-${m[0].padStart(2,'0')}`})(),
      nummer:(nummern.find(n=>Math.abs(n.x-d.x)<8)||{}).s||null})).sort((a,b)=>a.x-b.x);
    const gesehen=new Set();
    for(const sp of spalten){
      if(sp.nummer&&gesehen.has(sp.nummer))continue;   /* Analyse und erste Historie sind dieselbe Probe */
      if(sp.nummer)gesehen.add(sp.nummer);
      const werte={};
      for(const [key,y] of yVon){
        const t=seite.find(i=>Math.abs(i.x-sp.x)<8&&Math.abs(i.y-y)<12&&NUM.test(i.s));
        if(t)werte[key]={wert:toNum(t.s),unter:isLim(t.s)};
      }
      if(!Object.keys(werte).length)continue;
      r.proben.push({laborId:sp.nummer,datum:sp.datum,satz:null,blattalter:null,zustand:null,
        stelle:stelle||null,kultur:lage||null,werte,optima:{},optArt:{}});
    }
  }
  if(!r.proben.length){r.hinweise.push('Keine Wasserproben erkannt – bitte von Hand erfassen.');return r}
  /* Plausibilitaet: Spurenelemente stehen in µmol/l und sind klein */
  const gross=r.proben.some(p=>GW_MIKRO.some(b=>p.werte['gw_'+b]&&p.werte['gw_'+b].wert>200));
  if(gross)r.hinweise.push('Ein Spurenelement liegt ungewöhnlich hoch für µmol/l – bitte die Einheiten im Bericht kontrollieren.');
  if(r.proben.length>1)r.hinweise.push(`Der Bericht enthält ${r.proben.length} Proben: die aktuelle Analyse und ${r.proben.length-1} aus der Historie derselben Entnahmestelle.`);
  if(!stelle)r.hinweise.push('Der Name der Entnahmestelle wurde nicht gefunden – bitte eintragen, sonst lassen sich Proben vom selben Tag nicht unterscheiden.');
  return r;
}
function parseAuto(seiten,punkte){
  const t=[].concat(...seiten).join('\n');
  if(/Gie[ßs]wasser/i.test(t)&&/NovaCropControl/i.test(t))return parseGiess(seiten,punkte);
  if(/NovaCropControl|Pflanzensaft-Probe/i.test(t))return parseNCC(seiten);
  if(/Labor Ins AG|LABOR INS/i.test(t)&&/Bericht Substrate|Kulturgruppe\s+Substrate/i.test(t))return parseIns(seiten);
  return {labor:null,typ:null,proben:[{datum:null,satz:null,blattalter:'',zustand:null,werte:{},optima:{},optArt:{}}],
    hinweise:['Unbekanntes Layout – Werte bitte von Hand erfassen. Der Quelltext wird gespeichert, damit nichts verloren geht.'],rohtext:t};
}
/* Wie pdfSeiten, aber mit den Koordinaten je Textstueck. Der Wasserbericht
   braucht sie, weil seine Tabelle gedreht ist. */
async function pdfPunkte(buf){
  const doc=await pdfjsLib.getDocument({data:buf}).promise,out=[];
  for(let p=1;p<=doc.numPages;p++){
    const c=await(await doc.getPage(p)).getTextContent();
    out.push(c.items.filter(i=>i.str&&i.str.trim()).map(i=>({
      x:Math.round(i.transform[4]*10)/10,y:Math.round(i.transform[5]*10)/10,s:i.str.trim()})));
  }
  return out;
}
async function pdfSeiten(buf){
  const doc=await pdfjsLib.getDocument({data:buf}).promise,out=[];
  for(let p=1;p<=doc.numPages;p++){
    const c=await(await doc.getPage(p)).getTextContent(),b=new Map();
    for(const it of c.items){
      if(!it.str||!it.str.trim())continue;
      const y=Math.round(it.transform[5]*2)/2;
      if(!b.has(y))b.set(y,[]);
      b.get(y).push({x:it.transform[4],s:it.str});
    }
    out.push([...b.keys()].sort((a,z)=>z-a).map(y=>b.get(y).sort((a,z)=>a.x-z.x).map(o=>o.s).join(' ').replace(/\s+/g,' ')));
  }
  return out;
}

    gehalt:{N_gesamt:9,Fe:0.22,Mn:0.10,Zn:0.19,Cu:0.13},quelle:'Etikett'},
  epsotop:{name:'Magnesium (Epsotop, Bittersalz)',form:'fest',einheit:'g',dichte:null,
    gehalt:{Mg:9.86,S:13.0},quelle:'Etikett'},
  /* Kali und Zink werden seit dem Frühjahr in Gramm beigemischt. Kalisulfat
     mit 50 % K₂O ist ein typischer Wert, kein Etikett; welches Zinksalz es
     ist, ist nicht bekannt. */
  kali:{name:'Kalisulfat',form:'fest',einheit:'g',dichte:null,gehalt:{K:41.5,S:17},liefert:['K'],quelle:'typisches Kaliumsulfat (50 % K₂O) – Annahme, vom Etikett bestätigen'},
  zink:{name:'Zink',form:'fest',einheit:'g',dichte:null,gehalt:{},liefert:['Zn'],quelle:'Produkt nicht hinterlegt – Gehalt vom Etikett eintragen'},
  schwefelsaeure25:{name:'Schwefelsäure 25 %',form:'fluessig',einheit:'l',dichte:1.18,
    gehalt:{S:8.2},quelle:'Stöchiometrie und Dichtetabelle für 25 % H₂SO₄'},
  phosphorsaeure:{name:'Phosphorsäure',form:'fluessig',dichte:null,gehalt:{},quelle:'Gehalt nicht hinterlegt'},
  zitronensaeure:{name:'Zitronensäure',form:'fest',dichte:null,gehalt:{},quelle:'Gehalt nicht hinterlegt'},
  halades:{name:'Halades PE',form:'fluessig',dichte:null,gehalt:{},quelle:'Gehalt nicht hinterlegt'},
  /* EM – Effektive Mikroorganismen, im Betrieb «MKBoden» genannt. */
  em:{name:'EM (Effektive Mikroorganismen, «MKBoden»)',form:'fluessig',einheit:'l',dichte:null,gehalt:{},
    quelle:'Mikroorganismen-Präparat – «MKBoden» = EM laut Betrieb (Annahme vom 30.09.2026), kein Nährstoffgehalt'}};

/* Der Betrieb hat zwei Reservoirs. Das Labor schreibt aber jedes Mal etwas
   anderes auf den Bericht: «Reservoir Vorne», «RV Basilikum», «Vorne, mitt
   H2O2». Darum wird zugeordnet statt geraten: die Anwendung schlägt vor, der
   Mensch entscheidet (Einstellungen → Entnahmestellen).
   zu[<Bezeichnung>] ist die Kennung der Stelle, null heisst ausdrücklich
   «gehört zu keiner», und was fehlt, ist schlicht noch nicht entschieden. */
const STELLEN_VORGABE=()=>({gruppen:[{id:'v',name:'Reservoir vorne'},{id:'h',name:'Reservoir hinten'}],zu:{}});
const leer=()=>({schema:11,version:0,gespeichert:null,analysen:[],ereignisse:[],messungen:[],pakete:{},beigabeZeiten:[],
  produkte:JSON.parse(JSON.stringify(PRODUKTE_VORGABE)),stellen:STELLEN_VORGABE(),einst:{}});
let db=leer(),tab='kombi',dirty=false,nachRender=null;
/* Registrierung des aktiven Diagramms: erlaubt es, nur das Diagramm samt
   seiner Bedienung neu zu bauen statt der ganzen Seite. Siehe diagFrisch(). */
let DIAG=null;

/* Ein alter Eintrag ohne eigene Einheit bekam sie aus der Form des Produkts
   (fest = kg). Das bleibt so – heute dosiert man Epsotop in Gramm, aber die
   3 kg vom Mai waren Kilogramm. */
const evEinheitAlt=e=>{const d=EVTYPEN[e.typ];if(!d||!d.m)return null;if(d.m.e!=='auto')return d.m.e;
  const pr=PRODUKTE_VORGABE[e.mittel];return (pr&&pr.form==='fest')?'kg':'l'};
/* Ältere Sicherungsdateien einlesen, ohne dass etwas verloren geht. Was eine
   frühere Fassung zusätzlich führte – Sätze, Fotos, Rundgänge, Planer, eigene
   Optima, Einstellungen –, bleibt unangetastet im Bestand; diese Fassung zeigt
   es nur nicht mehr an. */
function migriere(roh){
  const basis=leer(),notizen=[],von=+(roh.schema||1);
  const d=Object.assign(basis,roh);
  d.einst=Object.assign({},roh.einst||{});
  d.produkte=Object.assign(JSON.parse(JSON.stringify(PRODUKTE_VORGABE)),roh.produkte||{});
  d.stellen=roh.stellen&&Array.isArray(roh.stellen.gruppen)
    ? {gruppen:roh.stellen.gruppen.map(g=>Object.assign({},g)),zu:Object.assign({},roh.stellen.zu||{})}
    : STELLEN_VORGABE();
  d.analysen=(roh.analysen||[]).map(a=>Object.assign({},a));
  d.ereignisse=(Array.isArray(roh.ereignisse)?roh.ereignisse:[]).filter(Boolean).map(e=>Object.assign({},e));
  d.messungen=(Array.isArray(roh.messungen)?roh.messungen:[]).filter(Boolean).map(m=>Object.assign({},m));
  d.pakete=Object.assign({},roh.pakete||{});
  /* Zeiträume von Hand: je Mittel oder als eigene Massnahme mit Namen.
     Ein freiwilliges Feld – fehlt es, ist es leer. */
  d.beigabeZeiten=Array.isArray(roh.beigabeZeiten)?roh.beigabeZeiten.filter(x=>x&&(x.mittel||x.name)&&x.von).map(x=>Object.assign({},x)):[];
  if(von<4){
    let u=0,s=0,al=0;
    const UM={pH:'sub_pH',Salz:'sub_Salz',Nmin:'sub_Nmin',Mn:'sub_Mn',Cu:'sub_Cu',Zn:'sub_Zn',Fe:'sub_Fe',B:'sub_B'};
    for(const a of d.analysen){
      a.werte=JSON.parse(JSON.stringify(a.werte||{}));
      a.optima=JSON.parse(JSON.stringify(a.optima||{}));   /* geteilte Objekte entkoppeln */
      for(const k in a.werte){const w=a.werte[k];
        if(w&&w.limit!==undefined){w.unter=!!w.limit;delete w.limit;u++}}
      if(a.typ==='substrat'){
        const nw={};for(const k in a.werte){const nk=UM[k]||k;if(nk!==k)s++;nw[nk]=a.werte[k]}
        a.werte=nw;
      }
      for(const k in a.optima){const o=a.optima[k];
        if(Array.isArray(o)&&o[0]!=null&&o[0]===o[1]){a.optima[k]=[null,o[1]];al++}}
    }
    if(u)notizen.push(`${u} Werte an der Nachweisgrenze sind jetzt als solche gekennzeichnet («<» vor der Zahl).`);
    if(s)notizen.push(`${s} Substratwerte haben einen eigenen Namen bekommen, damit sie nicht mit Blattsaftwerten verwechselt werden.`);
    if(al)notizen.push(`${al} Optimum-Angaben wie «<0,50 - <0,50» werden jetzt als Nachweisgrenze statt als Spanne gelesen.`);
  }
  if(von<5){
    /* Bis Schema 4 waren die Giesswasserfelder als mg/l beschriftet. Das
       Labor liefert mmol/l und µmol/l; von Hand Erfasstes wird markiert. */
    let gwAlt=0;
    for(const a of d.analysen){
      if(a.typ!=='giesswasser'||a.laborId)continue;
      if(Object.keys(a.werte||{}).some(k=>/^gw_/.test(k))){a.einheitAlt=true;gwAlt++}
    }
    if(gwAlt)notizen.push(`${gwAlt} von Hand erfasste Giesswasseranalyse${gwAlt>1?'n sind':' ist'} markiert: damals waren die Felder als mg/l beschriftet, das Labor liefert mmol/l und µmol/l. Bitte diese Werte kontrollieren.`);
  }
  if(von<6){
    /* Mengen strukturiert mit fester Einheit statt als Freitext. Die alten
       Freitextfelder bleiben erhalten; wo eine Menge eindeutig
       herauszulesen war, wird sie zusätzlich gesetzt. */
    let em=0;
    const zahlAus=t=>{const m=String(t==null?'':t).replace(',','.').match(/(\d+(?:\.\d+)?)/);return m?+m[1]:null};
    for(const m of d.messungen)if(m.quelle===undefined)m.quelle='hand';
    for(const e of d.ereignisse){
      if(e.quelle===undefined)e.quelle='hand';
      if(e.stelle===undefined)e.stelle='beide';
      if(EVTYP_ALT[e.typ])e.typ=EVTYP_ALT[e.typ];
      const f=e.felder||{};
      if(e.mittel===undefined)e.mittel=f.mittel||f.saeure||f.neu||f.duenger||null;
      if(e.menge===undefined){
        const z=zahlAus(f.menge);
        if(z!=null){e.menge=z;em++}else e.menge=null;
      }
      if(e.einheit===undefined)e.einheit=e.menge!=null?evEinheit(e.typ,e.mittel):null;
      if(e.jeReservoir===undefined)e.jeReservoir=false;
    }
    if(em)notizen.push(`Bei ${em} Eintrag${em>1?'en':''} liess sich aus einem alten Freitextfeld eine Menge herauslesen. Der ursprüngliche Text bleibt erhalten.`);
  }
  if(von<9){
    /* Sauerstoff am Tank und wer gemessen hat. Alte Einträge bekommen null –
       geraten wird nichts. */
    for(const m of d.messungen){
      if(m.o2===undefined)m.o2=null;
      if(m.o2sat===undefined)m.o2sat=null;
      if(m.wer===undefined)m.wer=null;
    }
    for(const e of d.ereignisse)if(e.wer===undefined)e.wer=null;
  }
  if(von<10)for(const e of d.ereignisse)if(e.einheit===undefined&&e.mittel)e.einheit=evEinheitAlt(e);
  if(von<11){
    /* Seit dem 30. September tragen Messungen und Einträge eine Uhrzeit.
       Bisherige haben keine – sie bleibt leer. */
    for(const m of d.messungen)if(m.zeit===undefined)m.zeit=null;
    for(const e of d.ereignisse)if(e.zeit===undefined)e.zeit=null;
  }
  d.schema=11;
  return {db:d,notizen,von};
}

/* ── Optimum ──
   Gezeigt wird das Optimum, das im Laborbericht steht – nichts Eigenes,
   nichts Gerechnetes. */
const optimum=(a,k)=>(a&&a.optima&&Array.isArray(a.optima[k])&&(a.optima[k][0]!=null||a.optima[k][1]!=null))?a.optima[k]:null;
const optText=o=>!o?'–':o[0]!=null&&o[1]!=null?`${nz(o[0])}–${nz(o[1])}`:o[1]!=null?`bis ${nz(o[1])}`:`ab ${nz(o[0])}`;
/* Lage 0–3: [0,1] unter dem Optimum · [1,2] im Optimum · [2,3] darüber –
   begrenzt. Nur für die Anzeige «Lage im Optimum», damit Nährstoffe mit
   ganz verschiedenen Zahlen in dasselbe Fenster passen. */
function lage(v,o){
  if(v==null||!o)return null;
  const lo=o[0],hi=o[1];
  if(lo==null&&hi==null)return null;
  if(lo==null)return hi>0?(v<=hi?1+Math.min(1,v/hi):2+Math.min(1,(v-hi)/hi)):null;
  if(hi==null||hi<=lo)return v<lo?(lo>0?Math.max(0,v/lo):0):1.5;
  if(v<lo)return lo>0?Math.max(0,Math.min(1,v/lo)):0;
  if(v<=hi)return 1+(v-lo)/(hi-lo);
  return 2+Math.min(1,(v-hi)/(hi||1));
}

/* ══════════ 5 · Diagramme ══════════ */
const FARBEN=['#2C7A4B','#BE6F16','#3A6DA6','#7A4E8C','#A2432E','#3F7F7A','#8A7118','#556B2F'];
const svgAuf=(w,h,t)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(t)}" style="display:block">`;
const leerBox=(box,t)=>{box.innerHTML=`<p class="muted small" style="padding:18px 0">${esc(t)}</p>`};

/* ── Sofort-Tooltip ──────────────────────────────────────
   Der eingebaute <title>-Tooltip der Browser erscheint erst nach rund einer
   Sekunde, laesst sich nicht gestalten und bricht lange Texte hart um.
   Stattdessen traegt jedes anfassbare Element data-tipp mit fertigem,
   bereits maskiertem HTML; ein einziger Zeiger-Beobachter zeigt es an. */
let TIPP=null;
function tippKasten(){
  if(!TIPP){TIPP=document.createElement('div');TIPP.className='tipp';document.body.appendChild(TIPP)}
  return TIPP;
}
function tippZeigen(html,x,y){
  const t=tippKasten();
  t.innerHTML=html;t.classList.add('an');
  const b=t.getBoundingClientRect();
  let lx=x+14,ly=y+16;
  if(lx+b.width>window.innerWidth-8)lx=x-b.width-14;
  if(lx<8)lx=8;
  if(ly+b.height>window.innerHeight-8)ly=y-b.height-14;
  if(ly<8)ly=8;
  t.style.left=lx+'px';t.style.top=ly+'px';
}
const tippWeg=()=>{if(TIPP)TIPP.classList.remove('an')};
/* Ein Beobachter fuer das ganze Dokument statt einer Bindung je Diagramm:
   ueberlebt jedes Neuzeichnen, weil er nicht an den Elementen haengt. */
document.addEventListener('mousemove',ev=>{
  const t=ev.target&&ev.target.closest?ev.target.closest('[data-tipp]'):null;
  if(!t)return tippWeg();
  tippZeigen(t.dataset.tipp,ev.clientX,ev.clientY);
},{passive:true});
document.addEventListener('mouseleave',tippWeg);
window.addEventListener('scroll',tippWeg,{passive:true});
document.addEventListener('click',ev=>{
  const t=ev.target&&ev.target.closest?ev.target.closest('[data-tipp]'):null;
  if(t&&t.dataset.tun===undefined)tippZeigen(t.dataset.tipp,ev.clientX,ev.clientY);
});

/* ── Markierungsformen ───────────────────────────────────
   Die Farbe steht fuer den Naehrstoff, die Form fuer die zweite Dimension
   (Blattalter bzw. Entnahmestelle). Wer nur die Farbe unterscheiden kann,
   liest die Form – und umgekehrt. */
const FORMEN=['kreis','raute','quadrat','dreieck','kreuz','ring'];
function marke(form,x,y,r,farbe,deckung){
  const o=deckung!=null?deckung:1,f=`fill="${farbe}" opacity="${o}"`;
  switch(form){
    case 'raute':   return `<polygon points="${x},${y-r*1.25} ${x+r*1.15},${y} ${x},${y+r*1.25} ${x-r*1.15},${y}" ${f}/>`;
    case 'quadrat': return `<rect x="${x-r*0.92}" y="${y-r*0.92}" width="${r*1.84}" height="${r*1.84}" rx="1" ${f}/>`;
    case 'dreieck': return `<polygon points="${x},${y-r*1.3} ${x+r*1.2},${y+r*0.85} ${x-r*1.2},${y+r*0.85}" ${f}/>`;
    case 'kreuz':   return `<path d="M${x-r} ${y-r}L${x+r} ${y+r}M${x-r} ${y+r}L${x+r} ${y-r}" stroke="${farbe}" stroke-width="${r*0.75}" stroke-linecap="round" fill="none" opacity="${o}"/>`;
    case 'ring':    return `<circle cx="${x}" cy="${y}" r="${r*0.95}" fill="#fff" stroke="${farbe}" stroke-width="${r*0.62}" opacity="${o}"/>`;
    default:        return `<circle cx="${x}" cy="${y}" r="${r}" ${f}/>`;
  }
}
/* Zeichen für eine Reihe, klein, für Knöpfe und Hinweise neben dem
   Diagramm – dieselbe Form wie im Diagramm. */
const zeichen=(form,farbe)=>`<svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true">${marke(form,7,6,4.4,farbe)}</svg>`;

/* ── Gestapeltes Diagramm mit gemeinsamer Zeitachse ──────────────────────
   Mehrere Spuren untereinander, eine einzige x-Achse. Jede Spur hat ihre
   eigene y-Achse – Blattsaft in ppm und Wasser in mmol/l messen verschiedene
   Dinge, und zwischen ihnen steht die Wurzel. Sie ineinander umzurechnen
   würde eine Massenbilanz suggerieren, die es nicht gibt.
   Eine Spur mit «kopf» beginnt ein neues Fenster (Blattsaft, Giesswasser):
   darüber steht seine Überschrift, davor etwas Luft. Unter den Spuren liegen
   die Balken des Kulturmanagements, darunter die Zeitachse.
   o = {spuren:[{kopf,titel,serien,yTyp:'wert'|'lage',band,bandLabel,yLabel,hoehe,leerText}],
        von,bis,linien,aufKlick,spannen,punktR,titel}                     */
function chartStapel(box,o){
  const spuren=o.spuren||[];
  if(!spuren.length)return leerBox(box,'Nichts ausgewählt.');
  const W=Math.max(box.clientWidth||900,560),ml=104,mr=44,r=o.punktR||5;
  const spannen=o.spannen||[];
  let x0=o.von,x1=o.bis;
  if(x0==null||x1==null||!(x1>x0)){
    const alle=spuren.flatMap(sp=>(sp.serien||[]).flatMap(se=>se.punkte.map(p=>p.x)));
    for(const sp of spannen){alle.push(sp.x0,sp.x1)}
    if(!alle.length)return leerBox(box,'Keine Werte im gewählten Zeitraum.');
    x0=Math.min(...alle);x1=Math.max(...alle);
    if(x0===x1){x0-=6048e5;x1+=6048e5}
    const sp=(x1-x0)*0.05;x0-=sp;x1+=sp;
  }
  const X=v=>ml+(v-x0)/((x1-x0)||1)*(W-ml-mr);
  const SZ=spannenZeilen(spannen,X,x0,x1,W-4);
  const spH=SZ.n?26+SZ.n*BALKEN_ZEILE:0;
  const achseH=34,KOPF=30;
  const hoehen=spuren.map(sp=>sp.hoehe||190);
  const H=hoehen.reduce((a,b)=>a+b,0)+spuren.filter(sp=>sp.kopf).length*KOPF+spH+achseH+10;
  let s=svgAuf(W,H,o.titel||'Verlauf auf gemeinsamer Zeitachse');
  let oben=4;
  const treffer=[];

  spuren.forEach((sp,si)=>{
    if(sp.kopf){
      /* Neues Fenster: Überschrift links, eine feine Linie über die Breite */
      s+=`<text x="${ml}" y="${oben+19}" font-size="14" font-weight="700" fill="#141D17" font-family="Bricolage Grotesque,Inter,sans-serif">${esc(sp.kopf)}</text>`;
      if(si>0)s+=`<line x1="${8}" x2="${W-8}" y1="${oben+2}" y2="${oben+2}" stroke="#DCE3D5"/>`;
      oben+=KOPF;
    }
    const h=hoehen[si],mt=oben+20,unten=oben+h-8;
    const serien=(sp.serien||[]).filter(se=>se.punkte&&se.punkte.length);
    const sicht=serien.flatMap(se=>se.punkte.filter(p=>p.x>=x0&&p.x<=x1));
    const lageSkala=sp.yTyp==='lage';
    let y0,y1;
    if(lageSkala){y0=0;y1=3}
    else{
      const ys=sicht.map(p=>p.y);
      if(!ys.length){y0=0;y1=1}
      else{
        /* Die Achse folgt den MESSWERTEN. Ein Optimum, das weit über allem
           liegt, würde sonst die Auflösung dorthin ziehen, wo nichts steht.
           Das Band wird dann einfach auf die sichtbare Fläche beschnitten. */
        y0=Math.min(...ys);y1=Math.max(...ys);
        if(sp.band){
          const spanne=(y1-y0)||Math.abs(y1)||1;
          if(sp.band[0]!=null&&sp.band[0]>y0-2*spanne&&sp.band[0]<y1+2*spanne)y0=Math.min(y0,sp.band[0]);
          if(sp.band[1]!=null&&sp.band[1]<y1+2*spanne&&sp.band[1]>y0-2*spanne)y1=Math.max(y1,sp.band[1]);
        }
        const pad=((y1-y0)||Math.abs(y1)||1)*0.16;y0-=pad;y1+=pad;
        /* Eine negative Konzentration gibt es nicht */
        if(y0<0&&Math.min(...ys)>=0)y0=0;
        else if(y0>0&&y0<pad*3)y0=0;
      }
    }
    const Y=v=>mt+(1-(v-y0)/((y1-y0)||1))*(unten-mt);
    s+=`<rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${unten-mt}" fill="#fff"/>`;
    if(lageSkala){
      s+=`<rect x="${ml}" y="${Y(3)}" width="${W-ml-mr}" height="${Y(2)-Y(3)}" fill="#F6F7F3"/>`;
      s+=`<rect x="${ml}" y="${Y(2)}" width="${W-ml-mr}" height="${Y(1)-Y(2)}" fill="#E3F0E1"/>`;
      s+=`<rect x="${ml}" y="${Y(1)}" width="${W-ml-mr}" height="${Y(0)-Y(1)}" fill="#F6F7F3"/>`;
      s+=`<text x="${ml-8}" y="${(Y(2)+Y(1))/2+4}" text-anchor="end" font-size="10.5" fill="#2C7A4B">Optimum</text>`;
      s+=`<text x="${ml-8}" y="${Y(3)+12}" text-anchor="end" font-size="10" fill="#697A6C">darüber</text>`;
      s+=`<text x="${ml-8}" y="${Y(0)-4}" text-anchor="end" font-size="10" fill="#697A6C">darunter</text>`;
    }else{
      if(sp.band&&(sp.band[0]!=null||sp.band[1]!=null)){
        const roh1=Y(sp.band[1]!=null?sp.band[1]:y1),roh0=Y(sp.band[0]!=null?sp.band[0]:y0);
        const b1=Math.max(mt,Math.min(roh1,roh0)),b0=Math.min(unten,Math.max(roh1,roh0));
        if(b0>b1){
          s+=`<rect x="${ml}" y="${b1}" width="${W-ml-mr}" height="${Math.max(1,b0-b1)}" fill="#E3F0E1"/>`;
          s+=`<text x="${W-mr-4}" y="${b1+12}" text-anchor="end" font-size="10" fill="#2C7A4B">${esc(sp.bandLabel||'Optimum')}</text>`;
        }
      }
      for(let k=0;k<=3;k++){const v=y0+(y1-y0)*k/3,y=Y(v);
        s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#EDF1E9"/>`+
           `<text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#697A6C" font-family="JetBrains Mono,monospace">${nz(v)}</text>`}
    }
    /* Titel und Einheit der Spur */
    if(sp.titel)s+=`<text x="${ml}" y="${oben+13}" font-size="11.5" font-weight="600" fill="#141D17">${esc(sp.titel)}</text>`;
    if(sp.yLabel)s+=`<text x="${W-mr}" y="${oben+13}" text-anchor="end" font-size="10.5" fill="#697A6C">${esc(sp.yLabel)}</text>`;
    /* Linien vor den Punkten, damit sie nicht darüber liegen. Verbunden wird
       nur innerhalb einer Reihe – über zwei Blattetagen oder zwei
       Entnahmestellen hinweg wäre die Linie eine Behauptung über zwei
       verschiedene Dinge. */
    if(o.linien)for(const se of serien){
      const sicht2=se.punkte.filter(q=>q.x>=x0&&q.x<=x1).sort((a,b)=>a.x-b.x);
      if(sicht2.length<2)continue;
      s+=`<polyline fill="none" stroke="${se.farbe}" stroke-width="1.6" opacity=".5" points="${
        sicht2.map(q=>X(q.x)+','+Y(q.y)).join(' ')}"/>`;
    }
    for(const se of serien)for(const q of se.punkte){
      if(q.x<x0||q.x>x1)continue;
      const cx=X(q.x),cy=Y(q.y);
      s+=marke(se.form,cx,cy,r,se.farbe,1);
      treffer.push({cx,cy,tipp:q.tipp,kennung:q.kennung});
    }
    if(!sicht.length)s+=`<text x="${(ml+W-mr)/2}" y="${(mt+unten)/2+4}" text-anchor="middle" font-size="11.5" fill="#A8B3A4">${esc(sp.leerText||'keine Messung in diesem Zeitraum')}</text>`;
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${unten}" y2="${unten}" stroke="#DCE3D5"/>`;
    oben+=h;
  });

  /* Die Balken des Kulturmanagements: seit wann etwas gegeben wird, und
     bis wann. Die Mengen stehen im Kästchen, ein Klick öffnet die Gaben. */
  const spO=oben;
  if(SZ.n){
    s+=`<line x1="${8}" x2="${W-8}" y1="${spO+2}" y2="${spO+2}" stroke="#DCE3D5"/>`;
    s+=`<text x="${ml}" y="${spO+19}" font-size="14" font-weight="700" fill="#141D17" font-family="Bricolage Grotesque,Inter,sans-serif">Kulturmanagement</text>`;
    s+=spannenSvg(SZ,spO+26,ml);
  }
  /* Gemeinsame Zeitachse, einmal */
  const achseY=spO+spH+4;
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${achseY}" y2="${achseY}" stroke="#141D17"/>`;
  for(const t of zeitMarken(x0,x1))
    s+=`<line x1="${X(t.x)}" x2="${X(t.x)}" y1="${achseY}" y2="${achseY+4}" stroke="#141D17"/>`+
       `<text x="${X(t.x)}" y="${achseY+16}" text-anchor="middle" font-size="10.5" fill="#697A6C">${esc(t.text)}</text>`;
  s+=`<text x="${W-mr}" y="${achseY+29}" text-anchor="end" font-size="10" fill="#A8B3A4">Ziehen verschiebt · Rad zoomt · Doppelklick setzt zurück</text>`;

  /* Trefferflächen zuletzt, damit sie oben liegen */
  for(const t of treffer)
    s+=`<circle class="hit" cx="${t.cx}" cy="${t.cy}" r="${Math.max(9,r+5)}" data-tipp="${esc(t.tipp||'')}"${
      (o.aufKlick&&t.kennung)?` data-tun="diagPunkt" data-id="${esc(t.kennung)}" style="cursor:pointer"`:' style="cursor:help"'}/>`;
  s+=`<line class="zeiger" x1="-99" x2="-99" y1="4" y2="${achseY}" stroke="#141D17" stroke-width="1" opacity=".35" pointer-events="none"/>`;
  box.innerHTML=s+'</svg>';
  stapelBedienung(box,{W,ml,mr,x0,x1});
}
AKTION.diagPunkt=d=>{if(DIAG&&DIAG.klick)DIAG.klick(d.id)};
/* Sinnvolle Marken auf der Zeitachse, je nach Spannweite */
function zeitMarken(x0,x1){
  const t=(x1-x0)/864e5,out=[];
  const d0=new Date(x0);
  if(t<=3){                                         /* Stunden – seit es Uhrzeiten gibt */
    const schritt=t<=1.2?3:t<=2.2?6:12;
    const d=new Date(Math.ceil(x0/36e5)*36e5);
    while(d.getUTCHours()%schritt)d.setUTCHours(d.getUTCHours()+1);
    for(;+d<=x1;d.setUTCHours(d.getUTCHours()+schritt)){
      const h=d.getUTCHours();
      out.push({x:+d,text:h===0?fmtK(d.toISOString().slice(0,10)):String(h).padStart(2,'0')+':00'});
    }
  }else if(t<=16){                                  /* Tage */
    const d=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),d0.getUTCDate()));
    const schritt=t<=9?1:2;
    for(;+d<=x1;d.setUTCDate(d.getUTCDate()+schritt))
      if(+d>=x0)out.push({x:+d,text:fmtK(d.toISOString().slice(0,10))});
  }else if(t<=70){                                  /* Wochen */
    const d=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),d0.getUTCDate()));
    while(d.getUTCDay()!==1)d.setUTCDate(d.getUTCDate()+1);
    for(;+d<=x1;d.setUTCDate(d.getUTCDate()+7))
      if(+d>=x0)out.push({x:+d,text:fmtK(d.toISOString().slice(0,10))});
  }else{                                            /* Monate */
    const d=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),1));
    const N=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    for(;+d<=x1;d.setUTCMonth(d.getUTCMonth()+1))
      if(+d>=x0)out.push({x:+d,text:N[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2)});
  }
  return out.length?out:[{x:x0,text:fmtK(new Date(x0).toISOString().slice(0,10))}];
}
/* Ziehen, Zoomen, Zuruecksetzen – wirkt auf alle Spuren gleichzeitig, weil
   sie sich denselben x-Bereich teilen. */
let koVon=null,koBis=null;
/* Wer die gemeinsame Zeitachse gerade benutzt, meldet hier an, was bei
   Zoom («zoom») und Zurücksetzen («reset») mit seinem Zeitraum-Knopf
   geschehen soll. */
let zoomHaken=null;
const zoomMelden=art=>{if(zoomHaken)try{zoomHaken(art)}catch(e){}};
/* Der Zustand des Ziehens liegt bewusst AUSSERHALB der Funktion. Jede
   Verschiebung zeichnet das Diagramm neu, dabei werden die Ereignisbehandler
   ersetzt – laege der Zustand in ihrer Umgebung, waere das Ziehen nach dem
   ersten Bildpunkt zu Ende, und man muesste die Maustaste immer wieder neu
   druecken. */
let zieht=false,ziehBewegt=false,ziehStart=0,ziehVon=0,ziehBis=0;
function stapelBedienung(box,g){
  const svg=box.querySelector('svg');if(!svg)return;
  const zeiger=box.querySelector('.zeiger');
  const zuX=ev=>{
    const r=svg.getBoundingClientRect();
    if(!r.width)return null;
    return (ev.clientX-r.left)*(g.W/r.width);
  };
  const zuZeit=px=>g.x0+(px-g.ml)/((g.W-g.ml-g.mr)||1)*(g.x1-g.x0);
  if(zieht)box.style.cursor='grabbing';
  box.onmousedown=ev=>{
    const px=zuX(ev);if(px==null||px<g.ml)return;
    zieht=true;ziehBewegt=false;ziehStart=px;ziehVon=g.x0;ziehBis=g.x1;
    box.style.cursor='grabbing';ev.preventDefault();
  };
  box.onmousemove=ev=>{
    const px=zuX(ev);if(px==null)return;
    if(zeiger&&px>=g.ml){zeiger.setAttribute('x1',px);zeiger.setAttribute('x2',px)}
    if(!zieht)return;
    if(Math.abs(px-ziehStart)<2)return;
    ziehBewegt=true;
    const d=(ziehStart-px)/((g.W-g.ml-g.mr)||1)*(ziehBis-ziehVon);
    koVon=ziehVon+d;koBis=ziehBis+d;zoomMelden('zoom');
    /* Waehrend des Ziehens wird nur die Zeichnung erneuert, nicht die Tabellen
       darunter – sonst ruckelt es. Der Rest folgt beim Loslassen. */
    if(DIAG&&DIAG.zeichnen){tippWeg();DIAG.zeichnen()}else diagFrisch();
  };
  /* Nur nach einer echten Verschiebung wird der ganze Reiter erneuert. Sonst
     wuerde schon ein einfacher Klick die Zeichnung austauschen – und ein
     Doppelklick koennte gar nicht mehr entstehen, weil sein erstes Ziel
     zwischendurch aus dem Dokument verschwaende. */
  const los=()=>{const b=zieht&&ziehBewegt;zieht=false;ziehBewegt=false;box.style.cursor='';if(b)diagFrisch()};
  box.onmouseup=los;
  box.onmouseleave=()=>{los();if(zeiger){zeiger.setAttribute('x1',-99);zeiger.setAttribute('x2',-99)}};
  box.addEventListener('wheel',ev=>{
    const px=zuX(ev);if(px==null||px<g.ml)return;
    ev.preventDefault();
    const mitte=zuZeit(px);
    const f=ev.deltaY>0?1.25:0.8;
    const nv=mitte-(mitte-g.x0)*f,nb=mitte+(g.x1-mitte)*f;
    if(nb-nv<3*864e5)return;                        /* nicht enger als drei Tage */
    koVon=nv;koBis=nb;zoomMelden('zoom');diagFrisch();
  },{passive:false});
  box.ondblclick=()=>{koVon=koBis=null;zoomMelden('reset');diagFrisch()};
}

/* ── Balken und Marken unter der Zeitachse ─────────────────────────────
   Balken: 18 Bildpunkte hoch, satt in der Farbe des Mittels, die
   Beschriftung weiss im Balken – passt sie nicht hinein, steht sie dunkel
   gleich rechts daneben (am rechten Rand links davor). Ein Balken, der noch
   läuft, endet in einer Spitze: es geht weiter. Zeiträume desselben Mittels
   teilen sich eine Zeile, solange Balken und Beschriftung nicht
   aneinanderstossen.
   Marken: ein einzelnes Ereignis ohne Mittel (Tank neu angesetzt,
   Umpumpen …). Eine Zeile je Art, links benannt; mehrere am selben Tag
   werden eine Marke mit Zahl. */
const BALKEN_ZEILE=23,BALKEN_H=18,BALKEN_ZEICHEN=6.4;
function spannenZeilen(spannen,X,x0,x1,rechts){
  const zeilen=[],liste=[];
  const grenze=rechts!=null?rechts:X(x1)+20;
  for(const sp of spannen){
    const a=Math.max(x0,sp.x0),b=Math.min(x1,sp.x1);if(b<a)continue;
    const key=sp.zeile||sp.kennung;
    if(sp.marke){
      let z=zeilen.findIndex(r=>r.key===key);
      if(z<0){zeilen.push({key,ende:Infinity,text:sp.zeileText||''});z=zeilen.length-1}
      const xm=X(a);
      liste.push({sp,z,xa:xm-6,xb:xm+6,lage:'marke',innen:false,spitze:0,links:xm-6,ende:xm+6});
      continue;
    }
    const xa=X(a),xb=Math.max(X(b),xa+6),textW=String(sp.text||'').length*BALKEN_ZEICHEN;
    const spitze=sp.laeuft?8:0;
    let lage,links,ende;
    if(xb-xa>=textW+18){lage='innen';links=xa;ende=xb+spitze}
    else if(xb+spitze+6+textW<=grenze){lage='rechts';links=xa;ende=xb+spitze+6+textW}
    else{lage='links';links=xa-6-textW;ende=xb+spitze}
    links-=6;ende+=12;
    let z=zeilen.findIndex(r=>r.key===key&&r.ende<=links);
    if(z<0){zeilen.push({key,ende,text:''});z=zeilen.length-1}else zeilen[z].ende=ende;
    liste.push({sp,z,xa,xb,lage,innen:lage==='innen',spitze,links,ende});
  }
  return {liste,n:zeilen.length,zeilen};
}
/* Eine Farbe um f dunkler – damit weisse Schrift auch auf Orange lesbar ist. */
function dunkler(hex,f){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||''));if(!m)return hex;
  const n=parseInt(m[1],16),k=c=>Math.round(c*(1-f)).toString(16).padStart(2,'0');
  return '#'+k(n>>16&255)+k(n>>8&255)+k(n&255);
}
function spannenSvg(SZ,oben,ml){
  let s='';
  if(ml!=null)(SZ.zeilen||[]).forEach((r,z)=>{if(r.text)s+=`<text x="${ml-8}" y="${oben+z*BALKEN_ZEILE+12.6}" text-anchor="end" font-size="10.5" fill="#4F5E53">${esc(r.text)}</text>`});
  for(const {sp,z,xa,xb,lage,spitze} of SZ.liste){
    const y=oben+z*BALKEN_ZEILE,h=BALKEN_H,f=dunkler(sp.farbe,.12);
    s+=`<g class="spb" style="cursor:pointer" data-tun="spanne" data-id="${esc(sp.kennung)}" data-tipp="${esc(sp.tipp||'')}">`;
    if(lage==='marke'){
      const cx=(xa+xb)/2,cy=y+h/2;
      s+=(sp.n||1)>1
        ? `<rect x="${cx-10}" y="${cy-8}" width="20" height="16" rx="8" fill="${f}"/><text x="${cx}" y="${cy+3.5}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#fff">${sp.n}</text>`
        : `<circle cx="${cx}" cy="${cy}" r="6.5" fill="${f}" stroke="#fff" stroke-width="1.5"/>`;
      /* Die unsichtbare Trefferfläche liegt zuoberst: sie fängt den Zeiger
         für die ganze Marke, samt Zahl. */
      s+=`<rect x="${cx-11}" y="${y}" width="22" height="${h}" fill="transparent"/></g>`;
      continue;
    }
    s+=`<rect x="${xa}" y="${y}" width="${xb-xa}" height="${h}" rx="5" fill="${f}"/>`;
    if(spitze)s+=`<path d="M${xb-5} ${y}L${xb+spitze} ${y+h/2}L${xb-5} ${y+h}Z" fill="${f}"/>`;
    const dunkel=dunkler(sp.farbe,.35);
    s+=lage==='innen'
      ?`<text x="${xa+8}" y="${y+12.6}" font-size="11" font-weight="600" fill="#fff">${esc(sp.text)}</text>`
      :lage==='links'
      ?`<text x="${xa-6}" y="${y+12.6}" text-anchor="end" font-size="11" font-weight="600" fill="${dunkel}">${esc(sp.text)}</text>`
      :`<text x="${xb+spitze+6}" y="${y+12.6}" font-size="11" font-weight="600" fill="${dunkel}">${esc(sp.text)}</text>`;
    s+=`</g>`;
  }
  return s;
}
/* Baustein für den Inhalt des Infokästchens. Alles wird hier maskiert,
   damit ein Name mit spitzer Klammer kein Markup einschleusen kann. */
function tippBau(kopf,farbe,zeilen,fuss){
  let t=`<b><i style="background:${farbe}"></i>${esc(kopf)}</b>`;
  for(const z of zeilen.filter(Boolean)){
    if(Array.isArray(z))t+=`<div class="z">${esc(z[0])}: <span class="w">${esc(z[1])}</span></div>`;
    else t+=`<div class="z">${esc(z)}</div>`;
  }
  if(fuss)t+=`<div class="k">${esc(fuss)}</div>`;
  return t;
}

/* Diagramm allein neu bauen: die Bedienelemente und das Diagramm werden

function diagFrisch(){

}

const TYPNAME={blattsaft:'Blattsaft',substrat:'Substrat',giesswasser:'Giesswasser'};
const PARAM_JE_TYP={
  blattsaft:NCC.map(p=>p[1]),
  substrat:['sub_pH','sub_Salz','sub_Nmin','res_P2O5','res_K2O','res_Mg','res_Ca','sof_P2O5','sof_K2O','sof_Mg','sof_Ca','sub_Mn','sub_Cu','sub_Zn','sub_Fe','sub_B'],
  giesswasser:GW_PARAM.map(k=>'gw_'+k)};
/* Reihenfolge im Bericht: wie auf dem Laborblatt, nach Gruppen. */
const GRUPPEN=[
 ['Stickstoff',['NO3','N_aus_NO3','N_gesamt','NH4']],
 ['Hauptnährstoffe',['K','Ca','Mg','P','S']],
 ['Spurenelemente',['Fe','Mn','Zn','B','Cu','Mo']],
 ['Natrium und Chlorid',['Na','Cl']],
 ['Weitere',['Si','Al']],
 ['Summenparameter',['Zucker','pH','EC','K/Ca']]];
const BLATT_REIHE=['jung','alt','misch'];
const BLATTNAME={jung:'jung',alt:'alt',misch:'Mischprobe'};
const BLATTSPALTE={jung:'junges Blatt',alt:'altes Blatt',misch:'Mischprobe'};
/* Ein Blattsaftbericht enthält meist zwei Proben, jung und alt. Sie gehören
   zusammen: gleicher Satz, gleiches Datum, gleiches Kulturbild. Jede
   Wasserprobe ist ihr eigener Bericht. */
const berichtSchluessel=a=>a.typ==='blattsaft'?['b',a.satz||'',a.datum||'',a.zustand||''].join('|'):'a|'+a.id;
function berichte(){
  const m=new Map();
  for(const a of db.analysen){
    const k=berichtSchluessel(a);
    if(!m.has(k))m.set(k,{id:k,typ:a.typ,datum:a.datum,satz:a.satz,zustand:a.zustand||null,proben:[]});
    m.get(k).proben.push(a);
  }
  const out=[...m.values()];
  for(const b of out)b.proben.sort((x,y)=>BLATT_REIHE.indexOf(x.blattalter||'misch')-BLATT_REIHE.indexOf(y.blattalter||'misch'));
  return out.sort((x,y)=>(y.datum||'').localeCompare(x.datum||'')
    ||String(x.typ).localeCompare(String(y.typ))||String(x.satz||gwStelle(x.proben[0])).localeCompare(String(y.satz||gwStelle(y.proben[0]))));
}

const berichtTitel=b=>[TYPNAME[b.typ]||b.typ||'Analyse',
  b.typ==='giesswasser'?gwStelle(b.proben[0]):b.satz?'Satz '+b.satz:null,fmt(b.datum)].filter(Boolean).join(' · ');

/* Ein Wert und, wenn das Labor eines angibt, sein Optimum als Band: grün
   der Bereich des Labors, der Strich der Wert. Keine Farbe für gut oder
   schlecht – wo der Strich steht, sieht man. */
function wertMitOptimum(w,o){
  if(!w||w.wert==null)return '<span class="muted">–</span>';
  if(w.unter)return `<span class="mono muted" title="unter der Nachweisgrenze des Labors">&lt;${nz(w.wert)}</span>`;
  const v=w.wert;
  if(!o)return `<span class="mono">${nz(v)}</span>`;
  const lo=o[0]!=null?o[0]:0;
  const min=Math.min(v,lo)*0.85,max=Math.max(v,o[1]!=null?o[1]:lo*1.6)*1.12||1;
  const hi=o[1]!=null?o[1]:max;
  const pos=x=>Math.max(0,Math.min(100,(x-min)/((max-min)||1)*100));
  return `<div class="wertzeile"><span class="mono w">${nz(v)}</span>
    <div class="bar" title="Optimum laut Labor: ${esc(optText(o))}"><div class="opt" style="left:${pos(lo)}%;width:${Math.max(2,pos(hi)-pos(lo))}%"></div><div class="mk" style="left:${pos(v)}%"></div></div></div>`;
}
/* Der Bericht: alle Werte, beim Blattsaft jung und alt nebeneinander, mit

/* Felder nach Gruppen, in derselben Reihenfolge wie im Laborbericht. */
function feldGruppen(i,p,keys){
  const rest=keys.filter(k=>!GRUPPEN.some(g=>g[1].indexOf(k)>=0));
  const bloecke=GRUPPEN.concat(rest.length?[['Weitere Werte',rest]]:[])
    .map(([titel,ks])=>{
      const vorhanden=ks.filter(k=>keys.indexOf(k)>=0);
      if(!vorhanden.length)return '';
      return `<div style="margin-bottom:12px"><div class="lab" style="border-bottom:1px solid var(--line2);padding-bottom:3px;margin-bottom:7px">${esc(titel)}</div>

        ${vorhanden.map(k=>feldHtml(i,k,p.werte[k],p)).join('')}</div></div>`;
    }).join('');
  return bloecke||'<p class="muted small">Noch keine Messwerte – unten ergänzen.</p>';
}
function feldHtml(i,k,w,p){
  const o=optimum(p,k);
  /* Fängt Übertragungsfehler, nicht echte Extremwerte: erst ab dem
     Sechsfachen der oberen Grenze. Ammonium bei 178 gegen ein Optimum bis 55
     ist echt; Kalium bei 104000 gegen 4800 ist ein verrutschtes Komma. */
  const weit=!!(w&&w.wert!=null&&!w.unter&&o&&o[1]!=null&&o[1]>0&&w.wert>o[1]*6);
  return `<div data-feld="${esc(k)}"><label class="lab">${esc(NAME[k]||k)} <span class="muted">${esc(einheit(k))}</span></label>
  <input class="mono" style="width:100%${weit?';border-color:var(--alarm);background:var(--alarm-soft)':''}"
    value="${w&&w.wert!=null?(w.unter?'<':'')+w.wert:''}" data-aend="pruefFeld" data-i="${i}" data-w="${esc(k)}"
    title="Ein vorangestelltes &lt; kennzeichnet einen Wert unter der Nachweisgrenze.">
  <div class="tiny muted" style="margin-top:2px">${o?'Optimum '+esc(optText(o)):'&nbsp;'}${weit?' <span class="val-off">ungewöhnlich – bitte prüfen</span>':''}</div></div>`;
}
AKTION.feldDazu=d=>{

/* Wechselt die Art, wird das Formular neu aufgebaut (Satz oder Stelle) –

AKTION.pruefFeld=d=>{if(d.f==='typ'){pruefLesen();pruefdialog(PRUEF,PRUEF_BEARB)}else pruefPruefen()};
function pruefLesen(){
  const v=PRUEF,body=el('dlgBody');
  body.querySelectorAll('[data-f]').forEach(e=>{
    const p=v[+e.dataset.i];if(!p)return;
    if(e.dataset.f==='ok')p.__ok=e.checked;
    else p[e.dataset.f]=e.value||null;
  });
  body.querySelectorAll('[data-w]').forEach(e=>{
    const p=v[+e.dataset.i];if(!p)return;
    const k=e.dataset.w,roh=String(e.value||'').trim(),n=toNum(roh);
    if(n==null)delete p.werte[k];else p.werte[k]={wert:n,unter:isLim(roh)};
  });
  return v;
}
function pruefPruefen(){
  const v=pruefLesen();let blocker=0;
  v.forEach((p,i)=>{
    const box=document.querySelector(`[data-warn="${i}"]`);
    if(!box)return;
    const w=[];
    if(p.__ok!==false){
      if(!p.datum)w.push('Probendatum fehlt.');
      if(p.typ==='blattsaft'&&!p.blattalter)w.push('Bitte wählen, welches Blatt: jung, alt oder Mischprobe.');
      if(p.typ==='giesswasser'){
        if(!p.stelle)w.push('Ohne Namen der Entnahmestelle lassen sich Proben vom selben Tag nicht auseinanderhalten.');
        if(p.stelle&&p.datum&&db.analysen.some(x=>x.id!==p.id&&x.typ==='giesswasser'&&x.datum===p.datum&&(x.stelle||'')===p.stelle))
          w.push('Für diese Entnahmestelle und dieses Datum gibt es bereits eine Probe.');
      }
      else if(!p.satz)w.push('Die Satznummer fehlt.');
      if(p.typ==='blattsaft'&&p.satz&&p.datum&&p.blattalter&&db.analysen.some(x=>x.id!==p.id&&x.typ==='blattsaft'&&x.satz===p.satz&&x.datum===p.datum&&x.blattalter===p.blattalter&&(x.zustand||'')===(p.zustand||'')))
        w.push('Für diesen Satz, dieses Datum und dieses Blatt gibt es bereits eine Probe.');
      if(p.typ==='blattsaft'&&p.blattalter&&v.some((q,j)=>j!==i&&q.__ok!==false&&q.typ==='blattsaft'&&q.satz===p.satz&&q.datum===p.datum&&q.blattalter===p.blattalter&&(q.zustand||'')===(p.zustand||'')))
        w.push('Zwei Proben in diesem Import tragen dieselbe Kennzeichnung.');
      if(!Object.keys(p.werte||{}).length)w.push('Keine Messwerte erfasst.');
    }
    blocker+=w.filter(x=>/welches Blatt|Probendatum fehlt/.test(x)).length;
    box.innerHTML=w.length?`<div class="note">${w.map(esc).join('<br>')}</div>`:'';
  });
  const b=el('btnUeber');
  if(b){b.disabled=blocker>0;const h=el('pruefHint');if(h)h.textContent=blocker?'Bitte zuerst die markierten Angaben ergänzen.':''}
}
AKTION.uebernehmen=()=>{
  const v=pruefLesen(),neu=[];
  for(const p of v){
    if(p.__ok===false)continue;
    const rein=Object.assign({},p);
    delete rein.__ok;delete rein.hinweise;delete rein.optArt;
    rein.optima=JSON.parse(JSON.stringify(rein.optima||{}));
    const i=db.analysen.findIndex(x=>x.id===p.id);
    if(i>=0)db.analysen[i]=rein;else db.analysen.push(rein);
    neu.push(rein);
  }
  db.analysen.sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));
  aend();el('dlg').close();
  const n=neu.length;
  if(PRUEF_BEARB){render();if(neu.length)detail(neu[0].id);return toast('Gespeichert.')}
  tab='analysen';render();
  /* Ein einzelner Bericht wird gleich gezeigt – so sieht man, was angekommen ist. */
  if(n&&new Set(neu.map(berichtSchluessel)).size===1)setTimeout(()=>detail(neu[0].id),120);
  toast(n?`${n} Probe${n>1?'n':''} übernommen.${ONLINE.an?'':' Zum Behalten oben rechts sichern.'}`:'Nichts übernommen.');
};

/* ══════════ 8 · Blattsaft und Giesswasser ══════════
   Ein Reiter, zwei Fenster, eine Zeitachse: oben der Blattsaft, darunter
   das Giesswasser, darunter die Balken des Kulturmanagements. Ausgewählt
   wird, was man sehen will – die App stellt keine Fragen und gibt keine
   Antworten. Derselbe Stoff trägt oben und unten dieselbe Farbe.

   Bewusst NICHT umgerechnet: Blattsaft-ppm und Wasser-mmol/l messen
   verschiedene Dinge, zwischen ihnen steht die Wurzel. */

/* Feste Reihenfolge für die Farbvergabe: derselbe Nährstoff bekommt
   möglichst immer dieselbe Farbe, damit man ihn wiedererkennt. */
const STOFFREIHE=['NO3','N_gesamt','N_aus_NO3','NH4','K','Ca','Mg','P','S','Fe','Mn','Zn','B','Cu','Mo','Si','Na','Cl','Al','Zucker','pH','EC'];
const FARBSTOFF=['#2C7A4B','#BE6F16','#3A6DA6','#7A4E8C','#A2432E','#3F7F7A','#8A7118','#556B2F','#B0446F','#1F5F86','#96601C','#4B5D2A'];
/* Wunschfarbe je Nährstoff, aber innerhalb einer Auswahl nie doppelt. */
function farbenFuer(keys){
  const m={},belegt=new Set();
  for(const k of keys){
    const i=STOFFREIHE.indexOf(k);
    let c=FARBSTOFF[(i<0?keys.indexOf(k):i)%FARBSTOFF.length];
    if(belegt.has(c))c=FARBSTOFF.find(x=>!belegt.has(x))||c;

}
/* Die Farbe steht für den Stoff, die Form für das Blatt (oben) und für die
   Entnahmestelle (unten). */
const BLATTFORM={jung:'kreis',alt:'raute',misch:'quadrat'};

/* Wie gross sind die Zahlen eines Parameters üblicherweise? Der Median
   reicht dafür und ist gegen einen Ausreisser unempfindlich. */
function groessenordnung(werte){
  const v=werte.filter(x=>x!=null&&x>0).sort((a,b)=>a-b);
  return v.length?v[Math.floor(v.length/2)]:null;
}
/* Spuren bilden: erst nach Einheit, dann nach Grössenordnung. Kalium bei
   5000 ppm und Eisen bei 2 ppm teilen die Einheit, aber auf einer
   gemeinsamen Achse wäre Eisen eine Linie auf null – ab dem Faktor 25 bekommt
   jedes seine eigene Achse. Derselbe Stoff an zwei Stellen bleibt auf einer
   Achse. Mehr als drei Spuren je Fenster werden zusammengelegt. */
const SPANNE_MAX=25;
function spurGruppen(serien,max){
  const nachEinheit=new Map();
  for(const se of serien){const e=se.einh||'';if(!nachEinheit.has(e))nachEinheit.set(e,[]);nachEinheit.get(e).push(se)}
  const gruppen=[];
  for(const [e,liste] of nachEinheit){
    const nachParam=new Map();
    for(const se of liste){if(!nachParam.has(se.param))nachParam.set(se.param,[]);nachParam.get(se.param).push(se)}
    const mitG=[...nachParam.values()].map(gr=>({gr,g:groessenordnung(gr.flatMap(se=>se.punkte.map(q=>Math.abs(q.wert))))}))
      .sort((a,b)=>(a.g==null?Infinity:a.g)-(b.g==null?Infinity:b.g));
    let akt=null;
    for(const x of mitG){
      if(!akt||(x.g!=null&&akt.klein!=null&&x.g/akt.klein>SPANNE_MAX)){akt={einh:e,serien:[],klein:x.g};gruppen.push(akt)}
      x.gr.forEach(se=>akt.serien.push(se));
      if(akt.klein==null)akt.klein=x.g;
    }
  }
  while(gruppen.length>max){const l=gruppen.pop();l.serien.forEach(se=>gruppen[gruppen.length-1].serien.push(se))}
  return gruppen;
}

const gwStelle=a=>a.stelle||'ohne Namen';
/* ── Entnahmestellen zusammenfassen ────────────────────────────────────────
   gwStelle() liefert weiterhin die Bezeichnung, die im Bericht steht - sie
   wird nirgends ueberschrieben, in Tabellen und Infokaestchen erscheint immer
   das Original. Fuer alles, was Reihen bildet, tritt die zugeordnete Stelle
   an ihre Stelle. Ist nichts zugeordnet, bleibt die Bezeichnung ihre eigene
   Stelle - so aendert sich ohne Zutun nichts. */
const stellenDb=()=>{
  if(!db.stellen||!Array.isArray(db.stellen.gruppen))db.stellen=STELLEN_VORGABE();
  if(!db.stellen.zu)db.stellen.zu={};

};
const stelleDef=id=>stellenDb().gruppen.find(g=>g.id===id)||null;
/* Zustand einer Bezeichnung: zugeordnet, ausdruecklich draussen, oder offen. */
function stelleVon(a){
  const roh=gwStelle(a),zu=stellenDb().zu;
  if(Object.prototype.hasOwnProperty.call(zu,roh)){
    if(zu[roh]===null)return {roh,id:null,name:roh,aus:true,offen:false};
    const g=stelleDef(zu[roh]);
    if(g)return {roh,id:g.id,name:g.name,aus:false,offen:false};
  }
  return {roh,id:'roh:'+roh,name:roh,aus:false,offen:true};
}
const stelleSchluessel=a=>stelleVon(a).id||'';
/* Aus einem Schluessel wieder einen lesbaren Namen machen. */
const stelleTitel=id=>{
  if(!id)return 'ohne Stelle';

/* Alle Bezeichnungen, die je vorgekommen sind, mit Anzahl und Zeitraum. */
function stellenListe(){
  const m=new Map();
  for(const a of gwProben()){
    const r=gwStelle(a);
    if(!m.has(r))m.set(r,{roh:r,n:0,von:a.datum,bis:a.datum});
    const e=m.get(r);e.n++;
    if(a.datum<e.von)e.von=a.datum;
    if(a.datum>e.bis)e.bis=a.datum;
  }
  return [...m.values()].map(e=>Object.assign(e,{zustand:stelleVon({stelle:e.roh}),vorschlag:stellenVorschlag(e.roh)}))
    .sort((a,b)=>b.n-a.n||a.roh.localeCompare(b.roh));

/* Ein Vorschlag, mehr nicht: er wird nie von selbst angewandt. «vorne» und
   «RV» deuten auf dasselbe Reservoir, aber nur ein Mensch weiss, ob eine
   Probe «mit H2O2» noch als dieselbe Stelle gelten soll. */
function stellenVorschlag(roh){
  const t=' '+String(roh).toLowerCase().replace(/[^a-zäöü0-9]+/g,' ')+' ';
  const vorne=/ (vorne|vorn|vorderes?|rv|v) /.test(t),hinten=/ (hinten|hinter|hinteres?|rh|h) /.test(t);
  if(vorne===hinten)return null;                       /* beides oder keines: nichts vorschlagen */
  const id=vorne?'v':'h';
  const g=stelleDef(id);
  if(!g)return null;
  /* Eine behandelte Probe ist nicht dieselbe Stelle wie eine unbehandelte,
     auch wenn dasselbe Reservoir draufsteht. Der Vorschlag bleibt, aber mit
     Vorbehalt - entscheiden muss ihn ein Mensch. */
  const behandelt=/ (mit|mitt|m)\s*h2o2 | h2o2 /.test(t)&&!/ ohne /.test(t);
  return {id,name:g.name,
    grund:vorne?'enthält «vorne» oder «RV»':'enthält «hinten» oder «RH»',
    vorbehalt:behandelt?'Diese Bezeichnung nennt eine Behandlung mit Wasserstoffperoxid. Das ist derselbe Ort, aber nicht derselbe Zustand – überleg, ob sie in dieselbe Reihe gehört.':null};
}

      <td colspan="2"><button data-tun="stelleNeu">Anlegen</button></td></tr>

  const aus=liste.filter(x=>x.zustand.aus);

  dialog('Entnahmestellen zuordnen',t,`<button class="primary" data-tun="dlgZu">Fertig</button>`);
}
