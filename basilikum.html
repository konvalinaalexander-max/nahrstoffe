}
function rgStufe(id,i){const d=el('rgDatum'),n=el('rgNotiz');if(d)rg.datum=d.value;if(n)rg.notiz=n.value;rg.eintraege[id]=i;render()}
function rgDazu(){const v=el('rgW').value;if(!v)return;db.einst.schaeden.push(v);aend();render()}
function rgSpeichern(){
  db.rundgaenge.push({id:uid(),datum:rg.datum,satz:rg.satz,kultur:rg.kultur||null,notiz:rg.notiz||null,
    eintraege:db.einst.schaeden.map(id=>({schaden:id,stufe:rg.eintraege[id]??0}))});
  rg={datum:heute(),satz:rg.satz,eintraege:{},notiz:'',kultur:''};
  aend();render();toast('Rundgang gespeichert.');
}

/* ══════════ 17 · Sätze und Einstellungen ══════════ */
function vSaetze(){
  const liste=saetzeListe(),S=db.einst;
  const params=[...new Set(db.analysen.filter(a=>a.typ==='blattsaft').flatMap(a=>Object.keys(a.optima||{})))];
  return `<div class="card"><div class="hd"><div><h2>Sätze</h2>
    <p class="sub">Das Aussaatdatum bestimmt jede Altersangabe im Tool. Ohne Eintrag wird es aus der Kalenderwoche im Satznamen geschätzt.</p></div>
    <button class="primary" onclick="satzDialog()">Satz anlegen</button></div>
    <div class="scroll"><table><thead><tr><th>Satz</th><th>Aussaat</th><th>Herkunft</th><th>Dauer</th><th>Substrat</th><th>Dünger</th><th>Analysen</th><th></th></tr></thead><tbody>
    ${liste.map(s=>`<tr><td class="mono">${esc(s.id)}</td><td class="mono">${fmt(s.aussaat)}</td>
      <td>${s.quelle==='eingetragen'?'<span class="pill ok">eingetragen</span>':'<span class="pill na">aus KW geschätzt</span>'}</td>
      <td class="mono tiny">${s.dauer} W${s.st.dauer?'':' <span class="muted">(Vorgabe)</span>'}</td>
      <td class="small">${esc(s.st.substrat||'–')}</td><td class="small">${esc(s.st.duenger||'–')}</td>
      <td class="mono tiny">${s.analysen.length}</td>
      <td><button class="ghost" onclick="satzDialog('${esc(s.id)}')">bearbeiten</button></td></tr>`).join('')}
    </tbody></table></div>${liste.length?'':'<p class="muted small">Noch keine Sätze.</p>'}
    <div class="row" style="margin-top:14px">
      <div><label class="lab">Vorgabe Kulturdauer Sommer (Wochen)</label><input class="mono" size="5" value="${S.dauerSommer}" onchange="setEinst('dauerSommer',this.value)"></div>
      <div><label class="lab">Vorgabe Kulturdauer Winter</label><input class="mono" size="5" value="${S.dauerWinter}" onchange="setEinst('dauerWinter',this.value)"></div>
      <div class="tiny muted" style="max-width:340px;padding-bottom:6px">Gilt für Sätze ohne eigene Angabe. Aussaat von April bis September zählt als Sommer.</div></div>
  </div>

  <div class="card"><div class="hd"><div><h2>Eigene Optimum-Bereiche</h2>
    <p class="sub">Die Werte von NovaCropControl sind für schnellwachsende Kulturen in mineralischer Ernährung kalibriert. Wenn ihr aus Erfahrung andere Zielbereiche für eure Bedingungen kennt, tragt sie hier ein – sie überschreiben dann die Laborwerte in allen Auswertungen.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Nährstoff</th><th>Labor</th><th>Eigene Untergrenze</th><th>Eigene Obergrenze</th><th>gilt</th></tr></thead><tbody>
    ${params.filter(k=>KERN.includes(k)).map(k=>{
      const lab=db.analysen.map(a=>a.optima?.[k]).find(Boolean);
      const eig=db.eigeneOptima[k]||[];
      return `<tr><td>${esc(NAME[k]||k)} <span class="tiny muted">${esc(einheit(k))}</span></td>
        <td class="mono tiny">${lab?`${nz(lab[0],2)}–${nz(lab[1],2)}`:'–'}</td>
        <td><input class="mono" size="7" value="${eig[0]??''}" onchange="setOptimum('${k}',0,this.value)"></td>
        <td><input class="mono" size="7" value="${eig[1]??''}" onchange="setOptimum('${k}',1,this.value)"></td>
        <td>${optEigen(k)?'<span class="pill ok">eigener Wert</span>':'<span class="pill na">Labor</span>'}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="tiny muted" style="margin-top:10px">Beide Grenzen leer lassen heisst: der Laborwert gilt. Ein späterer Ausbau könnte die Bereiche vom Kulturalter abhängig machen – dafür braucht es zuerst genug eigene Daten.</p></div>

  <div class="card"><div class="hd"><div><h2>Schwellenwerte der Regeln</h2>
    <p class="sub">Diese Grenzen sind gesetzte Annahmen, keine publizierten Referenzwerte – für Basilikum im Pflanzensaft gibt es kaum belastbare Literatur. Die Mobilität der Nährstoffe dahinter ist dagegen gesichertes Lehrbuchwissen.</p></div></div>
    <div class="row">
      <div><label class="lab">Verlagerung jung/alt ab</label><input class="mono" size="5" value="${S.verlagerung}" onchange="setEinst('verlagerung',this.value)"></div>
      <div><label class="lab">K/Mg kritisch ab</label><input class="mono" size="5" value="${S.kMg}" onchange="setEinst('kMg',this.value)"></div>
      <div><label class="lab">K/Ca kritisch ab</label><input class="mono" size="5" value="${S.kCa}" onchange="setEinst('kCa',this.value)"></div></div></div>

  <div class="card"><h2>Datenstand</h2>
    <p class="small">${db.analysen.length} Analysen · ${db.ereignisse.length} Einträge im Logbuch · ${db.messungen.length} Messungen · ${db.rundgaenge.length} Rundgänge · ${alleSaetze().length} Sätze</p>
    <p class="small muted">Alle Angaben liegen in der Sicherungsdatei; die Original-PDFs werden nicht mehr gebraucht. Beim Sichern entsteht jedes Mal eine neue Datei mit Datum und Uhrzeit, ältere Stände bleiben erhalten.</p>
    <div class="row"><button class="primary" onclick="sichern()">Jetzt sichern</button><button onclick="fileJson.click()">Datei öffnen</button>
      <button onclick="zuruecksetzen()">Alles zurücksetzen</button></div>
    ${dirty?'<div class="note">Es gibt ungesicherte Änderungen.</div>':''}</div>`;
}
function setEinst(k,v){const n=toNum(v);if(n!=null){db.einst[k]=n;aend();render()}}
function setOptimum(k,i,v){
  const n=toNum(v),cur=db.eigeneOptima[k]||[null,null];
  cur[i]=n;
  if(cur[0]==null&&cur[1]==null)delete db.eigeneOptima[k];else db.eigeneOptima[k]=cur;
  aend();render();
}
function zuruecksetzen(){
  if(!confirm('Wirklich alle Daten in diesem Fenster verwerfen? Gesicherte Dateien bleiben erhalten.'))return;
  db=leer();ueParams=null;dirty=false;render();
}

/* ══════════ 18 · Sichern ══════════ */
function sichern(){
  db.version++;db.gespeichert=new Date().toISOString();
  const st=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
  a.download=`basilikum-daten_${st}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  dirty=false;render();toast('Datei gesichert – im gemeinsamen Ordner ablegen.');
}
async function laden(file){
  try{
    const neu=JSON.parse(await file.text());
    if(!neu||!Array.isArray(neu.analysen))throw new Error('Format');
    if(dirty&&!confirm('Es gibt ungesicherte Änderungen. Trotzdem laden?'))return;
    const basis=leer();
    db=Object.assign(basis,neu);
    db.einst=Object.assign(basis.einst,neu.einst||{});
    db.plan=Object.assign({zielwochen:[2,4,6],begleitet:[],geplant:[]},neu.plan||{});
    db.eigeneOptima=neu.eigeneOptima||{};
    db.saetze=neu.saetze||{};
    ueParams=null;dirty=false;render();
    toast(`Geladen: ${db.analysen.length} Analysen, ${alleSaetze().length} Sätze.`);
  }catch(e){toast('Diese Datei konnte nicht gelesen werden.')}
}

/* ══════════ 19 · Verdrahtung ══════════ */
el('btnSichern').onclick=sichern;
el('btnOeffnen').onclick=()=>fileJson.click();
fileJson.onchange=e=>{const f=e.target.files[0];if(f)laden(f);e.target.value=''};
filePdf.onchange=e=>{const l=[...e.target.files].map(f=>({pfad:f.name,file:f}));if(l.length)einlesen(l);e.target.value=''};
document.addEventListener('dragover',e=>{if(tab!=='analysen')return;e.preventDefault();el('drop')?.classList.add('over')});
document.addEventListener('dragleave',()=>el('drop')?.classList.remove('over'));
document.addEventListener('drop',e=>{
  e.preventDefault();el('drop')?.classList.remove('over');
  const fs=[...(e.dataTransfer?.files||[])].filter(f=>/\.pdf$/i.test(f.name));
  if(fs.length){if(tab!=='analysen'){tab='analysen';render()}einlesen(fs.map(f=>({pfad:f.name,file:f})))}
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(['lage','naehrstoff','kultur','wirkung','planer','kreislauf'].includes(tab))render()},250)});
(async()=>{
  try{const w=await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await w.text()],{type:'application/javascript'}));
  }catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  render();
})();
</script>
</body>
</html>
