function balken(w,o,dez){
  if(!w||w.wert==null)return '<span class="muted">–</span>';
  if(w.unter)return `<span class="mono muted" title="Der Messwert lag unter der Nachweisgrenze des Labors. Er wird nicht bewertet.">&lt;${nz(w.wert,dez)}</span>`;
  const v=w.wert;
  if(!o)return `<span class="mono">${nz(v,dez)}</span>`;
  const lo=o[0]!=null?o[0]:0,hi=o[1]!=null?o[1]:lo*2||v*1.5;
  const t=toleranz();
  const min=Math.min(v,lo*(1-t))*0.92,max=Math.max(v,hi*(1+t))*1.08||1;
  const pos=x=>Math.max(0,Math.min(100,(x-min)/((max-min)||1)*100));
  const st=status(v,o,false);
  const kl=st==='ok'?'val-ok':istRand(st)?'val-rand':'val-off';
  return `<div class="balkenzeile"><span class="mono ${kl}" style="min-width:58px;text-align:right">${nz(v,dez)}</span>
    <div class="bar" style="flex:1" title="Optimum ${o[0]!=null?nz(o[0]):'offen'} bis ${o[1]!=null?nz(o[1]):'offen'} · ${STTEXT[st]||''}">
      <div class="tol" style="left:${pos(lo*(1-t))}%;width:${Math.max(1,pos(hi*(1+t))-pos(lo*(1-t)))}%"></div>
      <div class="opt" style="left:${pos(lo)}%;width:${Math.max(2,pos(hi)-pos(lo))}%"></div>
      <div class="mk" style="left:${pos(v)}%"></div></div></div>`;
}
const stPill=st=>st==null?'<span class="pill na">nicht bewertbar</span>'
  :`<span class="pill ${st==='ok'?'ok':istRand(st)?'rand':'off'}">${STTEXT[st]}</span>`;
/* Nährstoffstreifen: zeigt für jeden Kernnährstoff das massgebliche Blatt */
function streifen(e){
  const ks=kern();
  return `<div class="strip">${ks.map(k=>{
    const b=e.bew[k];
    if(!b||b.fehlt)return `<div class="sq na" title="${esc(NAME[k])}: ${esc(b&&b.grund||'nicht gemessen')}">${esc(kurz(k))}</div>`;
    const kl=b.ok?(b.rand?'rand':'ok'):'off';
    const pf=b.ok?'':(b.st==='tief'?'↓':'↑');
    const wt=b.werte.filter(x=>x.st!=null).map(x=>`${x.blattalter} ${nz(x.wert)}`).join(', ');
    return `<div class="sq ${kl}" title="${esc(NAME[k])} · ${esc(wt)} ${esc(einheit(k))} · beurteilt am ${esc(b.art==='beide'?'Jung- und Altblatt':b.art+'blatt')} (${esc(MOBIL[k]||'')}) · ${esc(b.ok?(b.rand?'knapp im Optimum':'im Optimum'):b.st==='tief'?'unter Optimum':'über Optimum')}">${esc(kurz(k))}${pf}</div>`;
  }).join('')}</div>`;
}

function alterTag(a){
  if(!a||a.woche==null)return '<span class="tag">Alter unbekannt</span>';
  if(!a.plausibel)return `<span class="tag warn" title="${esc(a.text)} – das ist für Basilikum unplausibel. Bitte das Aussaatdatum unter «Sätze» eintragen.">Woche ${nz(a.woche,1)} · unplausibel</span>`;
  return `<span class="tag ${a.sicher?'':'schaetz'}" title="${esc(a.text)}">${a.sicher?'':'~'}Woche ${nz(a.woche,1)}</span>`;
}
const zustandTag=z=>z?`<span class="tag ${z==='gelb'?'gelb':'gruen'}">${esc(z)}</span>`:'';
const leerHinweis=(titel,text,knopf)=>`<div class="card"><div class="leer"><h3>${esc(titel)}</h3>
  <p class="muted" style="max-width:56ch;margin:0 auto 14px">${text}</p>${knopf||''}</div></div>`;
/* Wie belastbar ist die aktuelle Datenlage? Steht überall dort, wo es zählt. */
function datenlage(){
  const erh=erhebungen();
  const saetzeMehrfach=new Set();
  const proSatz=new Map();
  erh.forEach(e=>{const l=proSatz.get(e.satz)||[];l.push(e);proSatz.set(e.satz,l)});
  proSatz.forEach((l,s)=>{if(new Set(l.map(x=>x.datum)).size>1)saetzeMehrfach.add(s)});
  return {erhebungen:erh.length,saetze:proSatz.size,mehrfach:saetzeMehrfach.size,
    ereignisse:db.ereignisse.length,substrat:db.analysen.filter(a=>a.typ==='substrat').length,
    unplausibel:erh.filter(e=>e.alter.woche!=null&&!e.alter.plausibel).length};
}

let ueParams=null,ueLinien='aus',ueLog=true;
function vLage(){
  if(!db.analysen.length)return `<div class="card"><h2>Willkommen</h2>
    <p class="muted" style="max-width:64ch">Dieses Werkzeug sammelt eure Blattsaft- und Substratanalysen und beantwortet drei Fragen:
      Was haben unsere Entscheidungen bewirkt · nähern wir uns dem Optimum · was passiert mit einer Pflanze während ihrer Kulturzeit.</p>
    <p class="muted" style="max-width:64ch">Beginne mit dem Einlesen eines PDFs. Alles, was du übernimmst, wandert in die Sicherungsdatei; die Originale werden danach nicht mehr gebraucht.</p>
    <div class="row"><button class="primary" data-tun="reiter" data-reiter="analysen">Erste Analyse einlesen</button>
      <button data-tun="dateiOeffnen">Bestehende Datei öffnen</button></div></div>`;
  const erh=erhebungen();
  if(!erh.length)return leerHinweis('Noch keine Blattsaftanalyse',
    'Substrat- und Giesswasseranalysen sind erfasst, aber die Auswertung baut auf dem Blattsaft auf. Lies eine NovaCropControl-Analyse ein, dann füllt sich dieser Reiter.',
    '<button class="primary" data-tun="reiter" data-reiter="analysen">Zu den Analysen</button>');
  const bil=bilanz(),dl=datenlage(),wk=wiederkehrend();
  const letzte=erh[erh.length-1],vorletzte=erh[erh.length-2];
  const iL=letzte&&letzte.index?Math.round(letzte.index.anteil*100):null;
  const gleicherSatz=vorletzte&&vorletzte.satz===letzte.satz;
  const iV=vorletzte&&vorletzte.index?Math.round(vorletzte.index.anteil*100):null;
  const laufend=saetzeListe().filter(s=>s.laufend).length;
  const offen=erh.length?befunde(letzte).filter(f=>f.schwere==='hoch').length:0;
  const verf=[...new Set(erh.flatMap(e=>Object.keys(e.bew).filter(k=>!e.bew[k].fehlt)))];
  if(!ueParams)ueParams=bil.slice(0,5).map(b=>b.k);
  ueParams=ueParams.filter(k=>verf.includes(k));
  if(!ueParams.length)ueParams=verf.slice(0,4);

  /* Die Farbvergabe hängt von der Auswahl ab und wird deshalb bei jedem
     Neuzeichnen frisch bestimmt, nicht einmal beim Seitenaufbau. */
  const ueFarben=()=>farbenFuer(ueParams);
  function ueSerien(){
    const ueFarbe=ueFarben();
    return ueParams.map((k,i)=>({id:'ue|'+k,name:NAME[k]||k,farbe:ueFarbe[k],form:FORMEN[i%FORMEN.length],
      punkte:erh.map(e=>{const b=e.bew[k];if(!b||b.fehlt)return null;
        const l=mittel(b.werte.map(x=>lage(x.wert,x.opt)).filter(v=>v!=null));
        if(l==null)return null;
        return {x:+new Date(e.datum),y:l,xtext:fmtK(e.datum),gruppe:ueLinien==='alle'?null:e.satz,kennung:e.id,
          tipp:tippBau(NAME[k]||k,ueFarbe[k],[
            ['Satz',(e.satz||'?')+(e.zustand?' · '+e.zustand:'')],
            ['Probe',fmt(e.datum)],
            e.alter.woche!=null?['Kulturwoche',nz(e.alter.woche,1)]:null,
            ...b.werte.filter(x=>x.st!=null).map(x=>[x.blattalter==='misch'?'Mischprobe':x.blattalter+'es Blatt',nz(x.wert)+' '+einheit(k)]),
            ['Beurteilung',b.ok?(b.rand?'im Sollbereich, knapp':'im Sollbereich'):(b.st==='tief'?'unter dem Sollbereich':'über dem Sollbereich')]],
            'Anklicken öffnet alle Werte dieser Erhebung.')}}).filter(Boolean)}))
      .filter(x=>x.punkte.length);
  }
  function ueZeichnen(){
    if(erh.length<2)return;                 /* bei einer Erhebung gibt es keine Diagramme */
    chartIndex(el('cIndex'),erh);
    const serien=ueSerien();
    chartPunkte(el('cBand'),{serien,yTyp:'lage',xTyp:'datum',xLabel:'Probendatum',hoehe:320,spannen:beigabenFuer(ueParams,ueFarben()),
      linien:ueLinien!=='aus',aufKlick:true,fotos:fotoSpur?fotoGruppen():null,
      ereignisse:ueLog?logbuchPunkte(db.ereignisse):[]});
    el('legBand').innerHTML=legende(serien,diagAus,'Skala 0–3: 1 bis 2 ist der Sollbereich');
  }
  function ueKopf(){
    const ueFarbe=ueFarben();
    return `<div class="hd"><div><h2>Nährstofflage über die Zeit</h2>
      <p class="sub">Alle Nährstoffe auf einer gemeinsamen Skala: das grüne Band ist der Sollbereich, unabhängig von der Einheit.
      Farbe und Form kennzeichnen den Nährstoff. Mit dem Zeiger über einem Punkt stehen Satz, Datum und die gemessenen Werte; ein Klick öffnet die Erhebung.</p></div></div>
      <div class="werkzeug">
        <div class="wz haupt"><span class="lab">Nährstoffe</span><span style="display:flex;gap:6px;flex-wrap:wrap;flex:1">
          ${verf.map(k=>`<span class="chip stoff ${ueParams.includes(k)?'on':''}" data-tun="ueParam" data-k="${esc(k)}"><span class="dot" style="background:${ueParams.includes(k)?ueFarbe[k]:'#C3CDBF'}"></span>${esc(NAME[k]||k)}</span>`).join('')}
        </span></div>
        <div class="wz mitBeigaben"><span class="lab">Linien</span>
          <span class="seg">${[['aus','keine'],['satz','je Satz'],['alle','durchgehend']].map(([v,l])=>`<button class="${ueLinien===v?'on':''}" data-tun="ueLinien" data-v="${v}">${l}</button>`).join('')}</span>
          <span class="chip ${ueLog?'on':''}" data-tun="ueLog" style="margin-left:8px">Logbuch einblenden</span>${fotoChip()}${beigabenSchalter()}
          <button class="ghost" data-tun="ueSatzWahl" data-v="problem" style="margin-left:auto">Was daneben liegt</button>
          <button class="ghost" data-tun="ueSatzWahl" data-v="kern">Alle der Kennzahl</button>
        </div></div>
      <div id="cBand" class="diagramm"></div><div class="legend" id="legBand"></div>`;
  }
  if(erh.length>1){
    DIAG={teile:[['ueKarte',ueKopf]],zeichnen:ueZeichnen,klick:id=>erhebungDetail(id)};
  }
  nachRender=ueZeichnen;

  let s='';
  if(dl.unplausibel)s+=`<div class="note warn"><strong>${dl.unplausibel} Altersangabe${dl.unplausibel>1?'n sind':' ist'} unplausibel.</strong>
    Das abgeleitete Aussaatdatum liegt mehr als ${nz(Math.max(20,(db.einst.dauerWinter||10)*2),0)} Wochen vor der Probe – für Basilikum ist das zu lang.
    Meist stimmt die Kalenderwoche im Satznamen nicht mit dem tatsächlichen Aussaatjahr überein.
    <button style="margin-left:8px" data-tun="reiter" data-reiter="saetze">Aussaatdatum eintragen</button></div>`;

  s+=`<div class="kpis">
    <div class="kpi"><h4>Erhebungen</h4><b>${erh.length}</b><span class="tiny muted">${db.analysen.filter(a=>a.typ==='blattsaft').length} Blattsaftproben aus ${dl.saetze} Sätzen</span></div>
    <div class="kpi"><h4>Zuletzt im Optimum</h4><b class="${iL>=50?'val-ok':'val-off'}">${iL==null?'–':iL+' %'}</b>
      <span class="tiny muted">${iL==null?'nicht bewertbar':
        (gleicherSatz&&iV!=null?`${iL>iV?'+':''}${iL-iV} Punkte gegenüber der vorigen Erhebung desselben Satzes`
         :vorletzte?`Satz ${esc(letzte.satz)} · die vorige Erhebung war ein anderer Satz und darum kein Verlauf`
         :'erste Erhebung')}</span></div>
    <div class="kpi"><h4>Dringende Befunde</h4><b class="${offen?'val-off':'val-ok'}">${offen}</b><span class="tiny muted">in der neuesten Erhebung</span></div>
    <div class="kpi"><h4>Sätze laufend</h4><b>${laufend}</b><span class="tiny muted">von ${alleSaetze().length} erfasst</span></div>
  </div>`;

  const indexKarte=()=> erh.length>1
   ? `<div class="card"><div class="hd"><div><h2>Nähern wir uns dem Optimum?</h2>
      <p class="sub">Anteil der Kernnährstoffe im Sollbereich, je Erhebung. Senkrechte Linien sind Einträge aus dem Logbuch. Grün und gelb desselben Tages stehen nebeneinander.</p></div></div>
      <div id="cIndex" class="scroll"></div>
      <p class="tiny muted" style="margin-top:10px">Gerechnet wird über ${kern().length} Nährstoffe, jeder gleich gewichtet, jeder an dem Blatt, an dem er überhaupt aussagekräftig ist –
      phloemmobile am Altblatt, immobile am Jungblatt. Die Zahl ist ein grobes Mass für die Gesamtlage und ersetzt den Blick auf den einzelnen Nährstoff nicht.
      ${erh.some(e=>e.alter.woche!=null)?`Beachte: die Bestände waren bei der Probenahme unterschiedlich alt (${nz(Math.min(...erh.map(e=>e.alter.woche).filter(x=>x!=null)),1)} bis ${nz(Math.max(...erh.map(e=>e.alter.woche).filter(x=>x!=null)),1)} Wochen), was den Vergleich zwischen den Balken einschränkt.`:''}</p>
    </div>`
   : `<div class="card"><div class="hd"><div><h2>Nähern wir uns dem Optimum?</h2></div></div>
      <div class="leer"><h3>Dafür braucht es eine zweite Erhebung</h3>
      <p class="muted" style="max-width:58ch;margin:0 auto">Mit einer einzigen Analyse gibt es keinen Verlauf – nur einen Zustand.
      Sobald eine zweite Erhebung dazukommt, erscheint hier der Anteil der Nährstoffe im Sollbereich über die Zeit, mit den Einträgen aus dem Logbuch als senkrechte Linien.</p></div></div>`;

  /* Bei mehr als einer Erhebung ist das Diagramm das Herzstück und steht
     zuoberst, gleich unter den Kennzahlen. Bei einer einzigen Analyse gäbe es
     dort nichts zu sehen – dann stehen die Befunde oben, wo sonst das
     Diagramm steht, statt unter zwei fast leeren Kästen. */
  if(erh.length>1){
    s+=`<div class="card haupt" id="ueKarte">${ueKopf()}</div>`;
    s+=indexKarte();
    s+=befundKarten();
  }else{
    s+=befundKarten();
    s+=indexKarte();
  }

  if(wk.length)s+=`<div class="card"><div class="hd"><div><h2>Was immer wieder auftritt</h2>
    <p class="sub">Befunde, die in mehr als einer Erhebung entstanden sind. Bei wenigen Analysen ist das die belastbarere Frage als ein Einzelbefund – ein wiederholtes Muster ist kein Ausreisser.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Befund</th><th>wie oft</th><th>wann</th></tr></thead><tbody>
    ${wk.map(x=>`<tr><td><strong>${esc(x.titel)}</strong></td>
      <td><span class="pill ${x.n>2?'off':'na'}">${x.n}×</span></td>
      <td class="tiny muted">${x.wann.map(y=>esc(y.satz)+' '+fmtK(y.datum)).join(' · ')}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  s+=ranglisteKarte();
  s+=eingangsKarte();

  /* Die Befunde sind der Inhalt, nicht die Diagramme. Sie stehen deshalb
     direkt nach der Kennzahlzeile – bei einer einzigen Analyse standen sie
     vorher bei 60 % der Seitenlaenge unter drei fast leeren Diagrammen. */
  function befundKarten(){
    const neu=new Map();
    for(const e of [...erh].reverse()){const k=e.satz+'|'+(e.zustand||'');if(!neu.has(k))neu.set(k,e)}
    let t=`<div class="hd" style="margin:22px 0 12px"><div><h2>${neu.size>1?'Neueste Erhebung je Satz':'Die Auswertung'}</h2>
      <p class="sub">${neu.size>1?'Für jeden Satz die jüngste Erhebung.':'Was in dieser Analyse steht und was daraus folgt.'}</p></div></div>`;
    for(const e of neu.values()){
      const f=befunde(e),top=f.slice(0,3),rest=f.slice(3);
      t+=`<div class="card"><div class="hd">
        <div><h2>Satz ${esc(e.satz||'?')} ${zustandTag(e.zustand)}</h2>
          <p class="sub">${fmt(e.datum)} · ${alterTag(e.alter)} · ${Object.keys(e.proben).map(x=>`<span class="tag ${x}">${x}</span>`).join(' ')}</p></div>
        <div style="display:flex;gap:14px;align-items:flex-start">
        ${e.index?`<div style="text-align:right"><b style="font-family:'Bricolage Grotesque';font-size:23px" class="${e.index.anteil>=0.5?'val-ok':'val-off'}">${Math.round(e.index.anteil*100)} %</b>
          <div class="tiny muted">${e.index.ok} von ${e.index.n} im Optimum${e.index.fehlt?` · ${e.index.fehlt} nicht bewertbar`:''}</div></div>`:''}
        <button class="primary" data-tun="erhebung" data-id="${esc(e.id)}">Alle Werte ansehen</button></div></div>
        ${streifen(e)}
        <p class="tiny muted" style="margin-top:8px">${esc(e.alter.text||'')}</p>
        <div style="margin-top:12px">${top.length?top.map(befundHtml).join(''):'<p class="muted small">Keine Auffälligkeiten nach den hinterlegten Regeln.</p>'}</div>
        ${rest.length?`<details><summary>${rest.length} weitere${rest.length>1?'':'r'} Befund${rest.length>1?'e':''}</summary><div style="margin-top:10px">${rest.map(befundHtml).join('')}</div></details>`:''}
      </div>`;
    }
    return t;
  }
  return s;
}
AKTION.ueParam=d=>{
  const i=ueParams.indexOf(d.k);
  if(i>=0){if(ueParams.length>1)ueParams.splice(i,1);else return toast('Mindestens ein Nährstoff muss ausgewählt bleiben.')}
  else{if(ueParams.length>=NS_MAX)return toast(`Mehr als ${NS_MAX} Nährstoffe werden unübersichtlich – nimm zuerst einen weg.`);ueParams.push(d.k)}
  diagFrisch();
};
AKTION.ueLinien=d=>{ueLinien=d.v;diagFrisch()};
AKTION.ueLog=()=>{ueLog=!ueLog;diagFrisch()};
AKTION.ueSatzWahl=d=>{
  const b=bilanz();
  const w=(d.v==='kern'?b.map(x=>x.k):b.filter(x=>x.quote<1).map(x=>x.k)).slice(0,NS_MAX);

};

        <div class="tiny">${stPill(x.letzter.st)}</div></td>

      <td class="tiny muted">${esc(x.blatt==='beide'?'Jung- und Altblatt':x.blatt+'blatt')}</td></tr>`).join('')}

    <p class="tiny muted" style="margin-top:8px">Eine Zeile anklicken zeigt alle Einzelwerte dieses Parameters.

    <p class="tiny muted">Die Spalte «im Giesswasser» zeigt die neueste Wasseranalyse. Alle bisherigen stammen aus dem <strong>Rücklauf</strong>, nicht aus frisch angesetzter Lösung – sie sagen also, was übrig blieb, nicht was hineinging.</p>

/* ── Eine Erhebung als Ganzes ────────────────────────────
   Der Weg «Datei hochladen und verstehen» endet hier: alle Werte des
   Laborberichts, Jung- und Altblatt nebeneinander, mit Sollbereich,
   Bewertung und der Angabe, welches Blatt zählt. */
const GRUPPEN=[
 ['Stickstoff',['NO3','N_aus_NO3','N_gesamt','NH4']],
 ['Hauptnährstoffe',['K','Ca','Mg','P','S']],
 ['Spurenelemente',['Fe','Mn','Zn','B','Cu','Mo']],
 ['Ballastionen',['Na','Cl']],
 ['Weitere',['Si','Al']],
 ['Summenparameter',['Zucker','pH','EC','K/Ca']]];
AKTION.erhebung=d=>erhebungDetail(d.id);
function erhebungDetail(id){
  const e=erhebungen().find(x=>x.id===id);
  if(!e)return toast('Diese Erhebung gibt es nicht mehr.');
  const j=e.proben.jung,a=e.proben.alt,mi=e.proben.misch;
  const spalten=[['jung',j],['alt',a],['misch',mi]].filter(x=>x[1]);
  const f=befunde(e);
  const ref=j||mi||a;
  const zeile=k=>{
    const b=e.bew[k];
    const o=optVon(ref,k);
    const hat=spalten.some(([,p])=>p.werte[k]);
    if(!hat)return '';
    const inKern=kern().indexOf(k)>=0;
    return `<tr><td><strong>${esc(NAME[k]||k)}</strong>
        <div class="tiny muted">${esc(einheit(k))}${MOBIL[k]?' · '+esc(MOBIL[k]):''}</div></td>
      ${spalten.map(([lbl,p])=>{
        const w=p.werte[k];
        const mass=b&&!b.fehlt&&(b.mass||[]).some(x=>x.blattalter===lbl);
        return `<td style="min-width:150px${mass?';background:var(--card2)':''}">${balken(w,o)}
          ${mass?'<div class="tiny muted">zählt</div>':''}</td>`}).join('')}

async function einlesen(liste){
  if(typeof pdfjsLib==='undefined'||!pdfBereit){
    return dialog('PDFs lassen sich gerade nicht lesen',

       <p class="small muted">Sobald wieder eine Verbindung besteht, die Seite neu laden – dann geht auch das Einlesen wieder.</p>`,
      `<button class="primary" data-tun="dlgZu">Verstanden</button>`);
  }
  toast('Lese '+liste.length+' Datei'+(liste.length>1?'en':'')+' …');
  const v=[];
  for(const f of liste){
    try{
      const roh=await f.file.arrayBuffer();
      const r=parseAuto(await pdfSeiten(roh.slice(0)),await pdfPunkte(roh.slice(0)));
      r.proben.forEach(p=>v.push(Object.assign({id:uid(),typ:r.typ||'blattsaft',labor:r.labor,
        quelle:{datei:f.pfad,text:(r.rohtext||'').slice(0,20000)},hinweise:(r.hinweise||[]).slice()},p)));
    }catch(e){toast('Fehler bei '+f.pfad+': '+e.message)}
  }
  if(v.length)pruefdialog(v);else toast('Es liessen sich keine Proben lesen.');
}

/* Felder nach Nährstoffgruppen sortiert statt in einem flachen Raster –
   in derselben Reihenfolge, in der sie im Laborbericht stehen. */
function feldGruppen(i,p,keys){
  const rest=keys.filter(k=>!GRUPPEN.some(g=>g[1].indexOf(k)>=0));
  const bloecke=GRUPPEN.concat(rest.length?[['Weitere Werte',rest]]:[])
    .map(([titel,ks])=>{
      const vorhanden=ks.filter(k=>keys.indexOf(k)>=0);
      if(!vorhanden.length)return '';
      return `<div style="margin-bottom:12px"><div class="lab" style="border-bottom:1px solid var(--line2);padding-bottom:3px;margin-bottom:7px">${esc(titel)}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px">
        ${vorhanden.map(k=>feldHtml(i,k,p.werte[k],p)).join('')}</div></div>`;
    }).join('');
  return bloecke||'<p class="muted small">Noch keine Messwerte – unten ergänzen.</p>';
}
function feldHtml(i,k,w,p){
  const o=(p&&p.optima&&p.optima[k])||null;
  const st=(w&&w.wert!=null&&o)?status(w.wert,o,w.unter):null;
  /* Diese Markierung soll Uebertragungsfehler fangen, nicht echte Extremwerte.
     Ammonium bei 178 gegen ein Optimum bis 55 ist real; Kalium bei 104000
     gegen 4800 ist ein verrutschtes Komma. Die Schwelle liegt deshalb hoch. */
  const weit=st&&!istOk(st)&&ausmass(w.wert,o)>5;
  return `<div data-feld="${esc(k)}"><label class="lab">${esc(NAME[k]||k)} <span class="muted">${esc(einheit(k))}</span></label>
  <input class="mono" style="width:100%${weit?';border-color:var(--alarm);background:var(--alarm-soft)':''}"
    value="${w&&w.wert!=null?(w.unter?'<':'')+w.wert:''}" data-aend="pruefFeld" data-i="${i}" data-w="${esc(k)}"
    title="Ein vorangestelltes &lt; kennzeichnet einen Wert unter der Nachweisgrenze.">
  <div class="tiny muted" style="margin-top:2px">${o?`Soll ${o[0]!=null?nz(o[0]):'offen'}–${o[1]!=null?nz(o[1]):'offen'}`:'&nbsp;'}${weit?' <span class="val-off">ungewöhnlich – bitte prüfen</span>':''}</div></div>`;
}

    if(e.dataset.f==='ok')p.__ok=e.checked;

  });
  body.querySelectorAll('[data-s]').forEach(e=>{

    const p=v[+e.dataset.i];if(!p)return;

function pruefPruefen(){

  v.forEach((p,i)=>{
    const box=document.querySelector(`[data-warn="${i}"]`),ab=document.querySelector(`[data-alter="${i}"]`);

      if(p.typ==='blattsaft'&&!p.blattalter)w.push('Blattalter ist nicht zugeordnet. Ohne diese Angabe lassen sich Verlagerung und Verhältnisse nicht auswerten.');
      if(p.typ==='giesswasser'){
        if(!p.stelle)w.push('Ohne Namen der Entnahmestelle lassen sich Proben vom selben Tag nicht auseinanderhalten.');
        if(p.stelle&&p.datum&&db.analysen.some(x=>x.id!==p.id&&x.typ==='giesswasser'&&x.datum===p.datum&&(x.stelle||'')===p.stelle))
          w.push('Für diese Entnahmestelle und dieses Datum existiert bereits eine Probe.');
      }
      else if(!p.satz)w.push('Ohne Satznummer lässt sich die Probe keiner Kultur und keinem Alter zuordnen.');
      if(p.typ==='blattsaft'&&p.satz&&p.datum&&p.blattalter&&db.analysen.some(x=>x.id!==p.id&&x.typ==='blattsaft'&&x.satz===p.satz&&x.datum===p.datum&&x.blattalter===p.blattalter&&(x.zustand||'')===(p.zustand||'')))
        w.push('Für diesen Satz, dieses Datum und dieses Blattalter existiert bereits eine Probe.');
      if(p.typ==='blattsaft'&&p.blattalter&&v.some((q,j)=>j!==i&&q.__ok!==false&&q.typ==='blattsaft'&&q.satz===p.satz&&q.datum===p.datum&&q.blattalter===p.blattalter&&(q.zustand||'')===(p.zustand||'')))
        w.push('Zwei Proben in diesem Import tragen dieselbe Kennzeichnung.');
      if(!Object.keys(p.werte||{}).length)w.push('Keine Messwerte erfasst.');
      if(p.typ==='substrat'&&p.tiefe==null)w.push('Ohne Entnahmetiefe lässt sich diese Probe später nicht mit anderen vergleichen. Freiwillig, aber empfohlen.');
    }
    blocker+=w.filter(x=>/Blattalter|Probendatum fehlt/.test(x)).length;
    box.innerHTML=w.length?`<div class="note">${w.map(esc).join('<br>')}</div>`:'';
    if(ab){
      const aus=p.__satzdaten&&p.__satzdaten.aussaat;
      if(p.typ==='blattsaft'&&p.satz&&p.datum){
        if(aus){const wo=tage(aus,p.datum)/7;ab.textContent=`Kulturalter: Aussaat ${fmt(aus)} eingetragen → ${nz(wo,1)} Wochen bei der Probenahme.`}
        else{const g=ausKW(p.satz,p.datum);
          ab.innerHTML=g?`Kulturalter geschätzt: KW ${esc(p.satz.split('-')[0])} aus dem Satznamen → Aussaat rund ${fmt(g.datum)} → etwa ${nz(g.wochen,1)} Wochen bei der Probenahme.${g.plausibel?'':' <strong class="val-off">Das ist für Basilikum unplausibel – bitte das Aussaatdatum eintragen.</strong>'}`
            :'Kulturalter nicht bestimmbar – Satzname enthält keine Kalenderwoche.'}
      }else ab.textContent='';
    }
  });
  const b=el('btnUeber');
  if(b){b.disabled=blocker>0;const h=el('pruefHint');if(h)h.textContent=blocker?'Bitte zuerst die markierten Angaben ergänzen.':''}
}
AKTION.uebernehmen=()=>{

    if(p.satz&&!db.saetze[p.satz])satzSichern(p.satz,{});
    const i=db.analysen.findIndex(x=>x.id===p.id);

/* ══════════ 10 · Verlauf: Pflanze und Wasser auf einer Zeitachse ══════
   Der Reiter beantwortet die Frage, die sich in keinem der bisherigen
   beantworten liess: Was war im Wasser, und was kam in der Pflanze an?
   Blattsaft oben, Giesswasser unten, Logbuch und Fotos als eigene Spur,
   eine gemeinsame Zeitachse. Zoomen und Verschieben wirken auf alles.

   Bewusst NICHT umgerechnet: Blattsaft-ppm und Wasser-mmol/l messen
   verschiedene Dinge, zwischen ihnen steht die Wurzel. Eine Umrechnung
   würde eine Massenbilanz suggerieren, die es nicht gibt.               */

/* Fünf benannte Fragen statt 22 mal 21 Kombinationen. Jede sagt, was zu
   sehen sein sollte – und was die Erwartung widerlegen würde. */
const PAARE_VOR=[
 {id:'n',name:'Stickstoffform',blatt:['NO3','NH4'],wasser:['gw_NO3','gw_NH4','gw_NO2'],
  frage:'Der Dünger liefert Stickstoff, aber als Ammonium. Wird daraus Nitrat?',
  erwartung:'Im Wasser viel Ammonium und wenig Nitrat, im Blatt Nitrat unter dem Sollbereich.',
  widerlegt:'Nitrat im Wasser in derselben Grössenordnung wie Ammonium – dann läuft die Nitrifikation.'},
 {id:'fe',name:'Kommt das Eisen an?',blatt:['Fe'],wasser:['gw_Fe','gw_pH'],
  frage:'Eisen wird mit dem Dünger gegeben. Steht es im Wasser?',
  erwartung:'Im Wasser fast nichts trotz Dosierung, im Blatt fallend.',
  widerlegt:'Eisen im Wasser in der Grössenordnung des Dosierten – dann fällt es nicht aus.'},
 {id:'zn',name:'Kommt das Zink an?',blatt:['Zn'],wasser:['gw_Zn','gw_pH'],
  frage:'Dasselbe für Zink – der zweite Kandidat für die Streifen.',
  erwartung:'Wie beim Eisen.',
  widerlegt:'Zink im Wasser messbar und im Blatt trotzdem tief – dann liegt es an der Aufnahme, nicht an der Fällung.'},
 {id:'k',name:'Kalium',blatt:['K'],wasser:['gw_K','gw_NH4'],
  frage:'Kalium hat keine Düngerquelle. Und Ammonium konkurriert an derselben Wurzel.',
  erwartung:'Wenig Kalium im Wasser, viel Ammonium, Kalium im Blatt tief.',
  widerlegt:'Kalium im Wasser hoch und im Blatt trotzdem tief – dann ist es Konkurrenz, nicht Mangel an Angebot.'},
 {id:'ph',name:'pH und was er ausfällt',blatt:['Fe','Zn','Mn'],wasser:['gw_pH','gw_HCO3'],
  frage:'Der pH steigt. Fallen die Spurenelemente mit ihm aus?',
  erwartung:'Steigender pH, im Blatt fallendes Eisen und Zink.',
  widerlegt:'Fallender oder gleichbleibender pH bei gleichzeitig fallenden Spurenelementen.'}];

/* Die fünf Fragen sind Startpunkte, keine Grenze. Sobald etwas dazu- oder
   weggenommen wird, gilt die eigene Auswahl – dieselbe Ansicht, nur ohne
   vorformulierte Erwartung. */
const VL_MAX_BLATT=8,VL_MAX_WASSER=6;
let vlPaar='n',vlBlatt=null,vlWasser=null,vlSkala='lage',vlTank=true,vlLog=true,vlZeit='alles';
/* Blattetage und Linien wirken auf die obere Spur. Beides ist eine Frage der
   Lesbarkeit, keine der Daten: gefiltert wird nur, was gezeigt wird. */
let vlEtage='beide',vlLinien='keine';
/* Welche Wassergrössen mussten mangels Platz auf eine fremde Achse? */
let vlGedraengt=[];
/* Von einer Voreinstellung auf die eigene Auswahl umschalten, ohne dabei die
   bisher gezeigten Grössen zu verlieren: sie werden übernommen. */
function vlEigen(){
  if(vlPaar!=='eigen'){
    const p=PAARE_VOR.find(x=>x.id===vlPaar)||PAARE_VOR[0];
    vlBlatt=p.blatt.slice();vlWasser=p.wasser.slice();vlPaar='eigen';
  }
  if(!vlBlatt)vlBlatt=[];
  if(!vlWasser)vlWasser=[];
}
const vlKurz=(namen,n)=>namen.length<=n?namen.join(', '):namen.slice(0,n).join(', ')+' +'+(namen.length-n);
function vVerlauf(){
  const erh=erhebungen();
  const gw=gwProben();
  if(!erh.length&&!gw.length)return leerHinweis('Noch keine Analysen',
    'Dieser Reiter stellt Blattsaft und Giesswasser auf eine gemeinsame Zeitachse. Dafür braucht es wenigstens eine Analyse.',
    '<button class="primary" data-tun="reiter" data-reiter="analysen">Zu den Analysen</button>');
  /* Gruppiert wird nach zugeordneter Stelle, nicht nach der Schreibweise auf
     dem Bericht. Ausdrücklich ausgeschlossene Bezeichnungen erscheinen gar
     nicht erst - sie würden eine Reihe verfälschen. */
  const gwSicht=gw.filter(gwSichtbar);
  const gwStellen=[...new Set(gwSicht.map(stelleSchluessel))]
    .sort((a,b)=>stelleTitel(a).localeCompare(stelleTitel(b)));
  const gwForm={};gwStellen.forEach((st,i)=>gwForm[st]=FORMEN[i%FORMEN.length]);
  /* Zur Wahl steht, was gemessen wurde: im Blatt alles, was in irgendeiner
     Probe vorkommt, im Wasser der ganze Berichtsumfang – auch das, was nie
     gemessen wurde, denn genau diese Lücke soll sichtbar bleiben. */
  const blattParams=STOFFREIHE.concat([...new Set(erh.flatMap(e=>alleProben(e).flatMap(p=>Object.keys(p.werte))))])
    .filter((k,i,a)=>a.indexOf(k)===i)
    .filter(k=>k!=='K/Ca'&&NAME[k]&&erh.some(e=>alleProben(e).some(p=>p.werte[k])));
  const wasserParams=GW_PARAM.map(k=>'gw_'+k).filter(k=>k!=='gw_KCa');
  /* Nur Blattetagen anbieten, die es im Bestand auch gibt. */
  const etagenDa=['jung','alt','misch'].filter(al=>erh.some(e=>e.proben[al]));

  /* Alles, was von der gewählten Frage abhängt, wird bei JEDEM Neuzeichnen
     frisch bestimmt. Läge es im äusseren Gültigkeitsbereich, wechselte die
     Schaltfläche, aber nicht der Inhalt – genau dieser Fehler ist beim Bauen
     passiert und von der Browserprüfung gefunden worden. */
  function vlAb(){
    let paar;
    if(vlPaar==='eigen'){
      vlEigen();
      const bn=vlBlatt.map(k=>NAME[k]||k),wn=vlWasser.map(k=>gwName(k));
      paar={id:'eigen',blatt:vlBlatt.slice(),wasser:vlWasser.slice(),
        name:bn.length&&wn.length?'Eigene Auswahl'
            :bn.length?'Nur die Pflanze'
            :wn.length?'Nur das Wasser'
            :'Nichts ausgewählt',
        frage:bn.length&&wn.length?'Oben '+bn.join(', ')+' · unten '+wn.join(', ')+'.'
            :bn.length?'Oben '+bn.join(', ')+'. Nimm unten eine Wassergrösse dazu, um beide Seiten zu sehen.'
            :wn.length?'Unten '+wn.join(', ')+'. Nimm oben einen Nährstoff dazu, um beide Seiten zu sehen.'
            :'Wähle oben einen Nährstoff und unten eine Wassergrösse.',
        erwartung:null,widerlegt:null};
    }else paar=PAARE_VOR.find(p=>p.id===vlPaar)||PAARE_VOR[0];
    /* Doppelte Schlüssel würden in farbenFuer eine Farbe verbrauchen und die
       Wunschfarbe verlieren. Nitrat oben und Nitrat unten ist derselbe Stoff
       und muss dieselbe Farbe tragen – das ist der ganze Sinn der Kopplung. */
    const keys=[...new Set(paar.blatt.concat(paar.wasser.map(k=>k.slice(3))))];
    return {paar,farbe:farbenFuer(keys)};
  }

  function blattSerien(paar,farbe){
    const out=[];
    const etagen=vlEtage==='beide'?['jung','alt','misch']:[vlEtage];
    for(const k of paar.blatt)for(const al of etagen){
      const punkte=[];
      for(const e of erh){
        const pr=e.proben[al];if(!pr)continue;
        const w=pr.werte[k];if(!w||w.wert==null||w.unter)continue;
        const o=optVon(pr,k);
        const y=vlSkala==='lage'?lage(w.wert,o):w.wert;
        if(y==null)continue;
        const st=status(w.wert,o,w.unter);
        punkte.push({x:+new Date(e.datum),y,kennung:e.id,
          tipp:tippBau(NAME[k]||k,farbe[k],[
            ['Pflanze',(e.satz||'?')+(e.zustand?' · '+e.zustand:'')],
            ['Probe',fmt(e.datum)],
            e.alter.woche!=null?['Kulturwoche',nz(e.alter.woche,1)]:null,
            ['Blatt',al==='misch'?'Mischprobe':al+'es Blatt'],
            ['Messwert',nz(w.wert)+' '+einheit(k)],
            o?['Sollbereich',(o[0]!=null?nz(o[0]):'offen')+'–'+(o[1]!=null?nz(o[1]):'offen')]:null,
            st?['Beurteilung',STTEXT[st]]:null],'Anklicken öffnet die ganze Erhebung.')});
      }
      if(punkte.length){
        /* Der Reihenname nennt nur, was zur Unterscheidung nötig ist. */
        const teil=[];
        if(paar.blatt.length>1)teil.push(NAME[k]||k);
        if(etagen.length>1)teil.push(al);
        out.push({id:'b|'+k+'|'+al,name:teil.length?teil.join(' · '):(NAME[k]||k),
          farbe:farbe[k],form:BLATTFORM[al]||'kreis',punkte});
      }
    }
    return out;
  }
  /* Wasserparameter mit verschiedenen Einheiten bekommen getrennte Spuren.
     Eisen in µmol/l und der pH auf einer Achse wären zufällig ähnlich gross
     und würden eine Vergleichbarkeit vortäuschen, die es nicht gibt. */
  function wasserSerien(paar,farbe){
    const out=[];
    for(const k of paar.wasser){
      const basis=k.slice(3);
      for(const st of gwStellen){
        const punkte=[];
        for(const a of gwSicht.filter(x=>stelleSchluessel(x)===st)){
          const w=a.werte[k];if(!w||w.wert==null||w.unter)continue;
          const mg=inMgL(k,w.wert);
          punkte.push({x:+new Date(a.datum),y:w.wert,kennung:a.id,
            tipp:tippBau(gwName(k),farbe[basis],[
              ['Wasser',stelleName(a)],
              stelleVon(a).roh!==stelleName(a)?['auf dem Bericht',stelleVon(a).roh]:null,
              ['Probe',fmt(a.datum)],
              ['Messwert',nz(w.wert)+' '+einheit(k)],
              mg!=null?['entspricht',nz(mg,2)+' mg/l']:null],'Anklicken öffnet die ganze Wasserprobe.')});
        }
        if(punkte.length)out.push({id:'w|'+k+'|'+st,param:k,einh:einheit(k),
          name:(paar.wasser.length>1?gwName(k)+' · ':'')+stelleTitel(st),
          farbe:farbe[basis],form:gwForm[st]||'kreis',punkte});
      }
    }
    /* Tankmessungen als dichte, kleine Ebene – dort ist das Wasser nicht leer */
    if(vlTank&&paar.wasser.includes('gw_pH')){
      const p=db.messungen.filter(m=>m.ph!=null&&m.datum);
      const lage=messLage(p);
      if(p.length)out.push({id:'w|tank|ph',einh:'',name:'pH am Tank',farbe:'#8C9A88',form:'kreis',klein:true,
        punkte:p.map(m=>({x:lage.x.get(m),y:m.ph,
          tipp:tippBau('pH am Tank','#8C9A88',[['Datum',fmt(m.datum)],zeitZeile(m,lage.folge),
            m.stelle?['Stelle',m.stelle]:null,['pH',nz(m.ph,2)],
            m.ec!=null?['EC',nz(m.ec,2)+' mS/cm']:null],m.notiz||'')}))});
    }
    return out;
  }
  /* Welche Parameter dieser Frage sind im Wasser ueberhaupt nie gemessen?
     Ohne diese Auskunft verschwindet die untere Spur wortlos, und die Frage
     sieht beantwortet aus, obwohl die halbe Antwort fehlt. */
  function wasserFehlt(paar){
    const tankPH=vlTank&&db.messungen.some(m=>m.ph!=null&&m.datum);
    return paar.wasser.filter(k=>{
      if(k==='gw_pH'&&tankPH)return false;          /* der Tank liefert den pH */
      return !gw.some(a=>a.werte[k]&&a.werte[k].wert!=null&&!a.werte[k].unter);
    });
  }
  /* Erst nach Einheit, dann nach Grössenordnung gruppieren – je Gruppe eine
     eigene Spur mit eigener Achse. Dieselbe Regel wie im Reiter Nährstoffe
     (Faktor 25): Ammonium bei 4 mmol/l und Nitrit bei 0,02 mmol/l teilen die
     Einheit, aber auf einer gemeinsamen Achse wäre Nitrit eine Linie auf
     null – und die Frage, ob Nitrit da ist, bleibt unbeantwortet. */
  const VL_WASSER_SPUREN=3;
  function wasserSpuren(paar,ws){
    const nachEinheit=new Map();
    for(const se of ws){
      const e=se.einh==null?'':se.einh;
      if(!nachEinheit.has(e))nachEinheit.set(e,[]);
      nachEinheit.get(e).push(se);
    }
    let gruppen=[];
    for(const [e,serien] of nachEinheit){
      /* Zusammengehalten wird nach Parameter, nicht nach Einzelreihe: Nitrat
         vorne und Nitrat hinten gehören auf dieselbe Achse, auch wenn die
         eine Entnahmestelle dreimal so hoch liegt wie die andere. Sonst
         stünde derselbe Stoff in zwei Spuren und wäre nicht vergleichbar. */
      const nachParam=new Map();
      for(const se of serien){
        const k=se.param||se.id;
        if(!nachParam.has(k))nachParam.set(k,[]);
        nachParam.get(k).push(se);
      }
      const mitG=[...nachParam.values()].map(gr=>({gr,
        g:groessenordnung(gr.flatMap(se=>se.punkte.map(q=>Math.abs(q.y))))}))
        .sort((a,b)=>(a.g==null?Infinity:a.g)-(b.g==null?Infinity:b.g));
      let akt=null;
      for(const x of mitG){
        if(!akt||(x.g!=null&&akt.klein!=null&&x.g/akt.klein>SPANNE_MAX)){
          akt={einh:e,serien:[],klein:x.g};gruppen.push(akt);
        }
        x.gr.forEach(se=>akt.serien.push(se));
        if(akt.klein==null)akt.klein=x.g;
      }
    }
    /* Mehr als drei Wasserspuren macht die Zeichnung höher als den Bildschirm.
       Was dann zusammengelegt wird, steht im Hinweis über dem Diagramm. */
    vlGedraengt=[];
    while(gruppen.length>VL_WASSER_SPUREN){
      const letzt=gruppen.pop(),ziel=gruppen[gruppen.length-1];
      letzt.serien.forEach(x=>ziel.serien.push(x));
      vlGedraengt=vlGedraengt.concat([...new Set(letzt.serien.map(x=>x.param).filter(Boolean))]);
    }
    const n=gruppen.length||1;
    const h=n>=3?140:n===2?160:200;
    return gruppen.map(gr=>{
      const params=[...new Set(gr.serien.map(x=>x.param).filter(Boolean))];
      const einWert=params.length===1?gwRichtVon(params[0]):null;
      return {titel:'Wasser · '+(vlKurz(params.map(k=>gwName(k)),4)||'Giesswasser')
              +((vlTank&&gr.einh===''&&gr.serien.some(x=>x.klein))?' und Tank':''),
        serien:gr.serien,yTyp:'wert',band:einWert?[null,einWert.bis]:null,bandLabel:'Richtwert (Annahme)',
        yLabel:gr.einh||'ohne Einheit',hoehe:h,
        leerText:'keine Wasseranalyse in diesem Zeitraum'};
    });
  }

  function vlZeichnen(){
    zoomHaken=art=>{vlZeit=art==='reset'?'alles':null};
    const {paar,farbe}=vlAb();
    const bs=blattSerien(paar,farbe),ws=wasserSerien(paar,farbe);
    /* Was im Wasser nie gemessen wurde, bekommt trotzdem eine Spur – eine
       leere, die sagt warum. Verschwaende sie stillschweigend, sähe die
       Frage beantwortet aus, obwohl die halbe Antwort fehlt. */
    const wSpuren=wasserSpuren(paar,ws),fehlt=wasserFehlt(paar);
    if(fehlt.length)wSpuren.push({titel:'Wasser · '+vlKurz(fehlt.map(k=>gwName(k)),4),
      serien:[],yTyp:'wert',yLabel:'',hoehe:fehlt.length&&wSpuren.length?86:150,

/* ══════════ 10b · Nährstoffe im Einzelnen ══════════
   Das Diagramm ist hier das Herzstück: es steht zuoberst, alle Regler stehen
   darüber, und jeder Regler zeichnet nur das Diagramm neu – die Seite bleibt
   stehen, wo sie ist. Die Tabellen darunter beantworten dieselbe Frage in
   Zahlen, für alle ausgewählten Nährstoffe. */

/* Feste Reihenfolge für die Farbvergabe: derselbe Nährstoff bekommt beim
   Zusammenstellen möglichst immer dieselbe Farbe, damit man ihn wiedererkennt. */
const STOFFREIHE=['NO3','N_gesamt','N_aus_NO3','NH4','K','Ca','Mg','P','S','Fe','Mn','Zn','B','Cu','Mo','Si','Na','Cl','Al','Zucker','pH','EC'];
const FARBSTOFF=['#2C7A4B','#BE6F16','#3A6DA6','#7A4E8C','#A2432E','#3F7F7A','#8A7118','#556B2F','#B0446F','#1F5F86','#96601C','#4B5D2A'];
/* Wunschfarbe je Nährstoff, aber innerhalb einer Auswahl nie doppelt. */
function farbenFuer(keys){
  const m={},belegt=new Set();
  for(const k of keys){
    const i=STOFFREIHE.indexOf(k);
    let c=FARBSTOFF[(i<0?keys.indexOf(k):i)%FARBSTOFF.length];
    if(belegt.has(c))c=FARBSTOFF.find(x=>!belegt.has(x))||c;
    belegt.add(c);m[k]=c;
  }
  return m;
}
const BLATTFORM={jung:'kreis',alt:'raute',misch:'quadrat'};
/* Bei mehreren Nährstoffen steht die Farbe für den Nährstoff und die Form
   für das Blatt. Ist nur ein Nährstoff gewählt, wäre die Farbe leer – dann
   übernimmt sie das Blattalter. So trägt sie immer eine Information. */
const BLATTFARBE={jung:'#2C7A4B',alt:'#BE6F16',misch:'#3A6DA6'};
/* Wie gross sind die Zahlen dieses Parameters ueblicherweise? Der Median der
   Messwerte reicht dafuer und ist gegen einen Ausreisser unempfindlich. */
function groessenordnung(werte){
  const v=werte.filter(x=>x!=null&&x>0).sort((a,b)=>a-b);
  return v.length?v[Math.floor(v.length/2)]:null;
}
/* Duerfen diese Parameter auf eine gemeinsame Messwert-Achse?
   Nur wenn sie dieselbe Einheit haben UND in derselben Groessenordnung
   liegen. Kalium (rund 5000 ppm) und Eisen (rund 2 ppm) teilen zwar die
   Einheit, aber auf einer gemeinsamen Achse waere Eisen eine Linie auf null. */
const SPANNE_MAX=25;
function gemeinsameAchse(keys,einheitVon,groesseVon){
  const einh=[...new Set(keys.map(einheitVon))];
  if(einh.length>1)return {ok:false,grund:'einheit',einheiten:einh};
  const gr=keys.map(k=>({k,g:groesseVon(k)})).filter(x=>x.g!=null);
  if(gr.length<2)return {ok:true,einheiten:einh};
  const hoch=gr.reduce((a,b)=>b.g>a.g?b:a),tief=gr.reduce((a,b)=>b.g<a.g?b:a);
  if(hoch.g/tief.g>SPANNE_MAX)return {ok:false,grund:'groesse',einheiten:einh,hoch,tief};
  return {ok:true,einheiten:einh};
}
const SATZ_HAUPT=['NO3','K','Ca','Mg','P','S'];
const SATZ_SPUR=['Fe','Mn','Zn','B','Cu','Mo'];
const SATZ_BALLAST=['Na','Cl','EC'];
const NS_MAX=8;

let nsWahl=null,nsAchse='datum',nsSkala='auto',nsLinien='aus',nsBlatt='beide',nsLog=true;
function vNaehr(){

  if(!erh.length)return leerHinweis('Noch keine Blattsaftanalyse','Dieser Reiter zeigt Nährstoffe über die Zeit oder über das Kulturalter – einzeln oder mehrere nebeneinander.',
    '<button class="primary" data-tun="reiter" data-reiter="analysen">Zu den Analysen</button>');
  const params=STOFFREIHE.concat([...new Set(erh.flatMap(e=>alleProben(e).flatMap(p=>Object.keys(p.werte))))])
    .filter((k,i,a)=>a.indexOf(k)===i)
    .filter(k=>k!=='K/Ca'&&NAME[k]&&erh.some(e=>alleProben(e).some(p=>p.werte[k])));
  if(!nsWahl)nsWahl=params.includes('K')?['K']:params.slice(0,1);
  const blattArten=['jung','alt','misch'].filter(al=>erh.some(e=>e.proben[al]));
  const mitAlter=erh.filter(e=>e.alter.woche!=null&&e.alter.plausibel);
  const nsGroesse=k=>groessenordnung(erh.flatMap(e=>alleProben(e).map(p=>p.werte[k]))
    .filter(w=>w&&w.wert!=null&&!w.unter).map(w=>Math.abs(w.wert)));

  /* Alles, was von der Auswahl abhängt, wird bei jedem Neuzeichnen frisch
     bestimmt. Läge es im äusseren Gültigkeitsbereich, zeigte das Diagramm
     nach einer Änderung noch die Farben und Hinweise der vorigen Auswahl. */
  function nsAb(){
    nsWahl=nsWahl.filter(k=>params.includes(k));
    if(!nsWahl.length)nsWahl=params.slice(0,1);
    if(nsBlatt!=='beide'&&!blattArten.includes(nsBlatt))nsBlatt='beide';
    if(nsAchse==='woche'&&!mitAlter.length)nsAchse='datum';
    const achse=gemeinsameAchse(nsWahl,einheit,nsGroesse);
    const skala=nsSkala==='lage'?'lage':(achse.ok?'wert':'lage');
    return {achse,einheiten:achse.einheiten,gleich:achse.ok,skala,
      erzwungen:nsSkala!=='lage'&&!achse.ok,
      farbe:farbenFuer(nsWahl),
      band:(nsWahl.length===1&&skala==='wert')?(erh.map(e=>optVon(leitProbe(e)||{optima:{}},nsWahl[0])).find(Boolean)||null):null};
  }

  function serienBauen(Z){
    const arten=nsBlatt==='beide'?blattArten:[nsBlatt];
    const basis=nsAchse==='woche'?mitAlter:erh;
    const out=[];
    for(const k of nsWahl)for(const al of arten){
      const punkte=[];
      for(const e of basis){
        const pr=e.proben[al];if(!pr)continue;
        const w=pr.werte[k];if(!w||w.wert==null||w.unter)continue;
        const o=optVon(pr,k);
        const y=Z.skala==='lage'?lage(w.wert,o):w.wert;
        if(y==null)continue;
        const st=status(w.wert,o,w.unter);
        punkte.push({
          x:nsAchse==='woche'?e.alter.woche:+new Date(e.datum),
          y,gruppe:nsLinien==='alle'?null:e.satz,kennung:e.id,
          xtext:nsAchse==='woche'?nz(e.alter.woche,0)+' W':fmtK(e.datum),
          tipp:tippBau(NAME[k]||k,nsWahl.length>1?Z.farbe[k]:(BLATTFARBE[al]||Z.farbe[k]),[
            ['Satz',(e.satz||'?')+(e.zustand?' · '+e.zustand:'')],
            ['Probe',fmt(e.datum)],
            e.alter.woche!=null?['Kulturwoche',nz(e.alter.woche,1)]:null,
            ['Blatt',al==='misch'?'Mischprobe':al+'es Blatt'],
            ['Messwert',nz(w.wert)+' '+einheit(k)],
            o?['Sollbereich',(o[0]!=null?nz(o[0]):'offen')+'–'+(o[1]!=null?nz(o[1]):'offen')+' '+einheit(k)]:null,
            st?['Beurteilung',STTEXT[st]]:null],
            'Anklicken öffnet alle Werte dieser Erhebung.')});
      }
      if(punkte.length)out.push({id:k+'|'+al,name:(nsWahl.length>1?(NAME[k]||k)+' · ':'')+(al==='misch'?'Mischprobe':al),
        farbe:nsWahl.length>1?Z.farbe[k]:(BLATTFARBE[al]||Z.farbe[k]),form:BLATTFORM[al]||'kreis',punkte});
    }
    return out;
  }

  function nsZeichnen(){
    const Z=nsAb(),serien=serienBauen(Z);
    chartPunkte(el('cNs'),{serien,yTyp:Z.skala==='lage'?'lage':'wert',spannen:beigabenFuer(nsWahl,Z.farbe),
      band:Z.band,bandLabel:'Sollbereich',
      xTyp:nsAchse==='woche'?'zahl':'datum',
      xLabel:nsAchse==='woche'?'Kulturwoche bei der Probenahme':'Probendatum',
      yLabel:Z.skala==='lage'?'Lage auf der Skala 0–3':Z.einheiten.join(' · '),
      linien:nsLinien!=='aus',hoehe:340,aufKlick:true,fotos:(fotoSpur&&nsAchse==='datum')?fotoGruppen():null,
      ereignisse:(nsLog&&nsAchse==='datum')?logbuchPunkte(db.ereignisse):[]});
    el('legNs').innerHTML=legende(serien,diagAus,
      Z.skala==='lage'?'Skala 0–3: 1 bis 2 ist der Sollbereich':'Einheit '+esc(Z.einheiten.join(' · ')));
  }

  function segment(name,wert,liste){
    return `<span class="seg">${liste.map(([v,l,aus,grund])=>`<button class="${wert===v?'on':''}"${aus?' disabled title="'+esc(grund||'')+'"':''} data-tun="${name}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</span>`;
  }

  function nsKopf(){
    const Z=nsAb();
    const chips=params.map(k=>`<span class="chip stoff ${nsWahl.includes(k)?'on':''}" data-tun="nsStoff" data-k="${esc(k)}"><span class="dot" style="background:${nsWahl.includes(k)?Z.farbe[k]:'#C3CDBF'}"></span>${esc(NAME[k]||k)}</span>`).join('');
    let t=`<div class="hd"><div><h2>${nsWahl.length===1?esc(NAME[nsWahl[0]]||nsWahl[0]):nsWahl.length+' Nährstoffe im Verlauf'}</h2>
      <p class="sub">Jeder Punkt ist eine Messung – Linien sind zuschaltbar, aber nicht die Vorgabe.
      ${nsWahl.length>1?'Die Farbe steht für den Nährstoff, die Form für das Blatt.':'Farbe und Form stehen für das Blattalter.'}
      Mit dem Zeiger über einem Punkt erscheinen Satz, Datum und Wert; ein Klick öffnet die ganze Erhebung.
      Ein Klick in der Legende blendet eine Reihe aus.</p></div></div>`;
    t+=`<div class="werkzeug">
      <div class="wz"><span class="lab">Zusammenstellung</span>
        ${[['haupt','Hauptnährstoffe'],['spur','Spurenelemente'],['ballast','Ballast'],['problem','Was daneben liegt'],['kern','Alle der Kennzahl']]
          .map(([v,l])=>`<button class="ghost" data-tun="nsSatzWahl" data-v="${v}">${l}</button>`).join('')}
      </div>
      <div class="wz haupt"><span class="lab">Nährstoffe</span><span style="display:flex;gap:6px;flex-wrap:wrap;flex:1">${chips}</span></div>
      <div class="wz">
        <span class="lab">Waagrecht</span>${segment('nsAchse',nsAchse,[['datum','Probendatum'],['woche','Kulturwoche',!mitAlter.length,'Dafür braucht es Erhebungen mit bekanntem Aussaatdatum.']])}
        <span class="lab" style="min-width:0;margin-left:8px">Senkrecht</span>${segment('nsSkala',Z.skala,[['wert','Messwert',!Z.gleich,
          Z.achse.grund==='einheit'?'Die ausgewählten Nährstoffe haben verschiedene Einheiten – nur die Lage 0–3 ist gemeinsam lesbar.'
            :'Die ausgewählten Nährstoffe liegen zu weit auseinander für eine gemeinsame Messwert-Achse.'],['lage','Lage 0–3']])}
      </div>
      <div class="wz mitBeigaben">
        <span class="lab">Blatt</span>${segment('nsBlatt',nsBlatt,[['beide','alle']].concat(blattArten.map(a=>[a,a==='misch'?'Mischprobe':a])))}
        <span class="lab" style="min-width:0;margin-left:8px">Linien</span>${segment('nsLinien',nsLinien,[['aus','keine'],['satz','je Satz'],['alle','durchgehend']])}
        ${nsAchse==='datum'?`<span class="chip ${nsLog?'on':''}" data-tun="nsLog" style="margin-left:8px">Logbuch einblenden</span>${fotoChip()}${beigabenSchalter()}`:''}
      </div></div>`;
    t+=`<div id="cNs" class="diagramm"></div><div class="legend" id="legNs"></div>`;
    if(Z.erzwungen)t+=`<div class="note">${Z.achse.grund==='einheit'
        ?`Die Auswahl umfasst verschiedene Einheiten (${esc(Z.einheiten.join(', '))}).`
        :`${esc(NAME[Z.achse.hoch.k]||Z.achse.hoch.k)} liegt bei rund ${nz(Z.achse.hoch.g)} ${esc(Z.einheiten[0])}, ${esc(NAME[Z.achse.tief.k]||Z.achse.tief.k)} bei rund ${nz(Z.achse.tief.g)} – auf einer gemeinsamen Messwert-Achse wäre ${esc(NAME[Z.achse.tief.k]||Z.achse.tief.k)} eine Linie auf null.`}
      Gezeigt wird deshalb die Lage 0–3: 0 bis 1 heisst unter dem Sollbereich, 1 bis 2 im Sollbereich, 2 bis 3 darüber.
      Wähle einen einzelnen Nährstoff oder Nährstoffe ähnlicher Grössenordnung, um wieder Messwerte zu sehen.</div>`;
    if(nsLinien==='alle')t+=`<p class="tiny muted">Die Linien laufen durchgehend, auch über Satzgrenzen hinweg. Zwischen zwei Sätzen liegt kein Verlauf, sondern ein Wechsel des Bestands – lies solche Abschnitte mit Vorbehalt.</p>`;
    else if(nsLinien==='satz'&&!erh.some(e=>erh.filter(x=>x.satz===e.satz).length>1))
      t+=`<p class="tiny muted">Es sind keine Linien zu sehen, weil bisher kein Satz zweimal beprobt wurde. Verbunden wird nur, was zum selben Bestand gehört.</p>`;
    if(nsAchse==='woche'){
      const proSatz=new Map();mitAlter.forEach(e=>{const l=proSatz.get(e.satz)||[];l.push(e);proSatz.set(e.satz,l)});
      const mehrfach=[...proSatz.values()].filter(a=>a.length>1).length;
      t+=mehrfach?`<div class="note gut">${mehrfach} Satz${mehrfach>1?' wurden':' wurde'} mehrfach beprobt – dort entsteht eine echte Entwicklungskurve statt einer Punktwolke.</div>`
        :`<div class="note">Bisher wurde kein Satz zweimal beprobt. Jeder Punkt ist deshalb eine Momentaufnahme eines anderen Satzes an seinem jeweiligen Alter – zusammen ein grobes Bild, aber keine Entwicklung. Im Planer kannst du festlegen, welchen Satz ihr über seine Kulturzeit begleiten wollt.</div>`;
      if(erh.length>mitAlter.length)t+=`<p class="tiny muted">${erh.length-mitAlter.length} Erhebung(en) fehlen hier, weil ihr Kulturalter unbekannt oder unplausibel ist.</p>`;
    }
    if(erh.some(e=>alleProben(e).some(p=>nsWahl.some(k=>p.werte[k]&&p.werte[k].unter))))
      t+=`<p class="tiny muted">Werte unter der Nachweisgrenze sind nicht eingezeichnet – eine Zahl dafür wäre erfunden. In der Tabelle stehen sie mit vorangestelltem &lt;.</p>`;
    return t;
  }

  /* ── Einordnung und Zahlen ── */
  function einordnung(farbe){
    return `<div class="card"><div class="hd"><div><h2>Einordnung</h2>
      <p class="sub">Woran der Nährstoff überhaupt zu messen ist – und mit welchem Sollbereich gerechnet wird.</p></div></div>
      <div class="scroll"><table><thead><tr><th>Nährstoff</th><th>Mobilität</th><th>massgebliches Blatt</th><th>Einheit</th><th>Sollbereich</th><th>Herkunft</th><th>in der Kennzahl</th></tr></thead><tbody>
      ${nsWahl.map(k=>{const mob=MOBIL[k]||'unbekannt',o=erh.map(e=>optVon(leitProbe(e)||{optima:{}},k)).find(Boolean);
        return `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${farbe[k]};margin-right:6px"></span><strong>${esc(NAME[k]||k)}</strong></td>
        <td>${esc(mob)}</td><td>${mob==='mobil'?'Altblatt':mob==='immobil'?'Jungblatt':'beide'}</td>
        <td class="tiny muted">${esc(einheit(k))}</td>
        <td class="mono">${o?`${o[0]!=null?nz(o[0]):'offen'}–${o[1]!=null?nz(o[1]):'offen'}`:'nicht hinterlegt'}</td>
        <td class="tiny muted">${esc(optQuelle(leitProbe(erh[erh.length-1])||{},k)||'–')}</td>
        <td>${kern().includes(k)?'ja':'nein'}</td></tr>`}).join('')}
      </tbody></table></div>
      ${nsWahl.length===1?`<p class="small" style="margin-top:10px">${MOBILTEXT[MOBIL[nsWahl[0]]||'unbekannt']}</p>`:''}
    </div>`;
  }

  function tabelleFuer(k){
    const mob=MOBIL[k]||'unbekannt';
    const zeilen=erh.map(e=>{
      const wj=e.proben.jung&&e.proben.jung.werte[k],wa=e.proben.alt&&e.proben.alt.werte[k];
      const o=optVon(leitProbe(e),k);
      const vj=wj&&!wj.unter?wj.wert:null,va=wa&&!wa.unter?wa.wert:null;
      return {e,wj,wa,o,v:(vj!=null&&va)?vj/va:null,b:e.bew[k]};
    });
    return `<div class="scroll"><table><thead><tr><th>Datum</th><th>Satz</th><th>Alter</th><th>jung</th><th>alt</th><th>jung/alt</th><th>Bewertung</th><th>Lesart</th></tr></thead><tbody>
    ${zeilen.map(r=>{
      const stj=r.wj?status(r.wj.wert,r.o,r.wj.unter):null,sta=r.wa?status(r.wa.wert,r.o,r.wa.unter):null;
      let lese='–';
      if(mob==='mobil'){
        lese=r.v!=null&&r.v>db.einst.verlagerung&&sta==='tief'?'Altblatt wird ausgeräumt – Angebot zu knapp, Jungblatt noch versorgt'
          :sta==='tief'&&stj==='tief'?'beide tief – flächige Unterversorgung'
          :sta==='tief'?'Altblatt tief'
          :sta==null?'am Altblatt nicht bewertbar':'unauffällig';
      }else if(mob==='immobil'){
        lese=stj==='tief'&&(sta==null||!(r.wa&&r.wa.wert<r.wj.wert*0.9))?'Jungblatt tief bei intaktem Altblatt – zuerst Klima und EC prüfen'
          :stj==='tief'?'Jungblatt tief':stj==null?'am Jungblatt nicht bewertbar':'unauffällig';
      }else{
        lese=(stj==='tief'||sta==='tief')?'unter Optimum':(stj==='hoch'||sta==='hoch')?'über Optimum':'unauffällig';
      }
      return `<tr class="klick" data-tun="erhebung" data-id="${esc(r.e.id)}"><td class="mono">${fmt(r.e.datum)}</td><td class="mono">${esc(r.e.satz||'')} ${zustandTag(r.e.zustand)}</td>
        <td class="tiny">${alterTag(r.e.alter)}</td>
        <td style="min-width:150px">${balken(r.wj,r.o)}</td><td style="min-width:150px">${balken(r.wa,r.o)}</td>
        <td class="mono">${r.v!=null?nz(r.v,2):'–'}</td>
        <td>${r.b&&!r.b.fehlt?stPill(r.b.ok?(r.b.rand?'randtief':'ok'):(r.b.st==='tief'?'tief':'hoch')):'<span class="pill na">nicht in der Kennzahl</span>'}</td>
        <td class="small">${esc(lese)}</td></tr>`}).join('')}
    </tbody></table></div>`;
  }

  /* Mehrere Nährstoffe nebeneinander: eine Zeile je Erhebung, eine Spalte je
     Nährstoff, jeweils am massgeblichen Blatt. Beantwortet die Frage, die das
     Diagramm aufwirft – welche Zahl steckt hinter diesem Punkt. */
  function nebeneinander(farbe){
    return `<div class="card"><div class="hd"><div><h2>Die ausgewählten Nährstoffe nebeneinander</h2>
      <p class="sub">Je Erhebung eine Zeile. Gezeigt wird der Wert an dem Blatt, an dem der Nährstoff aussagekräftig ist – phloemmobile am Altblatt, immobile am Jungblatt.</p></div></div>
      <div class="scroll"><table><thead><tr><th>Datum</th><th>Satz</th><th>Alter</th>
      ${nsWahl.map(k=>`<th><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${farbe[k]};margin-right:5px"></span>${esc(NAME[k]||k)}<div style="font-weight:400;text-transform:none;letter-spacing:0">${esc(einheit(k))}</div></th>`).join('')}
      </tr></thead><tbody>
      ${erh.map(e=>`<tr class="klick" data-tun="erhebung" data-id="${esc(e.id)}">
        <td class="mono">${fmt(e.datum)}</td><td class="mono">${esc(e.satz||'')} ${zustandTag(e.zustand)}</td><td class="tiny">${alterTag(e.alter)}</td>
        ${nsWahl.map(k=>{
          const m=massgebliche(e,k);
          if(!m)return '<td class="mono muted">–</td>';
          const pr=m.ps[0],w=pr.werte[k],o=optVon(pr,k),st=status(w.wert,o,w.unter);
          return `<td class="mono${st==='tief'||st==='hoch'?' val-off':istOk(st)?' val-ok':''}" title="${esc((m.art==='beide'?'Jung- und Altblatt':m.art+'blatt')+(st?' · '+STTEXT[st]:''))}">${zeigeWert(w)}</td>`;
        }).join('')}
      </tr>`).join('')}
      </tbody></table></div>
      <p class="tiny muted" style="margin-top:8px">Grün heisst im Sollbereich, rot daneben. Eine Zeile anklicken öffnet alle Werte dieser Erhebung.</p></div>`;
  }

  function nsUnten(){
    const Z=nsAb();
    let t=einordnung(Z.farbe);
    if(nsWahl.length>1){
      t+=nebeneinander(Z.farbe);
      t+=`<div class="card"><h2>Je Nährstoff im Einzelnen</h2>
        ${nsWahl.map((k,i)=>`<details${i===0?' open':''}><summary>${esc(NAME[k]||k)} je Erhebung</summary><div style="margin-top:10px">${tabelleFuer(k)}</div></details>`).join('')}</div>`;
    }else{
      t+=`<div class="card"><h2>${esc(NAME[nsWahl[0]]||nsWahl[0])} je Erhebung</h2>${tabelleFuer(nsWahl[0])}
        ${erh.some(e=>e.proben.misch)?'<p class="tiny muted">Mischproben erscheinen in dieser Tabelle nicht in den Spalten jung und alt – im Diagramm oben sind sie als Quadrate enthalten.</p>':''}</div>`;
    }
    return t;
  }

  DIAG={teile:[['nsKarte',nsKopf],['nsUnten',nsUnten]],zeichnen:nsZeichnen,klick:id=>erhebungDetail(id)};
  nachRender=nsZeichnen;
  return `<div class="card haupt" id="nsKarte">${nsKopf()}</div><div id="nsUnten">${nsUnten()}</div>`;
}
/* Alle Regler des Diagramms zeichnen nur das Diagramm neu. */
AKTION.nsStoff=d=>{
  const i=nsWahl.indexOf(d.k);
  if(i>=0){if(nsWahl.length>1)nsWahl.splice(i,1);else return toast('Mindestens ein Nährstoff muss ausgewählt bleiben.')}
  else{if(nsWahl.length>=NS_MAX)return toast(`Mehr als ${NS_MAX} Nährstoffe werden unübersichtlich – nimm zuerst einen weg.`);nsWahl.push(d.k)}
  diagFrisch();
};
AKTION.nsSatzWahl=d=>{
  const erh=erhebungen();
  const da=k=>erh.some(e=>alleProben(e).some(p=>p.werte[k]));
  let w;
  if(d.v==='haupt')w=SATZ_HAUPT.filter(da);
  else if(d.v==='spur')w=SATZ_SPUR.filter(da);
  else if(d.v==='ballast')w=SATZ_BALLAST.filter(da);
  else if(d.v==='kern')w=kern().filter(da);
  else w=bilanz().filter(b=>b.quote<1).slice(0,NS_MAX).map(b=>b.k);
  w=w.slice(0,NS_MAX);
  if(!w.length)return toast('Für diese Zusammenstellung liegen keine Messwerte vor.');
  nsWahl=w;diagAus.clear();diagFrisch();
};
AKTION.nsAchse=d=>{nsAchse=d.v;diagFrisch()};
AKTION.nsSkala=d=>{nsSkala=d.v;diagFrisch()};
AKTION.nsBlatt=d=>{nsBlatt=d.v;diagFrisch()};
AKTION.nsLinien=d=>{nsLinien=d.v;diagFrisch()};
AKTION.nsLog=()=>{nsLog=!nsLog;diagFrisch()};

/* ══════════ 12 · Substrat und Wasser ══════════ */
/* Richtwerte für das Substrat sind GESETZTE ANNAHMEN, keine Laborvorgaben.
   Labor Ins liefert zu Substratproben keine Optimum-Bereiche. Die Zahlen unten
   sind Orientierungswerte für Topfkultur im H2O-Auszug und in den Einstellungen
   änderbar. Sie entscheiden nur über die Einordnung «Angebot knapp / reicht»,
   nie über eine Zahl, die als Messwert erscheint. */
const RICHT_VORGABE={sub_Nmin:[50,150],sof_K2O:[80,250],sof_Mg:[30,120],sof_Ca:[100,400],sub_pH:[5.5,6.5],sub_Salz:[0.8,2.0]};
/* Woher die Zahlen stammen – damit nachvollziehbar bleibt, worauf sie beruhen. */
const RICHT_HERKUNFT={
  sub_Nmin:'Orientierungswert für Topfkultur im H2O-Auszug. Nicht vom Labor vorgegeben.',
  sof_K2O:'Orientierungswert für Topfkultur im H2O-Auszug. Nicht vom Labor vorgegeben.',
  sof_Mg:'Orientierungswert für Topfkultur im H2O-Auszug. Nicht vom Labor vorgegeben.',
  sof_Ca:'Orientierungswert für Topfkultur im H2O-Auszug. Nicht vom Labor vorgegeben.',
  sub_pH:'Bereich, in dem Mangan, Eisen und Phosphor gleichzeitig verfügbar bleiben. Lehrbuchwissen, kein Laborwert.',
  sub_Salz:'Orientierungswert für Topfkultur. Nicht vom Labor vorgegeben.'};
const richtVon=k=>((db.einst.richt&&db.einst.richt[k])||RICHT_VORGABE[k]||null);

function vSubstrat(){
  const subs=db.analysen.filter(a=>a.typ==='substrat'&&a.datum).sort((a,b)=>b.datum.localeCompare(a.datum));
  const erh=erhebungen();

  /* Paare bilden: Substratprobe und Blattsafterhebung desselben Satzes */
  const paare=[];
  for(const e of erh){
    const sub=substratZu(e.satz,e.datum);
    if(!sub)continue;
    const zeilen=PAARE.map(P=>{
      const sw=sub.werte[P.sub],b=e.bew[P.blatt];
      if(!sw||sw.wert==null||sw.unter)return null;
      const r=richtVon(P.sub);
      const angebot=r?(sw.wert<r[0]?'knapp':sw.wert>r[1]?'reichlich':'ausreichend'):'unbekannt';
      const aufnahme=(!b||b.fehlt)?null:(b.ok?'ok':b.st);
      let art='offen',text='';
      if(aufnahme==null){art='offen';text='Im Blattsaft ist dieser Nährstoff nicht bewertbar – ohne ihn lässt sich Angebot und Aufnahme nicht trennen.'}
      else if(aufnahme==='ok'){art='ok';text='Angebot und Aufnahme passen zusammen. Hier ist nichts zu tun.'}
      else if(aufnahme==='hoch'){art='ok';text='Im Blattsaft liegt der Nährstoff über dem Optimum – die Zufuhr ist eher zu hoch als zu tief.'}
      else if(angebot==='knapp'){art='angebot';text='Beides ist tief: Es fehlt am Angebot, nicht an der Aufnahme. Zudüngen wirkt hier.'}
      else if(angebot==='unbekannt'){art='offen';text='Ohne Richtwert für das Substrat lässt sich das Angebot nicht einordnen.'}
      else{art='aufnahme';text='Im Substrat ist genug vorhanden, im Blattsaft nicht. Das ist ein Aufnahmeproblem – mehr desselben Düngers wirkt hier kaum.'}
      return {P,sw,b,r,angebot,aufnahme,art,text};
    }).filter(Boolean);
    if(zeilen.length)paare.push({e,sub,zeilen,abstand:tage(sub.datum,e.datum)});
  }

    }
    /* pH-Folgen */

    if(ph&&ph.wert!=null){

        ${treffer.length?'<br>'+treffer.map(f=>esc(NAME[f.k]+': '+f.text)).join('<br>'):'<br>Keine der hinterlegten pH-Folgen trifft auf diese Erhebung zu.'}</div>`;

    s+='</div>';

  if(paare.length)s+=`<div class="note neutral">Die Richtwerte für das Substrat sind gesetzte Annahmen für Topfkultur, keine Laborvorgaben – Labor Ins liefert zu Substratproben keine Optimum-Bereiche. Sie entscheiden nur über die Einordnung «knapp» oder «ausreichend»; die Messwerte selbst bleiben unberührt. Unter «Sätze &amp; Einstellungen» änderbar.</div>`;
  s+='</div>';

  /* ── Substratanalysen ── */
  s+=`<div class="card"><div class="hd"><div><h2>Substratanalysen (${subs.length})</h2>

    <button data-tun="manuellNeu" data-typ="substrat">Von Hand erfassen</button></div>

    :'<p class="muted small">Noch keine Substratanalyse erfasst.</p>'}</div>`;

  return s;
}

/* ══════════ 12b · Giesswasser ══════════
   Das Wasser ist die Quelle des Kreislaufs. Was hier hereinkommt, reichert
   sich an, weil in einem Ebbe-Flut-System nichts abfliesst.
   Die Richtwerte sind gesetzte Annahmen mit offengelegter Herkunft. */
const GW_RICHT_VORGABE={
  gw_EC:  {bis:0.5, text:'Ab hier bringt das Wasser selbst nennenswert Salz mit, das bei jeder Gabe im Kreislauf bleibt.'},
  gw_Na:  {bis:1.5, text:'Natrium wird von der Pflanze kaum aufgenommen und reichert sich im Umlauf an.'},
  gw_Cl:  {bis:1.5, text:'Chlorid verhält sich wie Natrium: es bleibt im Kreislauf zurück.'},
  gw_HCO3:{bis:4.0, text:'Hydrogencarbonat puffert den pH nach oben und verbraucht Säure. Über diesem Wert ist eine pH-Korrektur üblich.'},
  gw_Fe:  {bis:20,  text:'Höhere Eisengehalte können in Tropfern und Düsen ausfallen.'},
  gw_Mn:  {bis:20,  text:'Wie Eisen – Ausfällungsgefahr in der Technik.'}};
const GW_HERKUNFT='Orientierungswert für Giesswasser im geschlossenen Kreislauf. Nicht vom Labor vorgegeben und nicht aus der Literatur belegt – eine gesetzte Annahme wie die Schwellen im Regelwerk.';
const gwRichtVon=k=>{
  const eig=db.einst.gwRicht&&db.einst.gwRicht[k];
  const vor=GW_RICHT_VORGABE[k];
  if(!vor)return null;
  return {bis:(eig!=null?eig:vor.bis),text:vor.text};
};
const gwProben=()=>db.analysen.filter(a=>a.typ==='giesswasser'&&a.datum)
  .slice().sort((a,b)=>b.datum.localeCompare(a.datum)||String(a.stelle||'').localeCompare(String(b.stelle||'')));
/* Löslichkeit von Sauerstoff in Süsswasser bei 1013 hPa, in mg/l – die
   Standardtabelle (Benson und Krause 1984, wie sie USGS und jedes
   Gewässerkunde-Lehrbuch führen). Zwischen den Stützstellen wird linear
   gerechnet; der Luftdruck der Höhenlage senkt die Grenze (barometrische
   Höhenformel). Das ist eine physikalische Obergrenze, kein Sollwert. */
const O2_LOESLICH=[[0,14.62],[5,12.77],[10,11.29],[15,10.08],[20,9.09],[25,8.26],[30,7.56],[35,6.95],[40,6.41]];
function o2Saettigung(temp,hoeheM){
  if(temp==null||!isFinite(temp))return null;
  const t=Math.max(0,Math.min(40,+temp));
  let a=O2_LOESLICH[0],b=O2_LOESLICH[O2_LOESLICH.length-1];
  for(let i=0;i<O2_LOESLICH.length-1;i++)if(t>=O2_LOESLICH[i][0]&&t<=O2_LOESLICH[i+1][0]){a=O2_LOESLICH[i];b=O2_LOESLICH[i+1];break}
  const mg=a[1]+(b[1]-a[1])*((t-a[0])/((b[0]-a[0])||1));
  const h=hoeheM==null?0:+hoeheM;
  return mg*Math.exp(-h/8434);
}
const gwStelle=a=>a.stelle||'ohne Namen';
/* ── Entnahmestellen zusammenfassen ────────────────────────────────────────
   gwStelle() liefert weiterhin die Bezeichnung, die im Bericht steht - sie
   wird nirgends ueberschrieben, in Tabellen und Infokaestchen erscheint immer
   das Original. Fuer alles, was Reihen bildet, tritt die zugeordnete Stelle
   an ihre Stelle. Ist nichts zugeordnet, bleibt die Bezeichnung ihre eigene
   Stelle - so aendert sich ohne Zutun nichts. */
const stellenDb=()=>{
  if(!db.stellen||!Array.isArray(db.stellen.gruppen))db.stellen=STELLEN_VORGABE();
  if(!db.stellen.zu)db.stellen.zu={};
  return db.stellen;
};
const stelleDef=id=>stellenDb().gruppen.find(g=>g.id===id)||null;
/* Zustand einer Bezeichnung: zugeordnet, ausdruecklich draussen, oder offen. */
function stelleVon(a){
  const roh=gwStelle(a),zu=stellenDb().zu;
  if(Object.prototype.hasOwnProperty.call(zu,roh)){
    if(zu[roh]===null)return {roh,id:null,name:roh,aus:true,offen:false};
    const g=stelleDef(zu[roh]);
    if(g)return {roh,id:g.id,name:g.name,aus:false,offen:false};
  }
  return {roh,id:'roh:'+roh,name:roh,aus:false,offen:true};
}
const stelleSchluessel=a=>stelleVon(a).id||'';
/* Aus einem Schluessel wieder einen lesbaren Namen machen. */
const stelleTitel=id=>{
  if(!id)return 'ohne Stelle';
  if(String(id).indexOf('roh:')===0)return String(id).slice(4);
  const g=stelleDef(id);
  return g?g.name:String(id);
};
const stelleName=a=>stelleVon(a).name;
const gwSichtbar=a=>!stelleVon(a).aus;
/* Alle Bezeichnungen, die je vorgekommen sind, mit Anzahl und Zeitraum. */
function stellenListe(){
  const m=new Map();
  for(const a of gwProben()){
    const r=gwStelle(a);
    if(!m.has(r))m.set(r,{roh:r,n:0,von:a.datum,bis:a.datum});
    const e=m.get(r);e.n++;
    if(a.datum<e.von)e.von=a.datum;
    if(a.datum>e.bis)e.bis=a.datum;
  }
  return [...m.values()].map(e=>Object.assign(e,{zustand:stelleVon({stelle:e.roh}),vorschlag:stellenVorschlag(e.roh)}))
    .sort((a,b)=>b.n-a.n||a.roh.localeCompare(b.roh));
}
/* Ein Vorschlag, mehr nicht: er wird nie von selbst angewandt. «vorne» und
   «RV» deuten auf dasselbe Reservoir, aber nur ein Mensch weiss, ob eine
   Probe «mit H2O2» noch als dieselbe Stelle gelten soll. */
function stellenVorschlag(roh){
  const t=' '+String(roh).toLowerCase().replace(/[^a-zäöü0-9]+/g,' ')+' ';
  const vorne=/ (vorne|vorn|vorderes?|rv|v) /.test(t),hinten=/ (hinten|hinter|hinteres?|rh|h) /.test(t);
  if(vorne===hinten)return null;                       /* beides oder keines: nichts vorschlagen */
  const id=vorne?'v':'h';
  const g=stelleDef(id);
  if(!g)return null;
  /* Eine behandelte Probe ist nicht dieselbe Stelle wie eine unbehandelte,
     auch wenn dasselbe Reservoir draufsteht. Der Vorschlag bleibt, aber mit
     Vorbehalt - entscheiden muss ihn ein Mensch. */
  const behandelt=/ (mit|mitt|m)\s*h2o2 | h2o2 /.test(t)&&!/ ohne /.test(t);
  return {id,name:g.name,
    grund:vorne?'enthält «vorne» oder «RV»':'enthält «hinten» oder «RH»',
    vorbehalt:behandelt?'Diese Bezeichnung nennt eine Behandlung mit Wasserstoffperoxid. Das ist derselbe Ort, aber nicht derselbe Zustand – überleg, ob sie in dieselbe Reihe gehört.':null};
}
/* ── Der Zuordnungsdialog ──────────────────────────────────────────────────
   Eine Zeile je Bezeichnung, die im Bestand vorkommt, und je Zeile eine

    Die Anwendung fasst das <strong>nicht</strong> von sich aus zusammen: «mit H2O2» ist derselbe Ort, aber nicht derselbe Zustand,
    und ob das in dieselbe Reihe gehört, weisst nur du. Hier ordnest du es einmal zu; alle Diagramme folgen danach dieser Zuordnung.</p>`;
  if(machbar.length)t+=`<div class="note neutral" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">

    ${liste.map(x=>`<tr>
      <td><strong>${esc(x.roh)}</strong>${x.vorschlag&&x.zustand.offen?`<div class="tiny muted">Vorschlag: ${esc(x.vorschlag.name)} – ${esc(x.vorschlag.grund)}</div>`:''}

      <td class="mono">${x.n}</td>

        </span>
        ${x.zustand.offen?' <span class="tiny muted">noch offen</span>'
          :` <button class="ghost" data-tun="stelleZu" data-roh="${esc(x.roh)}" data-id="offen" title="Zuordnung wieder aufheben">↺</button>`}
      </td></tr>`).join('')}
    </tbody></table></div>`;
  t+=`<div class="hd" style="margin-top:18px"><div><h2 style="font-size:15px">Stellen</h2>
      <p class="sub">So heissen die Reihen in den Diagrammen. Es sind zwei Reservoirs – aber wenn ihr mehr braucht, leg sie hier an.</p></div></div>
    <div class="scroll"><table><tbody>
