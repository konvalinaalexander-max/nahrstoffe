<style>
:root{
  --paper:#F3F6EF;--card:#FFF;--card2:#FAFCF7;--ink:#141D17;--muted:#697A6C;--line:#DCE3D5;--line2:#EDF1E9;
  --ok:#2C7A4B;--ok-soft:#E3F0E1;--ok-line:#A8CDA6;
  --off:#BE6F16;--off-soft:#FBEEDC;--off-line:#E7C48A;
  --rand:#8A7118;--rand-soft:#F6F2DE;--rand-line:#DCD09A;
  --alarm:#A2432E;--alarm-soft:#F7E8E3;--alarm-line:#DCAE9F;
  --info:#3A6DA6;--info-soft:#E5EEF6;--info-line:#A9C4DC;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.55}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
h1{font-size:17px}h2{font-size:18px}h3{font-size:15px}
h4{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:Inter,sans-serif;margin-bottom:6px}
p{margin:0 0 10px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
button{font:inherit;cursor:pointer;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;transition:border-color .12s,background .12s}
button:hover{border-color:var(--ink)}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
button.primary:hover{background:#25352B}
button.ghost{border-color:transparent;background:none;color:var(--muted);padding:5px 8px}
button.ghost:hover{color:var(--ink);background:var(--line2)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:var(--rs);background:#fff;color:var(--ink);max-width:100%}
input[type=date]{min-width:142px}
label.lab{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;font-weight:500}
header.top{position:sticky;top:0;z-index:40;background:rgba(243,246,239,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{display:flex;gap:12px;align-items:center;padding:11px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
nav{display:flex;gap:2px;padding:0 14px 8px;overflow-x:auto}
nav button{border:0;background:none;padding:7px 12px;border-radius:20px;color:var(--muted);font-weight:500;white-space:nowrap}
nav button:hover{background:var(--line2);color:var(--ink)}
nav button.active{background:var(--ink);color:#fff}
main{padding:20px;max-width:1160px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card.tight{padding:14px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.hd .sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;max-width:78ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.kpi b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tr.klick:hover{background:var(--card2);cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:#fff}
.tag.jung{background:var(--ok-soft);border-color:var(--ok-line);color:#215C39}
.tag.alt{background:#F0EEE3;border-color:#DDD8C4;color:#675F44}
.tag.misch{background:var(--info-soft);border-color:var(--info-line);color:#2A5177}
.tag.gelb{background:var(--off-soft);border-color:var(--off-line);color:#8A5210}
.tag.gruen{background:var(--ok-soft);border-color:var(--ok-line);color:#215C39}
.tag.schaetz{background:#fff;border-style:dashed}
.tag.warn{background:var(--alarm-soft);border-color:var(--alarm-line);color:var(--alarm)}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--off-soft);color:var(--off)}
.pill.rand{background:var(--rand-soft);color:var(--rand)}
.pill.na{background:var(--line2);color:var(--muted)}
.pill.al{background:var(--alarm-soft);color:var(--alarm)}
.bar{position:relative;height:16px;background:var(--off-soft);border-radius:4px;min-width:90px;overflow:hidden}
.bar .opt{position:absolute;top:0;bottom:0;background:var(--ok-soft)}
.bar .tol{position:absolute;top:0;bottom:0;background:var(--rand-soft)}
.bar .mk{position:absolute;top:1px;bottom:1px;width:2.5px;background:var(--ink);border-radius:2px}
.val-ok{color:var(--ok)}.val-off{color:var(--off)}.val-rand{color:var(--rand)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;background:#fff;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.sq{min-width:30px;height:26px;padding:0 4px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;border:1px solid transparent}
.sq.ok{background:var(--ok-soft);color:#215C39;border-color:var(--ok-line)}
.sq.rand{background:var(--rand-soft);color:var(--rand);border-color:var(--rand-line)}
.sq.off{background:var(--off-soft);color:#8A5210;border-color:var(--off-line)}
.sq.na{background:var(--line2);color:var(--muted);border-color:var(--line)}
.finding{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin-bottom:15px}
.finding.hoch{border-left-color:var(--alarm)}
.finding.mittel{border-left-color:var(--off)}
.finding.info{border-left-color:var(--info)}
.finding .beleg{color:var(--muted);font-size:12.5px;margin:3px 0;font-family:'JetBrains Mono',monospace}
.finding h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.regel{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:6px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);background:var(--card2)}
.drop.over{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.note{background:var(--off-soft);border:1px solid var(--off-line);color:#7C4A0C;padding:9px 12px;border-radius:var(--rs);font-size:12.5px;margin:10px 0}
.note.neutral{background:var(--card2);border-color:var(--line);color:var(--muted)}
.note.gut{background:var(--ok-soft);border-color:var(--ok-line);color:#215C39}
.note.warn{background:var(--alarm-soft);border-color:var(--alarm-line);color:var(--alarm)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--rs);z-index:90;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.22);max-width:88vw}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:0;max-width:min(980px,95vw);width:100%;background:var(--paper)}
dialog::backdrop{background:rgba(18,28,20,.4)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.dlg-b{padding:18px;max-height:72vh;overflow:auto}
.dlg-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--paper);position:sticky;bottom:0}
details>summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:'▸ ';font-size:10px}
details[open]>summary:before{content:'▾ '}
.stufen{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.stufen button{border:0;border-radius:0;padding:4px 11px;font-size:12px;background:none;color:var(--muted);border-right:1px solid var(--line2)}
.stufen button:last-child{border-right:0}
.stufen button.on{background:var(--alarm);color:#fff}
.stufen button.on.null{background:var(--ok-soft);color:#215C39}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:13px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.scroll{overflow-x:auto}
.vorschlag{border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;margin-bottom:9px;background:var(--card2)}
.vorschlag.dringend{border-color:var(--alarm-line);background:var(--alarm-soft)}
.vorschlag .wann{font-family:'JetBrains Mono',monospace;font-weight:500}
.balkenzeile{display:flex;align-items:center;gap:8px}
.paar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.paar:last-child{border-bottom:0}
.paar .pfeil{color:var(--muted);font-size:16px}
.deutung{font-size:12.5px;padding:7px 11px;border-radius:var(--rs);margin-top:6px}
.deutung.angebot{background:var(--off-soft);color:#7C4A0C}
.deutung.aufnahme{background:var(--info-soft);color:#2A5177}
.deutung.ok{background:var(--ok-soft);color:#215C39}
.leer{text-align:center;padding:34px 18px;color:var(--muted)}
.leer h3{color:var(--ink);margin-bottom:6px}
.stufenleiste{display:flex;gap:2px;margin-top:6px}
.stufenleiste i{height:6px;flex:1;border-radius:2px;background:var(--line2)}
.stufenleiste i.an{background:var(--ok)}
@media (max-width:700px){main{padding:12px}.card{padding:14px}.topbar{padding:10px 12px}.paar{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";
/* ══════════ 1 · Werkzeug ══════════ */
const NUM=/^[<>]?-?\d+(?:[.,]\d+)?$/;
const toNum=t=>{if(t==null||t==='')return null;const v=parseFloat(String(t).trim().replace(/^[<>]\s*/,'').replace(',','.'));return isNaN(v)?null:v};
const isLim=t=>/^[<>]/.test(String(t).trim());
const tk=l=>l.trim().split(/\s+/).filter(Boolean);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const heute=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.split('-').reverse().join('.'):'–';
const fmtK=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.':'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=i=>document.getElementById(i);
const tage=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const plus=(d,t)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+t);return x.toISOString().slice(0,10)};
const monat=d=>+String(d).slice(5,7);
const summe=a=>a.reduce((x,y)=>x+y,0);
const mittel=a=>a.length?summe(a)/a.length:null;
/* Zahlen: kleine Werte behalten ihre Stellen, grosse werden nicht überpräzise */
function nz(v,d){
  if(v==null||v===''||isNaN(v))return '–';
  const a=Math.abs(v);
  let dez=d!=null?d:(a>=100?0:a>=10?1:2);
  if(a>0&&a<1)dez=Math.max(dez,a<0.01?4:a<0.1?3:2);
  if(a>=1000)dez=0;
  return (+(+v).toFixed(dez)).toLocaleString('de-CH',{maximumFractionDigits:dez});
}
/* Wert mit Nachweisgrenze: «<0,05» statt einer erfundenen Zahl */
const zeigeWert=(w,d)=>w==null?'–':(w.unter?'&lt;'+nz(w.wert,d):esc(nz(w.wert,d)));

/* ══════════ 2 · Fachwissen ══════════ */
/* Blattsaft-Parameter (NovaCropControl) */
const NAME={Zucker:'Zucker',pH:'pH (Saft)',EC:'EC (Saft)',K:'Kalium',Ca:'Calcium','K/Ca':'K/Ca',Mg:'Magnesium',Na:'Natrium',
 NH4:'Ammonium',NO3:'Nitrat',N_aus_NO3:'N aus Nitrat',N_gesamt:'Stickstoff gesamt',Cl:'Chlorid',S:'Schwefel',P:'Phosphor',
 Si:'Silizium',Fe:'Eisen',Mn:'Mangan',Zn:'Zink',B:'Bor',Cu:'Kupfer',Mo:'Molybdän',Al:'Aluminium',
 /* Substrat (Labor Ins) – eigener Namensraum, damit nichts mit dem Blattsaft verwechselt wird */
 sub_pH:'pH (Substrat)',sub_Salz:'Salz (Substrat)',sub_Nmin:'Nmin (Substrat)',
 res_P2O5:'P₂O₅ Reserve',res_K2O:'K₂O Reserve',res_Mg:'Mg Reserve',res_Ca:'Ca Reserve',
 sof_P2O5:'P₂O₅ sofort verfügbar',sof_K2O:'K₂O sofort verfügbar',sof_Mg:'Mg sofort verfügbar',sof_Ca:'Ca sofort verfügbar',
 sub_Mn:'Mangan (Substrat)',sub_Cu:'Kupfer (Substrat)',sub_Zn:'Zink (Substrat)',sub_Fe:'Eisen (Substrat)',sub_B:'Bor (Substrat)',
 /* Giesswasser – NovaCropControl liefert Makronährstoffe in mmol/l und
    Spurenelemente in µmol/l, nicht in mg/l. */
 gw_EC:'EC (Giesswasser)',gw_pH:'pH (Giesswasser)',gw_KCa:'K/Ca (Giesswasser)',
 gw_NH4:'Ammonium (Wasser)',gw_K:'Kalium (Wasser)',gw_Na:'Natrium (Wasser)',gw_Ca:'Calcium (Wasser)',
 gw_Mg:'Magnesium (Wasser)',gw_Si:'Silizium (Wasser)',gw_NO3:'Nitrat (Wasser)',gw_Cl:'Chlorid (Wasser)',
 gw_S:'Schwefel (Wasser)',gw_HCO3:'Hydrogencarbonat (Wasser)',gw_P:'Phosphor (Wasser)',
 gw_Fe:'Eisen (Wasser)',gw_Mn:'Mangan (Wasser)',gw_Zn:'Zink (Wasser)',gw_B:'Bor (Wasser)',
 gw_Cu:'Kupfer (Wasser)',gw_Mo:'Molybdän (Wasser)',gw_Al:'Aluminium (Wasser)'};
const KURZ={N_gesamt:'N ges',N_aus_NO3:'N-NO₃',Zucker:'Zuck'};
const kurz=k=>KURZ[k]||k;
const EINH={Zucker:'%',EC:'mS/cm',pH:'','K/Ca':'',sub_pH:'',gw_pH:'',gw_EC:'mS/cm',gw_KCa:''};
/* Giesswasser: Makronährstoffe kommen vom Labor in mmol/l, Spurenelemente in
   µmol/l. Die Zuordnung folgt der Chemie und dem Berichtslayout von
   NovaCropControl; sie ist an den drei vorliegenden Berichten geprüft. */
const GW_MAKRO=['NH4','K','Na','Ca','Mg','Si','NO3','Cl','S','HCO3','P'];
const GW_MIKRO=['Fe','Mn','Zn','B','Cu','Mo','Al'];
const GW_PARAM=['EC','pH','KCa'].concat(GW_MAKRO,GW_MIKRO);
function einheit(k){
  if(EINH[k]!==undefined)return EINH[k];
  if(/^(res_|sof_)/.test(k)||k==='sub_Nmin')return 'mg/l';
  if(k==='sub_Salz')return 'g/l';
  if(/^sub_/.test(k))return 'mg/l';
  if(/^gw_/.test(k)){
    const b=k.slice(3);
    if(GW_MAKRO.indexOf(b)>=0)return 'mmol/l';
    if(GW_MIKRO.indexOf(b)>=0)return 'µmol/l';
    return '';
  }
  return 'ppm';
}
/* Molmassen, um mmol/l für den Vergleich mit anderen Quellen in mg/l zu zeigen */
const MOLMASSE={NH4:18.04,K:39.1,Na:22.99,Ca:40.08,Mg:24.31,Si:28.09,NO3:62.0,Cl:35.45,S:32.06,HCO3:61.02,P:30.97,
  Fe:55.85,Mn:54.94,Zn:65.38,B:10.81,Cu:63.55,Mo:95.95,Al:26.98};
function inMgL(k,v){
  if(v==null)return null;
  const b=k.slice(3),m=MOLMASSE[b];
  if(!m)return null;
  if(GW_MAKRO.indexOf(b)>=0)return v*m;          /* mmol/l → mg/l */
  if(GW_MIKRO.indexOf(b)>=0)return v*m/1000;     /* µmol/l → mg/l */
  return null;
}
const istBlattsaft=k=>!/^(sub_|res_|sof_|gw_)/.test(k);

/* Phloem-Mobilität – Lehrbuchwissen, keine gesetzte Annahme.
   Sie entscheidet, an welchem Blatt ein Nährstoff überhaupt beurteilbar ist. */
const MOBIL={NO3:'mobil',N_gesamt:'mobil',N_aus_NO3:'mobil',K:'mobil',Mg:'mobil',P:'mobil',Cl:'mobil',Na:'mobil',Mo:'mobil',
 S:'teilmobil',Zn:'teilmobil',Cu:'teilmobil',Mn:'teilmobil',Fe:'immobil',Ca:'immobil',B:'immobil',Si:'immobil'};
const MOBILTEXT={
 mobil:'Im Phloem beweglich. Bei Knappheit räumt die Pflanze alte Blätter aus und schickt den Nährstoff in die Spitze. Beurteilt wird deshalb das <strong>Altblatt</strong> – dort zeigt sich der Mangel zuerst, oft Wochen bevor das Jungblatt nachgibt.',
 immobil:'Wird nicht verlagert und kommt nur mit dem Transpirationsstrom nach. Beurteilt wird das <strong>Jungblatt</strong>. Ein Defizit dort bei intaktem Altblatt ist ein Transport-, kein Angebotsproblem: Luftfeuchte, EC und Flutrhythmus entscheiden mehr als die Düngermenge.',
 teilmobil:'Nur begrenzt verlagerbar. Beurteilt werden <strong>beide Blattalter</strong>; als versorgt gilt der Nährstoff nur, wenn beide im Sollbereich liegen.',
 unbekannt:'Sammelgrösse ohne eigene Mobilität – als Kontext lesen, nicht als Einzelmangel.'};

/* Nährstoffe, die in die Kennzahl «im Optimum» eingehen.
   Bewusst OHNE N_gesamt (Dublette zu Nitrat), ohne Na und Cl (Ballastionen,
   für die es keinen anzustrebenden Sollwert gibt) und ohne Si (Basilikum ist
   kein Silizium-Akkumulator). In den Einstellungen änderbar. */
const KERN_VORGABE=['NO3','K','Ca','Mg','P','S','Fe','Mn','Zn','B','Cu'];
const KERN_WAEHLBAR=['NO3','N_gesamt','K','Ca','Mg','P','S','Fe','Mn','Zn','B','Cu','Si','Mo','Na','Cl'];
const HAUPT=['NO3','K','Ca','Mg','P'];
/* Ballastionen: reichern sich im Umlauf an, werden nie zugedüngt.
   Nur «zu hoch» ist ein Befund, «zu tief» ist der Normalfall. */

/* Die Spaltenmarker ¹ ² stehen im NovaCropControl-PDF auf eigenen Zeilen.
   Deshalb wird NUR eine Zeile geleert, die ausschliesslich aus einem Marker
   besteht – innerhalb einer Zeile wird nichts entfernt. Ein Messwert von
   genau 1 oder 2 bleibt damit erhalten. */
const nurMarker=l=>/^[\s ]*[12¹²][\s ]*$/.test(l);
const putz=l=>nurMarker(l)?'':String(l).replace(/ /g,' ').replace(/[¹²]/g,' ').trimEnd();

function findeZustand(...t){
  const s=t.filter(Boolean).join(' ');const m=s.match(/\b(gelb\w*|gr[üu]n\w*)\b/i);
  return m?{wert:/gelb/i.test(m[1])?'gelb':'grün',beleg:m[0]}:null;
}
function findeTiefe(...t){
  const s=t.filter(Boolean).join(' ');const m=s.match(/(\d{1,2})\s*(?:-\s*\d{1,2}\s*)?cm/i);
  return m?{wert:+m[1],beleg:m[0]}:null;
}
/* «<0,50 - <0,50» ist keine Spanne, sondern die Nachweisgrenze des Labors.
   Solche Angaben werden als Obergrenze gelesen, nicht als Unter = Obergrenze. */
function leseOptimum(rest,anzahl){
  const om=rest.match(/([<>]?\s*[\d.,]+)\s*-\s*([<>]?\s*[\d.,]+)\s*$/);
  if(om&&anzahl>=3){
    const a=om[1].replace(/\s/g,''),b=om[2].replace(/\s/g,'');
    const lo=toNum(a),hi=toNum(b);
    if(isLim(a)&&isLim(b)&&lo===hi)return {opt:[null,hi],art:'nachweisgrenze'};
    return {opt:[isLim(a)?null:lo,hi],art:'spanne'};
  }
  const o=rest.match(/<\s*([\d.,]+)\s*$/);
  if(o&&anzahl>=2)return {opt:[null,toNum(o[1])],art:'nachweisgrenze'};
  return null;
}
function parseNCC(seiten){
  const lines=[].concat(...seiten).map(l=>String(l).replace(/ /g,' ').trimEnd());
  const text=lines.join('\n');
  const r={labor:'NovaCropControl',typ:'blattsaft',proben:[],hinweise:[],rohtext:text};
  const d=text.match(/Probendatum:\s*(\d{1,2})-(\d{1,2})-(\d{4})/);
  const datum=d?`${d[3]}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`:null;
  if(!datum)r.hinweise.push('Probendatum nicht gefunden – bitte eintragen.');
  const anbauAlle=[...text.matchAll(/Anbau:\s*(.+)/g)].map(m=>m[1].trim());
  if(anbauAlle.length>1)r.hinweise.push('Mehrere «Anbau»-Angaben gefunden – bitte den Satz kontrollieren.');
  const anbau=anbauAlle[0]||'';
  const lage=(text.match(/Lage\/Grundst[üu]ck:\s*(.+)/)||[])[1]||'';
  const hinw=(text.match(/Hinweise([\s\S]{0,320}?)Parameter/)||[])[1]||'';
  const sm=anbau.match(/(\d{1,2}\s*-\s*\d{2,4})/);
  const satz=sm?sm[1].replace(/\s+/g,''):null;
  if(!satz)r.hinweise.push('Satznummer nicht erkannt – bitte eintragen.');
  const ids=[...text.matchAll(/\b(\d{12})\b/g)].map(m=>m[1]);
  const z=findeZustand(hinw,anbau);
  const tz=(text.match(/Pflanzenteil:.*/)||[])[0]||'';
  const gef=[...tz.matchAll(/Blatt\s*\((Jung|Alt|Mix|Misch)[^)]*\)/gi)]
    .map(m=>({roh:m[0],wert:/jung/i.test(m[1])?'jung':/alt/i.test(m[1])?'alt':'misch'}));
  let teile=gef;
  if(!teile.length){teile=[{roh:null,wert:''}];r.hinweise.push('Pflanzenteil steht nicht im Dokument – bitte selbst zuordnen.')}
  const werte=teile.map(()=>({})),optima={},optArt={};
  for(let i=0;i<lines.length;i++){
    const L=putz(lines[i]).trim();
    if(!L)continue;
    const tr=NCC.find(p=>L.startsWith(p[0]));
    if(!tr)continue;
    const rest=L.slice(tr[0].length);
    const zahlen=tk(rest).filter(t=>NUM.test(t));
    if(!zahlen.length)continue;
    const lo=leseOptimum(rest,zahlen.length);
    if(lo){optima[tr[1]]=lo.opt;optArt[tr[1]]=lo.art}
    werte[0][tr[1]]={wert:toNum(zahlen[0]),unter:isLim(zahlen[0])};
    if(teile.length<2)continue;
    for(let j=i+1;j<Math.min(i+6,lines.length);j++){
      const M=putz(lines[j]).trim();if(!M)continue;
      if(NCC.some(p=>M.startsWith(p[0])))break;
      const mz=tk(M).filter(t=>NUM.test(t));
      if(mz.length){werte[1][tr[1]]={wert:toNum(mz[0]),unter:isLim(mz[0])};break}
    }
  }
  /* Jede Probe bekommt eine EIGENE Kopie der Optima – sonst verändert das
     Bearbeiten der einen Probe stillschweigend die andere. */
  teile.forEach((t,k)=>r.proben.push({laborId:ids[k]||null,datum,satz,kultur:lage||anbau,blattalter:t.wert,
    blattalterBeleg:t.roh?`Kopfzeile: «${t.roh}»`:null,zustand:z?z.wert:null,
    zustandBeleg:z?`Fundstelle: «${z.beleg}»`:null,werte:werte[k]||{},
    optima:JSON.parse(JSON.stringify(optima)),optArt:JSON.parse(JSON.stringify(optArt))}));
  const n=Object.keys(werte[0]).length;
  if(n<15)r.hinweise.push(`Nur ${n} von 23 Parametern gelesen – bitte kontrollieren.`);
  if(teile.length===2&&Object.keys(werte[1]).length<n-2)
    r.hinweise.push(`Die zweite Probe hat nur ${Object.keys(werte[1]).length} Werte gegenüber ${n} bei der ersten – bitte kontrollieren.`);
  return r;
}
function parseIns(seiten){
  const r={labor:'Labor Ins AG',typ:'substrat',proben:[],hinweise:[],rohtext:[].concat(...seiten).join('\n')};
  for(const seite of seiten){
    const lines=seite.map(l=>String(l).replace(/ /g,' ').trimEnd());
    const text=lines.join('\n');
    if(!/Parzelle/.test(text)||!/Messwert/.test(text))continue;
    const p=text.match(/Parzelle\s+(.+?)\s+Probenummer\s+(\d+)/);if(!p)continue;
    const label=p[1].trim(),sm=label.match(/(\d{1,2}-\d{2,4})/),z=findeZustand(label),ti=findeTiefe(label);
    const ad=(text.match(/Auftragsdatum\s+(\d{2}\.\d{2}\.\d{4})/)||[])[1];
    const ph=text.match(/pH-Wert\s+pH-H2OSU\s+pH\s+([\d.,]+)/);
    const werte={};if(ph)werte.sub_pH={wert:toNum(ph[1])};
    let spuren=false;
    for(let i=0;i<lines.length;i++){
      if(/^Spurenelemente\s*$/.test(lines[i].trim()))spuren=true;
      if(!/^Parameter\s+/.test(lines[i].trim()))continue;
      const par=tk(lines[i]).slice(1);let meth=null,mw=null;
      for(let j=i+1;j<Math.min(i+8,lines.length);j++){
        const t=lines[j].trim();
        if(/^Methode \(Reserven\)/.test(t))meth=spuren?'spuren':'reserven';
        if(/^Methode \(sofort verf[üu]gbar\)/.test(t))meth='sofort';
        if(/^Messwert\s+/.test(t)){mw=tk(t).slice(1);break}
      }
      if(!meth||!mw)continue;
      par.forEach((q,idx)=>{const key=INS[meth][q];
        if(key&&mw[idx]!=null&&NUM.test(mw[idx]))werte[key]={wert:toNum(mw[idx]),unter:isLim(mw[idx])}});
    }
    r.proben.push({laborId:p[2],datum:ad?ad.split('.').reverse().join('-'):null,parzelle:label,
      satz:sm?sm[1]:null,blattalter:null,zustand:z?z.wert:null,zustandBeleg:z?`Parzellenfeld: «${label}»`:null,
      tiefe:ti?ti.wert:null,tiefeBeleg:ti?`Parzellenfeld: «${ti.beleg}»`:null,werte,optima:{},optArt:{}});
  }
  if(!r.proben.length)r.hinweise.push('Keine Substratproben erkannt.');
  else r.hinweise.push('Substratproben tragen keine Optimum-Bereiche vom Labor. Die Bewertung erfolgt über den Vergleich mit dem Blattsaft im Reiter «Substrat & Wasser».');
  return r;
}
/* ── Giesswasser (NovaCropControl) ────────────────────────
   Der Wasserbericht ist eine um 90 Grad gedrehte Tabelle. Die Rekonstruktion
   über Zeilen verliert dort Werte, weil Zellen je nach Rundung in dieselbe
   oder in verschiedene Zeilen fallen. Deshalb wird hier direkt mit den
   Koordinaten gearbeitet: die y-Position bestimmt den Parameter, die
   x-Position die Spalte.

   Ein Bericht enthält eine Spalte «Analyse» und beliebig viele Spalten
   «Historie». Die erste Historiespalte ist dieselbe Probe wie die Analyse –
   erkennbar an derselben Probennummer – und wird zusammengefasst. Jede
   übrige Spalte ist eine eigene, ältere Probe mit eigenem Datum.

   Der Name der Entnahmestelle steht in der Kopfzeile
   «Analysebericht:Giesswasser; <Lage>/<Stelle>» und gilt für alle Spalten
   des Berichts – die Historie ist die Historie derselben Stelle. */
const GW_NAMEN=[['EC','gw_EC'],['pH','gw_pH'],['K/Ca','gw_KCa'],['NH4','gw_NH4'],['K','gw_K'],['Na','gw_Na'],
 ['Ca','gw_Ca'],['Mg','gw_Mg'],['Si','gw_Si'],['NO3','gw_NO3'],['Cl','gw_Cl'],['S','gw_S'],['HCO3','gw_HCO3'],
 ['P','gw_P'],['Fe','gw_Fe'],['Mn','gw_Mn'],['Zn','gw_Zn'],['B','gw_B'],['Cu','gw_Cu'],['Mo','gw_Mo'],['Al','gw_Al']];
function parseGiess(seiten,punkte){
  const text=[].concat(...seiten).join('\n');
  const r={labor:'NovaCropControl',typ:'giesswasser',proben:[],hinweise:[],rohtext:text};
  if(!punkte||!punkte.length){
    r.hinweise.push('Die Koordinaten des Dokuments liessen sich nicht lesen – bitte von Hand erfassen.');
    return r;
  }
  /* Der Laborbericht kommt aus Deutschland und schreibt «Gießwasser» mit ß.
     Die Oberfläche bleibt in Schweizer Rechtschreibung – hier muss der
     Ausdruck aber den fremden Text treffen, deshalb beide Formen. */
  const kopf=(text.match(/Analysebericht:\s*Gie[ßs]wasser;\s*([^\n]*?)\s*(?:Name:|Adresse:|$)/)||[])[1]||'';
  const teil=kopf.split('/');
  const lage=(teil[0]||'').trim();
  let stelle=(teil.slice(1).join('/')||'').trim();
  if(!stelle){
    const an=(text.match(/Anbau:?\s*([^\n]*)/)||[])[1]||'';
    stelle=an.replace(/\bErnte:?.*/,'').replace(/\bSonstiges\b/,'').trim();
  }
  for(const seite of punkte){
    /* y je Parameter aus der Namensspalte */
    const yVon=new Map();
    for(const [roh,key] of GW_NAMEN){
      const t=seite.filter(i=>i.s===roh);
      if(t.length)yVon.set(key,t[0].y);
    }
    if(yVon.size<10)continue;
    /* Kopfzeile der Spalten: Probendatum ganz unten, Probennummer darüber */
    const daten=seite.filter(i=>i.y<40&&/^\d{1,2}-\d{1,2}-\d{4}$/.test(i.s));
    if(!daten.length)continue;
    const nummern=seite.filter(i=>i.y>60&&i.y<110&&/^\d{10,14}$/.test(i.s));
    const spalten=daten.map(d=>({x:d.x,
      datum:(()=>{const m=d.s.split('-');return `${m[2]}-${m[1].padStart(2,'0')}-${m[0].padStart(2,'0')}`})(),
      nummer:(nummern.find(n=>Math.abs(n.x-d.x)<8)||{}).s||null})).sort((a,b)=>a.x-b.x);
    const gesehen=new Set();
    for(const sp of spalten){
      if(sp.nummer&&gesehen.has(sp.nummer))continue;   /* Analyse und erste Historie sind dieselbe Probe */
      if(sp.nummer)gesehen.add(sp.nummer);
      const werte={};
      for(const [key,y] of yVon){
        const t=seite.find(i=>Math.abs(i.x-sp.x)<8&&Math.abs(i.y-y)<12&&NUM.test(i.s));
        if(t)werte[key]={wert:toNum(t.s),unter:isLim(t.s)};
      }
      if(!Object.keys(werte).length)continue;
      r.proben.push({laborId:sp.nummer,datum:sp.datum,satz:null,blattalter:null,zustand:null,
        stelle:stelle||null,kultur:lage||null,werte,optima:{},optArt:{}});
    }
  }
  if(!r.proben.length){r.hinweise.push('Keine Wasserproben erkannt – bitte von Hand erfassen.');return r}
  /* Plausibilitaet: Spurenelemente stehen in µmol/l und sind klein */
  const gross=r.proben.some(p=>GW_MIKRO.some(b=>p.werte['gw_'+b]&&p.werte['gw_'+b].wert>200));
  if(gross)r.hinweise.push('Ein Spurenelement liegt ungewöhnlich hoch für µmol/l – bitte die Einheiten im Bericht kontrollieren.');
  if(r.proben.length>1)r.hinweise.push(`Der Bericht enthält ${r.proben.length} Proben: die aktuelle Analyse und ${r.proben.length-1} aus der Historie derselben Entnahmestelle.`);
  if(!stelle)r.hinweise.push('Der Name der Entnahmestelle wurde nicht gefunden – bitte eintragen, sonst lassen sich Proben vom selben Tag nicht unterscheiden.');
  return r;
}
function parseAuto(seiten,punkte){
  const t=[].concat(...seiten).join('\n');
  if(/Gie[ßs]wasser/i.test(t)&&/NovaCropControl/i.test(t))return parseGiess(seiten,punkte);
  if(/NovaCropControl|Pflanzensaft-Probe/i.test(t))return parseNCC(seiten);
  if(/Labor Ins AG|LABOR INS/i.test(t)&&/Bericht Substrate|Kulturgruppe\s+Substrate/i.test(t))return parseIns(seiten);
  return {labor:null,typ:null,proben:[{datum:null,satz:null,blattalter:'',zustand:null,werte:{},optima:{},optArt:{}}],
    hinweise:['Unbekanntes Layout – Werte bitte von Hand erfassen. Der Quelltext wird gespeichert, damit nichts verloren geht.'],rohtext:t};
}
/* Wie pdfSeiten, aber mit den Koordinaten je Textstueck. Der Wasserbericht
   braucht sie, weil seine Tabelle gedreht ist. */
async function pdfPunkte(buf){
  const doc=await pdfjsLib.getDocument({data:buf}).promise,out=[];
  for(let p=1;p<=doc.numPages;p++){
    const c=await(await doc.getPage(p)).getTextContent();
    out.push(c.items.filter(i=>i.str&&i.str.trim()).map(i=>({
      x:Math.round(i.transform[4]*10)/10,y:Math.round(i.transform[5]*10)/10,s:i.str.trim()})));
  }
  return out;
}
async function pdfSeiten(buf){
  const doc=await pdfjsLib.getDocument({data:buf}).promise,out=[];
  for(let p=1;p<=doc.numPages;p++){
    const c=await(await doc.getPage(p)).getTextContent(),b=new Map();
    for(const it of c.items){
      if(!it.str||!it.str.trim())continue;
      const y=Math.round(it.transform[5]*2)/2;
      if(!b.has(y))b.set(y,[]);
      b.get(y).push({x:it.transform[4],s:it.str});
    }
    out.push([...b.keys()].sort((a,z)=>z-a).map(y=>b.get(y).sort((a,z)=>a.x-z.x).map(o=>o.s).join(' ').replace(/\s+/g,' ')));
  }
  return out;
}

let db=leer(),tab='lage',dirty=false,nachRender=null;

/* Ältere Sicherungsdateien einlesen, ohne dass etwas verloren geht. */
function migriere(roh){
  const basis=leer(),notizen=[],von=+(roh.schema||1);
  const d=Object.assign(basis,roh);
  d.einst=Object.assign(leer().einst,roh.einst||{});
  d.plan=Object.assign({zielwochen:[2,4,6],begleitet:[],geplant:[]},roh.plan||{});
  d.eigeneOptima=roh.eigeneOptima||{};
  d.saetze=roh.saetze||{};
  d.analysen=(roh.analysen||[]).map(a=>Object.assign({},a));
  if(von<4){
    let u=0,s=0,al=0;
    const UM={pH:'sub_pH',Salz:'sub_Salz',Nmin:'sub_Nmin',Mn:'sub_Mn',Cu:'sub_Cu',Zn:'sub_Zn',Fe:'sub_Fe',B:'sub_B'};
    for(const a of d.analysen){
      a.werte=JSON.parse(JSON.stringify(a.werte||{}));
      a.optima=JSON.parse(JSON.stringify(a.optima||{}));   /* geteilte Objekte entkoppeln */
      for(const k in a.werte){const w=a.werte[k];
        if(w&&w.limit!==undefined){w.unter=!!w.limit;delete w.limit;u++}}
      if(a.typ==='substrat'){
        const nw={};for(const k in a.werte){const nk=UM[k]||k;if(nk!==k)s++;nw[nk]=a.werte[k]}
        a.werte=nw;
      }
      for(const k in a.optima){const o=a.optima[k];
        if(Array.isArray(o)&&o[0]!=null&&o[0]===o[1]){a.optima[k]=[null,o[1]];al++}}
    }
    if(u)notizen.push(`${u} Werte an der Nachweisgrenze sind jetzt als solche gekennzeichnet und fliessen nicht mehr in Berechnungen ein.`);
    if(s)notizen.push(`${s} Substratwerte wurden in einen eigenen Namensraum verschoben, damit sie nicht mehr mit Blattsaftwerten verwechselt werden.`);
    if(al)notizen.push(`${al} Optimum-Angaben wie «<0,50 - <0,50» werden jetzt als Nachweisgrenze statt als Spanne gelesen.`);
    if(!roh.einst||!roh.einst.kern){d.einst.kern=KERN_VORGABE.slice();
      notizen.push('Die Kennzahl «im Optimum» rechnet neu mit elf steuerbaren Nährstoffen: ohne die Stickstoff-Dublette, ohne Natrium und Chlorid und ohne Silizium. Unter «Sätze & Einstellungen» änderbar.')}
  }
  if(von<5){
    /* Bis Schema 4 waren die Giesswasserfelder als mg/l beschriftet – eine
       Annahme, bevor ein echter Wasserbericht vorlag. Das Labor liefert
       Makronährstoffe in mmol/l und Spurenelemente in µmol/l. Eingelesene
       Berichte tragen eine Probennummer und sind unbedenklich; von Hand
       erfasste Werte werden markiert. */
    let gwAlt=0;
    for(const a of d.analysen){
      if(a.typ!=='giesswasser')continue;
      if(a.laborId)continue;
      if(Object.keys(a.werte||{}).some(k=>/^gw_/.test(k))){a.einheitAlt=true;gwAlt++}
    }
    if(gwAlt)notizen.push(`${gwAlt} von Hand erfasste Giesswasseranalyse${gwAlt>1?'n sind':' ist'} markiert: damals waren die Felder als mg/l beschriftet. Das Labor liefert mmol/l und µmol/l – bitte diese Werte kontrollieren. Eingelesene Berichte sind davon nicht betroffen.`);
    if(!roh.einst||!roh.einst.gwRicht)notizen.push('Für das Giesswasser gibt es jetzt einen eigenen Reiter mit Richtwerten. Sie sind gesetzte Annahmen und im Reiter änderbar.');
  }
  d.schema=5;
  return {db:d,notizen,von};
}

/* ── Kulturalter ────────────────────────────────────────── */
const montagKW=(jahr,kw)=>{const d=new Date(Date.UTC(jahr,0,4));d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+(kw-1)*7);return d};
/* Aus der Kalenderwoche im Satznamen das Aussaatdatum schätzen.
   Gewählt wird der KW-Montag, der dem Bezugsdatum am NÄCHSTEN liegt und nicht
   nach ihm liegt. Die alte Fassung nahm den letzten Montag davor und sprang
   dadurch ein volles Jahr zurück, sobald das Bezugsdatum wenige Tage vor dem
   Beginn der eigenen Kalenderwoche lag. */
function ausKW(satz,bezug){
  const m=String(satz||'').match(/^\s*(\d{1,2})\s*-/);if(!m||!bezug)return null;
  const kw=+m[1];if(kw<1||kw>53)return null;
  const bez=new Date(bezug);if(isNaN(bez))return null;
  let best=null;
  for(const j of [bez.getUTCFullYear()+1,bez.getUTCFullYear(),bez.getUTCFullYear()-1]){
    const d=montagKW(j,kw),w=(bez-d)/6048e5;
    if(w<-1.5)continue;                         /* Aussaat deutlich nach der Probe: ausgeschlossen */
    if(best==null||Math.abs(w)<Math.abs(best.w))best={d,w};
  }
  if(!best)return null;
  const grenze=Math.max(20,(db.einst.dauerWinter||10)*2);
  return {datum:best.d.toISOString().slice(0,10),wochen:best.w,plausibel:best.w<=grenze,grenze};
}
/* Bezug ist die früheste BLATTSAFT-Probe. Substratproben werden oft vor dem
   Topfen gezogen und liegen damit vor der Aussaat – sie würden die Schätzung
   verziehen. */
function bezugFuer(satz){
  const ds=db.analysen.filter(a=>a.satz===satz&&a.datum&&a.typ==='blattsaft').map(a=>a.datum).sort();
  if(ds.length)return ds[0];
  const alle=db.analysen.filter(a=>a.satz===satz&&a.datum).map(a=>a.datum).sort();
  return alle[0]||heute();
}
function aussaatVon(satz){
  const st=db.saetze[satz]||{};
  if(st.aussaat)return {datum:st.aussaat,quelle:'eingetragen',plausibel:true};
  const abg=ausKW(satz,bezugFuer(satz));
  return abg?{datum:abg.datum,quelle:'abgeleitet',plausibel:abg.plausibel,wochen:abg.wochen,grenze:abg.grenze}
            :{datum:null,quelle:'unbekannt',plausibel:true};
}
function kulturdauer(satz){
  const st=db.saetze[satz]||{};
  if(st.dauer)return st.dauer;
  const a=aussaatVon(satz).datum;
  if(!a)return db.einst.dauerSommer;
  const m=monat(a);
  return (m>=4&&m<=9)?db.einst.dauerSommer:db.einst.dauerWinter;
}
function alter(a){
  const satz=a&&a.satz;
  if(!satz||!a.datum)return {woche:null,text:'Satz oder Datum fehlt',sicher:false,plausibel:true};
  const q=aussaatVon(satz);
  if(!q.datum)return {woche:null,text:'Aussaatdatum unbekannt – unter «Sätze» nachtragen.',sicher:false,plausibel:true};
  const w=tage(q.datum,a.datum)/7;
  const kw=String(satz).match(/^\s*(\d{1,2})-/);
  return {woche:Math.round(w*10)/10,aussaat:q.datum,quelle:q.quelle,sicher:q.quelle==='eingetragen',
    plausibel:q.plausibel!==false&&w>=-0.5,
    text:q.quelle==='eingetragen'
      ? `Aussaat ${fmt(q.datum)} eingetragen · Probe ${fmt(a.datum)} · ${nz(w,1)} Wochen`
      : `KW ${kw?kw[1]:'?'} aus dem Satznamen → Aussaat geschätzt ${fmt(q.datum)} · Probe ${fmt(a.datum)} · rund ${nz(w,1)} Wochen`};
}

/* ── Optimum-Bereiche ───────────────────────────────────── */
/* Eigene Werte schlagen Laborwerte – aber je Grenze einzeln. Ist nur eine
   eigene Grenze eingetragen, bleibt die andere vom Labor bestehen. */
function optVon(a,k){
  const lab=(a&&a.optima&&a.optima[k])||null;
  const eig=(db.eigeneOptima&&db.eigeneOptima[k])||null;
  if(!eig)return lab;
  const lo=eig[0]!=null?eig[0]:(lab?lab[0]:null);
  const hi=eig[1]!=null?eig[1]:(lab?lab[1]:null);
  return (lo==null&&hi==null)?null:[lo,hi];
}
function optQuelle(a,k){
  const lab=(a&&a.optima&&a.optima[k])||null;
  const eig=(db.eigeneOptima&&db.eigeneOptima[k])||null;
  if(!eig)return lab?'Labor':null;
  if(eig[0]!=null&&eig[1]!=null)return 'eigener Wert';
  return lab?'eigener Wert + Labor':'eigener Wert';
}
const optEigen=k=>!!(db.eigeneOptima&&db.eigeneOptima[k]);
const toleranz=()=>(+db.einst.toleranz||0)/100;
/* Fünf Stufen statt drei: die Randstufen fangen Messrauschen ab, damit
   0,79 gegen eine Untergrenze von 0,80 kein Alarmbefund mehr wird. */
function status(v,o,unter){
  if(v==null||!o||unter)return null;
  const lo=o[0],hi=o[1],t=toleranz();
  if(lo!=null&&v<lo)return v>=lo*(1-t)?'randtief':'tief';
  if(hi!=null&&v>hi)return v<=hi*(1+t)?'randhoch':'hoch';
  return 'ok';
}
const istOk=s=>s==='ok'||s==='randtief'||s==='randhoch';
const istRand=s=>s==='randtief'||s==='randhoch';
const STTEXT={tief:'unter Optimum',randtief:'knapp unter Optimum',ok:'im Optimum',randhoch:'knapp über Optimum',hoch:'über Optimum'};
/* Lagewert 0–3: [0,1] zu tief · [1,2] Optimum · [2,3] zu hoch – begrenzt */
function lage(v,o){
  if(v==null||!o)return null;
  const lo=o[0],hi=o[1];
  if(lo==null&&hi==null)return null;
  if(lo==null)return hi>0?(v<=hi?1+Math.min(1,v/hi):2+Math.min(1,(v-hi)/hi)):null;
  if(hi==null||hi<=lo)return v<lo?(lo>0?Math.max(0,v/lo):0):1.5;
  if(v<lo)return lo>0?Math.max(0,Math.min(1,v/lo)):0;
  if(v<=hi)return 1+(v-lo)/(hi-lo);
  return 2+Math.min(1,(v-hi)/(hi||1));
}
const abstand=l=>l==null?null:(l<1?1-l:l>2?l-2:0);
/* Ausmass einer Abweichung, für die Einstufung der Schwere */
function ausmass(v,o){
  if(v==null||!o)return 0;
  const lo=o[0],hi=o[1];
  if(lo!=null&&v<lo&&lo>0)return (lo-v)/lo;
  if(hi!=null&&v>hi&&hi>0)return (v-hi)/hi;
  return 0;
}
const schwereVon=a=>a>=0.5?'hoch':a>=0.15?'mittel':'info';

/* ── Erhebungen und Bewertung ───────────────────────────── */
function erhebungen(){
  const m=new Map();
  for(const a of db.analysen.filter(x=>x.typ==='blattsaft'&&x.datum)){
    const k=(a.satz||'?')+'|'+a.datum+'|'+(a.zustand||'');
    if(!m.has(k))m.set(k,{id:k,satz:a.satz,datum:a.datum,zustand:a.zustand||null,proben:{},liste:[]});
    const e=m.get(k);e.proben[a.blattalter||'misch']=a;e.liste.push(a);
  }
  const out=[...m.values()];
  out.forEach(e=>{e.alter=alter(e.liste[0]);e.bew=bewerte(e);e.index=indexVon(e.bew)});
  return out.sort((a,b)=>a.datum.localeCompare(b.datum)||String(a.satz).localeCompare(String(b.satz)));
}
/* Welches Blatt ist für diesen Nährstoff überhaupt aussagekräftig?
   Mobil → Altblatt (dort zeigt sich Knappheit zuerst).
   Immobil → Jungblatt (dorthin kommt der Nachschub nicht).
   Teilmobil → beide, versorgt nur wenn beide stimmen. */
function massgebliche(e,k){
  const j=e.proben.jung,a=e.proben.alt,mi=e.proben.misch;
  const hat=p=>p&&p.werte[k]&&p.werte[k].wert!=null;
  const m=MOBIL[k]||'unbekannt';
  if(m==='mobil'&&hat(a))return {art:'alt',ps:[a]};
  if(m==='immobil'&&hat(j))return {art:'jung',ps:[j]};
  if(hat(j)&&hat(a))return {art:'beide',ps:[j,a]};
  const eine=[j,a,mi].filter(hat);
  if(!eine.length)return null;
  const p=eine[0];
  return {art:p===j?'jung':p===a?'alt':'misch',ps:[p],ersatz:m==='mobil'||m==='immobil'};
}
/* Asymmetrisch, und das mit Absicht:
   MANGEL wird nur am massgeblichen Blatt festgestellt – bei einem mobilen
   Nährstoff sagt ein volles Jungblatt nichts, solange das Altblatt leer ist.
   ÜBERSCHUSS zählt dagegen an JEDEM Blatt. Ein Nährstoff, der irgendwo über
   dem Optimum liegt, ist im Überschuss, egal wo er sich staut – und im
   Umlaufsystem ist Anreicherung der wahrscheinlichere Fehler als Mangel. */
function bewerte(e){
  const out={};
  for(const k of kern()){
    const m=massgebliche(e,k);
    if(!m){out[k]={k,fehlt:true};continue}
    const ps=alleProben(e).filter(p=>p.werte[k]&&p.werte[k].wert!=null);
    const ws=ps.map(p=>{const w=p.werte[k],o=optVon(p,k);
      return {blattalter:p.blattalter||'misch',wert:w.wert,unter:!!w.unter,opt:o,st:status(w.wert,o,w.unter),
              massgeblich:m.ps.indexOf(p)>=0,probe:p}});
    const gem=ws.filter(w=>w.st!=null);
    if(!gem.length){out[k]={k,fehlt:true,werte:ws,grund:ws.some(w=>w.unter)?'Nachweisgrenze':'kein Optimum hinterlegt'};continue}
    const mass=gem.filter(w=>w.massgeblich),basis=mass.length?mass:gem;
    const tief=basis.some(w=>w.st==='tief');
    const hoch=gem.some(w=>w.st==='hoch');
    const ok=!tief&&!hoch;
    const daneben=(tief?basis:gem).filter(w=>!istOk(w.st));
    out[k]={k,art:m.art,ersatz:!!m.ersatz,werte:ws,mass:basis,ok,rand:ok&&gem.some(w=>istRand(w.st)),
      st:ok?'ok':(tief?'tief':'hoch'),
      hochAn:hoch&&!tief?gem.filter(w=>w.st==='hoch').map(w=>w.blattalter):[],
      ausmass:daneben.length?Math.max.apply(null,daneben.map(w=>ausmass(w.wert,w.opt))):0};
  }
  return out;
}
function indexVon(bew){
  const v=Object.values(bew).filter(x=>!x.fehlt);
  if(!v.length)return null;
  const ok=v.filter(x=>x.ok).length;
  return {anteil:ok/v.length,n:v.length,ok,fehlt:kern().length-v.length};
}
const leitProbe=e=>e.proben.jung||e.proben.misch||e.proben.alt;
const alleProben=e=>['jung','alt','misch'].map(a=>e.proben[a]).filter(Boolean);
const alleSaetze=()=>[...new Set([...db.analysen.map(a=>a.satz),...Object.keys(db.saetze)])].filter(Boolean).sort();
function satzSichern(satz,daten){
  if(!satz)return;
  db.saetze[satz]=Object.assign({},db.saetze[satz]||{},daten||{});
}
/* Welcher Nährstoff ist über alle Erhebungen hinweg chronisch daneben?
   Rechnet auf derselben Grundlage wie die Kennzahl im Überblick. */
function bilanz(){
  const erh=erhebungen(),m=new Map();
  for(const e of erh){
    for(const k of kern()){
      const b=e.bew[k];if(!b||b.fehlt)continue;
      if(!m.has(k))m.set(k,{k,n:0,ok:0,tief:0,hoch:0,rand:0,lagen:[],art:b.art});
      const x=m.get(k);x.n++;
      if(b.ok){x.ok++;if(b.rand)x.rand++}else if(b.st==='tief')x.tief++;else x.hoch++;
      const l=b.werte.map(w=>lage(w.wert,w.opt)).filter(v=>v!=null);
      if(l.length)x.lagen.push(mittel(l));
    }
  }
  return [...m.values()].map(b=>({...b,mittel:mittel(b.lagen),quote:b.ok/b.n,haupt:HAUPT.includes(b.k)}))
    .sort((a,b)=>a.quote-b.quote||b.n-a.n);
}
/* Verhältnis zweier Werte in derselben Probe – vom Kulturalter unabhängig
   und darum bei dieser Datenlage die belastbarste Auswertung. */
function verh(p,a,b){
  const x=p&&p.werte[a],y=p&&p.werte[b];
  if(!x||!y||x.wert==null||y.wert==null||!y.wert||x.unter||y.unter)return null;
  return x.wert/y.wert;
}
/* Substratprobe, die zeitlich am besten zu einer Erhebung passt */
function substratZu(satz,datum,fenster){
  const f=fenster||28;
  const c=db.analysen.filter(a=>a.typ==='substrat'&&a.satz===satz&&a.datum&&Math.abs(tage(a.datum,datum))<=f);
  if(!c.length)return null;
  return c.sort((x,y)=>Math.abs(tage(x.datum,datum))-Math.abs(tage(y.datum,datum)))[0];
}

/* ══════════ 5 · Regeln ══════════
   Grundsätze dieses Regelwerks:
   · Je Nährstoff entsteht höchstens EIN Befund. Verknüpfende Regeln, die eine
     Ursache benennen, unterdrücken die Einzelbefunde, die sie erklären.
   · Verhältnisregeln laufen einmal je Erhebung, nicht einmal je Blattalter –
     ein Kationen-Ungleichgewicht ist eine Eigenschaft der Nährlösung.
   · Beurteilt wird dasselbe Blatt, mit dem auch die Kennzahl rechnet.
   · Die Schwere richtet sich nach dem Ausmass, nicht nach der Regelart.
   · Jede gesetzte Schwelle steht im Feld «regel» und ist in den Einstellungen
     änderbar.                                                                */
function befunde(e){
  const S=db.einst,out=[],belegt=new Set();
  const ps=alleProben(e);if(!ps.length)return out;
  const ir=leitProbe(e);
  const o=k=>optVon(ir,k);
  const w=(p,k)=>{const x=p&&p.werte[k];return (x&&!x.unter&&x.wert!=null)?x.wert:null};
  const j=e.proben.jung,a=e.proben.alt,mi=e.proben.misch;
  const add=x=>{out.push(Object.assign({id:x.art+':'+(x.param||'-'),ausmass:0},x))};
  const einh=k=>einheit(k);
  const nOpt=(k,i)=>{const x=o(k);return x&&x[i]!=null?nz(x[i]):'–'};
  /* höchstes Verhältnis über alle Blattalter, mit Angabe wo */
  const maxVerh=(x,y)=>{
    let b=null;
    for(const p of ps){const v=verh(p,x,y);if(v!=null&&(b==null||v>b.v))b={v,p}}
    return b;
  };

  /* ── R1 · Stickstoff als Leitbefund ──────────────────── */
  if(o('NO3')){
    const n3=ps.map(p=>({p,v:w(p,'NO3')})).filter(x=>x.v!=null);
    if(n3.length&&n3.every(x=>status(x.v,o('NO3'))==='tief')){
      const bel=[`Nitrat ${n3.map(x=>`${x.p.blattalter||'Probe'} ${nz(x.v)}`).join(', ')} ${einh('NO3')} · Optimum ab ${nOpt('NO3',0)}`];
      const zu=ps.map(p=>({p,v:w(p,'Zucker')})).filter(x=>x.v!=null&&o('Zucker')&&status(x.v,o('Zucker'))==='hoch');
      if(zu.length)bel.push(`Zucker gleichzeitig über Optimum: ${zu.map(x=>nz(x.v,2)).join(', ')} % (Optimum bis ${nOpt('Zucker',1)}) – Assimilate stauen sich, weil sie ohne Stickstoff nicht in Wachstum umgesetzt werden`);
      const ec=w(j||ir,'EC');
      if(ec!=null&&o('EC')&&status(ec,o('EC'))==='tief')bel.push(`Saft-EC ${nz(ec,1)} mS/cm unter Optimum (ab ${nOpt('EC',0)}) – bestätigt die tiefe Gesamtbeladung`);
      const sub=substratZu(e.satz,e.datum);
      const nmin=sub&&sub.werte.sub_Nmin?sub.werte.sub_Nmin.wert:null;
      if(nmin!=null)bel.push(`Substrat vom ${fmt(sub.datum)}: Nmin ${nz(nmin)} mg/l – ${nmin<30?'auch im Substrat ist wenig mineralisierter Stickstoff vorhanden, das Angebot fehlt':'im Substrat liegt Stickstoff bereit, er kommt aber nicht in der Pflanze an'}`);
      add({art:'stickstoff',schwere:'hoch',param:'NO3',ausmass:1,titel:'Stickstoff limitiert das Wachstum',belege:bel,
        ursache:'Nitrat ist der Sofortvorrat der Pflanze. Ist er in allen Blattaltern leer, kommt zu wenig pflanzenverfügbarer Stickstoff nach – bei organischer Düngung heisst das meist, dass die Mineralisierung nicht mit dem Bedarf mithält.',
        tun:nmin!=null&&nmin<30
          ? 'Stickstoffzufuhr erhöhen oder auf einen schneller verfügbaren Dünger wechseln. Weil auch das Substrat wenig Nmin führt, fehlt das Angebot und nicht die Aufnahme.'
          : 'Stickstoffzufuhr erhöhen oder auf einen schneller verfügbaren Dünger wechseln. Substrattemperatur mitprüfen: die Mineralisierung läuft temperaturabhängig, bei 15 °C liefert dieselbe Grunddüngung deutlich weniger als bei 25 °C.',
        regel:'Nitrat in allen gemessenen Proben unter Optimum'});
      ['NO3','N_gesamt','N_aus_NO3','Zucker','EC'].forEach(k=>belegt.add(k));
    }
  }

  /* ── R2 · Ammonium verdrängt Kalium ──────────────────── */
  /* Der agronomisch wichtigste Zusammenhang bei organischer Düngung im
     Umlaufsystem: beide Werte stammen aus derselben Probe, der Befund ist
     damit vom Kulturalter unabhängig. */
  {
    const nh=ps.map(p=>({p,v:w(p,'NH4')})).filter(x=>x.v!=null&&o('NH4')&&status(x.v,o('NH4'))==='hoch');
    const bk=e.bew.K;
    if(nh.length&&bk&&!bk.fehlt&&!bk.ok&&bk.st==='tief'){
      const hoch=nh.sort((x,y)=>y.v-x.v)[0];
      const kw=bk.werte.filter(x=>x.st!=null).sort((x,y)=>x.wert-y.wert)[0];
      add({art:'nh4k',schwere:'hoch',param:'K',ausmass:Math.max(bk.ausmass,ausmass(hoch.v,o('NH4'))),
        titel:'Ammoniumüberschuss bremst die Kaliumaufnahme',
        belege:[`Ammonium ${hoch.p.blattalter||'Probe'} ${nz(hoch.v)} ${einh('NH4')} · Optimum bis ${nOpt('NH4',1)}`,
                `Kalium ${kw.blattalter} ${nz(kw.wert)} ${einh('K')} · Optimum ab ${kw.opt&&kw.opt[0]!=null?nz(kw.opt[0]):'–'}`],
        ursache:'Ammonium und Kalium konkurrieren an denselben Aufnahmestellen der Wurzel. Solange Ammonium im Überschuss anfällt – bei organischer Düngung typischerweise schubweise nach der Mineralisierung – bleibt Kalium tief, auch wenn im Substrat genug davon bereitsteht. Zusätzlich versauert die Ammoniumaufnahme die Wurzelzone.',
        tun:'Nicht einfach mehr Kalium geben. Zuerst die Stickstoffform prüfen: langsamer freisetzenden Dünger oder kleinere, häufigere Gaben, damit weniger Ammonium auf einmal anfällt. Rücklauf-pH beobachten – fällt er, bestätigt das die Ammoniumaufnahme. Erst danach Kalium anheben.',
        regel:'Ammonium über Optimum und Kalium unter Optimum in derselben Erhebung'});
      belegt.add('NH4');belegt.add('K');
    }
  }

  /* ── R3 · Stickstoffform ─────────────────────────────── */
  if(!belegt.has('NH4')){
    const r=maxVerh('NH4','NO3');
    if(r&&r.v>S.nh4no3){
      const n3=w(r.p,'NO3'),tief=o('NO3')&&status(n3,o('NO3'))==='tief';
      add({art:'stickstoffform',schwere:tief?'mittel':'info',param:'NH4',ausmass:Math.min(1,r.v/(S.nh4no3*4)),
        titel:'Ammonium dominiert die Stickstoffform',
        belege:[`${r.p.blattalter||'Probe'}: NH4 ${nz(w(r.p,'NH4'))} zu NO3 ${nz(n3)} ${einh('NO3')} · Verhältnis ${nz(r.v,2)}`],
        ursache:'Bei organischer Düngung fällt Ammonium schubweise an, während Nitrat erst über die Mineralisierung nachkommt. Ammonium konkurriert mit Kalium, Calcium und Magnesium um die Aufnahme und versauert die Wurzelzone.',
        tun:'Kationenversorgung im Auge behalten. Fällt gleichzeitig der Rücklauf-pH, spricht das für Ammoniumaufnahme – dann kleinere, häufigere Gaben statt einzelner Schübe.',
        regel:`NH4/NO3 über ${nz(S.nh4no3,2)}`});
      belegt.add('NH4');
    }
  }
  /* Ammoniumüberschuss auch ohne tiefes Nitrat melden */
  if(!belegt.has('NH4')&&o('NH4')){
    const h=ps.map(p=>({p,v:w(p,'NH4')})).filter(x=>x.v!=null&&status(x.v,o('NH4'))==='hoch');
    if(h.length){
      const t=h.sort((x,y)=>y.v-x.v)[0];
      add({art:'ueberschuss',schwere:schwereVon(ausmass(t.v,o('NH4'))),param:'NH4',ausmass:ausmass(t.v,o('NH4')),
        titel:'Ammonium über Optimum',
        belege:[`${t.p.blattalter||'Probe'} ${nz(t.v)} ${einh('NH4')} · Optimum bis ${nOpt('NH4',1)}`],
        ursache:'Ein Ammoniumüberschuss bei ausreichendem Nitrat entsteht typischerweise kurz nach einer organischen Kopfdüngung im warmen Gewächshaus. Er konkurriert mit Kalium, Calcium und Magnesium und versauert die Wurzelzone.',
        tun:'Beobachten, ob die Kationen in der nächsten Erhebung nachgeben. Kleinere, häufigere Gaben verteilen den Schub.',
        regel:'Ammonium über Optimum'});
      belegt.add('NH4');
    }
  }

  /* ── R4 · Kationenverhältnisse, einmal je Erhebung ───── */
  const kmg=maxVerh('K','Mg'),kca=maxVerh('K','Ca');
  if(kmg&&kmg.v>S.kMg&&e.bew.Mg&&!e.bew.Mg.fehlt&&e.bew.Mg.st==='tief'&&!belegt.has('Mg')){
    add({art:'kmg',schwere:'mittel',param:'Mg',ausmass:e.bew.Mg.ausmass,
      titel:'Magnesium wird durch Kalium verdrängt',
      belege:[`${kmg.p.blattalter||'Probe'}: K/Mg = ${nz(kmg.v,1)} bei Magnesium ${nz(w(kmg.p,'Mg'))} ${einh('Mg')} unter Optimum (ab ${nOpt('Mg',0)})`],
      ursache:'Kalium und Magnesium konkurrieren an denselben Aufnahmestellen der Wurzel. Steht das Verhältnis so weit auf der Kaliumseite, bleibt eine Magnesiumgabe weitgehend wirkungslos.',
      tun:'Kaliumanteil senken oder beides gemeinsam anpassen, statt nur Magnesium nachzulegen.',
      regel:`K/Mg über ${nz(S.kMg,1)} bei Magnesium unter Optimum`});
    belegt.add('Mg');
  }
  if(kca&&kca.v>S.kCa&&e.bew.Ca&&!e.bew.Ca.fehlt&&e.bew.Ca.st==='tief'&&!belegt.has('Ca')){
    add({art:'kca',schwere:'mittel',param:'Ca',ausmass:e.bew.Ca.ausmass,
      titel:'Calciumaufnahme durch Kalium gebremst',
      belege:[`${kca.p.blattalter||'Probe'}: K/Ca = ${nz(kca.v,2)} bei Calcium ${nz(w(kca.p,'Ca'))} ${einh('Ca')} unter Optimum (ab ${nOpt('Ca',0)})`],
      ursache:'Kalium konkurriert mit Calcium um die Aufnahme. Zusammen mit einem schwachen Transpirationsstrom ist das der übliche Weg zu Blattrandschäden.',
      tun:'Kaliumanteil prüfen und das Klima stabilisieren – Calcium kommt nur mit dem Transpirationsstrom in die Spitze.',
      regel:`K/Ca über ${nz(S.kCa,2)} bei Calcium unter Optimum`});
    belegt.add('Ca');
  }

  /* ── R5 · Mangan und Substrat-pH ─────────────────────── */
  /* Liest jedes vorhandene Blattalter, nicht nur das Jungblatt – bei einer
     Mischprobe schwieg diese Regel früher ganz. */
  {
    const mn=ps.map(p=>({p,v:w(p,'Mn')})).filter(x=>x.v!=null&&o('Mn')&&status(x.v,o('Mn'))!=='ok'&&!istRand(status(x.v,o('Mn'))));
    if(mn.length&&!belegt.has('Mn')){
      const t=mn.sort((x,y)=>y.v-x.v)[0],hoch=status(t.v,o('Mn'))==='hoch';
      const sub=substratZu(e.satz,e.datum);
      const ph=sub&&sub.werte.sub_pH?sub.werte.sub_pH.wert:null;
      const bel=[`${t.p.blattalter||'Probe'} ${nz(t.v,2)} ${einh('Mn')} · Optimum ${nOpt('Mn',0)}–${nOpt('Mn',1)}`];
      let passt=false;
      if(ph!=null){
        bel.push(`Substrat vom ${fmt(sub.datum)}: pH ${nz(ph,1)}`);
        passt=(hoch&&ph<5.5)||(!hoch&&ph>6.8);
        if(passt)bel.push(hoch?'pH unter 5,5 macht Mangan stark verfügbar – das erklärt den hohen Blattwert'
                              :'pH über 6,8 legt Mangan fest – das erklärt den tiefen Blattwert trotz Vorrat im Substrat');
      }
      add({art:hoch?'ueberschuss':'mangel',schwere:passt?'mittel':schwereVon(ausmass(t.v,o('Mn'))),param:'Mn',
        ausmass:ausmass(t.v,o('Mn')),
        titel:hoch?'Mangan über Optimum':'Mangan unter Optimum',
        belege:bel,
        ursache:'Die Manganverfügbarkeit hängt stark am Wurzel-pH: unter pH 5,5 steigt sie bis zur Toxizität, über pH 6,8 fällt Mangan aus und wird knapp, obwohl im Substrat genug vorhanden ist.',
        tun:ph==null?'Substrat-pH messen – ohne ihn lässt sich nicht unterscheiden, ob es an der Menge oder an der Verfügbarkeit liegt.'
           :passt?(hoch?'Substrat-pH anheben. Eine Reduktion der Manganzufuhr hilft hier nicht, weil nicht die Menge, sondern die Verfügbarkeit das Problem ist.'
                       :'Substrat-pH senken, damit das vorhandene Mangan wieder verfügbar wird.')
           :'Substrat-pH liegt im üblichen Bereich – die Ursache liegt eher bei der Zufuhr als bei der Verfügbarkeit.',
        regel:'Mangan ausserhalb des Optimums, mit Substrat-pH als Kontext'});
      belegt.add('Mn');
    }
  }

  /* ── R6 · Ballastionen ───────────────────────────────── */
  /* Natrium und Chlorid werden nie zugedüngt. Nur «zu hoch» ist ein Befund;
     tiefe Werte sind im Umlaufsystem der erwünschte Zustand. */
  for(const k of BALLAST){
    if(!o(k))continue;
    const h=ps.map(p=>({p,v:w(p,k)})).filter(x=>x.v!=null&&status(x.v,o(k))==='hoch');
    if(!h.length)continue;
    const t=h.sort((x,y)=>y.v-x.v)[0];
    const gw=db.analysen.filter(x=>x.typ==='giesswasser'&&x.datum).sort((x,y)=>y.datum.localeCompare(x.datum))[0];
    const gwv=gw&&gw.werte['gw_'+k]?gw.werte['gw_'+k].wert:null;
    const bel=[`${h.map(x=>`${x.p.blattalter||'Probe'} ${nz(x.v)}`).join(', ')} ${einh(k)} · Optimum bis ${nOpt(k,1)}`];
    if(gwv!=null)bel.push(`Giesswasser vom ${fmt(gw.datum)}: ${nz(gwv)} mg/l ${NAME[k]} – ${gwv>50?'die Quelle liegt im Giesswasser selbst':'das Giesswasser ist unauffällig, die Anreicherung entsteht im Umlauf'}`);
    add({art:'ballast',schwere:schwereVon(ausmass(t.v,o(k))),param:k,ausmass:ausmass(t.v,o(k)),
      titel:`${NAME[k]} reichert sich an`,belege:bel,
      ursache:`${NAME[k]} wird von der Pflanze kaum aufgenommen. Im Ebbe-Flut-Kreislauf bleibt zurück, was nicht aufgenommen wird, und reichert sich Gabe für Gabe an. Der Rücklauf-EC steigt dadurch, ohne dass mehr Nährstoff im Wasser ist.`,
      tun:'Giesswasser analysieren und den Rücklauf-EC im Reiter «Substrat & Wasser» verfolgen. Bestätigt sich die Anreicherung, den Tank ablassen und neu ansetzen – weniger zu düngen wäre genau die falsche Antwort, weil es den Nährstoffanteil senkt und den Ballastanteil unberührt lässt.',
      regel:`${NAME[k]} über Optimum`});
    belegt.add(k);
  }

  /* ── R7 · Weiches Gewebe (ausdrücklich Hypothese) ────── */
  if(!belegt.has('Ca')){
    const p=j||mi;
    const N=w(p,'N_gesamt'),Ca=w(p,'Ca');
    if(N!=null&&Ca!=null&&o('Ca')&&o('N_gesamt')&&status(Ca,o('Ca'))==='tief'&&status(N,o('N_gesamt'))!=='tief')
      add({art:'weich',schwere:'info',param:'Ca',ausmass:ausmass(Ca,o('Ca')),hypothese:true,
        titel:'Weiches Gewebe – erhöhter Infektionsdruck',
        belege:[`${p.blattalter||'Probe'}: Stickstoff gesamt ${nz(N)} ${einh('N_gesamt')} nicht tief, Calcium ${nz(Ca)} ${einh('Ca')} unter Optimum (ab ${nOpt('Ca',0)})`],
        ursache:'Calcium vernetzt die Pektine der Zellwand. Viel Stickstoff bei knappem Calcium ergibt dünnwandiges, saftreiches Gewebe. Dass daraus bei Basilikum mehr Mehltau folgt, ist plausibel, aber mit eurer Datenlage nicht belegt.',
        tun:'Vor der nächsten Stickstofferhöhung Calcium und Klima stabilisieren.',
        regel:'Calcium unter Optimum bei nicht tiefem Gesamtstickstoff'});
  }

  /* ── R8 · Einzelbefunde je Nährstoff ─────────────────── */
  const rand=[];
  for(const k of kern()){
    if(belegt.has(k))continue;
    const b=e.bew[k];if(!b||b.fehlt)continue;
    if(b.ok){if(b.rand)rand.push(b);continue}
    const ok=optVon(j||a||ir,k);
    const vj=w(j,k),va=w(a,k),m=MOBIL[k]||'unbekannt';
    const stelle=b.werte.filter(x=>x.st!=null).sort((x,y)=>y.st==='tief'?1:-1);
    const zeig=b.werte.filter(x=>x.st!=null).map(x=>`${x.blattalter} ${nz(x.wert)}`).join(', ');
    const zeigMass=(b.mass||b.werte).filter(x=>x.st!=null).map(x=>`${x.blattalter} ${nz(x.wert)}`).join(', ');
    const sw=schwereVon(b.ausmass);

    if(b.st==='hoch'){
      const wo=(b.hochAn&&b.hochAn.length)?b.hochAn.join(' und ')+'blatt':(b.art==='beide'?'Jung- und Altblatt':b.art+'blatt');
      add({art:'ueberschuss',schwere:sw,param:k,ausmass:b.ausmass,
        titel:`${NAME[k]} über Optimum`,
        belege:[`${zeig} ${einh(k)} · Optimum bis ${nOpt(k,1)}`,`über dem Optimum am ${wo} (${m})`],
        ursache:'In einem Umlaufsystem ist Anreicherung der wahrscheinlichere Fehler als Mangel: was die Pflanze nicht aufnimmt, bleibt im Kreislauf und kommt bei der nächsten Gabe dazu. Ein Überschuss verdrängt zudem konkurrierende Kationen an der Wurzel.',
        tun:`Zufuhr von ${NAME[k]} zurücknehmen und prüfen, ob der Rücklauf-EC bei gleicher Dosierung steigt. Bei anhaltendem Überschuss den Tank ablassen.`,
        regel:`${NAME[k]} über Optimum am massgeblichen Blatt`});
      continue;
    }
    /* Verlagerung: gilt jetzt für ALLE phloemmobilen Nährstoffe. Früher hatten
       nur sechs davon eine Auffangregel, der Rest fiel stillschweigend durch. */
    if(m==='mobil'&&vj!=null&&va!=null&&va>0&&vj/va>S.verlagerung&&istOk(status(vj,ok))){
      add({art:'verlagerung',schwere:'mittel',param:k,ausmass:b.ausmass,
        titel:`${NAME[k]}: das Altblatt wird ausgeräumt`,
        belege:[`alt ${nz(va)} ${einh(k)} unter Optimum (ab ${nOpt(k,0)}), jung ${nz(vj)} noch im Sollbereich · Verhältnis ${nz(vj/va,2)}`],
        ursache:`${NAME[k]} ist im Phloem beweglich. Bei Knappheit zieht die Pflanze den Nährstoff aus alten Blättern in die Spitze. Das Jungblatt sieht darum noch gut aus, während die Versorgung schon nicht mehr reicht.`,
        tun:'Zufuhr erhöhen, solange das Jungblatt noch im Optimum liegt – das ist das Zeitfenster für eine Korrektur ohne Qualitätsverlust.',
        regel:`${NAME[k]}: Altblatt unter Optimum und jung/alt über ${nz(S.verlagerung,2)}`});
      continue;
    }
    if(m==='immobil'&&vj!=null&&status(vj,ok)==='tief'&&(va==null||va>=vj*0.9)){
      add({art:'transport',schwere:sw,param:k,ausmass:b.ausmass,
        titel:`${NAME[k]}: die Versorgung der Spitze stockt`,
        belege:[`jung ${nz(vj)} ${einh(k)} unter Optimum (ab ${nOpt(k,0)})${va!=null?`, alt ${nz(va)} und damit nicht tiefer`:''}`],
        ursache:`${NAME[k]} wird nicht verlagert und kommt nur mit dem Transpirationsstrom ins junge Blatt. Steht dieser Strom still – hohe Luftfeuchte, Nacht, zu hoher EC, zu selten geflutet – fehlt der Nährstoff in der Spitze, obwohl im Tank genug davon ist.`,
        tun:'Zuerst Klima und Bewässerung prüfen: Entfeuchtung nachts, Luftbewegung, Flutrhythmus, EC im Rücklauf. Zudüngen hilft nur, wenn auch das Altblatt tief liegt.',
        regel:`${NAME[k]}: Jungblatt unter Optimum bei mindestens gleich hohem Altblatt`});
      continue;
    }
    add({art:'mangel',schwere:sw,param:k,ausmass:b.ausmass,
      titel:`${NAME[k]} unter Optimum`,
      belege:[`${zeigMass} ${einh(k)} · Optimum ab ${nOpt(k,0)}`,`beurteilt am ${b.art==='beide'?'Jung- und Altblatt':b.art+'blatt'} (${m}) – dort zeigt sich Knappheit zuerst`],
      ursache:m==='mobil'?'Kein Verlagerungsmuster: auch die Reserve in den alten Blättern ist aufgebraucht. Das Angebot reicht nicht.'
        :m==='immobil'?'Beide Blattalter sind tief – anders als bei einem reinen Transportproblem fehlt der Nährstoff auch dort, wo er einmal angekommen ist.'
        :'Beide Blattalter liegen unter dem Optimum. Das Angebot an der Wurzel reicht nicht, oder die Aufnahme ist blockiert.',
      tun:m==='immobil'?`Klima und EC prüfen, danach die Zufuhr von ${NAME[k]} erhöhen.`:`Zufuhr von ${NAME[k]} erhöhen und in der nächsten Erhebung kontrollieren.`,
      regel:`${NAME[k]} unter Optimum am massgeblichen Blatt, ohne Verlagerungsmuster`});
  }
  /* Randlagen gebündelt statt als Einzelalarme */
  if(rand.length)
    add({art:'rand',schwere:'info',param:null,ausmass:0,
      titel:`${rand.length} Nährstoff${rand.length>1?'e liegen':' liegt'} knapp am Rand des Optimums`,
      belege:[rand.map(b=>{const x=b.werte.find(y=>istRand(y.st))||b.werte[0];
        return `${NAME[b.k]} ${x.blattalter} ${nz(x.wert)} (${STTEXT[x.st]})`}).join(' · ')],
      ursache:`Diese Werte liegen innerhalb von ${nz(db.einst.toleranz,0)} % der Optimumgrenze. Das ist im Bereich der Messgenauigkeit einer Blattsaftanalyse und zählt darum als versorgt.`,
      tun:'Nicht handeln, aber in der nächsten Erhebung im Auge behalten. Wandert ein Wert weiter, wird daraus ein eigener Befund.',
      regel:`innerhalb von ${nz(db.einst.toleranz,0)} % der Optimumgrenze (Annahme, in den Einstellungen änderbar)`});

  const rang={hoch:0,mittel:1,info:2};
  return out.sort((x,y)=>rang[x.schwere]-rang[y.schwere]||(y.ausmass||0)-(x.ausmass||0));
}
/* Welcher Befund ist wiederholt aufgetreten? Bei wenigen Analysen ist das
   die belastbarere Frage als ein Einzelbefund. */
function wiederkehrend(){
  const erh=erhebungen(),m=new Map();
  for(const e of erh)for(const f of befunde(e)){
    if(f.schwere==='info')continue;
    if(!m.has(f.id))m.set(f.id,{id:f.id,titel:f.titel,param:f.param,n:0,wann:[]});
    const x=m.get(f.id);x.n++;x.wann.push({datum:e.datum,satz:e.satz});
  }
  return [...m.values()].filter(x=>x.n>1).sort((a,b)=>b.n-a.n);
}

/* ══════════ 6 · Diagramme ══════════ */
const FARBEN=['#2C7A4B','#BE6F16','#3A6DA6','#7A4E8C','#A2432E','#3F7F7A','#8A7118','#556B2F'];
const svgAuf=(w,h,t)=>`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(t)}" style="display:block">`;
const leerBox=(box,t)=>{box.innerHTML=`<p class="muted small" style="padding:18px 0">${esc(t)}</p>`};

function chartLinien(box,o){
  const {serien=[],band,bands3,xTyp='datum',xLabel='',ereignisse=[],hoehe=290,bandLabel='Optimum'}=o;
  const W=Math.max(box.clientWidth||820,540),H=hoehe,ml=bands3?96:64,mr=20,mt=24,mb=42;
  const pts=serien.flatMap(s=>s.punkte);
  if(!pts.length)return leerBox(box,'Keine Werte für diese Auswahl.');
  const xs=pts.map(p=>p.x);
  let x0=Math.min(...xs),x1=Math.max(...xs);
  if(x0===x1){const d=xTyp==='datum'?6048e5:1;x0-=d;x1+=d}
  const sp=(x1-x0)*0.06;x0-=sp;x1+=sp;
  let y0,y1;
  if(bands3){y0=0;y1=3}
  else{
    const ys=pts.map(p=>p.y);
    y0=Math.min(...ys,band&&band[0]!=null?band[0]:Infinity);
    y1=Math.max(...ys,band&&band[1]!=null?band[1]:-Infinity);
    if(!isFinite(y0))y0=Math.min(...ys);if(!isFinite(y1))y1=Math.max(...ys);
    const pad=((y1-y0)||Math.abs(y1)||1)*0.14;y0-=pad;y1+=pad;if(y0>0&&y0<pad*3)y0=0;
  }
  const X=v=>ml+(v-x0)/((x1-x0)||1)*(W-ml-mr),Y=v=>mt+(1-(v-y0)/((y1-y0)||1))*(H-mt-mb);
  let s=svgAuf(W,H,xLabel||'Diagramm');
  if(bands3){
    s+=`<rect x="${ml}" y="${Y(3)}" width="${W-ml-mr}" height="${Y(2)-Y(3)}" fill="#FBEEDC"/>`;
    s+=`<rect x="${ml}" y="${Y(2)}" width="${W-ml-mr}" height="${Y(1)-Y(2)}" fill="#E3F0E1"/>`;
    s+=`<rect x="${ml}" y="${Y(1)}" width="${W-ml-mr}" height="${Y(0)-Y(1)}" fill="#FBEEDC"/>`;
    s+=`<text x="${ml-8}" y="${(Y(3)+Y(2))/2+4}" text-anchor="end" font-size="11" fill="#BE6F16">über Optimum</text>`;
    s+=`<text x="${ml-8}" y="${(Y(2)+Y(1))/2+4}" text-anchor="end" font-size="11" fill="#2C7A4B">im Optimum</text>`;
    s+=`<text x="${ml-8}" y="${(Y(1)+Y(0))/2+4}" text-anchor="end" font-size="11" fill="#BE6F16">unter Optimum</text>`;
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(2)}" y2="${Y(2)}" stroke="#A8CDA6"/><line x1="${ml}" x2="${W-mr}" y1="${Y(1)}" y2="${Y(1)}" stroke="#A8CDA6"/>`;
  }else{
    if(band){
      const b1=Y(band[1]!=null?band[1]:y1),b0=Y(band[0]!=null?band[0]:y0);
      s+=`<rect x="${ml}" y="${b1}" width="${W-ml-mr}" height="${Math.max(1,b0-b1)}" fill="#E3F0E1"/><text x="${W-mr-4}" y="${b1+13}" text-anchor="end" font-size="10.5" fill="#2C7A4B">${esc(bandLabel)}</text>`;
    }
    for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);
      s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#EDF1E9"/><text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#697A6C" font-family="JetBrains Mono,monospace">${nz(v)}</text>`}
  }
  for(const ev of ereignisse){
    const x=X(ev.x);if(x<ml||x>W-mr)continue;
    s+=`<line x1="${x}" x2="${x}" y1="${mt}" y2="${H-mb}" stroke="#141D17" stroke-dasharray="3 4" opacity=".5"/><text x="${x+3}" y="${mt+10}" font-size="10" fill="#141D17">${esc(String(ev.label).slice(0,20))}</text>`;
  }
  for(const se of serien){
    const p=[...se.punkte].sort((a,b)=>a.x-b.x);
    if(p.length>1&&se.linie!==false)s+=`<polyline fill="none" stroke="${se.farbe}" stroke-width="2" stroke-dasharray="${se.strich||''}" points="${p.map(q=>X(q.x)+','+Y(q.y)).join(' ')}"/>`;
    for(const q of p)s+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="4" fill="${se.farbe}"><title>${esc(se.name)} · ${esc(q.titel||q.label||'')}</title></circle>`;
  }
  const seen=new Set();
  for(const p of [...pts].sort((a,b)=>a.x-b.x)){
    if(!p.xtext||seen.has(p.xtext))continue;seen.add(p.xtext);
    s+=`<text x="${X(p.x)}" y="${H-mb+16}" text-anchor="middle" font-size="10.5" fill="#697A6C">${esc(p.xtext)}</text>`;
  }
  s+=`<text x="${(ml+W-mr)/2}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="#697A6C">${esc(xLabel)}</text>`;
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" stroke="#141D17"/>`;
  box.innerHTML=s+'</svg>';
}

/* Anteil im Optimum über die Zeit.
   Die Zeitachse spannt nur über die Erhebungen. Logbucheinträge ausserhalb
   werden am Rand vermerkt statt die Achse zu strecken – ein einzelner alter
   Eintrag drückte früher alle Balken an den Rand.
   Erhebungen am selben Tag (grün und gelb) werden nebeneinander gesetzt. */
function chartIndex(box,erh){
  const mitIdx=erh.filter(e=>e.index);
  if(!mitIdx.length)return leerBox(box,'Noch keine Erhebung mit auswertbaren Werten.');
  const W=Math.max(box.clientWidth||820,540),H=252,ml=52,mr=22,mt=30,mb=50;
  const zs=mitIdx.map(e=>+new Date(e.datum));
  let x0=Math.min(...zs),x1=Math.max(...zs);
  if(x0===x1){x0-=12096e5;x1+=12096e5}
  const sp=(x1-x0)*0.08;x0-=sp;x1+=sp;
  const X=v=>ml+(v-x0)/(x1-x0)*(W-ml-mr),Y=p=>mt+(1-p)*(H-mt-mb);
  let s=svgAuf(W,H,'Anteil der Nährstoffe im Optimum über die Zeit');
  for(let i=0;i<=4;i++){const p=i/4,y=Y(p);
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#EDF1E9"/><text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#697A6C">${p*100} %</text>`}
  let davor=0,danach=0;
  for(const ev of db.ereignisse){
    const t=+new Date(ev.datum);if(isNaN(t))continue;
    if(t<x0){davor++;continue}
    if(t>x1){danach++;continue}
    const x=X(t);
    s+=`<line x1="${x}" x2="${x}" y1="${mt}" y2="${H-mb}" stroke="#141D17" stroke-dasharray="3 4" opacity=".5"><title>${esc(ev.titel||ev.typ)} · ${fmt(ev.datum)}</title></line>`;
    s+=`<text x="${x+3}" y="${mt-8}" font-size="10" fill="#141D17">${esc(String(ev.titel||ev.typ).slice(0,18))}</text>`;
  }
  if(davor)s+=`<text x="${ml+2}" y="${mt-8}" font-size="10" fill="#697A6C">← ${davor} Eintrag${davor>1?'e':''} davor</text>`;
  if(danach)s+=`<text x="${W-mr-2}" y="${mt-8}" text-anchor="end" font-size="10" fill="#697A6C">${danach} Eintrag${danach>1?'e':''} danach →</text>`;
  /* gleiche Datumswerte auffächern */
  const proTag=new Map();
  mitIdx.forEach(e=>{const k=e.datum;if(!proTag.has(k))proTag.set(k,[]);proTag.get(k).push(e)});
  const bwBasis=Math.max(9,Math.min(40,(W-ml-mr)/Math.max(mitIdx.length,3)*0.55));
  if(mitIdx.length>1){
    const linie=[...proTag.entries()].map(([d,gr])=>[X(+new Date(d)),Y(mittel(gr.map(g=>g.index.anteil)))]);
    s+=`<polyline fill="none" stroke="#2C7A4B" stroke-width="1.5" opacity=".4" points="${linie.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
  }
  for(const [d,gruppe] of proTag){
    const n=gruppe.length,bw=n>1?Math.max(7,bwBasis/n-2):bwBasis;
    gruppe.forEach((e,i)=>{
      const mitte=X(+new Date(d)),off=(i-(n-1)/2)*(bw+2);
      const x=mitte+off,y=Y(e.index.anteil);
      const farbe=e.zustand==='gelb'?'#BE6F16':'#2C7A4B';
      s+=`<rect x="${x-bw/2}" y="${y}" width="${bw}" height="${Math.max(1,H-mb-y)}" rx="3" fill="${farbe}" opacity=".75"><title>Satz ${esc(e.satz)}${e.zustand?' ('+esc(e.zustand)+')':''} · ${fmt(e.datum)} · ${e.index.ok} von ${e.index.n} im Optimum${e.alter.woche!=null?` · rund ${nz(e.alter.woche,1)} Wochen alt`:''}</title></rect>`;
      s+=`<text x="${x}" y="${y-6}" text-anchor="middle" font-size="10.5" fill="#141D17" font-weight="500">${Math.round(e.index.anteil*100)}</text>`;
      s+=`<text x="${x}" y="${H-mb+15}" text-anchor="middle" font-size="9.5" fill="#697A6C">${esc(String(e.satz||''))}</text>`;
      if(n>1&&e.zustand)s+=`<text x="${x}" y="${H-mb+26}" text-anchor="middle" font-size="9" fill="#697A6C">${esc(e.zustand)}</text>`;
    });
    s+=`<text x="${X(+new Date(d))}" y="${H-mb+(n>1?37:26)}" text-anchor="middle" font-size="9.5" fill="#697A6C">${fmtK(d)}</text>`;
  }
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" stroke="#141D17"/>`;
  box.innerHTML=s+'</svg>';
}

function chartProfil(box,zeilen){
  if(!zeilen.length)return leerBox(box,'Keine gemeinsamen Parameter zum Vergleichen.');
  const W=Math.max(box.clientWidth||760,520),ml=124,mr=160,zh=24,H=zeilen.length*zh+34;
  const max=Math.max(0.12,...zeilen.map(z=>Math.abs(z.delta)));
  const mitte=ml+(W-ml-mr)/2,halb=(W-ml-mr)/2;
  let s=svgAuf(W,H,'Wirkungsprofil');
  s+=`<text x="${mitte-halb*0.5}" y="12" text-anchor="middle" font-size="10.5" fill="#BE6F16">weiter weg vom Optimum</text>`;
  s+=`<text x="${mitte+halb*0.5}" y="12" text-anchor="middle" font-size="10.5" fill="#2C7A4B">Richtung Optimum</text>`;
  zeilen.forEach((z,i)=>{
    const y=22+i*zh,len=Math.abs(z.delta)/max*halb*0.92,pos=z.delta>0;
    s+=`<text x="${ml-8}" y="${y+13}" text-anchor="end" font-size="11.5" fill="#141D17">${esc(NAME[z.k]||z.k)}</text>`;
    s+=`<rect x="${pos?mitte:mitte-len}" y="${y+3}" width="${Math.max(1.5,len)}" height="14" rx="3" fill="${pos?'#2C7A4B':'#BE6F16'}" opacity=".85"><title>${esc(NAME[z.k])} am ${esc(z.blatt)}blatt: ${nz(z.vor)} → ${nz(z.nach)} ${einheit(z.k)}</title></rect>`;
    s+=`<text x="${W-mr+8}" y="${y+14}" font-size="11" fill="#697A6C" font-family="JetBrains Mono,monospace">${nz(z.vor)} → ${nz(z.nach)}${istOk(z.stNach)?' ✓':''}</text>`;
  });
  s+=`<line x1="${mitte}" x2="${mitte}" y1="16" y2="${H-8}" stroke="#141D17" opacity=".5"/>`;
  box.innerHTML=s+'</svg>';
}

function chartSaetze(box,saetze){
  const mit=saetze.filter(s=>s.aussaat);
  if(!mit.length)return leerBox(box,'Noch kein Satz mit bekanntem oder ableitbarem Aussaatdatum.');
  const W=Math.max(box.clientWidth||820,540),ml=92,mr=24,zh=26,H=mit.length*zh+56;
  const heuteT=+new Date(heute());
  const alle=mit.flatMap(s=>[+new Date(s.aussaat),+new Date(s.ende)]).concat(heuteT);
  let x0=Math.min(...alle),x1=Math.max(...alle);
  const sp=(x1-x0)*0.05||6048e5;x0-=sp;x1+=sp;
  const X=v=>ml+(v-x0)/(x1-x0)*(W-ml-mr);
  let s=svgAuf(W,H,'Laufzeit der Sätze');
  for(const ev of db.ereignisse){
    const t=+new Date(ev.datum);if(isNaN(t))continue;
    const x=X(t);if(x<ml||x>W-mr)continue;
    s+=`<line x1="${x}" x2="${x}" y1="18" y2="${H-30}" stroke="#141D17" stroke-dasharray="3 4" opacity=".4"><title>${esc(ev.titel||ev.typ)} · ${fmt(ev.datum)}</title></line>`;
  }
  const xh=X(heuteT);
  if(xh>=ml&&xh<=W-mr)s+=`<line x1="${xh}" x2="${xh}" y1="18" y2="${H-30}" stroke="#A2432E" stroke-width="1.5"/><text x="${xh+4}" y="14" font-size="10.5" fill="#A2432E">heute</text>`;
  mit.forEach((z,i)=>{
    const y=22+i*zh,xa=X(+new Date(z.aussaat)),xe=X(+new Date(z.ende));
    s+=`<text x="${ml-8}" y="${y+13}" text-anchor="end" font-size="11.5" fill="#141D17" font-family="JetBrains Mono,monospace">${esc(z.id)}</text>`;
    s+=`<rect x="${xa}" y="${y+4}" width="${Math.max(3,xe-xa)}" height="13" rx="3" fill="${z.laufend?'#2C7A4B':'#DCE3D5'}" opacity="${z.laufend?.55:.9}"><title>${esc(z.id)}: ${fmt(z.aussaat)} bis etwa ${fmt(z.ende)}${z.laufend?` · heute Woche ${nz(z.woche,1)}`:''}</title></rect>`;
    for(const an of z.analysen){const x=X(+new Date(an.datum));
      s+=`<circle cx="${x}" cy="${y+10.5}" r="4.5" fill="#141D17"><title>Beprobung ${fmt(an.datum)} · Woche ${nz(an.woche,1)}</title></circle>`}
    for(const g of z.geplant){const x=X(+new Date(g.datum));
      s+=`<circle cx="${x}" cy="${y+10.5}" r="4.5" fill="none" stroke="#3A6DA6" stroke-width="1.6"><title>geplant ${fmt(g.datum)} · Woche ${nz(g.woche,1)}</title></circle>`}
  });
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${H-30}" y2="${H-30}" stroke="#141D17"/>`;
  for(let i=0;i<=4;i++){const t=x0+(x1-x0)*i/4;
    s+=`<text x="${X(t)}" y="${H-14}" text-anchor="middle" font-size="10.5" fill="#697A6C">${fmtK(new Date(t).toISOString().slice(0,10))}</text>`}
  box.innerHTML=s+'</svg>';
}

/* Alle Klickziele laufen über data-Attribute statt über zusammengesetzte
   onclick-Zeichenketten. Ein Apostroph in einem Logbuchtitel kann damit

 ['substrat','Substrat'],['giess','Giesswasser'],['logbuch','Logbuch'],['rundgang','Rundgang'],['planer','Planer'],['saetze','Sätze & Einstellungen']];

/* ── Bausteine ──────────────────────────────────────────── */
function balken(w,o,dez){
  if(!w||w.wert==null)return '<span class="muted">–</span>';
  if(w.unter)return `<span class="mono muted" title="Der Messwert lag unter der Nachweisgrenze des Labors. Er wird nicht bewertet.">&lt;${nz(w.wert,dez)}</span>`;
  const v=w.wert;
  if(!o)return `<span class="mono">${nz(v,dez)}</span>`;
  const lo=o[0]!=null?o[0]:0,hi=o[1]!=null?o[1]:lo*2||v*1.5;
  const t=toleranz();
  const min=Math.min(v,lo*(1-t))*0.92,max=Math.max(v,hi*(1+t))*1.08||1;
  const pos=x=>Math.max(0,Math.min(100,(x-min)/((max-min)||1)*100));
  const st=status(v,o,false);
  const kl=st==='ok'?'val-ok':istRand(st)?'val-rand':'val-off';
  return `<div class="balkenzeile"><span class="mono ${kl}" style="min-width:58px;text-align:right">${nz(v,dez)}</span>
    <div class="bar" style="flex:1" title="Optimum ${o[0]!=null?nz(o[0]):'offen'} bis ${o[1]!=null?nz(o[1]):'offen'} · ${STTEXT[st]||''}">
      <div class="tol" style="left:${pos(lo*(1-t))}%;width:${Math.max(1,pos(hi*(1+t))-pos(lo*(1-t)))}%"></div>
      <div class="opt" style="left:${pos(lo)}%;width:${Math.max(2,pos(hi)-pos(lo))}%"></div>
      <div class="mk" style="left:${pos(v)}%"></div></div></div>`;
}
const stPill=st=>st==null?'<span class="pill na">nicht bewertbar</span>'
  :`<span class="pill ${st==='ok'?'ok':istRand(st)?'rand':'off'}">${STTEXT[st]}</span>`;
/* Nährstoffstreifen: zeigt für jeden Kernnährstoff das massgebliche Blatt */
function streifen(e){
  const ks=kern();
  return `<div class="strip">${ks.map(k=>{
    const b=e.bew[k];
    if(!b||b.fehlt)return `<div class="sq na" title="${esc(NAME[k])}: ${esc(b&&b.grund||'nicht gemessen')}">${esc(kurz(k))}</div>`;
    const kl=b.ok?(b.rand?'rand':'ok'):'off';
    const pf=b.ok?'':(b.st==='tief'?'↓':'↑');
    const wt=b.werte.filter(x=>x.st!=null).map(x=>`${x.blattalter} ${nz(x.wert)}`).join(', ');
    return `<div class="sq ${kl}" title="${esc(NAME[k])} · ${esc(wt)} ${esc(einheit(k))} · beurteilt am ${esc(b.art==='beide'?'Jung- und Altblatt':b.art+'blatt')} (${esc(MOBIL[k]||'')}) · ${esc(b.ok?(b.rand?'knapp im Optimum':'im Optimum'):b.st==='tief'?'unter Optimum':'über Optimum')}">${esc(kurz(k))}${pf}</div>`;
  }).join('')}</div>`;
}
const befundHtml=f=>`<div class="finding ${f.schwere}"><h3>${esc(f.titel)}
    ${f.hypothese?'<span class="tag schaetz">Hypothese</span>':''}
    ${f.schwere==='hoch'?'<span class="pill al">dringend</span>':''}</h3>
  ${f.belege.map(b=>`<div class="beleg">${esc(b)}</div>`).join('')}

  <div style="margin-top:5px"><strong>Nächster Schritt:</strong> ${esc(f.tun)}</div>
