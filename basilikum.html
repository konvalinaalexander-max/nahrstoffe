/* Liefert ALLE Sätze. Sätze ohne ableitbares Aussaatdatum fielen früher aus
   der Liste – und damit auch aus der Maske, in der man es nachtragen würde. */
function saetzeListe(){
  const h=heute();
  return alleSaetze().map(id=>{
    const q=aussaatVon(id);
    const aus=q.datum,dauer=kulturdauer(id);
    const ende=aus?plus(aus,dauer*7):null;
    const analysen=db.analysen.filter(a=>a.satz===id&&a.typ==='blattsaft'&&a.datum)
      .map(a=>({datum:a.datum,woche:alter(a).woche}))
      .filter((v,i,arr)=>arr.findIndex(x=>x.datum===v.datum)===i)
      .sort((a,b)=>a.datum.localeCompare(b.datum));
    const geplant=(db.plan.geplant||[]).filter(g=>g.satz===id&&!g.erledigt)
      .map(g=>Object.assign({},g,{woche:aus?tage(aus,g.datum)/7:null}));
    return {id,aussaat:aus,quelle:q.quelle,plausibel:q.plausibel!==false,dauer,ende,
      woche:aus?tage(aus,h)/7:null,analysen,geplant,
      laufend:!!(aus&&ende&&aus<=h&&h<=ende),kuenftig:!!(aus&&aus>h),
      st:db.saetze[id]||{}};
  }).sort((a,b)=>{
    if(!a.aussaat&&!b.aussaat)return String(a.id).localeCompare(String(b.id));
    if(!a.aussaat)return -1;if(!b.aussaat)return 1;
    return b.aussaat.localeCompare(a.aussaat);
  });
}
let VORSCHLAEGE=[];
function vorschlaege(){
  const h=heute(),liste=saetzeListe(),out=[];
  const nahAn=(an,datum,tol)=>an.some(a=>Math.abs(tage(a.datum,datum))<=(tol||6));
  const geplantAn=(s,datum,tol)=>s.geplant.some(g=>Math.abs(tage(g.datum,datum))<=(tol||6));

  /* A · Wirkung einer Änderung prüfen – beantwortet die Leitfrage */
  const wirkung=new Map();
  for(const ev of db.ereignisse){
    if(!ev.datum||ev.datum>h||tage(ev.datum,h)>84)continue;
    const betroffen=ev.geltung==='saetze'&&ev.saetze&&ev.saetze.length?ev.saetze:null;
    for(const s of liste){
      if(betroffen&&betroffen.indexOf(s.id)<0)continue;
      if(!s.laufend||!s.aussaat)continue;
      if(ev.datum<s.aussaat)continue;
      if(s.analysen.some(a=>a.datum>=ev.datum))continue;
      const ziel=plus(ev.datum,17);
      if(s.ende&&ziel>s.ende)continue;
      const wann=ziel<h?h:ziel;
      if(geplantAn(s,wann))continue;
      const vorher=s.analysen.some(a=>a.datum<ev.datum);
      const eintrag={art:'wirkung',satz:s.id,datum:wann,woche:Math.round(tage(s.aussaat,wann)/7*10)/10,
        titel:`Wirkung von «${ev.titel||ev.typ}» in Satz ${s.id} prüfen`,
        warum:vorher?`Dieser Satz wurde vor der Änderung vom ${fmt(ev.datum)} beprobt, danach noch nicht. Eine zweite Probe macht den Vergleich möglich – das ist die wertvollste Beprobung, die ihr gerade machen könnt.`
          :`Seit der Änderung vom ${fmt(ev.datum)} gibt es für diesen Satz keine Analyse. Rund zwei bis drei Wochen danach ist die Wirkung im Blattsaft sichtbar.`,
        dringend:true,rang:vorher?0:1,evDatum:ev.datum};
      const alt=wirkung.get(s.id);
      if(!alt||eintrag.rang<alt.rang||(eintrag.rang===alt.rang&&ev.datum>alt.evDatum))wirkung.set(s.id,eintrag);
    }
  }
  out.push(...wirkung.values());

  /* B · Vergleichsgruppe vervollständigen */
  for(const ev of db.ereignisse){
    if(!ev.datum||ev.datum>h||tage(ev.datum,h)>84)continue;
    if(ev.geltung!=='saetze'||!ev.saetze||!ev.saetze.length)continue;
    const ohne=liste.filter(s=>s.laufend&&ev.saetze.indexOf(s.id)<0&&!s.analysen.some(a=>a.datum>=ev.datum));
    for(const s of ohne.slice(0,2)){
      if(geplantAn(s,h))continue;
      if(out.some(o=>o.satz===s.id))continue;
      out.push({art:'gruppe',satz:s.id,datum:h,woche:s.woche==null?null:Math.round(s.woche*10)/10,
        titel:`Satz ${s.id} als Vergleichsgruppe beproben`,
        warum:`«${ev.titel||ev.typ}» vom ${fmt(ev.datum)} betrifft diesen Satz nicht. Beprobt ihr ihn im selben Zeitraum wie die betroffenen, entsteht ein Vergleich im selben Haus, unter demselben Klima – der einzige, der Management von Alter und Jahreszeit trennt.`,
        dringend:true,rang:2});
    }
  }

  /* C · begleitete Sätze über ihre Kulturzeit */
  for(const id of (db.plan.begleitet||[])){
    const s=liste.find(x=>x.id===id);if(!s||!s.aussaat)continue;
    for(const w of db.plan.zielwochen){
      const d=plus(s.aussaat,Math.round(w*7));
      if(d<plus(h,-14))continue;
      if(nahAn(s.analysen,d)||geplantAn(s,d))continue;
      out.push({art:'begleiten',satz:id,datum:d,woche:w,
        titel:`Satz ${id} in Woche ${w} beproben`,
        warum:`Ihr begleitet diesen Satz über seine Kulturzeit. Woche ${w} ist am ${fmt(d)} erreicht. Erst ein mehrfach beprobter Satz zeigt, was mit einer Pflanze während der Kultur passiert.`,
        dringend:d<=plus(h,7)&&d>=plus(h,-14),rang:3});
    }
  }

  /* D · gleiches Alter über mehrere Sätze */
  const zw=db.plan.zielwochen[Math.floor(db.plan.zielwochen.length/2)]||4;
  for(const s of liste){
    if(!s.aussaat||(!s.laufend&&!s.kuenftig))continue;
    if((db.plan.begleitet||[]).indexOf(s.id)>=0)continue;
    const d=plus(s.aussaat,Math.round(zw*7));
    if(d<h)continue;
    if(nahAn(s.analysen,d)||geplantAn(s,d))continue;
    if(out.some(o=>o.satz===s.id&&o.art==='wirkung'))continue;
    out.push({art:'alter',satz:s.id,datum:d,woche:zw,
      titel:`Satz ${s.id} erreicht Woche ${zw} am ${fmt(d)}`,
      warum:'Wenn ihr jeden Satz im gleichen Alter beprobt, werden die Sätze untereinander vergleichbar – dann zeigt ein Unterschied wirklich das Management und nicht das Alter.',
      dringend:false,rang:4});
  }
  return out.sort((a,b)=>(a.rang-b.rang)||a.datum.localeCompare(b.datum));
}
const ARTNAME={wirkung:'Wirkung prüfen',gruppe:'Vergleichsgruppe',begleiten:'Satz begleiten',alter:'gleiches Alter'};

/* ── Satzpaare ────────────────────────────────────────────────────────────
   Das Beprobungsschema: alle zwei Wochen zwei Proben, ein Satz in Woche 2
   und einer in Woche 4. Je Satz entsteht ein Paar (Veränderung innerhalb
   eines Bestands), und alle Woche-2-Proben sind untereinander vergleichbar
   (gleiches Alter, das Alter fällt als Störgrösse weg). Die Zielwochen
   stehen in den Einstellungen; genommen werden die ersten beiden. */
const PAAR_TOLERANZ=4;   /* Tage: eine Probe gilt als «in Woche w», wenn sie so nah am Stichtag liegt */
function satzpaare(){
  const zw=(db.plan.zielwochen||[2,4]).slice().sort((a,b)=>a-b);
  const wochen=zw.length>=2?zw.slice(0,2):[2,4];
  const h=heute(),erh=erhebungen();
  const zeilen=saetzeListe().filter(s=>s.aussaat).map(s=>{
    const zellen=wochen.map(w=>{
      const stichtag=plus(s.aussaat,Math.round(w*7));
      const kand=erh.filter(e=>e.satz===s.id&&Math.abs(tage(e.datum,stichtag))<=PAAR_TOLERANZ)
        .sort((a,b)=>Math.abs(tage(a.datum,stichtag))-Math.abs(tage(b.datum,stichtag)));
      const e=kand[0]||null;
      const geplant=(db.plan.geplant||[]).find(g=>g.satz===s.id&&!g.erledigt&&Math.abs(tage(g.datum,stichtag))<=PAAR_TOLERANZ)||null;
      const zustand=e?'da':geplant?'geplant':stichtag<plus(h,-PAAR_TOLERANZ)?'verpasst':stichtag<=plus(h,PAAR_TOLERANZ)?'jetzt':'kommt';
      return {woche:w,stichtag,erhebung:e,geplant,zustand,abstand:e?tage(stichtag,e.datum):null};
    });
    return {satz:s.id,aussaat:s.aussaat,quelle:s.quelle,laufend:s.laufend,kuenftig:s.kuenftig,zellen,
      vollstaendig:zellen.every(z=>z.zustand==='da')};
  });
  /* Die nächste Einsendung: der nächste Stichtag ab heute, und dazu alles,
     was innerhalb weniger Tage denselben Termin hat. Bei einem Aussaat-
     rhythmus von zwei Wochen fallen Woche 2 des einen und Woche 4 des
     anderen Satzes auf denselben Tag. */
  const offen=[];
  for(const z of zeilen)for(const c of z.zellen)if(c.zustand==='jetzt'||c.zustand==='kommt'||c.zustand==='geplant')offen.push({satz:z.satz,woche:c.woche,stichtag:c.stichtag,geplant:!!c.geplant});
  offen.sort((a,b)=>a.stichtag.localeCompare(b.stichtag)||a.woche-b.woche);
  let naechste=null;
  if(offen.length){
    const erst=offen[0];
    const gruppe=offen.filter(o=>Math.abs(tage(o.stichtag,erst.stichtag))<=PAAR_TOLERANZ);
    /* je Woche nur ein Satz – der nächstliegende */
    const jeWoche=new Map();
    for(const o of gruppe)if(!jeWoche.has(o.woche))jeWoche.set(o.woche,o);
    naechste={datum:erst.stichtag,proben:[...jeWoche.values()].sort((a,b)=>a.woche-b.woche),
      vollstaendig:wochen.every(w=>jeWoche.has(w))};
  }
  return {wochen,zeilen,naechste};
}
AKTION.paarPlanen=()=>{
  const sp=satzpaare();
  if(!sp.naechste)return toast('Es steht kein Stichtag an – fehlen Aussaatdaten?');
  db.plan.geplant=db.plan.geplant||[];
  let n=0;
  for(const p of sp.naechste.proben){
    if(p.geplant)continue;
    db.plan.geplant.push({id:uid(),datum:p.stichtag,typ:'blattsaft',satz:p.satz,zweck:`Satzpaar: Woche ${p.woche}`,erledigt:false,analyseId:null});n++;
  }
  aend();render();
  toast(n?`${n} Probe${n>1?'n':''} eingeplant – ${fmt(sp.naechste.datum)}.`:'Beide sind schon eingeplant.');
};
/* Der Paarvergleich selbst ist eine Ansicht, die es schon gibt: Nährstoffe
   über die Kulturwoche, Linien je Satz. Hier nur der Sprung dorthin. */
AKTION.paarVergleich=()=>{nsAchse='woche';nsLinien='satz';setTab('naehrstoff')};
let plNeu=null;
const plFrisch=()=>({datum:heute(),typ:'blattsaft',satz:'',zweck:''});
function vPlaner(){
  const liste=saetzeListe(),h=heute();
  if(!plNeu)plNeu=plFrisch();
  const geplant=(db.plan.geplant||[]).slice().sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));
  const offen=geplant.filter(g=>!g.erledigt);
  const ohneDatum=liste.filter(s=>!s.aussaat);
  const unplaus=liste.filter(s=>s.aussaat&&!s.plausibel);
  const saetze=alleSaetze();
  nachRender=()=>chartSaetze(el('cGantt'),liste.filter(s=>s.aussaat).slice(0,14));

  let s='';
  if(ohneDatum.length||unplaus.length)s+=`<div class="note warn">
    ${ohneDatum.length?`<div><strong>${ohneDatum.length} Satz${ohneDatum.length>1?'/Sätze':''} ohne Aussaatdatum:</strong> ${ohneDatum.map(x=>esc(x.id)).join(', ')} – ohne Datum lässt sich kein Alter und kein Termin berechnen.</div>`:''}
    ${unplaus.length?`<div><strong>${unplaus.length} unplausibles Aussaatdatum:</strong> ${unplaus.map(x=>esc(x.id)).join(', ')} – aus der Kalenderwoche abgeleitet, aber mehr als ${nz(Math.max(20,(db.einst.dauerWinter||10)*2),0)} Wochen vor der ersten Probe.</div>`:''}
    <button style="margin-top:6px" data-tun="reiter" data-reiter="saetze">Unter «Sätze» nachtragen</button></div>`;

  /* Der Hauptweg ist das Eintragen von Hand: geplant wird ausserhalb der App. */
  s+=`<div class="card"><div class="hd"><div><h2>Geplante Proben (${offen.length} offen)</h2>
    <p class="sub">Was ihr vorhabt, von Hand eingetragen. Nach dem Einlesen der Analyse lässt sich der Termin abhaken und mit der Analyse verknüpfen.</p></div></div>
    <div class="wz" style="margin-bottom:12px">
      <div><label class="lab">Datum</label><input type="date" data-aend="plFeld" data-f="datum" value="${esc(plNeu.datum)}"></div>
      <div><label class="lab">Art</label><select data-aend="plFeld" data-f="typ">
        ${Object.keys(TYPNAME).map(t=>`<option value="${esc(t)}"${plNeu.typ===t?' selected':''}>${esc(TYPNAME[t])}</option>`).join('')}</select></div>
      <div><label class="lab">Satz</label><select data-aend="plFeld" data-f="satz"><option value="">–</option>
        ${saetze.map(x=>`<option${plNeu.satz===x?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div style="flex:1;min-width:190px"><label class="lab">Zweck</label>
        <input data-aend="plFeld" data-f="zweck" value="${esc(plNeu.zweck)}" placeholder="z.B. Wirkung des Säurewechsels" style="width:100%"></div>
      <div><label class="lab">&nbsp;</label><button class="primary" data-tun="plAnlegen">Anlegen</button></div>
    </div>`;
  s+=geplant.length?`<div class="scroll"><table><thead><tr><th>Datum</th><th>Art</th><th>Satz</th><th>Woche</th><th>Zweck</th><th>Status</th><th>Analyse</th><th></th></tr></thead><tbody>
    ${geplant.map(g=>{
      const st=liste.find(x=>x.id===g.satz),w=st&&st.aussaat?tage(st.aussaat,g.datum)/7:null;
      const faellig=!g.erledigt&&g.datum<=h;
      const an=g.analyseId?db.analysen.find(a=>a.id===g.analyseId):null;
      /* Analysen, die zeitlich und vom Typ her passen */
      const passend=db.analysen.filter(a=>a.typ===(g.typ||'blattsaft')&&a.datum&&
        Math.abs(tage(a.datum,g.datum))<=21&&(!g.satz||!a.satz||a.satz===g.satz));
      return `<tr><td class="mono">${fmt(g.datum)}</td>
      <td class="tiny">${esc(TYPNAME[g.typ||'blattsaft']||g.typ)}</td>
      <td class="mono">${esc(g.satz||'–')}</td>
      <td class="mono tiny">${w==null?'–':nz(w,1)}</td><td class="small">${esc(g.zweck||'')}</td>
      <td>${g.erledigt?'<span class="pill ok">erledigt</span>':faellig?'<span class="pill off">fällig</span>':'<span class="pill na">geplant</span>'}</td>
      <td>${an?`<button class="ghost" data-tun="detail" data-id="${esc(an.id)}">${fmt(an.datum)}${an.blattalter?' · '+esc(an.blattalter):''}</button>`
        :(passend.length?`<select data-aend="plAnalyse" data-id="${esc(g.id)}"><option value="">verknüpfen …</option>
          ${passend.slice(0,12).map(a=>`<option value="${esc(a.id)}">${fmt(a.datum)}${a.satz?' · '+esc(a.satz):''}${a.blattalter?' · '+esc(a.blattalter):''}</option>`).join('')}</select>`
          :'<span class="tiny muted">keine passende</span>')}</td>
      <td><button class="ghost" data-tun="planErledigt" data-id="${esc(g.id)}">${g.erledigt?'öffnen':'erledigt'}</button>
        <button class="ghost" data-tun="planWeg" data-id="${esc(g.id)}">entfernen</button></td></tr>`}).join('')}
    </tbody></table></div>`:'<p class="muted small">Noch nichts eingeplant.</p>';
  s+='</div>';

  /* Die automatischen Vorschlaege bleiben, aber zugeklappt: geplant wird
     ausserhalb der App, und als Hauptinhalt standen sie im Weg. */
  s+=`<div class="card"><details><summary>Automatische Vorschläge, nach Nutzen geordnet</summary>
    <p class="sub" style="margin-top:8px">Aus dem Logbuch und den Kulturdaten abgeleitet. Ganz oben steht, was eure Leitfrage beantwortet: die Wirkung einer Änderung.</p>
    ${(VORSCHLAEGE=vorschlaege()).length?VORSCHLAEGE.slice(0,8).map((x,i)=>`<div class="vorschlag ${x.dringend?'dringend':''}">

        <div style="text-align:right"><div class="wann">${fmt(x.datum)}</div>
          ${x.woche!=null?`<div class="tiny muted">Woche ${nz(x.woche,1)}</div>`:''}
          <button style="margin-top:6px" data-tun="planAus" data-i="${i}">einplanen</button></div>
      </div></div>`).join('')
    :'<p class="muted small" style="margin-top:8px">Nichts Offenes – alle laufenden Sätze sind beprobt oder eingeplant. Sobald du im Logbuch eine Änderung einträgst, erscheint hier die passende Beprobung dafür.</p>'}
    <div class="row" style="margin-top:12px">
      <div><label class="lab">Zielwochen für die Beprobung</label>
        <input value="${esc(db.plan.zielwochen.join(', '))}" size="14" data-aend="zielwochen" class="mono"></div>
      <div class="tiny muted" style="max-width:430px;padding-bottom:6px">Bei sechs bis acht Wochen Kulturzeit sind zwei bis drei Termine sinnvoll: einer früh, einer in der Mitte, einer kurz vor der Ernte. Die mittlere Zielwoche dient zugleich als Vergleichsalter zwischen den Sätzen.</div>
    </div></details></div>`;

  /* ── Satzpaare ── */
  {
    const sp=satzpaare();
    const [w1,w2]=sp.wochen;
    const ZUST={da:['ok','beprobt'],geplant:['na','geplant'],jetzt:['rand','jetzt fällig'],verpasst:['off','verpasst'],kommt:['na','kommt']};
    const zelle=c=>{
      const [cls,txt]=ZUST[c.zustand];
      if(c.erhebung){const e=c.erhebung;const idx=(e.index&&e.index.anteil!=null)?Math.round(e.index.anteil*100)+' %':'–';
        return `<td class="klick" data-tun="erhebung" data-id="${esc(e.id)}" title="Erhebung öffnen"><span class="pill ${cls}">${fmt(e.datum)}</span> <span class="mono tiny">${idx}</span>${
          c.abstand?`<span class="tiny muted"> (${c.abstand>0?'+':''}${c.abstand} T)</span>`:''}</td>`}
      return `<td><span class="pill ${cls}">${txt}</span> <span class="tiny muted mono">${fmt(c.stichtag)}</span></td>`;
    };
    /* Gezeigt wird, was läuft oder kommt, was eine Probe hat – und was in den
       letzten vier Monaten lief, damit ein «verpasst» nicht stillschweigend
       verschwindet. */
    const sichtbar=sp.zeilen.filter(z=>z.laufend||z.kuenftig||z.zellen.some(c=>c.erhebung)||z.aussaat>=plus(h,-120)).slice(0,12);
    s+=`<div class="card" id="paare"><div class="hd"><div><h2>Satzpaare · Woche ${w1} und Woche ${w2}</h2>
      <p class="sub">Alle zwei Wochen zwei Proben: ein Satz in Woche ${w1}, einer in Woche ${w2}. So bekommt jeder Satz ein Paar – und alle Woche-${w1}-Proben
      sind untereinander vergleichbar, weil das Alter gleich ist. Der Prozentwert ist die Kennzahl der Erhebung.</p></div>
      ${sp.zeilen.some(z=>z.vollstaendig)?`<button data-tun="paarVergleich" title="Nährstoffe über die Kulturwoche, Linien je Satz">Woche ${w1} gegen Woche ${w2}</button>`:''}</div>
      ${sp.naechste?`<div class="note ${sp.naechste.vollstaendig?'neutral':''}" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div><strong>Nächste Einsendung: ${fmt(sp.naechste.datum)}</strong> –
          ${sp.naechste.proben.map(p=>`Satz ${esc(p.satz)} in Woche ${p.woche}${p.geplant?' (eingeplant)':''}`).join(' und ')}.
          ${sp.naechste.vollstaendig?'':`<span class="muted">Nur eine der beiden Wochen – für die andere fehlt ein passender Satz oder sein Aussaatdatum.</span>`}</div>
        ${sp.naechste.proben.some(p=>!p.geplant)?`<button class="primary" data-tun="paarPlanen">Einplanen</button>`:''}</div>`
      :`<p class="muted small">${sp.zeilen.length?'Kein Stichtag in Sicht: die bekannten Sätze sind abgeschlossen. Sobald ein neuer Satz mit Aussaatdatum angelegt ist, steht hier die nächste Einsendung.'
        :`Kein Stichtag in Sicht – ohne Aussaatdatum lässt sich keine Woche ${w1} und keine Woche ${w2} berechnen.`}</p>`}
      ${sichtbar.length?`<div class="scroll"><table><thead><tr><th>Satz</th><th>Aussaat</th><th>Woche ${w1}</th><th>Woche ${w2}</th></tr></thead><tbody>
        ${sichtbar.map(z=>`<tr><td class="mono"><strong>${esc(z.satz)}</strong>${z.laufend?'':z.kuenftig?' <span class="tiny muted">kommt</span>':' <span class="tiny muted">vorbei</span>'}</td>
          <td class="mono tiny">${fmt(z.aussaat)}${z.quelle==='abgeleitet'?' <span class="tag schaetz">geschätzt</span>':''}</td>${z.zellen.map(zelle).join('')}</tr>`).join('')}
      </tbody></table></div>
      <p class="tiny muted" style="margin-top:8px">Eine Probe zählt zu einer Woche, wenn sie höchstens ${PAAR_TOLERANZ} Tage vom Stichtag entfernt liegt; der Abstand steht in Klammern.
      Die Zielwochen stehen unter «Sätze &amp; Einstellungen» (${esc((db.plan.zielwochen||[]).join(', '))}).</p>`
      :`<p class="muted small">${sp.zeilen.length?'Alle Sätze mit Aussaatdatum liegen länger zurück, und keiner hatte eine Probe nahe an Woche '+w1+' oder '+w2+'.':'Noch kein Satz mit Aussaatdatum.'}</p>`}</div>`;
  }

  s+=`<div class="card"><div class="hd"><div><h2>Was gerade im Haus steht</h2>
      <p class="sub">Gefüllte Punkte sind erfolgte Beprobungen, offene sind geplante. Gestrichelte Linien sind Einträge aus dem Logbuch.</p></div>
      <button class="primary" data-tun="satzNeu">Satz anlegen</button></div>
    <div id="cGantt" class="diagramm"></div>
    <div class="scroll" style="margin-top:14px"><table><thead><tr><th>Satz</th><th>Aussaat</th><th>heute</th><th>Ernte etwa</th><th>Beprobt</th><th>Begleiten</th></tr></thead><tbody>
    ${liste.map(x=>`<tr><td class="mono">${esc(x.id)}</td>
      <td class="mono tiny">${x.aussaat?fmt(x.aussaat):'<span class="val-off">fehlt</span>'} ${x.aussaat&&x.quelle==='abgeleitet'?`<span class="tag ${x.plausibel?'schaetz':'warn'}">${x.plausibel?'geschätzt':'unplausibel'}</span>`:''}</td>
      <td>${!x.aussaat?'<span class="pill na">unbekannt</span>':x.laufend?`<span class="pill ok">Woche ${nz(x.woche,1)}</span>`:x.kuenftig?'<span class="pill na">noch nicht</span>':'<span class="pill na">abgeschlossen</span>'}</td>
      <td class="mono tiny">${x.ende?fmt(x.ende):'–'}</td>
      <td class="small">${x.analysen.length?x.analysen.map(a=>'W'+nz(a.woche,0)).join(', '):'–'}</td>
      <td><span class="chip ${(db.plan.begleitet||[]).indexOf(x.id)>=0?'on':''}" data-tun="begleiten" data-satz="${esc(x.id)}">begleiten</span></td></tr>`).join('')}
    </tbody></table></div>
    ${liste.length?'':'<p class="muted small">Noch keine Sätze. Sie entstehen automatisch beim Einlesen einer Analyse, oder du legst sie hier an.</p>'}
  </div>`;
  return s;
}
AKTION.plFeld=(d,ev)=>{plNeu[d.f]=ev.target.value};
AKTION.plAnlegen=()=>{
  if(!plNeu.datum)return toast('Datum fehlt.');
  db.plan.geplant=db.plan.geplant||[];
  db.plan.geplant.push({id:uid(),datum:plNeu.datum,typ:plNeu.typ||'blattsaft',satz:plNeu.satz||null,
    zweck:(plNeu.zweck||'').trim()||null,erledigt:false,analyseId:null});
  const merk={typ:plNeu.typ,satz:plNeu.satz};
  plNeu=Object.assign(plFrisch(),merk);
  aend();render();toast('Eingeplant.');
};
AKTION.plAnalyse=(d,ev)=>{
  const g=(db.plan.geplant||[]).find(x=>x.id===d.id);if(!g)return;
  const id=ev.target.value;
  if(!id)return;
  g.analyseId=id;g.erledigt=true;
  aend();render();toast('Verknüpft und als erledigt abgehakt.');
};
AKTION.planAus=d=>{
  const x=VORSCHLAEGE[+d.i];if(!x)return;
  db.plan.geplant=db.plan.geplant||[];
  db.plan.geplant.push({id:uid(),satz:x.satz,datum:x.datum,typ:'blattsaft',zweck:x.titel,
    erledigt:false,analyseId:null});
  aend();render();toast('Eingeplant.');
};
AKTION.begleiten=d=>{
  db.plan.begleitet=db.plan.begleitet||[];
  const i=db.plan.begleitet.indexOf(d.satz);
  i<0?db.plan.begleitet.push(d.satz):db.plan.begleitet.splice(i,1);
  aend();render();
};
AKTION.zielwochen=(d,ev)=>{
  const w=ev.target.value.split(/[,;\s]+/).map(toNum).filter(x=>x!=null&&x>0&&x<30).sort((a,b)=>a-b);
  if(w.length){db.plan.zielwochen=w;aend();render()}else toast('Bitte Wochen als Zahlen eintragen, z.B. 2, 4, 6.');
};
AKTION.planErledigt=d=>{const g=db.plan.geplant.find(x=>x.id===d.id);if(g){g.erledigt=!g.erledigt;aend();render()}};
AKTION.planWeg=d=>{db.plan.geplant=db.plan.geplant.filter(x=>x.id!==d.id);aend();render()};

    <div class="row" style="margin-top:14px">
      <div><label class="lab">Vorgabe Kulturdauer Sommer (Wochen)</label><input class="mono" size="5" value="${esc(S.dauerSommer)}" data-aend="einst" data-k="dauerSommer"></div>

  <div class="card"><div class="hd"><div><h2>Welche Nährstoffe zählen zur Kennzahl</h2>
    <p class="sub">Die Kennzahl «Anteil im Optimum» gewichtet alle gewählten Nährstoffe gleich. Damit das trägt, müssen es sinnvoll ausgewählte sein – keine Dubletten und keine Ionen, für die es gar kein Ziel gibt.</p></div></div>
    <div class="row" style="gap:6px">
    ${KERN_WAEHLBAR.map(k=>`<span class="chip ${kern().indexOf(k)>=0?'on':''}" data-tun="kernUm" data-k="${esc(k)}">${esc(NAME[k]||k)}</span>`).join('')}

      <strong>Vorgabe und Begründung.</strong> <em>Stickstoff gesamt</em> ist draussen, weil Nitrat denselben Nährstoff misst und der aussagekräftigere Sofortvorrat ist – beide zu zählen würde Stickstoff doppelt gewichten und Bor einfach.
      <em>Natrium</em> und <em>Chlorid</em> sind draussen, weil sie Ballastionen sind: sie werden nie zugedüngt, es gibt keinen anzustrebenden Sollwert, und tiefe Werte sind im Kreislauf der erwünschte Zustand. Sie erscheinen weiterhin als eigener Befund, wenn sie sich anreichern.

  <div class="card"><div class="hd"><div><h2>Schwellenwerte der Regeln</h2>

    <div class="row">
      <div><label class="lab">Verlagerung jung/alt ab</label><input class="mono" size="5" value="${esc(S.verlagerung)}" data-aend="einst" data-k="verlagerung">

  <div class="card"><div class="hd"><div><h2>Richtwerte für das Substrat</h2>
    <p class="sub">Labor Ins liefert zu Substratproben <strong>keine</strong> Optimum-Bereiche. Diese Zahlen sind Orientierungswerte für Topfkultur und damit ebenfalls gesetzte Annahmen. Sie entscheiden nur über die Einordnung «Angebot knapp oder ausreichend» im Reiter «Substrat &amp; Wasser», nie über einen Messwert.</p></div></div>

AKTION.einst=(d,ev)=>{const n=toNum(ev.target.value);if(n!=null){db.einst[d.k]=n;aend();render()}else toast('Bitte eine Zahl eintragen.')};
AKTION.prodFeld=(d,ev)=>{
  const pr=db.produkte[d.k];if(!pr)return;
  if(d.f==='dichte'){
    const t=String(ev.target.value).trim();
    if(t===''){pr.dichte=null}
    else{const n=toNum(t);if(n==null||n<=0)return toast('Die Dichte muss eine Zahl grösser als null sein.');pr.dichte=n}
  }else pr[d.f]=ev.target.value;
  aend();render();
};
AKTION.prodGehalt=(d,ev)=>{
  const pr=db.produkte[d.k];if(!pr)return;

  if(n==null||n<0||n>100)return toast('Ein Gehalt ist ein Anteil in Prozent – zwischen 0 und 100.');
  pr.gehalt[d.e]=n;aend();render();
};
AKTION.prodDazu=(d,ev)=>{

/* ══════════ 17 · Sichern und Laden ══════════
   Die Anwendung schreibt sich selbst neu. Beim Sichern entsteht keine
   getrennte Datenablage, sondern eine vollständige HTML-Datei: dasselbe
   Werkzeug, mit dem Bestand darin. Wer sie bekommt, öffnet sie doppelt und
   arbeitet weiter - ohne zweite Datei, ohne Hochladeschritt.

   Warum als Selbstabbild und nicht durch Nachlesen der eigenen Datei: aus
   einer lokal geöffneten Seite heraus darf keine Datei gelesen werden
   (fetch auf file:// ist in Firefox seit Jahren gesperrt), und ein Server
   ist ausdrücklich nicht gewünscht. Das Abbild wird beim Start genommen,
   bevor irgendetwas gezeichnet ist - so enthält es nur das Gerüst und nicht
   den halb aufgebauten Bildschirm des Augenblicks. */
let SEITE_ROH=null;
function seiteMerken(){
  const b=el('datenblock');
  /* Der Block wird geleert, bevor das Abbild entsteht: sonst schleppte jede
     Sicherung den vorigen Bestand ein zweites Mal mit. */
  if(b)b.textContent='null';
  try{SEITE_ROH='<!doctype html>\n'+document.documentElement.outerHTML}catch(e){SEITE_ROH=null}
}
function datenAusSeite(){
  const b=el('datenblock');
  if(!b)return null;
  const t=(b.textContent||'').trim();
  if(!t||t==='null')return null;
  try{return JSON.parse(t)}catch(e){return {__kaputt:String(e&&e.message||e)}}
}
/* Der eingesetzte Text darf die Seite nicht sprengen: ein «<» in einem
   Satznamen könnte sonst das Skript-Ende vortäuschen. \u003c ist im JSON
   dasselbe Zeichen und beim Einlesen wieder ein «<». */
function seiteMitDaten(){
  if(!SEITE_ROH)return null;
  const j=JSON.stringify(db).replace(/</g,'\\u003c');
  let getroffen=false;
  const raus=SEITE_ROH.replace(/(<script[^>]*id="datenblock"[^>]*>)[\s\S]*?(<\/script>)/,
    (m,a,b)=>{getroffen=true;return a+j+b});
  return getroffen?raus:null;
}
AKTION.sichern=()=>{if(ONLINE.an){if(dirty)sichernOnline();else toast('Wird von selbst gesichert – hier gibt es nichts zu drücken.')}else sichern()};
AKTION.kopie=()=>sichern();
AKTION.sichernDaten=()=>sichernJson();
AKTION.dateiOeffnen=()=>el('fileJson').click();
function stempel(){return new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}
function herunterladen(text,name,typ){
  const blob=new Blob([text],{type:typ});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return blob.size;
}
function sichern(){
  const html=seiteMitDaten();
  if(!html){
    toast('Die Seite konnte sich selbst nicht schreiben – ich sichere stattdessen die Daten als JSON.');
    return sichernJson();
  }
  db.version++;db.gespeichert=new Date().toISOString();
  const gr=herunterladen(html,`basilikum_${stempel()}.html`,'text/html');
  dirty=false;render();
  toast(`Gesichert: eine HTML-Datei mit allem darin (rund ${mb(gr)}). Diese eine Datei genügt.`);
}
function sichernJson(){
  db.version++;db.gespeichert=new Date().toISOString();
  herunterladen(JSON.stringify(db,null,1),`basilikum-daten_${stempel()}.json`,'application/json');
  dirty=false;render();
  toast('Nur die Daten gesichert. Zum Weitergeben ist die HTML-Datei der bequemere Weg.');
}
/* Beim Öffnen wird beides angenommen: eine reine Datendatei und eine
   gesicherte HTML-Datei. Aus der HTML wird nur der Datenblock gelesen, nicht
   das Skript - fremder Programmcode wird nie ausgeführt. */
function datenAusText(text,name){
  if(/^\s*[{[]/.test(text)){
    try{return JSON.parse(text)}catch(e){return {__fehler:'Diese Datei ist kein gültiges JSON.'}}
  }
  const m=text.match(/<script[^>]*id="datenblock"[^>]*>([\s\S]*?)<\/script>/);
  if(!m)return {__fehler:'In dieser HTML-Datei steckt kein Datenblock. Stammt sie aus einer älteren Fassung, die nur JSON gesichert hat?'};
  const t=m[1].trim();
  if(!t||t==='null')return {__fehler:'Diese HTML-Datei ist das leere Werkzeug – es sind keine Daten darin gesichert.'};
  try{return JSON.parse(t)}catch(e){return {__fehler:'Der Datenblock in dieser Datei ist beschädigt: '+(e&&e.message||e)}}
}
async function laden(file){
  const roh=datenAusText(await file.text(),file.name);
  if(roh&&roh.__fehler)return toast(roh.__fehler);
  if(!roh||!Array.isArray(roh.analysen))return toast('Diese Datei sieht nicht nach einer Sicherung dieses Werkzeugs aus.');
  if(dirty&&!confirm('Es gibt ungesicherte Änderungen. Trotzdem laden?'))return;
  let erg;
  try{erg=migriere(roh)}
  catch(e){return toast('Die Datei liess sich nicht übernehmen: '+e.message)}
  db=erg.db;ueParams=null;dirty=erg.von<4;
  if(ONLINE.an){aend();toast('Eingelesen – wird gleich auf den Server geschrieben.')}
  render();
  if(erg.von<4&&erg.notizen.length){
    dialog('Ältere Sicherung übernommen',
      `<p>Die Datei war im Format ${erg.von}, dieses Werkzeug arbeitet mit Format ${leer().schema}. Alles wurde übernommen. Was dabei angepasst wurde:</p>
       <ul style="margin:0 0 12px;padding-left:20px">${erg.notizen.map(n=>`<li style="margin-bottom:6px">${esc(n)}</li>`).join('')}</ul>
       <div class="note neutral">Deine alte Datei bleibt unverändert liegen. Erst wenn du hier sicherst, entsteht eine neue Datei im neuen Format – die alte kannst du als Sicherheitskopie behalten.</div>
       <p class="small">${db.analysen.length} Analysen · ${db.ereignisse.length} Logbucheinträge · ${alleSaetze().length} Sätze geladen.</p>`,
      `<button class="primary" data-tun="dlgZu">Verstanden</button>`);
  }else toast(`Geladen: ${db.analysen.length} Analysen, ${alleSaetze().length} Sätze.`);
}

/* ══════════ 17a · Persönliche Ansicht ══════════
   Was alle angeht, liegt im Bestand (Zuordnungen, Einstellungen, Daten).
   Was nur mich angeht – welche Nährstoffe ich gerade sehe, welcher Reiter
   offen war, ob ich das Wesentliche oder alles sehen will –, bleibt auf
   diesem Gerät. Das ist der einzige Gebrauch des Browserspeichers in der
   Büro-Ansicht; der Bestand liegt nie dort. */
const ANSICHT_SCHLUESSEL='basilikum.ansicht';
function ansichtMerken(){
  try{localStorage.setItem(ANSICHT_SCHLUESSEL,JSON.stringify({tab,wesentlich,
    nsWahl,nsAchse,nsSkala,nsLinien,nsBlatt,nsLog,
    vlPaar,vlBlatt,vlWasser,vlSkala,vlTank,vlLog,vlEtage,vlLinien,
    gwWahl,gwSkala,gwLinien,gwLog,tkStelle,tkLinien,tkBeigaben,ueParams,ueLinien,ueLog,beigabenModus,mittelAus:[...mittelAus]}))}catch(e){}
}
function ansichtLaden(){
  let a=null;try{a=JSON.parse(localStorage.getItem(ANSICHT_SCHLUESSEL)||'null')}catch(e){a=null}
  if(!a||typeof a!=='object')return;
  const liste=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):null;
  const wort=(v,erlaubt)=>erlaubt.includes(v)?v:undefined;
  if(TABS.some(([k])=>k===a.tab))tab=a.tab;
  wesentlich=!!a.wesentlich;
  if(liste(a.nsWahl)&&a.nsWahl.length)nsWahl=liste(a.nsWahl);
  nsAchse=wort(a.nsAchse,['datum','woche'])||nsAchse;nsSkala=wort(a.nsSkala,['auto','lage','wert'])||nsSkala;
  nsLinien=wort(a.nsLinien,['aus','satz','alle'])||nsLinien;nsBlatt=wort(a.nsBlatt,['beide','jung','alt','misch'])||nsBlatt;
  if(typeof a.nsLog==='boolean')nsLog=a.nsLog;
  if(typeof a.vlPaar==='string')vlPaar=a.vlPaar;
  if(liste(a.vlBlatt))vlBlatt=liste(a.vlBlatt);if(liste(a.vlWasser))vlWasser=liste(a.vlWasser);
  vlSkala=wort(a.vlSkala,['lage','wert'])||vlSkala;vlEtage=wort(a.vlEtage,['beide','jung','alt','misch'])||vlEtage;vlLinien=wort(a.vlLinien,['keine','reihe'])||vlLinien;
  if(typeof a.vlTank==='boolean')vlTank=a.vlTank;if(typeof a.vlLog==='boolean')vlLog=a.vlLog;
  if(liste(a.gwWahl)&&a.gwWahl.length)gwWahl=liste(a.gwWahl);
  gwSkala=wort(a.gwSkala,['auto','rel','wert'])||gwSkala;gwLinien=wort(a.gwLinien,['aus','stelle','alle'])||gwLinien;
  if(typeof a.gwLog==='boolean')gwLog=a.gwLog;
  if(typeof a.tkStelle==='string')tkStelle=a.tkStelle;tkLinien=wort(a.tkLinien,['keine','reihe'])||tkLinien;
  if(typeof a.tkBeigaben==='boolean')tkBeigaben=a.tkBeigaben;
  if(liste(a.ueParams)&&a.ueParams.length)ueParams=liste(a.ueParams);
  ueLinien=wort(a.ueLinien,['aus','satz','alle'])||ueLinien;if(typeof a.ueLog==='boolean')ueLog=a.ueLog;
  beigabenModus=wort(a.beigabenModus,['mittel','auswahl','aus'])||beigabenModus;
  if(liste(a.mittelAus))mittelAus=new Set(liste(a.mittelAus));
}
/* Wesentlich oder alles: der eine Schalter, mit dem man vor einem Chef die
   Tabellen und Vorbehalte wegnimmt und nur das Diagramm stehen lässt –
   und danach alles wieder hat. */
let wesentlich=false;
AKTION.wesentlich=()=>{wesentlich=!wesentlich;document.body.classList.toggle('wesentlich',wesentlich);ansichtMerken();render()};

/* ══════════ 17a2 · QR-Code zur Maske ══════════
   Hinten kommt man per QR-Code auf die Maske – ausgedruckt am Tank. Die
   Bibliothek (qrcode-generator, MIT) kommt wie pdf.js von cdnjs, aber erst,
   wenn jemand den Code öffnet; die Prüfsumme sorgt dafür, dass genau diese
   Datei läuft und keine andere. Gezeichnet wird selbst, als SVG: scharf in
   jeder Grösse, auch auf dem Drucker. */
const QR_SKRIPT='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const QR_PRUEF='sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==';
const maskeAdresse=()=>location.origin+'/maske';
function qrLaden(){
  return new Promise((ok,nein)=>{
    if(typeof window.qrcode==='function')return ok();
    const s=document.createElement('script');
    s.src=QR_SKRIPT;s.integrity=QR_PRUEF;s.crossOrigin='anonymous';s.referrerPolicy='no-referrer';
    s.onload=()=>typeof window.qrcode==='function'?ok():nein(new Error('QR-Bibliothek unvollständig'));
    s.onerror=()=>nein(new Error('QR-Bibliothek nicht erreichbar'));
    document.head.appendChild(s);
  });
}
function qrSvg(text,modul){
  const q=window.qrcode(0,'M');q.addData(text);q.make();
  const n=q.getModuleCount(),rand=4,g=(n+2*rand)*modul;
  let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${(c+rand)*modul} ${(r+rand)*modul}h${modul}v${modul}h-${modul}z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${g}" height="${g}" viewBox="0 0 ${g} ${g}" shape-rendering="crispEdges" role="img" aria-label="QR-Code: ${esc(text)}"><rect width="${g}" height="${g}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
AKTION.qr=async()=>{
  const url=maskeAdresse();
  try{await qrLaden()}catch(e){
    return dialog('QR-Code zur Maske',`<p class="small">Die QR-Bibliothek liess sich nicht laden (${esc(e.message)}). Die Adresse zum Abtippen:</p>
      <p class="mono" style="font-size:20px">${esc(url)}</p>`,'<button data-tun="dlgZu">Schliessen</button>');
  }
  dialog('QR-Code zur Maske',
    `<div style="text-align:center"><div id="qrBild" style="display:inline-block;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff">${qrSvg(url,8)}</div>
      <p class="mono" style="font-size:17px;margin:10px 0 2px">${esc(url)}</p>
      <p class="small muted" style="max-width:52ch;margin:6px auto 0">Ausdrucken und an den Tank hängen. Wer ihn mit dem Handy scannt, kommt direkt in die Eingabemaske – dort nur den Namen eintippen, kein Passwort.
      Die Maske hat keinen Link hierher ins Dashboard.</p></div>`,
    `<button class="primary" data-tun="qrDruck">Drucken</button><button data-tun="qrBildSpeichern">Als Bild speichern</button><button data-tun="dlgZu">Schliessen</button>`);
};
/* Drucken: nur das Blatt mit dem Code, gross, mit Titel und Adresse. */
AKTION.qrDruck=()=>{
  const url=maskeAdresse();
  let b=el('qrDruck');if(b)b.remove();
  b=document.createElement('div');b.id='qrDruck';
  b.innerHTML=`<h1>Basilikum · Messen und Beigaben</h1><div class="qr">${qrSvg(url,10)}</div><p>${esc(url)}</p><p class="klein">Scannen, Namen eintippen, eintragen.</p>`;
  document.body.appendChild(b);document.body.classList.add('druckQr');
  const weg=()=>{document.body.classList.remove('druckQr');const x=el('qrDruck');if(x)x.remove();window.removeEventListener('afterprint',weg)};
  window.addEventListener('afterprint',weg);
  setTimeout(()=>{window.print();setTimeout(weg,1500)},50);
};
AKTION.qrBildSpeichern=()=>{
  const blob=new Blob([qrSvg(maskeAdresse(),10)],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='basilikum-maske-qr.svg';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
};

/* ══════════ 17b · Online ══════════
   Läuft die Seite von einem Server (http oder https statt file), holt sie
   den Bestand von dort und schreibt Änderungen nach kurzer Ruhe zurück.
   Vom Ordner geöffnet ändert sich nichts – dann gilt weiter der Datei-Modus.

   Gleichzeitigkeit: jeder Schreibvorgang trägt die Version, die er geladen
   hat. Stimmt sie nicht mehr – jemand anders war schneller –, holt die App
   den fremden Stand, vereinigt die Listen nach Kennung und schreibt noch
   einmal. Messungen und Beigaben vom Handy kommen dabei immer mit, weil sie
   nur angehängt, nie ersetzt werden. */
const ONLINE={an:false,version:0,geaendert:null,von:null,zustand:'aus',fehler:null,laeuft:false,nochmal:false,zeitgeber:null,abfrage:null};
const LISTEN=['analysen','ereignisse','messungen','fotos','rundgaenge'];
function onlineStand(){
  if(!ONLINE.an)return dirty?'ungesicherte Änderungen':(db.gespeichert?'gesichert '+new Date(db.gespeichert).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'');
  const wann=ONLINE.geaendert?new Date(ONLINE.geaendert).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  if(ONLINE.zustand==='sichert')return 'wird gesichert …';
  if(ONLINE.zustand==='wartet')return 'Änderung – wird gleich gesichert';
  if(ONLINE.zustand==='fehler')return 'nicht erreichbar – Änderungen warten'+(ONLINE.fehler?' ('+ONLINE.fehler+')':'');
  return 'online · gesichert '+wann+(ONLINE.von&&ONLINE.von!=='admin'?' · zuletzt von «'+ONLINE.von+'»':'');
}
function kopfStand(){
  const st=el('stand');if(st)st.textContent=onlineStand();
  /* Online ist es eine Webseite: kein Sichern-Knopf, kein Datei-Knopf. Was
     eingetragen ist, ist eingetragen. Sicherung einspielen und Kopie holen
     stehen unter «Sätze & Einstellungen», wo sie hingehören. */
  const link=el('erfassenLink'),kopie=el('knopfKopie'),sich=el('knopfSichern'),oeff=el('knopfOeffnen'),qr=el('knopfQr');
  if(link)link.hidden=!ONLINE.an;
  if(qr)qr.hidden=!ONLINE.an;
  if(kopie)kopie.hidden=true;
  if(sich)sich.hidden=ONLINE.an;
  if(oeff)oeff.hidden=ONLINE.an;
}
async function onlineStart(){
  if(!/^https?:$/.test(location.protocol))return false;
  let r;
  try{r=await fetch('/api/bestand',{credentials:'same-origin',cache:'no-store'})}catch(e){return false}
  if(!r.ok)return false;
  let j;try{j=await r.json()}catch(e){return false}
  if(!j||typeof j.version!=='number')return false;
  ONLINE.an=true;ONLINE.version=j.version;ONLINE.geaendert=j.geaendert;ONLINE.von=j.von;ONLINE.zustand='gesichert';
  let notizen=[];
  if(j.db&&Array.isArray(j.db.analysen)){
    try{const erg=migriere(j.db);db=erg.db;notizen=erg.von<leer().schema?erg.notizen:[]}
    catch(e){ONLINE.an=false;return false}
  }else db=leer();
  dirty=false;
  ONLINE.abfrage=setInterval(onlineAbfragen,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)onlineAbfragen()});
  return {notizen};
}
function onlinePlanen(){
  clearTimeout(ONLINE.zeitgeber);
  if(ONLINE.laeuft){ONLINE.nochmal=true;return}
  ONLINE.zustand='wartet';kopfStand();
  ONLINE.zeitgeber=setTimeout(sichernOnline,1500);
}
/* Zwei Stände vereinigen: die Listen nach Kennung, alles Übrige aus dem
   eigenen Stand. Was der andere hat und ich nicht, kommt dazu – auch dann,
   wenn ich es gerade gelöscht hatte. Das ist selten und wird gesagt. */
function vereinigen(mein,fremd){
  const out=mein;let dazu=0;
  if(!fremd||typeof fremd!=='object')return {db:out,dazu};
  for(const k of LISTEN){
    const m=Array.isArray(out[k])?out[k]:(out[k]=[]),f=Array.isArray(fremd[k])?fremd[k]:[];
    const ids=new Set(m.map(x=>x&&x.id));
    for(const x of f)if(x&&x.id&&!ids.has(x.id)){m.push(x);ids.add(x.id);dazu++}
  }
  if(fremd.plan&&Array.isArray(fremd.plan.geplant)){
    out.plan=out.plan||{};out.plan.geplant=out.plan.geplant||[];
    const ids=new Set(out.plan.geplant.map(x=>x&&x.id));
    for(const x of fremd.plan.geplant)if(x&&x.id&&!ids.has(x.id)){out.plan.geplant.push(x);dazu++}
  }
  return {db:out,dazu};
}
async function sichernOnline(){
  if(!ONLINE.an||ONLINE.laeuft)return;
  clearTimeout(ONLINE.zeitgeber);
  ONLINE.laeuft=true;ONLINE.nochmal=false;ONLINE.zustand='sichert';kopfStand();
  try{
    const put=()=>fetch('/api/bestand',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({basisVersion:ONLINE.version,db})});
    let r=await put();
    if(r.status===409){
      const j=await r.json();
      const v=vereinigen(db,j.db);
      db=v.db;ONLINE.version=j.version;
      r=await put();
      if(v.dazu)toast(`Gleichzeitig gespeichert${j.von?' von «'+j.von+'»':''}: ${v.dazu} Eintrag${v.dazu>1?'e':''} aus dem anderen Stand übernommen – was du gerade gelöscht hattest, könnte darunter sein.`);
      if(r.ok)render();
    }
    if(!r.ok){let t='';try{t=(await r.json()).fehler||''}catch(e){}throw new Error(t||('Antwort '+r.status))}
    const j=await r.json();
    ONLINE.version=j.version;ONLINE.geaendert=j.geaendert;ONLINE.von='admin';
    db.gespeichert=j.geaendert;
    dirty=false;ONLINE.zustand='gesichert';ONLINE.fehler=null;
  }catch(e){
    ONLINE.zustand='fehler';ONLINE.fehler=e.message;
    setTimeout(()=>{if(dirty&&!ONLINE.laeuft)sichernOnline()},30000);
  }
  ONLINE.laeuft=false;kopfStand();
  if(ONLINE.nochmal)onlinePlanen();
}
/* Alle 30 Sekunden nachsehen, ob jemand anders etwas eingetragen hat. Nur
   wenn hier nichts offen ist und niemand gerade in einem Feld tippt, wird
   stillschweigend aufgefrischt – sonst holt der nächste Speichervorgang
   den fremden Stand ohnehin herein. */
async function onlineAbfragen(){
  if(!ONLINE.an||dirty||ONLINE.laeuft)return;
  let j;
  try{const r=await fetch('/api/version',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;j=await r.json()}catch(e){return}
  if(j.version===ONLINE.version)return;
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&el('view').contains(a))return;
  if(el('dlg').open)return;
  try{
    const r=await fetch('/api/bestand',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;
    const b=await r.json();
    if(!b.db||!Array.isArray(b.db.analysen))return;
    db=migriere(b.db).db;ONLINE.version=b.version;ONLINE.geaendert=b.geaendert;ONLINE.von=b.von;dirty=false;
    render();
    toast(`Aufgefrischt – ${b.von&&b.von!=='admin'?'von «'+b.von+'» ':''}neu eingetragen.`);
  }catch(e){}
}

el('fileJson').onchange=e=>{const f=e.target.files[0];if(f)laden(f);e.target.value=''};
el('filePdf').onchange=e=>{const l=[...e.target.files].map(f=>({pfad:f.name,file:f}));if(l.length)einlesen(l);e.target.value=''};

/* PDFs lassen sich auf jedem Reiter ablegen, nicht nur auf «Analysen».
   Ohne preventDefault auf dragover oeffnet der Browser die Datei stattdessen. */
const ziehtDatei=e=>!!(e.dataTransfer&&[...(e.dataTransfer.types||[])].indexOf('Files')>=0);
document.addEventListener('dragover',e=>{if(!ziehtDatei(e))return;e.preventDefault();
  for(const id of ['drop','dropFoto']){const d=el(id);if(d)d.classList.add('over')}});
document.addEventListener('dragleave',()=>{for(const id of ['drop','dropFoto']){const d=el(id);if(d)d.classList.remove('over')}});
document.addEventListener('drop',e=>{
  e.preventDefault();
  for(const id of ['drop','dropFoto']){const d=el(id);if(d)d.classList.remove('over')}
  const alle=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
  const pdfs=alle.filter(f=>/\.pdf$/i.test(f.name));
  const tab1=alle.filter(f=>/\.(xlsx|xlsm|csv)$/i.test(f.name));
  const bilder=alle.filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name));
  if(pdfs.length){if(tab!=='analysen'){tab='analysen';render()}einlesen(pdfs.map(f=>({pfad:f.name,file:f})))}
  if(tab1.length&&typeof tabelleEinlesen==='function')tabelleEinlesen(tab1[0]);
  if(bilder.length)fotosEinlesen(bilder);
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
/* Die Diagramme rechnen mit der Breite ihres Kastens; nach einer Aenderung
   der Fenstergroesse muessen sie neu gezeichnet werden. Wo ein Diagramm

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(el('dlg').open)return;

/* Die App muss auch ohne Netz vollständig bedienbar sein: Daten ansehen,
   von Hand erfassen, sichern und laden. Nur das Einlesen von PDFs braucht
   pdf.js vom CDN. Fällt das aus, sagt die App das – sie bleibt aber stehen. */
let pdfBereit=false;
async function pdfVorbereiten(){
  if(typeof pdfjsLib==='undefined')return false;
  try{
    const w=await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    if(!w.ok)throw new Error('Status '+w.status);
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await w.text()],{type:'application/javascript'}));
  }catch(e){
    try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
    catch(e2){return false}
  }
  return true;
}
(async()=>{
  /* Reihenfolge zählt gleich doppelt. Das Abbild entsteht als Allererstes –
     vor jedem Zeichnen und vor allem, was von aussen nachgeladen wird –,
     damit nur das ausgelieferte Gerüst darin steht. Und der Datenblock wird
     davor ausgelesen und danach geleert, sonst trüge jede Sicherung den
     vorigen Bestand ein zweites Mal mit sich. */
  let eingebettet=null;
  try{eingebettet=datenAusSeite()}catch(e){eingebettet=null}
  seiteMerken();
  try{ansichtLaden()}catch(e){}
  try{pdfBereit=await pdfVorbereiten()}catch(e){pdfBereit=false}
  let startNotiz=null;
  /* Vom Server geladen? Dann ist der Server die Wahrheit, nicht der Datenblock. */
  let online=null;
  try{online=await onlineStart()}catch(e){online=null}
  if(online){
    eingebettet=null;
    startNotiz=(online.notizen||[]).length
      ? {warn:false,text:`Bestand vom Server geladen: ${db.analysen.length} Analysen, ${db.ereignisse.length} Logbucheinträge, ${db.messungen.length} Messungen.`,notizen:online.notizen}
      : null;
    if(!startNotiz&&ONLINE.version===0)startNotiz={warn:false,text:'Verbunden. Der Bestand auf dem Server ist noch leer – über «Datei öffnen» lässt sich eine bestehende Sicherung einspielen.'};
  }
  if(eingebettet&&eingebettet.__kaputt)
    startNotiz={warn:true,text:'In dieser Datei stecken Daten, die sich nicht lesen lassen ('+eingebettet.__kaputt+'). Das Werkzeug startet leer – die Datei selbst ist unverändert, gib sie weiter, wer sie geschrieben hat.'};
  else if(eingebettet&&Array.isArray(eingebettet.analysen)){
    try{
      const erg=migriere(eingebettet);
      db=erg.db;dirty=false;
      startNotiz={warn:false,text:`Aus dieser Datei geladen: ${db.analysen.length} Analysen, ${db.ereignisse.length} Logbucheinträge, ${db.fotos.length} Fotos.`,
        notizen:erg.von<leer().schema?erg.notizen:[]};
    }catch(e){startNotiz={warn:true,text:'Die eingebetteten Daten liessen sich nicht übernehmen: '+(e&&e.message||e)}}
  }
  try{render()}
  catch(e){
    document.getElementById('view').innerHTML='<div class="card"><h2>Die App liess sich nicht starten</h2>'+
      '<p class="muted">Bitte die Seite neu laden. Bleibt es dabei, hilft die Meldung unten weiter.</p>'+
      '<pre class="tiny mono" style="white-space:pre-wrap">'+esc(e&&e.stack||e)+'</pre></div>';
  }
  if(startNotiz){
    if(startNotiz.warn||((startNotiz.notizen||[]).length))
      dialog(startNotiz.warn?'Daten in dieser Datei':'Datei mit Daten geöffnet',
        `<p>${esc(startNotiz.text)}</p>`+
        ((startNotiz.notizen||[]).length?`<p>Beim Übernehmen angepasst:</p><ul style="margin:0 0 12px;padding-left:20px">${
          startNotiz.notizen.map(n=>`<li style="margin-bottom:6px">${esc(n)}</li>`).join('')}</ul>`:'')+
        `<div class="note neutral">Diese Datei bleibt liegen, wie sie ist. Erst wenn du hier sicherst, entsteht eine neue Datei – die alte kannst du als Stand behalten.</div>`,
        `<button class="primary" data-tun="dlgZu">Verstanden</button>`);
    else toast(startNotiz.text);
  }
})();
</script>
